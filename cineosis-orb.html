    gPts.push(new T.Vector3(k * 0.5, 0.002, -4), new T.Vector3(k * 0.5, 0.002, 4));
    gPts.push(new T.Vector3(-4, 0.002, k * 0.5), new T.Vector3(4, 0.002, k * 0.5));
  }
  for (let a = 0; a < 12; a++) {
    const ang = a / 12 * TAU;
    gPts.push(new T.Vector3(Math.cos(ang) * 0.35, 0.003, Math.sin(ang) * 0.35), new T.Vector3(Math.cos(ang) * 3.8, 0.003, Math.sin(ang) * 3.8));
  }
  gridLines = new T.LineSegments(new T.BufferGeometry().setFromPoints(gPts), new T.LineBasicMaterial({ color: 0x283632, transparent: true, opacity: 0.42 }));
  scene.add(gridLines);

  // 6 Concentric Onion-Tube Rings (Z1..Z6) with color-coded arcs
  PLANE_Z.forEach((r, idx) => {

    m.rotation.x = -Math.PI / 2; m.position.y = 0.005; planeGuides.add(m);
  });

const MU = { uMist: { value: 0 }, uTime: { value: 0 }, uCurl: { value: 0.35 } };
function mistify(mat) {
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, MU);
    sh.vertexShader = 'varying vec3 vMW;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\n vMW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = 'uniform float uMist, uTime; varying vec3 vMW;\nfloat mh(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }\n' +
      sh.fragmentShader.replace('void main() {', 'void main() {\n float mThresh = clamp((uMist - 0.22) / 0.78, 0.0, 1.0);\n if (mThresh > 0.001 && mh(floor(vMW * 520.0)) < mThresh * 0.92) discard;');
  };
  mat.customProgramCacheKey = () => 'mist2' + (mat.alphaTest ? 'a' : '');
  return mat;
}

}
mistGeo.setAttribute('position', new T.BufferAttribute(mistPos, 3));
mistGeo.setAttribute('color', new T.BufferAttribute(mistCol, 3));

function deformGeometry(geo, sculpt) {
  if (Math.abs(sculpt) < 0.01) return geo;
  const pos = geo.attributes.position;
  const v = new T.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const a = Math.atan2(v.z, v.x), r = Math.hypot(v.x, v.z);
    const wave = 1 + sculpt * (0.22 * Math.sin(a * 5 + v.y * 18) + 0.12 * Math.cos(a * 3 - v.y * 12));
    const twist = a + sculpt * v.y * 6.0;
    pos.setXYZ(i, Math.cos(twist) * r * wave, v.y * (1 + sculpt * 0.08 * Math.sin(r * 25)), Math.sin(twist) * r * wave);
  }
  geo.computeVertexNormals();
  return geo;
}

function addCandlesToHero(count, radius, topY, lit) {
  if (!count || count <= 0) return;
  const cMat = mistify(new T.MeshStandardMaterial({ map: stripeTex, roughness: 0.5 }));
  const wMat = new T.MeshBasicMaterial({ color: 0x1b1612 });
  for (let k = 0; k < count; k++) {
    const a = k / count * TAU + 0.25, r = count === 1 ? 0 : radius;

/* =============================================================== 7. SEGMENTED VIDEO CUTOUT ENGINE + TUFTE SC-0XX CALLOUT FLAGS */
const baseCutoutTex = {};
function getCutoutBaseTex(clipIdx, onReady) {
  const info = CUTOUT_CLIPS[clamp(clipIdx, 0, CUTOUT_CLIPS.length - 1)];
  if (baseCutoutTex[info.id]) { if (baseCutoutTex[info.id].image) onReady(baseCutoutTex[info.id], info); return info; }
  const t = new T.TextureLoader().load(info.file, tex => {
    tex.encoding = T.sRGBEncoding; tex.wrapS = tex.wrapT = T.ClampToEdgeWrapping;
    onReady(tex, info);
  });
  t.encoding = T.sRGBEncoding;
  baseCutoutTex[info.id] = t;
  return info;
}

function makeTufteCalloutTex(scCode, subTxt, hexCol, isSel) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 72;
  const x = c.getContext('2d');
  x.fillStyle = isSel ? '#111111' : '#faf8f2';
  x.fillRect(2, 2, 252, 68);
  x.strokeStyle = '#111111'; x.lineWidth = 4;
  x.strokeRect(2, 2, 252, 68);
  x.fillStyle = hexCol || '#e85d04';
  x.fillRect(2, 2, 14, 68);
  x.font = '900 26px "IBM Plex Mono", Menlo, monospace';
  x.fillStyle = isSel ? '#ffffff' : '#111111';
  x.fillText(scCode, 24, 34);
  x.font = '700 17px "IBM Plex Mono", Menlo, monospace';
  x.fillStyle = isSel ? '#5ff0dc' : '#444444';
  x.fillText(subTxt.slice(0, 18), 24, 58);
  const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding;
  return t;
}

const cutoutActors = [];
function syncCutouts(dt) {
  while (cutoutActors.length > DOC.cutouts.length) {
    const old = cutoutActors.pop(); CAST_G.remove(old.mesh);
    if (old.tag) CAST_G.remove(old.tag);
  }
  DOC.cutouts.forEach((c, idx) => {
    const info = CUTOUT_CLIPS[clamp(c.clip, 0, CUTOUT_CLIPS.length - 1)];
    let act = cutoutActors[idx];
    const isSel = idx === S.castIdx;
    const pIdx = clamp(c.plane || 0, 0, PLANE_Z.length - 1);
    const scCode = 'SC-' + String(c.clip + 1).padStart(3, '0');
    const tagKey = scCode + '|' + pIdx + '|' + isSel;

    if (!act || act.clipIdx !== c.clip) {
      if (act) { CAST_G.remove(act.mesh); if (act.tag) CAST_G.remove(act.tag); }
      const placeholderMat = mistify(new T.MeshStandardMaterial({
        color: 0xffffff, transparent: true, alphaTest: 0.25, side: T.DoubleSide,
        roughness: 0.85, emissive: 0xffffff, emissiveIntensity: 0.22
      }));
      const mesh = new T.Mesh(new T.PlaneGeometry(1, 1), placeholderMat);
      mesh.castShadow = true; mesh.userData.cutoutIdx = idx;
      CAST_G.add(mesh);

      const tagMat = new T.SpriteMaterial({ map: makeTufteCalloutTex(scCode, 'Z' + (pIdx + 1) + '=' + PLANE_Z[pIdx] + 'm', PLANE_CSS[pIdx], isSel), toneMapped: false });
      const tag = new T.Sprite(tagMat);
      tag.scale.set(0.22, 0.062, 1);
      tag.userData.cutoutIdx = idx;
      CAST_G.add(tag);

      act = cutoutActors[idx] = { mesh, tag, tagKey, clipIdx: c.clip, tex: null, frames: info.frames, fps: info.fps, aspect: info.aspect };
      getCutoutBaseTex(c.clip, (bTex, inf) => {
        const cloned = bTex.clone(); cloned.needsUpdate = true; cloned.encoding = T.sRGBEncoding;
        cloned.repeat.set(1 / inf.frames, 1);
        act.tex = cloned;
        placeholderMat.map = cloned; placeholderMat.emissiveMap = cloned; placeholderMat.needsUpdate = true;
      });
    }
    if (act.tagKey !== tagKey && act.tag) {
      act.tagKey = tagKey;
      act.tag.material.map = makeTufteCalloutTex(scCode, 'Z' + (pIdx + 1) + '=' + PLANE_Z[pIdx] + 'm', PLANE_CSS[pIdx], isSel);
      act.tag.material.needsUpdate = true;
    }

    const mesh = act.mesh; mesh.userData.cutoutIdx = idx;
    if (info && info.liveVideo && info.liveCtx && act.tex) {
      if (info.liveVideo.readyState >= 2) { info.liveDraw(); act.tex.needsUpdate = true; }
    } else if (act.tex && act.frames > 1) {
      const fIdx = Math.floor(NOW * act.fps * (c.speed == null ? 1 : c.speed) + idx * 3) % act.frames;
      act.tex.offset.x = ((fIdx + act.frames) % act.frames) / act.frames;
    }
    const r = PLANE_Z[pIdx];
    const h = (info.h || 0.56) * (c.s || 1);
    const w = h * (info.aspect || 1);
    mesh.scale.set(w, h, 1);
    const baseElev = c.plane >= 5 ? TOP + 0.55 : TOP - 0.12;
    mesh.position.set(Math.sin(c.a) * r, baseElev + h / 2, Math.cos(c.a) * r);
    mesh.updateMatrixWorld(true);
    const wp = mesh.getWorldPosition(new T.Vector3());
    mesh.lookAt(cam.position.x, wp.y, cam.position.z);
    mesh.rotateY((c.face || 0) * Math.PI / 180);

    if (act.tag) {
      act.tag.position.set(Math.sin(c.a) * r, baseElev + h + 0.055, Math.cos(c.a) * r);
      act.tag.visible = !FILM;
    }
  });

  // Keep Onion-Tube floor rings crisp and legible in Paper Draft / CAST / ONION modes
  planeGuides.children.forEach((ringMesh, pIdx) => {
    const selCut = DOC.cutouts[S.castIdx];
    const baseOp = S.paperMode ? 0.72 : (S.mode === 'CAST' || S.view.preset === 'ONION' ? 0.45 : 0.22);
    const targetOp = (selCut && selCut.plane === pIdx) ? Math.min(0.95, baseOp + 0.35) : baseOp;
    ringMesh.material.opacity = lerp(ringMesh.material.opacity, targetOp, Math.min(1, dt * 8));
  });
}

function etchPoint3D(ex, ey, surface) {
  const sc = DOC.hero.scale || 1;
  if (surface === 0) return [ex * 0.095 * sc, 0.106 * sc, ey * 0.095 * sc]; // Cake top
  if (surface === 1) { const a = ex * Math.PI; return [Math.sin(a) * 0.125 * sc, (0.05 + ey * 0.04) * sc, Math.cos(a) * 0.125 * sc]; } // Cake side
  if (surface === 2) return [ex * 0.38, 0.004, ey * 0.38]; // Tabletop
  return [ex * 0.35, 0.22 + ey * 0.22, Math.sin(ex * 3) * 0.18]; // 3D Air filament
}

function pushEtchStep(dx, dy) {
  const E = DOC.etch;
  E.x = clamp((E.x || 0) + dx, -1, 1);
  E.y = clamp((E.y || 0) + dy, -1, 1);
  const pt = etchPoint3D(E.x, E.y, E.surface);
  if (!E.pts) E.pts = [];
  const last = E.pts[E.pts.length - 1];
  if (!last || Math.hypot(pt[0] - last[0], pt[1] - last[1], pt[2] - last[2]) > 0.004) {
    E.pts.push(pt);
    if (E.pts.length > 180) E.pts.shift();
  }
  dirty.etch = true;
}

function tick(kind, i) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const n = AC.createBufferSource(), L = kind === 'press' ? 880 : 360, b = AC.createBuffer(1, L, AC.sampleRate), d = b.getChannelData(0);
    for (let k = 0; k < L; k++) d[k] = (Math.random() * 2 - 1) * Math.exp(-k / (kind === 'dead' ? 25 : kind === 'press' ? 140 : 48));
    n.buffer = b;
    const f = AC.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = kind === 'press' ? 1150 : kind === 'dead' ? 620 : [2650, 2250, 1920, 2480, 3080][i || 0];
    f.Q.value = 2.6;
    const g = AC.createGain(); g.gain.value = kind === 'dead' ? 0.18 : 0.72;
    n.connect(f).connect(g).connect(AC.destination); n.start();

}

// Tizita scale frequencies (D minor / Tizita Minor-Major nostalgic intervals: D4, E4, F4, A4, Bb4, C#5, D5, E5, F5, A5)
const TIZITA_SCALE = [293.66, 329.63, 349.23, 440.00, 466.16, 554.37, 587.33, 659.25, 698.46, 880.00];
let lastMotionSndT = 0;

function motionNote(normPos, pan, vel) {
  try {
    ensureAudioGraph();
    const nowT = performance.now();
    if (nowT - lastMotionSndT < 28) return;
    lastMotionSndT = nowT;
    const idx = clamp(Math.floor(clamp(normPos, 0, 0.999) * TIZITA_SCALE.length), 0, TIZITA_SCALE.length - 1);
    const freq = TIZITA_SCALE[idx];
    const t = AC.currentTime, dur = clamp(0.14 + Math.abs(vel || 0.2) * 0.18, 0.12, 0.36);
    const o1 = AC.createOscillator(), o2 = AC.createOscillator(), flt = AC.createBiquadFilter(), g = AC.createGain();
    o1.type = 'triangle'; o2.type = 'sine';
    o1.frequency.setValueAtTime(freq, t);
    o1.frequency.exponentialRampToValueAtTime(freq * (1 + clamp(vel || 0, -0.3, 0.3) * 0.06), t + dur);
    o2.frequency.setValueAtTime(freq * 1.5, t); // 5th harmonic glass overtone
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(520 + Math.min(1, Math.abs(vel || 0.25)) * 2400 + DOC.bellows * 1200, t);
    flt.Q.value = 3.2;
    const amp = clamp(0.025 + Math.abs(vel || 0.2) * 0.065, 0.02, 0.09);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(amp, t + 0.018);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let outNode = mixAnalyser || AC.destination;
    if (AC.createStereoPanner) {
      const panner = AC.createStereoPanner();
      panner.pan.setValueAtTime(clamp(pan || 0, -1, 1), t);
      g.connect(panner).connect(outNode);
    } else {
      g.connect(outNode);
    }
    o1.connect(flt); o2.connect(flt); flt.connect(g);
    o1.start(t); o2.start(t); o1.stop(t + dur + 0.02); o2.stop(t + dur + 0.02);
  } catch (e) {}
}

function accordionChord(bellows, vel) {
  try {
    ensureAudioGraph();
    const notes = [293.66, 349.23, 440.0, 466.16, 659.25]; // D Tizita 9th chord
    const t = AC.currentTime, dur = 0.26;
    const outNode = mixAnalyser || AC.destination;
    notes.forEach((freq, idx) => {
      const o = AC.createOscillator(), g = AC.createGain(), flt = AC.createBiquadFilter();
      o.type = idx % 2 === 0 ? 'triangle' : 'sine';
      const fShift = freq * (1 + bellows * 0.12 + (vel || 0) * 0.03);
      o.frequency.setValueAtTime(fShift, t);
      flt.type = 'lowpass'; flt.frequency.setValueAtTime(600 + bellows * 2400, t);
      const amp = Math.min(0.055, 0.015 + Math.abs(vel || 0.2) * 0.038);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(amp, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(flt).connect(g).connect(outNode);
      o.start(t); o.stop(t + dur + 0.02);

  } catch (e) {}
}

}

        if (h >> 4 === 2) { K.ok = true; ws.send(mqPkt(0x82, cat(new Uint8Array([0, 1]), mqStr(topic()), new Uint8Array([0])))); hello(); }
        else if (h >> 4 === 3) { const tl = (body[0] << 8) | body[1], off = 2 + tl + (((h >> 1) & 3) ? 2 : 0); try { recv(JSON.parse(TD.decode(body.subarray(off)))); } catch (x) {} }
      }
    };
    ws.onclose = () => { socks = socks.filter(x => x !== K); urls.delete(url); if (room) setTimeout(() => open1(url), 3000); };
    ws.onerror = () => {};
  }

  function send(m) {
    m.from = dev; m.mid = dev + ':' + (++MID); m.room = room;
    try { BC && BC.postMessage(m); } catch (e) {}
    if (room && socks.length) {
      const p = mqPkt(0x30, cat(mqStr(topic()), TE.encode(JSON.stringify(m))));
      for (const K of socks) if (K.ok) try { K.ws.send(p); } catch (e) {}
    }
  }
  const role = PHONE ? 'orb' : 'scene', hello = () => send({ type: 'hello', role, mode: S.mode });

  function recv(m) {
    if (!m || !m.type || m.from === dev || SEEN.has(m.mid)) return;
    if (room && m.room && m.room !== room) return;
    SEEN.add(m.mid);
    const was = peers.size; peers.set(m.from, { role: m.role, at: performance.now() });
    if (!PHONE && m.role === 'orb') {
      if (!document.body.classList.contains('paired')) {
        document.body.classList.add('paired');
        S.showQrOnOled = false;
        resize();
      }
      if (!was) say('PHONE CONTROLLER PAIRED · FULL STAGE ACTIVE');
    }
    if (m.type === 'act') {
      if (m.k === 'turn') turn(m.i, m.steps, true);
      else if (m.k === 'scrub') scrub(m.i, m.frac, true);
      else if (m.k === 'press') press(m.b, m.long, true);
      else if (m.k === 'mode') setMode(m.m, true);
      else if (m.k === 'bellows') setBellows(m.v, true);
      else if (m.k === 'chapter') loadTizitaChapter(m.idx, true);
      else if (m.k === 'view') viewBy(m.dx, m.dy, m.dc, m.px, m.py, true);
    }
  }

  function join(c) {
    room = c.toUpperCase();
    for (const u of RELAYS) open1(u);
    hello();
  }
  const base = () => location.origin + location.pathname;
  const P = {
    get room() { return room; },
    url: () => base() + '?orb&room=' + room,
    open() {
      S.showQrOnOled = !S.showQrOnOled;
      if (S.showQrOnOled) {
        if (!room) room = Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random() * 24 | 0]).join('');
        join(room);
        try {
          const u = P.url();
          const q = qrcode(0, 'M'); q.addData(u); q.make();
          const n = q.getModuleCount(), cell = 6, sz = (n + 2) * cell;
          const cv = document.createElement('canvas'); cv.width = cv.height = sz;
          const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, sz, sz); cx.fillStyle = '#111';
          for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) cx.fillRect((c + 1) * cell, (r + 1) * cell, cell, cell);
          qrCanvasCache = cv;
        } catch (e) {}
        say('DIEGETIC QR ACTIVE ON BRIDGE DISPLAY · ROOM ' + room);
      } else {
        say('DIEGETIC QR CLOSED');
      }
      oledDirty = true;
    },
    sendAct: a => send(Object.assign({ type: 'act' }, a))
  };
  if (room) join(room);
  window.REMOTE = a => P.sendAct(a);
  return P;
})();

const oray = new T.Raycaster(), ondc = new T.Vector2(); let odrag = null; const optrs = new Map();
function orbHit(e) {
  const r = OR.domElement.getBoundingClientRect();
  ondc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  oray.setFromCamera(ondc, OC);
  const hits = oray.intersectObjects(ORB.children, true);
  if (!hits.length) return null;
  const h = hits[0];
  let o = h.object;
  if (o.userData && o.userData.oled && h.uv) {
    return { oled: true, px: h.uv.x * OLED.width, py: (1 - h.uv.y) * OLED.height };
  }
  while (o && o.userData.ring == null && !o.userData.btn && !o.userData.grip && !o.userData.lens) o = o.parent;
  return o ? o.userData : null;
}

// Handle direct clicks & drags inside the 4 zones of the 2400x620 Bridge Display!
function handleOledClick(px, py, isDrag) {
  // ZONE 1 (px: 0..550): Optical Monitor, Loupe, Futures Cone & Audio Mix
  if (px < 550) {
    if (isDrag) return;
    if (py < 430) {
      cycleMonitorClip();
    } else if (py < 525) {
      const fIdx = clamp(Math.floor((px - 14) / 130), 0, 3);
      S.futuresMode = FUTURES_MODES[fIdx];
      const targetMist = [0.0, 0.08, 0.22, 0.48][fIdx];
      setBellows(targetMist);
      say('FUTURES CONE · ' + S.futuresMode + ' (' + Math.round(targetMist * 100) + '% MIST)');
    } else {
      cycleAudioMix();
    }
    oledDirty = true;
    return;
  }

  // ZONE 2 (px: 550..1240): Concentric Onion Tube (c-bus) Multiplane Radar + Bound Verb Strip
  if (px >= 550 && px < 1240) {
    const cx = 895, cy = 268, maxR = 218;
    if (py >= 522 && !isDrag) {
      // Bottom bound verb strip: MOVE | TRIM | ROLL | LIFT | SPLIT | ROUTE | STORE
      const verbs = ['MOVE', 'TRIM', 'ROLL', 'LIFT', 'SPLIT', 'ROUTE', 'STORE'];
      const vIdx = clamp(Math.floor((px - 564) / ((1226 - 564) / 7)), 0, 6);
      const vb = verbs[vIdx];
      tick('press');
      if (vb === 'MOVE') { setMode('CAST'); S.lastRing = 0; say('BOUND · MOVE CUTOUT AROUND TABLE'); }
      else if (vb === 'TRIM') { setMode('CAST'); S.lastRing = 4; say('BOUND · TRIM CUTOUT SCALE / SPEED'); }
      else if (vb === 'ROLL') { setMode('CAST'); S.lastRing = 2; turn(2, 3); say('BOUND · ROLL AZIMUTH +15°'); }
      else if (vb === 'LIFT') {
        setMode('CAST');
        const c = DOC.cutouts[S.castIdx];
        if (c) { c.plane = (c.plane + 1) % PLANE_Z.length; say('BOUND · LIFT TO ' + PLANE_NAMES[c.plane]); }
      }
      else if (vb === 'SPLIT') { press('ADD'); }
      else if (vb === 'ROUTE') { loadTizitaChapter((S.tizitaIdx + 1) % TIZITA_CHAPTERS.length); }
      else if (vb === 'STORE') { if (typeof savePeakCheckpoint === 'function') savePeakCheckpoint(); }
      oledDirty = true; drawDialLabels();
      return;
    }
    // Inside the circular Onion Tube radar: select or drag cutout angle & depth ring!
    const dx = px - cx, dy = py - cy;
    const dist = Math.hypot(dx, dy);
    const ang = Math.atan2(dx, dy); // matches Math.sin(a), Math.cos(a)
    let bestP = 0, bestD = 999;
    PLANE_Z.forEach((z, pi) => {
      const rPx = 38 + pi * 33;
      if (Math.abs(dist - rPx) < bestD) { bestD = Math.abs(dist - rPx); bestP = pi; }
    });
    if (!isDrag) {
      // Find closest cutout in radar
      let bestC = S.castIdx, minDist = 999;
      DOC.cutouts.forEach((c, idx) => {
        const rPx = 38 + clamp(c.plane || 0, 0, 5) * 33;
        const ux = cx + Math.sin(c.a) * rPx, uy = cy + Math.cos(c.a) * rPx;
        const d = Math.hypot(px - ux, py - uy);
        if (d < minDist) { minDist = d; bestC = idx; }
      });
      if (minDist < 48) {
        S.castIdx = bestC; setMode('CAST', true);
        say('SELECTED ' + CUTOUT_CLIPS[DOC.cutouts[bestC].clip].name);
      } else if (DOC.cutouts[S.castIdx]) {
        DOC.cutouts[S.castIdx].a = ang;
        DOC.cutouts[S.castIdx].plane = bestP;
        motionNote(((ang % TAU) + TAU) % TAU / TAU, clamp(dx / maxR, -1, 1), 0.3);
      }
    } else if (DOC.cutouts[S.castIdx]) {
      DOC.cutouts[S.castIdx].a = ang;
      DOC.cutouts[S.castIdx].plane = bestP;
      motionNote(((ang % TAU) + TAU) % TAU / TAU, clamp(dx / maxR, -1, 1), 0.25);
    }
    oledDirty = true; drawDialLabels();
    return;
  }

  // ZONE 3 (px: 1240..1830): Birthday Chapter Header, SCION 5-Invariant Bars, Spectrum & Diegetic Action Pads
  if (px >= 1240 && px < 1830 && !isDrag) {
    tick('press');
    if (S.showQrOnOled) { S.showQrOnOled = false; oledDirty = true; return; }
    if (py < 110) {
      loadTizitaChapter((S.tizitaIdx + 1) % TIZITA_CHAPTERS.length);
    } else if (py < 410) {
      if (typeof scionRepairPrimaryGap === 'function') scionRepairPrimaryGap();
    } else if (py >= 515) {
      const actIdx = clamp(Math.floor((px - 1252) / 140), 0, 3);
      if (actIdx === 0 && typeof scionSwarmAutoBuild === 'function') scionSwarmAutoBuild();
      else if (actIdx === 1 && typeof savePeakCheckpoint === 'function') savePeakCheckpoint();
      else if (actIdx === 2 && typeof forkBirthdayFromChapter === 'function') forkBirthdayFromChapter((S.tizitaIdx + 1) % TIZITA_CHAPTERS.length, false);
      else if (actIdx === 3 && typeof spawnDemoCustomAsset === 'function') spawnDemoCustomAsset();
    }
    oledDirty = true; drawDialLabels();
    return;
  }

  // ZONE 4 (px: 1830..2400): LIVE BOUND OPERATIONS 8-Row Table
  if (px >= 1830 && !isDrag) {
    if (py >= 58 && py < 538) {
      const rowIdx = clamp(Math.floor((py - 58) / 60), 0, MODES.length - 1);
      tick('press');
      setMode(MODES[rowIdx]);
    } else if (py >= 538) {
      if (px < 2115) press('IMP');
      else press('KEEP');
    }
    oledDirty = true; drawDialLabels();
  }
}

OR.domElement.addEventListener('pointerdown', e => {
  optrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (optrs.size === 2) {
    const [p, q] = [...optrs.values()];
    odrag = { pinch: Math.hypot(p.x - q.x, p.y - q.y), b0: DOC.bellows };
    return;
  }
  const u = orbHit(e); if (!u) return;
  OR.domElement.setPointerCapture(e.pointerId);
  if (u.oled) {
    handleOledClick(u.px, u.py, false);
    odrag = { oled: true };
    return;
  }
  if (u.btn) { odrag = { btn: u.btn, t: performance.now() }; BTN[u.btn].down = 1; return; }
  if (u.grip || u.lens) { odrag = { grip: !!u.grip, lens: !!u.lens, x: e.clientX, y: e.clientY }; return; }
  odrag = { ring: u.ring, x: e.clientX, y: e.clientY, acc: 0, lock: null };
  S.lastRing = u.ring; oledDirty = true; drawDialLabels();
});

OR.domElement.addEventListener('pointermove', e => {
  if (optrs.has(e.pointerId)) optrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!odrag) {
    const u = orbHit(e);
    const hr = u && u.ring != null ? u.ring : -1;
    if (hr !== S.hoverRing) { S.hoverRing = hr; oledDirty = true; drawDialLabels(); }
    return;
  }
  if (odrag.oled) {
    const u = orbHit(e);
    if (u && u.oled) handleOledClick(u.px, u.py, true);
    return;
  }
  if (odrag.pinch != null && optrs.size === 2) {
    const [p, q] = [...optrs.values()], d = Math.hypot(p.x - q.x, p.y - q.y);
    setBellows(odrag.b0 + (d - odrag.pinch) / 220);
    return;
  }
  const rx = e.clientX - (odrag.x || 0), ry = e.clientY - (odrag.y || 0);
  if (odrag.grip) { odrag.x = e.clientX; odrag.y = e.clientY; viewBy(-rx * 0.01, ry * 0.006, 0); return; }
  if (odrag.lens) { odrag.x = e.clientX; odrag.y = e.clientY; setBellows(DOC.bellows + rx * 0.0045); return; }
  if (odrag.ring == null) return;
  const dx = rx, dy = -ry;
  odrag.x = e.clientX; odrag.y = e.clientY;
  if (!odrag.lock) {
    odrag.ax = (odrag.ax || 0) + Math.abs(dx); odrag.ay = (odrag.ay || 0) + Math.abs(dy);
    if (odrag.ax + odrag.ay > 5) odrag.lock = odrag.ax > odrag.ay ? 'x' : 'y'; else return;
  }
  if (odrag.lock === 'x') { scrub(odrag.ring, dx / 20); return; }
  odrag.acc += dy; const px = 11;
  while (Math.abs(odrag.acc) >= px) { turn(odrag.ring, Math.sign(odrag.acc)); odrag.acc -= Math.sign(odrag.acc) * px; }
});
OR.domElement.addEventListener('pointerup', e => { optrs.delete(e.pointerId); if (odrag && odrag.btn) press(odrag.btn, performance.now() - odrag.t > 550); odrag = null; });
OR.domElement.addEventListener('wheel', e => {
  e.preventDefault(); const u = orbHit(e); if (!u) return;
  if (u.lens || u.grip) { setBellows(DOC.bellows - e.deltaY * 0.0015); return; }
  if (u.ring != null) turn(u.ring, e.deltaY < 0 ? 1 : -1);
}, { passive: false });

function buildSegmentedImageCanvas(imgEl, mode, labelTxt) {
  const W = 384, H = 384;

    cx.fillStyle = '#fbfaf6';

    cx.fillStyle = '#101615';
    cx.fillRect(40, 30, W - 80, H - 106);
    const ir = imgEl.width / Math.max(1, imgEl.height);
    let dw = W - 80, dh = H - 106, dx = 40, dy = 30;
    if (ir > 1) { dh = dw / ir; dy += ((H - 106) - dh) / 2; }
    else { dw = dh * ir; dx += ((W - 80) - dw) / 2; }
    cx.drawImage(imgEl, dx, dy, dw, dh);
    cx.fillStyle = '#1b2826';
    cx.font = '700 22px Georgia, serif';
    cx.textAlign = 'center';
    cx.fillText((labelTxt || 'BIRTHDAY MEMORY').slice(0, 22), W / 2, H - 36);
    return cv;
  }
  const ir = imgEl.width / Math.max(1, imgEl.height);
  let dw = W - 24, dh = H - 24;
  if (ir > 1) dh = dw / ir; else dw = dh * ir;
  const dx = (W - dw) / 2, dy = (H - dh) / 2;
  cx.drawImage(imgEl, dx, dy, dw, dh);
  if (mode === 'RAW') return cv;

  // 'CUTOUT' mode: sample corner background color + radial silhouette vignette feathering
  const id = cx.getImageData(0, 0, W, H), d = id.data;
  const sx = Math.round(dx + 6), sy = Math.round(dy + 6), sx2 = Math.round(dx + dw - 6), sy2 = Math.round(dy + dh - 6);
  const sample = (x, y) => {
    const idx = (clamp(y, 0, H - 1) * W + clamp(x, 0, W - 1)) * 4;
    return [d[idx], d[idx + 1], d[idx + 2]];
  };
  const c1 = sample(sx, sy), c2 = sample(sx2, sy), c3 = sample(sx, sy2), c4 = sample(sx2, sy2);
  const bgR = (c1[0] + c2[0] + c3[0] + c4[0]) * 0.25;
  const bgG = (c1[1] + c2[1] + c3[1] + c4[1]) * 0.25;
  const bgB = (c1[2] + c2[2] + c3[2] + c4[2]) * 0.25;
  const cornerVar = Math.hypot(c1[0] - c2[0], c1[1] - c2[1], c1[2] - c2[2]);
  const hasUniformBg = cornerVar < 68;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      if (d[i + 3] < 10) continue;
      const nx = (x - W * 0.5) / (dw * 0.5), ny = (y - H * 0.52) / (dh * 0.5);
      const ell = Math.hypot(nx * 0.95, ny * 0.90);
      const colorDist = Math.hypot(d[i] - bgR, d[i + 1] - bgG, d[i + 2] - bgB);
      let alpha = d[i + 3];
      if (hasUniformBg && ell > 0.38 && colorDist < 42) {
        alpha *= clamp((colorDist - 14) / 28, 0, 1);
      }
      if (ell > 0.88) {
        alpha *= clamp((1.04 - ell) / 0.16, 0, 1);
      }
      d[i + 3] = Math.round(alpha);
    }
  }
  cx.putImageData(id, 0, 0);
  return cv;
}

function registerCustomCutoutFromCanvas(cv, name, opts = {}) {
  const id = opts.id || ('user_cut_' + Date.now() + '_' + Math.floor(Math.random() * 999));
  const tex = new T.CanvasTexture(cv);
  tex.encoding = T.sRGBEncoding;
  tex.wrapS = tex.wrapT = T.ClampToEdgeWrapping;
  tex.needsUpdate = true;
  baseCutoutTex[id] = tex;
  window._lastUserPhotoTex = tex;

  const clipObj = {
    id,
    name: ('USER · ' + name).toUpperCase().slice(0, 28),
    file: '',
    frames: 1,
    fps: 1,
    aspect: cv.width / Math.max(1, cv.height),
    h: opts.h || 0.62,
    plane: opts.plane != null ? opts.plane : 1,
    isCustom: true,
    liveVideo: opts.liveVideo || null,
    liveCtx: opts.liveCtx || null,
    liveDraw: opts.liveDraw || null
  };
  CUTOUT_CLIPS.push(clipObj);
  const newClipIdx = CUTOUT_CLIPS.length - 1;

  if (!opts.skipSpawn) {
    snap(true);
    const angle = Math.PI + (Math.random() - 0.5) * 1.4;
    DOC.cutouts.push({ clip: newClipIdx, a: angle, plane: clipObj.plane, face: 0, s: 1.05, speed: 1.0 });
    S.castIdx = DOC.cutouts.length - 1;
    // Also place a Polaroid prop on the table if not already present
    DOC.props.push({ kind: 10, a: angle + 0.15, r: 0.30, rot: angle, s: 1.15 });
    dirty.props = true;
  }
  if (!opts.skipSaveDataUrl && !opts.liveVideo) {
    try {
      const thumbCv = document.createElement('canvas'); thumbCv.width = 192; thumbCv.height = 192;
      thumbCv.getContext('2d').drawImage(cv, 0, 0, 192, 192);
      DOC.customAssets = DOC.customAssets || [];
      DOC.customAssets.push({ id, name: clipObj.name, dataUrl: thumbCv.toDataURL('image/webp', 0.82), clipIdx: newClipIdx });
      if (DOC.customAssets.length > 8) DOC.customAssets.shift();
    } catch (e) {}
  }
  motionNote(0.78, 0, 0.45);
  oledDirty = true; drawDialLabels(); updateScionHud();
  return newClipIdx;
}

function importUserVideoFile(file, matteMode) {
  const url = URL.createObjectURL(file);
  const vid = document.createElement('video');
  vid.src = url; vid.muted = true; vid.loop = true; vid.playsInline = true; vid.crossOrigin = 'anonymous';
  vid.play().catch(() => {});

  const cv = document.createElement('canvas'); cv.width = 320; cv.height = 320;
  const cx = cv.getContext('2d');
  const cleanName = file.name.replace(/\.[^.]+$/, '');

  const liveDraw = () => {
    cx.clearRect(0, 0, 320, 320);
    if (matteMode === 'POLAROID') {
      cx.fillStyle = '#fbfaf6'; cx.fillRect(16, 10, 288, 300);
      cx.drawImage(vid, 28, 22, 264, 226);
      cx.fillStyle = '#182422'; cx.font = '700 18px Georgia, serif'; cx.textAlign = 'center';
      cx.fillText(cleanName.slice(0, 20).toUpperCase(), 160, 282);
    } else {
      cx.save();
      cx.beginPath(); cx.arc(160, 160, 148, 0, TAU); cx.closePath(); cx.clip();
      cx.drawImage(vid, 12, 12, 296, 296);
      cx.restore();
      cx.strokeStyle = 'rgba(95, 240, 220, 0.55)'; cx.lineWidth = 3;
      cx.beginPath(); cx.arc(160, 160, 148, 0, TAU); cx.stroke();
    }
  };
  vid.addEventListener('loadeddata', () => { liveDraw(); oledDirty = true; });
  const clipIdx = registerCustomCutoutFromCanvas(cv, cleanName, { liveVideo: vid, liveCtx: cx, liveDraw, plane: 1, h: 0.64 });

  // Also add to Orb Top OLED Monitor Clips!
  MONITOR_CLIPS.push({
    id: 'user_vid_' + Date.now(),
    label: 'USER CLIP · ' + cleanName.toUpperCase().slice(0, 16),
    src: url,
    quote: '"Imported personal memory video playing inside the chamber."'
  });
  cycleMonitorClip(MONITOR_CLIPS.length - 1);
  say('IMPORTED VIDEO CUTOUT & OLED MONITOR · ' + cleanName.toUpperCase());
  return clipIdx;
}

function importUserFiles(fileList) {
  if (!fileList || !fileList.length) return;
  Array.from(fileList).forEach(file => {
    const n = file.name.toLowerCase();
    if (n.endsWith('.json')) {
      const r = new FileReader();
      r.onload = e => {
        try {
          importBirthdayCartridge(JSON.parse(e.target.result));
        } catch (err) { say('INVALID .BIRTHDAY.JSON FILE'); }
      };
      r.readAsText(file);
    } else if (file.type.startsWith('video/') || /\.(mp4|webm|mov|m4v)$/.test(n)) {
      importUserVideoFile(file, S.matteMode);
    } else if (file.type.startsWith('image/') || /\.(png|jpe?g|webp|gif)$/.test(n)) {
      importUserImageFile(file, S.matteMode);
    } else if (file.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a)$/.test(n)) {
      importUserAudioFile(file);
    }
  });
}

// B. SCION INDEPENDENT CRITIC & QUALITY BAR VERIFICATION ENGINE
function evaluateScionMemory() {
  // 1. UNTIDY MESS (0-20): Ana Stelline invariant ("a bit of mess makes it feel real")
  const pCount = DOC.props.length;
  const uniqueKinds = new Set(DOC.props.map(p => p.kind)).size;
  const messScore = Math.round(clamp(Math.min(12, pCount) / 12 * 12 + Math.min(8, uniqueKinds) / 8 * 8, 0, 20));

  // 2. MULTIPLANE DEPTH & SILHOUETTE SEPARATION (0-25)
  const planesUsed = new Set(DOC.cutouts.map(c => c.plane)).size;
  let minAngDiff = Math.PI;
  for (let i = 0; i < DOC.cutouts.length; i++) {
    for (let j = i + 1; j < DOC.cutouts.length; j++) {
      if (DOC.cutouts[i].plane === DOC.cutouts[j].plane) {
        const da = Math.abs(((DOC.cutouts[i].a - DOC.cutouts[j].a + Math.PI) % TAU + TAU) % TAU - Math.PI);
        if (da < minAngDiff) minAngDiff = da;
      }
    }
  }
  const tangencyPenalty = DOC.cutouts.length >= 2 && minAngDiff < 0.24 ? 6 : 0;
  const depthScore = Math.round(clamp(Math.min(3, planesUsed) / 3 * 15 + Math.min(5, DOC.cutouts.length) / 5 * 10 - tangencyPenalty, 0, 25));

  // 3. THERMAL LIGHT & WISH CONTRAST (0-20)
  const hasCandles = DOC.hero.candles > 0 ? 10 : 4;
  const warmBalance = DOC.light.warm >= 0.35 && DOC.light.warm <= 0.96 ? 10 : 6;
  const lightScore = clamp(hasCandles + warmBalance, 0, 20);

  // 4. PERSONAL TRACE & AUTHORSHIP (0-20): Custom assets, Etch-A-Sketch piping, or sculpted form
  const customCount = (DOC.customAssets || []).length;
  const etchPts = (DOC.etch && DOC.etch.pts) ? DOC.etch.pts.length : 0;
  const hasPhrase = DOC.etch && DOC.etch.phrase > 0 ? 6 : 0;
  const hasSculpt = Math.abs(DOC.hero.sculpt || 0) > 0.03 ? 6 : 0;
  const traceScore = Math.round(clamp(hasPhrase + hasSculpt + Math.min(10, etchPts * 0.5) + customCount * 10, 4, 20));

  // 5. TEMPORAL / ACCORDION BREATH & CHECKPOINT (0-15)
  const mistScore = (DOC.bellows > 0.02 && DOC.bellows < 0.85 ? 9 : 6) + (S.peakDoc ? 6 : 2);
  const breathScore = clamp(mistScore, 0, 15);

  const total = messScore + depthScore + lightScore + traceScore + breathScore;

  // Determine Primary Gap & Bounded Repair
  let primaryGap = 'All 5 multiplane, untidy mess, light, and personal trace invariants pass inspection.';
  let acceptance = 'Save Peak Checkpoint or Fork/Share this birthday cartridge.';
  let repairKind = 'PEAK';
  if (planesUsed < 3 || tangencyPenalty > 0) {
    primaryGap = 'FLAT PARALLAX / TANGENCY: Cutouts occupy only ' + planesUsed + ' depth plane(s) or overlap in silhouette.';
    acceptance = 'Distribute cutouts across >= 3 depth planes (Z1 Fore, Z2 Table Rim, Z3-Z5 Mid/Archive) with >= 20 deg separation.';
    repairKind = 'DEPTH';
  } else if (pCount < 9 || uniqueKinds < 6) {
    primaryGap = 'STERILE TABLETOP: Only ' + pCount + ' table props (' + uniqueKinds + ' kinds). Memories require untidy lived-in detail.';
    acceptance = 'Place >= 10 asymmetric birthday props (cut cake slice, spilled cup, wax drips, Polaroid) around the table.';
    repairKind = 'MESS';
  } else if (traceScore < 14) {
    primaryGap = 'WEAK PERSONAL TRACE: Scene lacks custom Etch-A-Sketch piping, sculpted deformation, or imported personal media.';
    acceptance = 'Pipe an icing inscription on the cake/table, sculpt the hero form, or import a personal photo/video.';
    repairKind = 'TRACE';
  } else if (!S.peakDoc || total > S.peakScore) {
    primaryGap = 'UNSAVED PEAK STATE: Current assembly (' + total + '/100) exceeds saved Peak Checkpoint (' + (S.peakScore || 0) + '/100).';
    acceptance = 'Commit current state to Peak Checkpoint so later edits cannot degrade the work.';
    repairKind = 'PEAK';
  }

  const strengths = [];
  if (messScore >= 16) strengths.push('Untidy table realism (' + pCount + ' props)');
  if (depthScore >= 20) strengths.push('Multiplane parallax (' + planesUsed + ' planes)');
  if (lightScore >= 18) strengths.push('Warm candlelit chiaroscuro');
  if (traceScore >= 15) strengths.push('Personal trace & custom piping');
  if (!strengths.length) strengths.push('Core hexagonal chamber framing');

  const verdict = total >= 88 ? 'BAR MET · EXCEPTIONAL' : total >= 74 ? 'STRONG CANDIDATE' : 'NEEDS BOUNDED REPAIR';
  return { total, messScore, depthScore, lightScore, traceScore, breathScore, verdict, primaryGap, acceptance, strengths: strengths.join(' · '), repairKind };
}

  document.getElementById('shBarDepth').style.width = Math.round(ev.depthScore / 25 * 100) + '%';
  document.getElementById('shBarLight').style.width = Math.round(ev.lightScore / 20 * 100) + '%';
  document.getElementById('shBarTrace').style.width = Math.round(ev.traceScore / 20 * 100) + '%';

}

function scionRepairPrimaryGap() {
  snap(true);
  const before = evaluateScionMemory();
  if (before.repairKind === 'DEPTH') {
    // Separate cutouts across Z1 (0), Z2 (1), Z3 (2), Z4 (3) with golden-angle silhouette spacing
    const planes = [1, 0, 2, 1, 3, 4];
    DOC.cutouts.forEach((c, i) => {
      c.plane = planes[i % planes.length];
      c.a = (Math.PI - 0.95 + i * 0.52) % TAU;
    });
    if (DOC.cutouts.length < 5) {
      DOC.cutouts.push({ clip: 6, a: 0.38, plane: 0, face: -10, s: 0.96, speed: 1.0 });
    }
  } else if (before.repairKind === 'MESS') {
    while (DOC.props.length < 12) {
      const i = DOC.props.length;
      DOC.props.push({ kind: (i * 3 + 1) % PROP_KINDS.length, a: (i * 2.399) % TAU, r: 0.21 + (i % 5) * 0.065, rot: i * 1.4, s: 0.9 + (i % 3) * 0.14 });
    }
    dirty.props = true;
  } else if (before.repairKind === 'TRACE') {
    if (!DOC.etch.pts || DOC.etch.pts.length < 16) {
      DOC.etch.pts = [];
      for (let t = 0; t <= 28; t++) {
        const a = t / 28 * TAU;
        const r = 0.075 + 0.012 * Math.sin(a * 6);
        DOC.etch.pts.push(etchPoint3D(Math.cos(a) * (r / 0.095), Math.sin(a) * (r / 0.095), DOC.etch.surface || 0));
      }
    }
    if (!DOC.etch.phrase) DOC.etch.phrase = 1;
    if (Math.abs(DOC.hero.sculpt || 0) < 0.04) DOC.hero.sculpt = 0.08;
    dirty.etch = dirty.hero = true;
  } else {
    savePeakCheckpoint();
    return;
  }
  const after = evaluateScionMemory();
  if (after.total >= S.peakScore) { S.peakDoc = JSON.stringify(DOC); S.peakScore = after.total; }
  motionNote(0.75, 0, 0.45);
  say('SCION BOUNDED REPAIR (' + before.repairKind + ') · SCORE ' + before.total + ' -> ' + after.total + '/100');
  updateScionHud(); oledDirty = true; drawDialLabels();
}

function scionSwarmAutoBuild() {
  snap(true);
  // 4-Agent Swarm Pass: Staging + Untidy Mess + Piping + Lighting & Mist
  const planes = [0, 1, 1, 2, 3, 4];
  while (DOC.cutouts.length < 5) {
    const nextClip = (DOC.cutouts.length * 5 + 3) % CUTOUT_CLIPS.length;
    DOC.cutouts.push({ clip: nextClip, a: Math.PI, plane: 1, face: 0, s: 1.0, speed: 1.0 });
  }
  DOC.cutouts.forEach((c, i) => {
    c.plane = planes[i % planes.length];
    c.a = (Math.PI - 0.88 + i * 0.48) % TAU;
  });
  while (DOC.props.length < 12) {
    const i = DOC.props.length;
    DOC.props.push({ kind: i % PROP_KINDS.length, a: (i * 2.3999) % TAU, r: 0.22 + (i % 5) * 0.06, rot: i * 1.2, s: 0.92 + (i % 3) * 0.12 });
  }
  DOC.etch.pts = [];
  for (let t = 0; t <= 32; t++) {
    const a = t / 32 * TAU;
    DOC.etch.pts.push(etchPoint3D(Math.cos(a) * 0.78, Math.sin(a) * 0.78, DOC.etch.surface || 0));
  }
  if (!DOC.etch.phrase) DOC.etch.phrase = 2;
  if (Math.abs(DOC.hero.sculpt || 0) < 0.05) DOC.hero.sculpt = 0.09;
  if (DOC.hero.candles < 5) DOC.hero.candles = 7;
  DOC.hero.lit = 1;
  DOC.light.warm = clamp(DOC.light.warm || 0.82, 0.65, 0.92);
  if (DOC.bellows < 0.04) setBellows(0.08, true);
  dirty.hero = dirty.table = dirty.props = dirty.etch = true;
  savePeakCheckpoint();
  const ev = evaluateScionMemory();
  say('SCION SWARM AUTO-BUILD COMPLETE · VERDICT ' + ev.total + '/100 (' + ev.verdict + ')');
  updateScionHud(); oledDirty = true; drawDialLabels();
}

function runScionRingAction(v) {
  if (v === 1) scionRepairPrimaryGap();
  else if (v === 2) scionSwarmAutoBuild();
  else if (v === 3) forkBirthdayFromChapter((S.tizitaIdx + 1) % TIZITA_CHAPTERS.length, false);
  else if (v === 4) forkBirthdayFromChapter((S.tizitaIdx + 3) % TIZITA_CHAPTERS.length, true);
}

// C. COLLABORATIVE REMIX, FORK, MASHUP & CARTRIDGE SHARING
function forkBirthdayFromChapter(idx, mashupOnly) {
  snap(true);
  const src = TIZITA_CHAPTERS[clamp(idx, 0, TIZITA_CHAPTERS.length - 1)];
  const prevGen = (DOC.meta && DOC.meta.generation) || 1;
  if (mashupOnly) {
    // Mashup: keep current Hero cake & Table, but blend in the source chapter's Cutouts and Lighting!
    src.cutouts.slice(0, 3).forEach((c, i) => {
      DOC.cutouts.push({ ...c, a: (c.a + 0.35 * (i + 1)) % TAU, plane: (c.plane + 1) % 4 });
    });
    if (DOC.cutouts.length > 8) DOC.cutouts.splice(0, DOC.cutouts.length - 8);
    DOC.light.warm = lerp(DOC.light.warm, src.light.warm, 0.5);
    DOC.meta = {
      id: 'bday_' + Date.now().toString(36),
      title: (DOC.meta ? DOC.meta.title.split('×')[0].trim() : 'BIRTHDAY') + ' × ' + src.title.slice(5, 22),
      author: (document.getElementById('inpBdayAuthor') && document.getElementById('inpBdayAuthor').value) || 'STELLINE-BUILDER',
      generation: prevGen + 1,
      parentId: src.id
    };
    dirty.props = true;
    say('MASHUP REMIX (GEN ' + DOC.meta.generation + ') · MERGED CAST FROM ' + src.title);
  } else {
    loadTizitaChapter(idx, true);
    // Apply a subtle creative branch mutation (new icing color, extra lived-in props, slight sculpt)
    DOC.hero.sculpt = clamp((DOC.hero.sculpt || 0) + 0.08, -0.5, 0.5);
    DOC.etch.col = (DOC.etch.col + 1) % ETCH_COLS.length;
    DOC.props.push({ kind: 10, a: 0.42, r: 0.32, rot: 0.5, s: 1.1 });
    DOC.meta = {
      id: 'bday_' + Date.now().toString(36),
      title: 'REMIX · ' + src.title.slice(5),
      author: (document.getElementById('inpBdayAuthor') && document.getElementById('inpBdayAuthor').value) || 'STELLINE-BUILDER',
      generation: prevGen + 1,
      parentId: src.id
    };
    dirty.hero = dirty.props = dirty.etch = true;
    say('FORKED BIRTHDAY BRANCH (GEN ' + DOC.meta.generation + ') · ' + DOC.meta.title);
  }
  const inpT = document.getElementById('inpBdayTitle');
  if (inpT && DOC.meta) inpT.value = DOC.meta.title;
  updateScionHud(); renderRemixDeck(); oledDirty = true; drawDialLabels();
}

function serializeBirthdayCartridge() {
  const titleEl = document.getElementById('inpBdayTitle');
  const authEl = document.getElementById('inpBdayAuthor');
  DOC.meta = DOC.meta || { id: 'bday_' + Date.now().toString(36), generation: 1 };
  if (titleEl && titleEl.value) DOC.meta.title = titleEl.value.trim();
  if (authEl && authEl.value) DOC.meta.author = authEl.value.trim();
  const ev = evaluateScionMemory();
  return {
    schema: 'scion.birthday.v1',
    exportedAt: new Date().toISOString(),
    scionValidation: { score: ev.total, verdict: ev.verdict, primaryGap: ev.primaryGap, strengths: ev.strengths },
    doc: DOC
  };
}

function exportBirthdayCartridge() {
  const cart = serializeBirthdayCartridge();
  const blob = new Blob([JSON.stringify(cart, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const slug = (cart.doc.meta.title || 'tizita-birthday').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  a.href = URL.createObjectURL(blob);
  a.download = slug + '.birthday.json';
  document.body.append(a); a.click();
  setTimeout(() => a.remove(), 1000);
  say('EXPORTED CARTRIDGE · ' + slug.toUpperCase() + '.BIRTHDAY.JSON');
}

function importBirthdayCartridge(cart, asFork) {
  const d = cart && cart.doc ? cart.doc : cart;
  if (!d || !d.hero) { say('INVALID BIRTHDAY CARTRIDGE'); return; }
  snap(true);
  DOC = JSON.parse(JSON.stringify(d));
  DOC.meta = DOC.meta || { id: 'bday_' + Date.now().toString(36), title: 'IMPORTED BIRTHDAY', author: 'COMMUNITY', generation: 1 };
  if (asFork) {
    DOC.meta.generation = (DOC.meta.generation || 1) + 1;
    DOC.meta.title = 'REMIX · ' + DOC.meta.title;
  }
  // Rehydrate any embedded custom photo cutouts!
  if (Array.isArray(DOC.customAssets)) {
    DOC.customAssets.forEach(ca => {
      if (ca && ca.dataUrl) {
        const img = new Image();
        img.onload = () => {
          const cv = document.createElement('canvas'); cv.width = 192; cv.height = 192;
          cv.getContext('2d').drawImage(img, 0, 0, 192, 192);
          registerCustomCutoutFromCanvas(cv, ca.name || 'IMPORTED', { id: ca.id, skipSpawn: true, skipSaveDataUrl: true });
        };
        img.src = ca.dataUrl;
      }
    });
  }
  dirty.hero = dirty.table = dirty.props = dirty.etch = true;
  setBellows(DOC.bellows || 0, true);
  const inpT = document.getElementById('inpBdayTitle');
  if (inpT) inpT.value = DOC.meta.title;
  updateScionHud(); renderRemixDeck(); oledDirty = true; drawDialLabels();
  say((asFork ? 'FORKED' : 'LOADED') + ' BIRTHDAY · ' + DOC.meta.title + ' (GEN ' + DOC.meta.generation + ')');
}

function copyBirthdayShareLink() {
  const compact = {
    m: DOC.meta,
    h: DOC.hero,
    t: DOC.table,
    p: DOC.props.slice(0, 14),
    c: DOC.cutouts.slice(0, 7).map(c => ({ clip: c.clip < 32 ? c.clip : 0, a: +c.a.toFixed(2), plane: c.plane, face: c.face, s: +c.s.toFixed(2) })),
    e: { surface: DOC.etch.surface, phrase: DOC.etch.phrase, col: DOC.etch.col },
    l: DOC.light,
    b: +DOC.bellows.toFixed(2)
  };
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(compact))));
  const shareUrl = location.origin + location.pathname + '#bday=' + b64;
  history.replaceState(null, '', '#bday=' + b64);
  const out = document.getElementById('inpShareUrlOut');
  if (out) { out.value = shareUrl; out.select(); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(shareUrl).catch(() => {});
  }
  say('SHAREABLE REMIX URL COPIED TO CLIPBOARD');
  return shareUrl;
}

function checkUrlBirthdayHash() {
  if (!location.hash || !location.hash.startsWith('#bday=')) return;
  try {
    const raw = decodeURIComponent(escape(atob(location.hash.slice(6))));
    const c = JSON.parse(raw);
    if (c && c.h) {
      DOC.meta = c.m || { title: 'SHARED BIRTHDAY', author: 'PEER', generation: 2 };
      DOC.hero = c.h; DOC.table = c.t || DOC.table; DOC.props = c.p || DOC.props;
      DOC.cutouts = c.c || DOC.cutouts;
      DOC.etch = Object.assign(DOC.etch, c.e || {});
      DOC.light = c.l || DOC.light;
      dirty.hero = dirty.table = dirty.props = dirty.etch = true;
      setBellows(c.b || 0, true);
      say('LOADED SHARED BIRTHDAY FROM URL · ' + (DOC.meta.title || 'REMIX'));
    }
  } catch (e) {}
}

function saveToLocalRemixDeck() {
  const cart = serializeBirthdayCartridge();
  SAVED_BDAYS.unshift(cart);
  if (SAVED_BDAYS.length > 16) SAVED_BDAYS.pop();
  try { localStorage.setItem('cineosis_saved_birthdays_v1', JSON.stringify(SAVED_BDAYS)); } catch (e) {}
  renderRemixDeck();
  say('SAVED TO REMIX DECK · ' + cart.doc.meta.title);
}

function renderRemixDeck() {
  const listEl = document.getElementById('remixDeckList');
  if (!listEl) return;
  listEl.innerHTML = '';
  const totalCount = SAVED_BDAYS.length + TIZITA_CHAPTERS.length;
  const cntEl = document.getElementById('deckCountTxt');
  if (cntEl) cntEl.textContent = String(totalCount);

  // 1. User / Community Saved Remixes
  SAVED_BDAYS.forEach((cart, idx) => {
    const row = document.createElement('div'); row.className = 'remixItem';
    const meta = cart.doc.meta || {};
    const sc = cart.scionValidation ? cart.scionValidation.score : 85;
    row.innerHTML = `<div class="rmMeta"><strong style="color:#f6c978">[USER GEN ${meta.generation || 1} · ${sc}PT]</strong> ${meta.title || 'CUSTOM BIRTHDAY'} <span style="color:#7aa8a0">by ${meta.author || 'BUILDER'}</span></div>`;
    const btns = document.createElement('div'); btns.className = 'rmBtns';
    const bLoad = document.createElement('button'); bLoad.className = 'pill'; bLoad.textContent = 'LOAD';
    bLoad.onclick = () => importBirthdayCartridge(cart, false);
    const bFork = document.createElement('button'); bFork.className = 'pill amber'; bFork.textContent = 'FORK REMIX';
    bFork.onclick = () => importBirthdayCartridge(cart, true);
    btns.append(bLoad, bFork); row.append(btns); listEl.append(row);
  });

  // 2. Canonical 12 Tizita Birthdays Across Time & Space
  TIZITA_CHAPTERS.forEach((ch, idx) => {
    const row = document.createElement('div'); row.className = 'remixItem';
    row.innerHTML = `<div class="rmMeta"><strong style="color:#5ff0dc">${ch.title}</strong></div>`;
    const btns = document.createElement('div'); btns.className = 'rmBtns';
    const bLoad = document.createElement('button'); bLoad.className = 'pill'; bLoad.textContent = 'LOAD';
    bLoad.onclick = () => { loadTizitaChapter(idx); updateScionHud(); };
    const bFork = document.createElement('button'); bFork.className = 'pill amber'; bFork.textContent = 'FORK';
    bFork.onclick = () => forkBirthdayFromChapter(idx, false);
    const bMash = document.createElement('button'); bMash.className = 'pill'; bMash.textContent = 'MASHUP';
    bMash.onclick = () => forkBirthdayFromChapter(idx, true);
    btns.append(bLoad, bFork, bMash); row.append(btns); listEl.append(row);
  });
}

function openScionModal() {
  setMode(7); oledDirty = true; drawDialLabels();
}
function closeScionModal() {
  oledDirty = true;
}

// Wire up hidden File Input & Global Drag-and-Drop (100% Diegetic — no floating UI!)
const fileImp = document.getElementById('fileImporter');
if (fileImp) fileImp.addEventListener('change', e => { importUserFiles(e.target.files); fileImp.value = ''; });

// Global Drag-and-Drop Media & Cartridge handler
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; say('DROP MEDIA FILE TO IMPORT INTO CHAMBER'); });
addEventListener('dragover', e => { e.preventDefault(); });
addEventListener('dragleave', e => { e.preventDefault(); dragDepth = Math.max(0, dragDepth - 1); });
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0;
  
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
    importUserFiles(e.dataTransfer.files);
  }
});
addEventListener('keydown', e => { if (e.key === 'Escape') closeScionModal(); });

checkUrlBirthdayHash();
setTimeout(() => { updateScionHud(); }, 120);

window.CINEOSIS = window.CINEOSI = {
  S, get DOC() { return DOC; }, setMode, setBellows, loadTizitaChapter, cycleAudioMix, cycleMonitorClip, motionNote,
  turn, scrub, press, viewBy, setView, toggleStageViewMode, handleOledClick, rings,
  evaluateScionMemory, scionRepairPrimaryGap, scionSwarmAutoBuild, savePeakCheckpoint, restorePeakCheckpoint,
  spawnDemoCustomAsset, importUserFiles, forkBirthdayFromChapter, serializeBirthdayCartridge, importBirthdayCartridge, copyBirthdayShareLink, openScionModal, closeScionModal,
  TIZITA_CHAPTERS, AUDIO_MIXES, MONITOR_CLIPS, HERO_PRESETS, CUTOUT_CLIPS, PROP_KINDS, PLANE_NAMES, PAIR,
  advance(dt) { update(dt); render(); }
};
