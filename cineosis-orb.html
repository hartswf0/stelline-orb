  }
  gridLines = new T.LineSegments(new T.BufferGeometry().setFromPoints(gPts), new T.LineBasicMaterial({ color: 0x283632, transparent: true, opacity: 0.42 }));

const MU = { uMist: { value: 0 }, uTime: { value: 0 }, uCurl: { value: 0.35 } };
function mistify(mat) {
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, MU);
    sh.vertexShader = 'varying vec3 vMW;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\n vMW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = 'uniform float uMist, uTime; varying vec3 vMW;\nfloat mh(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }\n' +
      sh.fragmentShader.replace('void main() {', 'void main() {\n float mThresh = clamp((uMist - 0.22) / 0.78, 0.0, 1.0);\n if (mThresh > 0.001 && mh(floor(vMW * 520.0)) < mThresh * 0.92) discard;');
  };
  mat.customProgramCacheKey = () => 'mist2' + (mat.alphaTest ? 'a' : '');
  return mat;

function ensureAudioGraph() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    if (!mixAnalyser) {
      mixAnalyser = AC.createAnalyser();
      mixAnalyser.fftSize = 128;
      mixAnalyser.smoothingTimeConstant = 0.78;
      mixData = new Uint8Array(mixAnalyser.frequencyBinCount);
      mixAnalyser.connect(AC.destination);
    }
    if (!mixConnected) {
      const srcNode = AC.createMediaElementSource(mixAudio);
      srcNode.connect(mixAnalyser);
      mixConnected = true;
    }
  } catch (e) {}
}

function cycleAudioMix(forceIdx) {
  ensureAudioGraph();
  curMixIdx = forceIdx != null ? forceIdx : (curMixIdx + 1) % AUDIO_MIXES.length;
  const m = AUDIO_MIXES[curMixIdx];
  const btn = document.getElementById('btnMixToggle');
  if (btn) { btn.textContent = m.label; btn.classList.toggle('hot', curMixIdx > 0); }
  if (!m.src) {
    mixAudio.pause();
    say('AUDIO · MOTION-COUPLED SYNTH ONLY');
  } else {
    if (!mixAudio.src.endsWith(m.src)) mixAudio.src = m.src;
    mixAudio.currentTime = 0;
    mixAudio.play().catch(() => {});
    say('PLAYING · ' + m.label);
  }
  oledDirty = true;
}

  x.putImageData(id, 0, 0); const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; return t;
})();
const stripeTex = (() => {
  const c = document.createElement('canvas'); c.width = 16; c.height = 64; const x = c.getContext('2d');
  x.fillStyle = '#f4ecdc'; x.fillRect(0, 0, 16, 64); x.fillStyle = '#d4483e';
  for (let y = -16; y < 80; y += 12) { x.beginPath(); x.moveTo(0, y); x.lineTo(16, y + 8); x.lineTo(16, y + 13); x.lineTo(0, y + 5); x.fill(); }
  const t = new T.CanvasTexture(c); t.wrapT = T.RepeatWrapping; t.encoding = T.sRGBEncoding; return t;
})();
const flameMat = new T.SpriteMaterial({

  blending: T.AdditiveBlending, depthWrite: false, transparent: true, toneMapped: false

let FLAMES = [], benchHeroSprite = null;
const benchTexCache = {};

function deformGeometry(geo, sculpt) {
  if (Math.abs(sculpt) < 0.01) return geo;
  const pos = geo.attributes.position;
  const v = new T.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const a = Math.atan2(v.z, v.x), r = Math.hypot(v.x, v.z);
    const wave = 1 + sculpt * (0.22 * Math.sin(a * 5 + v.y * 18) + 0.12 * Math.cos(a * 3 - v.y * 12));
    const twist = a + sculpt * v.y * 6.0;
    pos.setXYZ(i, Math.cos(twist) * r * wave, v.y * (1 + sculpt * 0.08 * Math.sin(r * 25)), Math.sin(twist) * r * wave);
  }
  geo.computeVertexNormals();
  return geo;
}

function addCandlesToHero(count, radius, topY, lit) {
  if (!count || count <= 0) return;
  const cMat = mistify(new T.MeshStandardMaterial({ map: stripeTex, roughness: 0.5 }));
  const wMat = new T.MeshBasicMaterial({ color: 0x1b1612 });
  for (let k = 0; k < count; k++) {
    const a = k / count * TAU + 0.25, r = count === 1 ? 0 : radius;
    const g = new T.Group(); g.position.set(Math.cos(a) * r, topY, Math.sin(a) * r);
    const L = 0.056;
    const cy = new T.Mesh(new T.CylinderGeometry(0.0035, 0.0035, L, 10), cMat); cy.position.y = L / 2; cy.castShadow = true;
    const w = new T.Mesh(new T.CylinderGeometry(0.0007, 0.0007, 0.007, 4), wMat); w.position.y = L + 0.0035;
    g.add(cy, w);
    if (lit) {
      const f = new T.Sprite(flameMat); f.scale.set(0.018, 0.036, 1); f.position.y = L + 0.018;
      g.add(f); FLAMES.push(f);
    }
    HERO_G.add(g);
  }
}

function getCutoutBaseTex(clipIdx, onReady) {
  const info = CUTOUT_CLIPS[clamp(clipIdx, 0, CUTOUT_CLIPS.length - 1)];
  if (!info.file) {
    if (baseCutoutTex[info.id] && baseCutoutTex[info.id].image) onReady(baseCutoutTex[info.id], info);
    return info;
  }
  if (baseCutoutTex[info.id]) {
    if (baseCutoutTex[info.id].image) onReady(baseCutoutTex[info.id], info);
    return info;
  }
  const t = new T.TextureLoader().load(info.file, tex => {
    tex.encoding = T.sRGBEncoding; tex.wrapS = tex.wrapT = T.ClampToEdgeWrapping;
    onReady(tex, info);
  });
  t.encoding = T.sRGBEncoding;
  baseCutoutTex[info.id] = t;

}

  const cols = info.cols || info.frames || 1;
  const rows = info.rows || 1;

  if (info.liveVideo && info.liveVideo.readyState >= 2) {
    wx.drawImage(info.liveVideo, 20, 16, W - 40, H - 44);
  } else if (img && img.width > 0) {
    const col = fIdx % cols;
    const row = Math.floor(fIdx / cols) % rows;
    const cellW = img.width / cols;
    const cellH = img.height / rows;
    const sx = (col + (info.cropX || 0)) * cellW;
    const sy = row * cellH;
    const sw = cellW * (info.cropW || 1);
    const sh = cellH * (info.cropY || 1);
    wx.drawImage(img, sx, sy, sw, sh, 16, 12, W - 32, H - 36);
  } else {
    // Immediate clean illustrated standee silhouette while sprite sheet loads
    wx.fillStyle = '#e8c49a';
    wx.beginPath(); wx.arc(W / 2, 74, 30, 0, TAU); wx.fill();
    wx.fillStyle = ['#d9534f', '#2a9d8f', '#e85d04', '#1d70b8', '#7209b7'][actorIdx % 5];
    wx.beginPath(); wx.ellipse(W / 2, 162, 52, 54, 0, Math.PI, TAU); wx.fill();
  }

  const id = wx.getImageData(0, 0, W, H);
  const d = id.data;
  _standeeMask.fill(0);

  // 1. Smooth Row-Hull Die-Cut Silhouette Filter (eliminates internal holes, Swiss-cheese hair gaps & detached islands)
  let sumX = 0, cntX = 0;
  for (let y = 12; y < H - 22; y += 2) {
    for (let x = 14; x < W - 14; x += 2) {
      if (d[(y * W + x) * 4 + 3] > 80) { sumX += x; cntX++; }
    }
  }
  const medX = cntX > 0 ? (sumX / cntX) : (W >> 1);
  const rowL = new Int16Array(H).fill(-1);
  const rowR = new Int16Array(H).fill(-1);
  let yMin = H, yMax = 0;
  for (let y = 12; y < H - 22; y++) {
    let l = -1, r = -1, count = 0;
    for (let x = 14; x < W - 14; x++) {
      if (Math.abs(x - medX) > 60) continue;
      if (d[(y * W + x) * 4 + 3] > 80) {
        if (l < 0) l = x;
        r = x;
        count++;
      }
    }
    if (count >= 3) {
      rowL[y] = l; rowR[y] = r;
      if (y < yMin) yMin = y;
      if (y > yMax) yMax = y;
    }
  }
  if (yMin <= yMax) {
    let lastL = rowL[yMin], lastR = rowR[yMin];
    for (let y = yMin; y <= yMax; y++) {
      if (rowL[y] < 0) { rowL[y] = lastL; rowR[y] = lastR; }
      else { lastL = rowL[y]; lastR = rowR[y]; }
    }
    for (let y = yMin; y <= yMax; y++) {
      let sL = 0, sR = 0, n = 0;
      for (let ky = Math.max(yMin, y - 4); ky <= Math.min(yMax, y + 4); ky++) {
        sL += rowL[ky]; sR += rowR[ky]; n++;
      }
      const l = Math.max(12, Math.round(sL / n));
      const r = Math.min(W - 13, Math.round(sR / n));
      for (let x = l; x <= r; x++) {
        const i = y * W + x, p = i * 4;
        _standeeMask[i] = 1;
        if (d[p + 3] < 48) {
          d[p] = 36; d[p + 1] = 30; d[p + 2] = 26; d[p + 3] = 255;
        }
      }
    }
  }

  // 2. 2-Pass Chamfer Distance Transform (in 1/3 px units) for exact Die-Cut Cardboard Border
  const INF = 9999;
  for (let i = 0; i < W * H; i++) _standeeDist[i] = _standeeMask[i] ? 0 : INF;
  for (let y = 1; y < H - 1; y++) {
    let rowOff = y * W;
    for (let x = 1; x < W - 1; x++) {
      const i = rowOff + x;
      if (_standeeDist[i] === 0) continue;
      let m = _standeeDist[i - 1] + 3;
      if (_standeeDist[i - W] + 3 < m) m = _standeeDist[i - W] + 3;
      if (_standeeDist[i - W - 1] + 4 < m) m = _standeeDist[i - W - 1] + 4;
      if (_standeeDist[i - W + 1] + 4 < m) m = _standeeDist[i - W + 1] + 4;
      _standeeDist[i] = m;
    }
  }
  for (let y = H - 2; y >= 1; y--) {
    let rowOff = y * W;
    for (let x = W - 2; x >= 1; x--) {
      const i = rowOff + x;
      let m = _standeeDist[i];
      if (_standeeDist[i + 1] + 3 < m) m = _standeeDist[i + 1] + 3;
      if (_standeeDist[i + W] + 3 < m) m = _standeeDist[i + W] + 3;
      if (_standeeDist[i + W - 1] + 4 < m) m = _standeeDist[i + W - 1] + 4;
      if (_standeeDist[i + W + 1] + 4 < m) m = _standeeDist[i + W + 1] + 4;
      _standeeDist[i] = m;
    }
  }

  // 3. Composite Opaque Brightened Person + Cream Die-Cut Paper-Board + Corrugated Kraft Bevel
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x, p = i * 4, dist = _standeeDist[i];
      if (dist === 0) {
        // Inside figure: 100% solid opaque with warm candlelit exposure lift
        const r0 = d[p], g0 = d[p + 1], b0 = d[p + 2];
        d[p]     = Math.min(255, Math.round(Math.pow(r0 / 255, 0.76) * 245 + 16));
        d[p + 1] = Math.min(255, Math.round(Math.pow(g0 / 255, 0.78) * 235 + 12));
        d[p + 2] = Math.min(255, Math.round(Math.pow(b0 / 255, 0.82) * 220 + 8));
        d[p + 3] = 255;
      } else if (dist <= 16) {
        // Warm Cream Die-Cut Archival Board Margin (#F6F0E2)
        const grain = ((x * 17 + y * 31) & 7) - 3;
        d[p] = 246 + grain; d[p + 1] = 240 + grain; d[p + 2] = 226 + grain; d[p + 3] = 255;
      } else if (dist <= 23) {
        // Corrugated Kraft Cardboard Bevel (#B88A52)
        const rib = ((x + y) & 3) === 0 ? -12 : 6;
        d[p] = 184 + rib; d[p + 1] = 138 + rib; d[p + 2] = 82 + rib; d[p + 3] = 255;
      } else if (dist <= 28) {
        // Crisp Dark Die-Cut Ink Outline (#181410)
        d[p] = 24; d[p + 1] = 20; d[p + 2] = 16; d[p + 3] = 255;
      } else {
        d[p + 3] = 0;
      }
    }
  }
  wx.putImageData(id, 0, 0);

  // 4. Draw onto actor's 320x400 Hi-DPI Standee Canvas + Bottom Wooden Standee Slot Label
  const ox2 = act.ctx;
  ox2.clearRect(0, 0, 320, 400);
  ox2.drawImage(_standeeWorkCv, 0, 0, W, H, 10, 6, 300, 366);

  // Tactile Cardboard Standee Base Strip at bottom
  ox2.fillStyle = isSel ? '#e85d04' : '#3a2614';
  ox2.fillRect(36, 356, 248, 38);
  ox2.strokeStyle = '#f6f0e2'; ox2.lineWidth = 4;
  ox2.strokeRect(36, 356, 248, 38);
  ox2.font = '900 22px "IBM Plex Mono", Menlo, monospace';
  ox2.fillStyle = '#ffffff'; ox2.textAlign = 'center';
  ox2.fillText('P' + (actorIdx + 1) + ' · ' + (info.short || info.name.slice(0, 10)), 160, 383);

  act.tex.needsUpdate = true;
}

const standeePlinthGeo = new T.CylinderGeometry(0.11, 0.125, 0.024, 24);
const standeeSlotGeo = new T.BoxGeometry(0.19, 0.028, 0.026);
const standeePlinthMat = mistify(new T.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.72 }));

const cutoutActors = [];
function syncCutouts(dt) {
  while (cutoutActors.length > DOC.cutouts.length) {
    const old = cutoutActors.pop();
    CAST_G.remove(old.group);
    if (old.tag) CAST_G.remove(old.tag);
  }
  DOC.cutouts.forEach((c, idx) => {
    const info = CUTOUT_CLIPS[clamp(c.clip, 0, CUTOUT_CLIPS.length - 1)];
    let act = cutoutActors[idx];
    const isSel = idx === S.castIdx;
    const pIdx = clamp(c.plane || 0, 0, PLANE_Z.length - 1);
    const pBadge = 'P' + (idx + 1);
    const shortName = info.short || info.name.split('·')[0].trim();
    const tagKey = pBadge + '|' + shortName + '|' + pIdx + '|' + isSel;

    if (!act || act.clipIdx !== c.clip) {
      if (act) { CAST_G.remove(act.group); if (act.tag) CAST_G.remove(act.tag); }
      const cv = document.createElement('canvas'); cv.width = 320; cv.height = 400;
      const ctx = cv.getContext('2d');
      const tex = new T.CanvasTexture(cv); tex.encoding = T.sRGBEncoding; tex.anisotropy = 4;

      const mat = mistify(new T.MeshStandardMaterial({
        map: tex, transparent: true, alphaTest: 0.35, side: T.DoubleSide,
        roughness: 0.65, metalness: 0.02, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.28
      }));
      const group = new T.Group(); group.userData.cutoutIdx = idx;
      const mesh = new T.Mesh(new T.PlaneGeometry(1, 1), mat);
      mesh.castShadow = true; mesh.userData.cutoutIdx = idx;
      group.add(mesh);

      // Physical 3D Slotted Wooden Standee Base under the cardboard cutout!
      const plinth = new T.Mesh(standeePlinthGeo, standeePlinthMat);
      plinth.position.y = 0.012; plinth.castShadow = plinth.receiveShadow = true;
      plinth.userData.cutoutIdx = idx;
      const slot = new T.Mesh(standeeSlotGeo, standeePlinthMat);
      slot.position.y = 0.024; slot.userData.cutoutIdx = idx;
      group.add(plinth, slot);
      CAST_G.add(group);

      const tagMat = new T.SpriteMaterial({ map: makeTufteCalloutTex(pBadge, shortName, PLANE_CSS[pIdx], isSel), toneMapped: false });
      const tag = new T.Sprite(tagMat);
      tag.scale.set(0.28, 0.075, 1);
      tag.userData.cutoutIdx = idx;
      CAST_G.add(tag);

      act = cutoutActors[idx] = {
        group, mesh, plinth, slot, tag, tagKey,
        clipIdx: c.clip, cv, ctx, tex,
        frames: info.frames || 1, fps: info.fps || 8,
        aspect: info.aspect || 0.82, lastFrame: -1, loaded: false
      };
      renderCardboardStandeeFrame(act, info, (info.frames > 16 ? 4 : 0), idx, isSel);
      getCutoutBaseTex(c.clip, () => {
        act.loaded = true; act.lastFrame = -1;
        renderCardboardStandeeFrame(act, info, (info.frames > 16 ? 4 : 0), idx, isSel);
      });
    }

    if (act.tagKey !== tagKey && act.tag) {
      act.tagKey = tagKey;
      act.tag.material.map = makeTufteCalloutTex(pBadge, shortName, PLANE_CSS[pIdx], isSel);
      act.tag.material.needsUpdate = true;
      act.lastFrame = -1;
    }

    const startF = act.frames > 16 ? 4 : 0;
    const fSpan = Math.max(1, act.frames - startF);
    const fIdx = startF + (Math.floor(NOW * act.fps * (c.speed == null ? 1 : c.speed) + idx * 3) % fSpan);
    if (fIdx !== act.lastFrame || (info.liveVideo && info.liveVideo.readyState >= 2)) {
      act.lastFrame = fIdx;
      renderCardboardStandeeFrame(act, info, fIdx, idx, isSel);
    }

    const r = PLANE_Z[pIdx];
    const h = (info.h || 0.56) * (c.s || 1);
    const w = h * (info.aspect || 0.82);
    act.mesh.scale.set(w, h, 1);
    act.mesh.position.set(0, h / 2 + 0.015, 0);

    // Position the standee cleanly at table-rim level so everyone sits right around the table!
    const baseElev = c.plane >= 4 ? TOP + 0.35 : TOP - 0.14;
    act.group.position.set(Math.sin(c.a) * r, baseElev, Math.cos(c.a) * r);
    act.group.lookAt(cam.position.x, baseElev, cam.position.z);
    act.group.rotateY((c.face || 0) * Math.PI / 180);

    if (act.tag) {
      act.tag.position.set(Math.sin(c.a) * r, baseElev + h + 0.065, Math.cos(c.a) * r);
      act.tag.visible = !FILM;
    }
  });

  planeGuides.children.forEach((ringMesh, pIdx) => {
    const selCut = DOC.cutouts[S.castIdx];
    const baseOp = S.paperMode ? 0.72 : (S.mode === 'CAST' || S.view.preset === 'ONION' ? 0.45 : 0.22);
    const targetOp = (selCut && selCut.plane === pIdx) ? Math.min(0.95, baseOp + 0.35) : baseOp;
    ringMesh.material.opacity = lerp(ringMesh.material.opacity, targetOp, Math.min(1, dt * 8));
  });
}

/* =============================================================== 8. ETCH-A-SKETCH DUAL-WHEEL WRITING & 3D PIPING */
const ETCH_PHRASES = ['FREEHAND ETCH', 'HAPPY/BIRTHDAY', '生日快乐', '6·10·21', 'MAKE A WISH', 'STELLINE', 'SHAKE CLEAR'];
const ETCH_COLS = [['ROSE ICING', 0xe87a90], ['BUTTERCREAM', 0xfbf8f0], ['GOLD LEAF', 0xf0b840], ['CHOCOLATE', 0x4a2b1b], ['CYAN FILAMENT', 0x5ff0dc], ['WARM EMBER', 0xff6b3d]];

function buildEtch() {
  ETCH_G.clear();
  const E = DOC.etch, colHex = ETCH_COLS[clamp(E.col || 0, 0, ETCH_COLS.length - 1)][1];
  const eMat = mistify(new T.MeshStandardMaterial({ color: colHex, roughness: 0.4, emissive: colHex, emissiveIntensity: E.col >= 4 ? 0.65 : 0.12 }));

  // 1. Phrase stamp on cake or tabletop
  if (E.phrase > 0 && E.phrase < 6) {
    const txt = ETCH_PHRASES[E.phrase];
    const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 512; const x = cv.getContext('2d');
    const lines = txt.split('/');
    x.font = 'italic 700 132px Georgia, "Noto Serif CJK SC", serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    lines.forEach((l, i) => {
      const y = 256 + (i - (lines.length - 1) / 2) * 140;
      x.lineWidth = 16; x.strokeStyle = 'rgba(0,0,0,0.28)'; x.strokeText(l, 512, y + 4);
      x.fillStyle = '#' + colHex.toString(16).padStart(6, '0'); x.fillText(l, 512, y);
    });
    const t = new T.CanvasTexture(cv); t.encoding = T.sRGBEncoding;
    const surfY = E.surface === 2 ? 0.003 : 0.105 * (DOC.hero.scale || 1);
    const w = E.surface === 2 ? 0.42 : 0.20 * (DOC.hero.scale || 1);
    const pm = new T.Mesh(new T.PlaneGeometry(w, w * 0.5), mistify(new T.MeshStandardMaterial({ map: t, transparent: true, alphaTest: 0.2, roughness: 0.5, depthWrite: false })));
    pm.rotation.x = -Math.PI / 2; pm.position.set(0, surfY, E.surface === 2 ? 0.24 : 0);
    ETCH_G.add(pm);
  }

  // 2. Continuous Etch-A-Sketch 3D tube trail from dual-wheel (X, Y) coordinates
  if (E.pts && E.pts.length >= 2) {
    const vecs = E.pts.map(p => new T.Vector3(p[0], p[1], p[2]));
    const curve = new T.CatmullRomCurve3(vecs);
    const tube = new T.Mesh(new T.TubeGeometry(curve, Math.min(240, vecs.length * 4), 0.0038, 8, false), eMat);
    tube.castShadow = true; ETCH_G.add(tube);
  }

  // Stylus nib indicator when in ETCH mode
  if (S.mode === 'ETCH') {
    const p = etchPoint3D(E.x, E.y, E.surface);
    const nib = new T.Mesh(new T.SphereGeometry(0.007, 12, 10), new T.MeshBasicMaterial({ color: 0x5ff0dc, toneMapped: false }));
    nib.position.set(p[0], p[1], p[2]); ETCH_G.add(nib);
  }
}

function etchPoint3D(ex, ey, surface) {
  const sc = DOC.hero.scale || 1;
  if (surface === 0) return [ex * 0.095 * sc, 0.106 * sc, ey * 0.095 * sc]; // Cake top
  if (surface === 1) { const a = ex * Math.PI; return [Math.sin(a) * 0.125 * sc, (0.05 + ey * 0.04) * sc, Math.cos(a) * 0.125 * sc]; } // Cake side
  if (surface === 2) return [ex * 0.38, 0.004, ey * 0.38]; // Tabletop
  return [ex * 0.35, 0.22 + ey * 0.22, Math.sin(ex * 3) * 0.18]; // 3D Air filament
}

function pushEtchStep(dx, dy) {
  const E = DOC.etch;
  E.x = clamp((E.x || 0) + dx, -1, 1);
  E.y = clamp((E.y || 0) + dy, -1, 1);
  const pt = etchPoint3D(E.x, E.y, E.surface);
  if (!E.pts) E.pts = [];
  const last = E.pts[E.pts.length - 1];
  if (!last || Math.hypot(pt[0] - last[0], pt[1] - last[1], pt[2] - last[2]) > 0.004) {
    E.pts.push(pt);
    if (E.pts.length > 180) E.pts.shift();
  }
  dirty.etch = true;
}

/* =============================================================== 9. WEBAUDIO TACTILE CLICKS & ACCORDION HARMONIC REED SYNTH */
function tick(kind, i) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const n = AC.createBufferSource(), L = kind === 'press' ? 880 : 360, b = AC.createBuffer(1, L, AC.sampleRate), d = b.getChannelData(0);
    for (let k = 0; k < L; k++) d[k] = (Math.random() * 2 - 1) * Math.exp(-k / (kind === 'dead' ? 25 : kind === 'press' ? 140 : 48));
    n.buffer = b;
    const f = AC.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = kind === 'press' ? 1150 : kind === 'dead' ? 620 : [2650, 2250, 1920, 2480, 3080][i || 0];
    f.Q.value = 2.6;
    const g = AC.createGain(); g.gain.value = kind === 'dead' ? 0.18 : 0.72;
    n.connect(f).connect(g).connect(AC.destination); n.start();
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(kind === 'press' ? 12 : 5);
}

// Tizita scale frequencies (D minor / Tizita Minor-Major nostalgic intervals: D4, E4, F4, A4, Bb4, C#5, D5, E5, F5, A5)
const TIZITA_SCALE = [293.66, 329.63, 349.23, 440.00, 466.16, 554.37, 587.33, 659.25, 698.46, 880.00];
let lastMotionSndT = 0;

function motionNote(normPos, pan, vel) {
  try {
    ensureAudioGraph();
    const nowT = performance.now();
    if (nowT - lastMotionSndT < 28) return;
    lastMotionSndT = nowT;
    const idx = clamp(Math.floor(clamp(normPos, 0, 0.999) * TIZITA_SCALE.length), 0, TIZITA_SCALE.length - 1);
    const freq = TIZITA_SCALE[idx];
    const t = AC.currentTime, dur = clamp(0.14 + Math.abs(vel || 0.2) * 0.18, 0.12, 0.36);
    const o1 = AC.createOscillator(), o2 = AC.createOscillator(), flt = AC.createBiquadFilter(), g = AC.createGain();
    o1.type = 'triangle'; o2.type = 'sine';
    o1.frequency.setValueAtTime(freq, t);
    o1.frequency.exponentialRampToValueAtTime(freq * (1 + clamp(vel || 0, -0.3, 0.3) * 0.06), t + dur);
    o2.frequency.setValueAtTime(freq * 1.5, t); // 5th harmonic glass overtone
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(520 + Math.min(1, Math.abs(vel || 0.25)) * 2400 + DOC.bellows * 1200, t);
    flt.Q.value = 3.2;
    const amp = clamp(0.025 + Math.abs(vel || 0.2) * 0.065, 0.02, 0.09);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(amp, t + 0.018);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let outNode = mixAnalyser || AC.destination;
    if (AC.createStereoPanner) {
      const panner = AC.createStereoPanner();
      panner.pan.setValueAtTime(clamp(pan || 0, -1, 1), t);
      g.connect(panner).connect(outNode);
    } else {
      g.connect(outNode);
    }
    o1.connect(flt); o2.connect(flt); flt.connect(g);
    o1.start(t); o2.start(t); o1.stop(t + dur + 0.02); o2.stop(t + dur + 0.02);
  } catch (e) {}
}

function accordionChord(bellows, vel) {
  try {
    ensureAudioGraph();
    const notes = [293.66, 349.23, 440.0, 466.16, 659.25]; // D Tizita 9th chord
    const t = AC.currentTime, dur = 0.26;
    const outNode = mixAnalyser || AC.destination;
    notes.forEach((freq, idx) => {
      const o = AC.createOscillator(), g = AC.createGain(), flt = AC.createBiquadFilter();
      o.type = idx % 2 === 0 ? 'triangle' : 'sine';
      const fShift = freq * (1 + bellows * 0.12 + (vel || 0) * 0.03);
      o.frequency.setValueAtTime(fShift, t);
      flt.type = 'lowpass'; flt.frequency.setValueAtTime(600 + bellows * 2400, t);
      const amp = Math.min(0.055, 0.015 + Math.abs(vel || 0.2) * 0.038);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(amp, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(flt).connect(g).connect(outNode);
      o.start(t); o.stop(t + dur + 0.02);
    });
  } catch (e) {}
}

function v01(r) {
  if (!r || r.lo == null) return 0.5;
  let v = r.v();
  if (r.wrap) { const sp = r.hi - r.lo; v = ((v - r.lo) % sp + sp) % sp + r.lo; }
  return clamp((v - r.lo) / Math.max(1e-6, r.hi - r.lo), 0, 1);
}

function normalTex(fn, W, H) {
  const h = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) h[y * W + x] = fn(x / W, y / H);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x2 = c.getContext('2d'), id = x2.createImageData(W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const l = h[y * W + (x - 1 + W) % W], r = h[y * W + (x + 1) % W], u = h[((y - 1 + H) % H) * W + x], d = h[((y + 1) % H) * W + x];
    let nx = (l - r) * 3, ny = (u - d) * 3, nz = 1, L = Math.hypot(nx, ny, nz), k = (y * W + x) * 4;
    id.data[k] = (nx / L * 0.5 + 0.5) * 255; id.data[k + 1] = (ny / L * 0.5 + 0.5) * 255; id.data[k + 2] = (nz / L * 0.5 + 0.5) * 255; id.data[k + 3] = 255;
  }
  x2.putImageData(id, 0, 0); const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; return t;
}

  (u, v) => 0.5 + 0.5 * Math.cos(u * TAU * 140),

  (u, v) => Math.pow(0.5 + 0.5 * Math.cos(u * TAU * 45), 0.4),
  (u, v) => { const a = (u * 110) % 1 - 0.5, b = (v * 8 + Math.floor(u * 110) * 0.5) % 1 - 0.5; return Math.max(0, 1 - Math.hypot(a, b * 1.1) * 3.2); },
  (u, v) => 0.5 + 0.5 * Math.cos((u * 65 + v * 3.0) * TAU)
];

let qrCanvasCache = null;
const PAIR = (function () {

  function open1(url) {
    if (urls.has(url) || !room) return; urls.add(url);

    ws.binaryType = 'arraybuffer'; const K = { ws, ok: false, buf: new Uint8Array(0) }; socks.push(K);
    ws.onopen = () => ws.send(mqPkt(0x10, cat(mqStr('MQTT'), new Uint8Array([4, 2, 0, 60]), mqStr('co-' + dev + uid().slice(0, 4)))));
    ws.onmessage = e => {
      K.buf = cat(K.buf, new Uint8Array(e.data));
      for (;;) {
        const b = K.buf; if (b.length < 2) return;
        let m = 1, len = 0, i = 1, d; do { if (i >= b.length) return; d = b[i++]; len += (d & 127) * m; m *= 128; } while (d & 128);

  const P = {

    url: () => base() + '?orb&room=' + room,
    open() {

function orbHit(e) {

  }
  while (o && o.userData.ring == null && !o.userData.btn && !o.userData.grip && !o.userData.lens) o = o.parent;

}

    let o = cHits[0].object; while (o && o.userData.cutoutIdx == null) o = o.parent;
    if (o && o.userData.cutoutIdx != null) {
      S.castIdx = o.userData.cutoutIdx; setMode('CAST', true);
      rdrag = { kind: 'cutout', idx: S.castIdx };
      say('MOVING P' + (S.castIdx + 1) + ' · ' + CUTOUT_CLIPS[DOC.cutouts[S.castIdx].clip].name);
      return;
    }
  }
  const pHits = rray.intersectObjects(MESS_G.children, true);
  if (pHits.length) {
    let o = pHits[0].object; while (o && o.userData.propIdx == null) o = o.parent;
    if (o && o.userData.propIdx != null) {
      S.propIdx = o.userData.propIdx;
      rdrag = { kind: 'prop', idx: S.propIdx };
      say('MOVING TABLE ITEM · ' + PROP_KINDS[DOC.props[S.propIdx].kind]);
      return;
    }
  }
  rdrag = { kind: e.button === 2 || e.shiftKey ? 'pan' : 'orbit', x: e.clientX, y: e.clientY };
});

R.domElement.addEventListener('pointermove', e => {
  if (!rdrag) return;
  const rect = R.domElement.getBoundingClientRect();
  rndc.set((e.clientX - rect.left) / rect.width * 2 - 1, -(e.clientY - rect.top) / rect.height * 2 + 1);
  rray.setFromCamera(rndc, cam);
  const hitPt = new T.Vector3();
  if (rdrag.kind === 'cutout') {
    if (rray.ray.intersectPlane(floorPlane, hitPt)) {
      const c = DOC.cutouts[rdrag.idx];
      if (c) {
        const prevA = c.a;
        c.a = Math.atan2(hitPt.x, hitPt.z);
        const dist = Math.hypot(hitPt.x, hitPt.z);
        let bestP = c.plane, bestD = 99;
        PLANE_Z.forEach((pz, pi) => { const d = Math.abs(dist - pz); if (d < bestD) { bestD = d; bestP = pi; } });
        c.plane = bestP;
        motionNote(((c.a % TAU) + TAU) % TAU / TAU, clamp(hitPt.x / 1.2, -1, 1), (c.a - prevA) * 4.0);
        oledDirty = true; drawDialLabels();
      }
    }
    return;
  }
  if (rdrag.kind === 'prop') {
    if (rray.ray.intersectPlane(floorPlane, hitPt)) {
      const p = DOC.props[rdrag.idx];
      if (p) {
        p.a = (Math.atan2(hitPt.x, hitPt.z) + TAU) % TAU;
        p.r = clamp(Math.hypot(hitPt.x, hitPt.z), 0.14, 0.58);
        dirty.props = true; oledDirty = true; drawDialLabels();
      }
    }
    return;
  }
  const dx = e.clientX - rdrag.x, dy = e.clientY - rdrag.y;
  rdrag.x = e.clientX; rdrag.y = e.clientY;
  if (rdrag.kind === 'pan') viewBy(0, 0, 0, dx / rect.height, dy / rect.height);
  else viewBy(-dx * 0.007, dy * 0.005, 0);
});
R.domElement.addEventListener('pointerup', () => rdrag = null);
R.domElement.addEventListener('wheel', e => { e.preventDefault(); viewBy(0, 0, -e.deltaY * 0.0015); }, { passive: false });

addEventListener('keydown', e => {

  else if (e.key === ']') setBellows(DOC.bellows + 0.08);

});

const rt = new T.WebGLRenderTarget(16, 16); rt.texture.encoding = T.sRGBEncoding;
const grade = new T.ShaderMaterial({
  uniforms: { tC: { value: rt.texture }, gt: { value: 0 }, uPaper: { value: 0 } }, depthTest: false, depthWrite: false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `uniform sampler2D tC; uniform float gt, uPaper; varying vec2 vUv; void main(){
    vec3 c = texture2D(tC, vUv).rgb;
    if (uPaper > 0.5) { gl_FragColor = vec4(c, 1.); return; }
    vec2 q = vUv - .5; c *= 1. - dot(q, q) * 0.85;
    float l = dot(c, vec3(.299, .587, .114)); c = mix(vec3(l), c, .90);
    c = vec3(.024, .032, .028) + c * vec3(.98, 1., .96); c = c / (c + .70) * 1.60;
    gl_FragColor = vec4(c, 1.); }`
});
const gQ = new T.Scene(), gC = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
gQ.add(new T.Mesh(new T.PlaneGeometry(2, 2), grade));

function update(dt) {
  NOW += dt; MU.uTime.value = NOW;
  grade.uniforms.uPaper.value = S.paperMode ? 1.0 : 0.0;
  if (dirty.hero) { buildHero(); dirty.hero = false; }
  if (dirty.table) { buildTable(); dirty.table = false; }
  if (dirty.props) { buildProps(); dirty.props = false; }
  if (dirty.etch) { buildEtch(); dirty.etch = false; }

  if (benchHeroSprite && benchHeroSprite.tex) {
    const normYaw = (((CAM.yaw % TAU) + TAU) % TAU) / TAU;
    const frame = Math.floor(normYaw * benchHeroSprite.frames) % benchHeroSprite.frames;
    benchHeroSprite.tex.offset.x = frame / benchHeroSprite.frames;
    benchHeroSprite.mesh.lookAt(cam.position.x, TOP + 0.11, cam.position.z);
  }

  syncCutouts(dt);

  if (DOC.bellows > 0.01) {
    const pos = mistGeo.attributes.position.array, b = DOC.bellows, curl = DOC.flight.curl || 0.35;
    for (let i = 0; i < MIST_N; i += 4) {
      const idx = (i + Math.floor(NOW * 60) % 4) % MIST_N;
      const s0 = mistSeed[idx * 3], sp = mistSeed[idx * 3 + 1], r0 = mistSeed[idx * 3 + 2] * (1 + b * 0.8);
      const a = s0 + NOW * sp * 0.25 * (0.3 + b);
      pos[idx * 3] = Math.cos(a) * r0 + Math.sin(NOW * 1.7 + s0) * curl * b * 0.35;
      pos[idx * 3 + 1] = TOP + Math.sin(s0 * 3 + NOW * 0.8) * (0.4 + b * 0.9);
      pos[idx * 3 + 2] = Math.sin(a) * r0 + Math.cos(NOW * 1.3 + s0) * curl * b * 0.35;
    }
    mistGeo.attributes.position.needsUpdate = true;
  }

  const Lt = DOC.light, cw = new T.Vector3(0, TOP + 0.05, 0), la = Lt.a * Math.PI / 180;
  key.position.set(cw.x + Math.sin(la) * 1.15, cw.y + Lt.h, cw.z + Math.cos(la) * 1.15);
  key.target.position.copy(cw);
  key.color.setRGB(lerp(0.72, 1, Lt.warm), lerp(0.84, 0.72, Lt.warm), lerp(1, 0.45, Lt.warm));
  key.intensity = S.paperMode ? 1.85 : Lt.k;
  if (hemiLight) hemiLight.intensity = S.paperMode ? 0.95 : 0.22;
  keyMark.position.copy(key.position); keyMark.visible = S.mode === 'LIGHT' && !FILM;

  const lit = FLAMES.length;
  candleLight.position.set(cw.x, cw.y + 0.16, cw.z);
  candleLight.intensity = lit ? (0.35 + Math.min(lit, 12) * 0.11) * (0.94 + Math.sin(NOW * 19) * 0.05) : 0;
  FLAMES.forEach((f, i) => {
    const k = 1 + Math.sin(NOW * 14 + i * 1.7) * 0.07;
    f.scale.set(0.018 * k, 0.036 * (2 - k), 1);
  });

  const V = S.view;
  if (DOC.bellows > 0.68 || S.mode === 'FLIGHT') {
    V.yaw += (DOC.flight.swoop || 0.18 * DOC.bellows) * dt * 0.55;
    V.roll = lerp(V.roll || 0, (DOC.flight.bank || 0) * Math.PI / 180, Math.min(1, dt * 5));
  } else {
    V.roll = lerp(V.roll || 0, 0, Math.min(1, dt * 6));
  }
  const k = Math.min(1, dt * 7);
  const tgt = new T.Vector3(0, TOP + 0.08, 0).add(V.pan);
  CAM.yaw += (((V.yaw - CAM.yaw + Math.PI) % TAU + TAU) % TAU - Math.PI) * k;
  CAM.pitch += (V.pitch - CAM.pitch) * k;
  CAM.dist += (V.dist - CAM.dist) * k;
  CAM.fov += (V.fov - CAM.fov) * k;
  CAM.roll += ((V.roll || 0) - CAM.roll) * k;
  CAM.tgt.lerp(tgt, k);
  cam.position.set(
    CAM.tgt.x + Math.sin(CAM.yaw) * Math.cos(CAM.pitch) * CAM.dist,
    CAM.tgt.y + Math.sin(CAM.pitch) * CAM.dist,
    CAM.tgt.z + Math.cos(CAM.yaw) * Math.cos(CAM.pitch) * CAM.dist
  );
  cam.up.set(Math.sin(CAM.roll), Math.cos(CAM.roll), 0);
  cam.lookAt(CAM.tgt);
  if (Math.abs(cam.fov - CAM.fov) > 0.01) { cam.fov = CAM.fov; cam.updateProjectionMatrix(); }

  RINGS.forEach((r, i) => {
    r.ang += (r.target - r.ang) * Math.min(1, dt * 18);
    r.g.rotation.x = r.ang;
    r.lit.material.color.setHex(i === S.lastRing ? 0xe85d04 : PLANE_HEX[i]);
  });
  for (const bKey in BTN) {
    const b = BTN[bKey];
    if (odrag && odrag.btn === bKey) b.down = 1; else b.down = Math.max(0, b.down - dt * 6);
    b.cap.position.z = b.z0 - b.down * 0.008;
  }
  drawDialLabels();
  if (oledDirty || Math.floor(NOW * 15) !== Math.floor((NOW - dt) * 15)) { drawOLED(); oledDirty = false; }
}

function render() {
  if (!PHONE && !document.body.classList.contains('phone')) {
    grade.uniforms.gt.value = (NOW * 37.1) % 100;
    R.setRenderTarget(rt); R.render(scene, cam); R.setRenderTarget(null); R.render(gQ, gC);
  }
  if (!document.body.classList.contains('paired')) {
    OR.render(OS, OC);
  }
}

let last = performance.now(), auto = true;
function loop(now) {
  if (!auto) return;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render(); requestAnimationFrame(loop);

// A. Client-Side Image Auto-Cutout & Polaroid Processor
function buildSegmentedImageCanvas(imgEl, mode, labelTxt) {
  const W = 384, H = 384;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const cx = cv.getContext('2d');
  if (mode === 'POLAROID') {
    cx.fillStyle = '#fbfaf6';
    cx.fillRect(24, 14, W - 48, H - 28);
    cx.fillStyle = '#101615';
    cx.fillRect(40, 30, W - 80, H - 106);
    const ir = imgEl.width / Math.max(1, imgEl.height);
    let dw = W - 80, dh = H - 106, dx = 40, dy = 30;
    if (ir > 1) { dh = dw / ir; dy += ((H - 106) - dh) / 2; }
    else { dw = dh * ir; dx += ((W - 80) - dw) / 2; }
    cx.drawImage(imgEl, dx, dy, dw, dh);
    cx.fillStyle = '#1b2826';
    cx.font = '700 22px Georgia, serif';
    cx.textAlign = 'center';
    cx.fillText((labelTxt || 'BIRTHDAY MEMORY').slice(0, 22), W / 2, H - 36);
    return cv;
  }
  const ir = imgEl.width / Math.max(1, imgEl.height);
  let dw = W - 24, dh = H - 24;
  if (ir > 1) dh = dw / ir; else dw = dh * ir;
  const dx = (W - dw) / 2, dy = (H - dh) / 2;
  cx.drawImage(imgEl, dx, dy, dw, dh);
  if (mode === 'RAW') return cv;

  // 'CUTOUT' mode: sample corner background color + radial silhouette vignette feathering
  const id = cx.getImageData(0, 0, W, H), d = id.data;
  const sx = Math.round(dx + 6), sy = Math.round(dy + 6), sx2 = Math.round(dx + dw - 6), sy2 = Math.round(dy + dh - 6);
  const sample = (x, y) => {
    const idx = (clamp(y, 0, H - 1) * W + clamp(x, 0, W - 1)) * 4;
    return [d[idx], d[idx + 1], d[idx + 2]];
  };
  const c1 = sample(sx, sy), c2 = sample(sx2, sy), c3 = sample(sx, sy2), c4 = sample(sx2, sy2);
  const bgR = (c1[0] + c2[0] + c3[0] + c4[0]) * 0.25;
  const bgG = (c1[1] + c2[1] + c3[1] + c4[1]) * 0.25;
  const bgB = (c1[2] + c2[2] + c3[2] + c4[2]) * 0.25;
  const cornerVar = Math.hypot(c1[0] - c2[0], c1[1] - c2[1], c1[2] - c2[2]);
  const hasUniformBg = cornerVar < 68;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      if (d[i + 3] < 10) continue;
      const nx = (x - W * 0.5) / (dw * 0.5), ny = (y - H * 0.52) / (dh * 0.5);
      const ell = Math.hypot(nx * 0.95, ny * 0.90);
      const colorDist = Math.hypot(d[i] - bgR, d[i + 1] - bgG, d[i + 2] - bgB);
      let alpha = d[i + 3];
      if (hasUniformBg && ell > 0.38 && colorDist < 42) {
        alpha *= clamp((colorDist - 14) / 28, 0, 1);
      }
      if (ell > 0.88) {
        alpha *= clamp((1.04 - ell) / 0.16, 0, 1);
      }
      d[i + 3] = Math.round(alpha);
    }
  }
  cx.putImageData(id, 0, 0);
  return cv;
}

function registerCustomCutoutFromCanvas(cv, name, opts = {}) {

  const clipObj = {
    id,
    name: ('USER · ' + name).toUpperCase().slice(0, 28),

    fps: 1,
    aspect: cv.width / Math.max(1, cv.height),
    h: opts.h || 0.62,

    isCustom: true,

  if (!opts.skipSaveDataUrl && !opts.liveVideo) {

  motionNote(0.78, 0, 0.45);

}

// B. SCION INDEPENDENT CRITIC & QUALITY BAR VERIFICATION ENGINE
function evaluateScionMemory() {
  // 1. UNTIDY MESS (0-20): Ana Stelline invariant ("a bit of mess makes it feel real")
  const pCount = DOC.props.length;
  const uniqueKinds = new Set(DOC.props.map(p => p.kind)).size;
  const messScore = Math.round(clamp(Math.min(12, pCount) / 12 * 12 + Math.min(8, uniqueKinds) / 8 * 8, 0, 20));

  // 2. MULTIPLANE DEPTH & SILHOUETTE SEPARATION (0-25)
  const planesUsed = new Set(DOC.cutouts.map(c => c.plane)).size;
  let minAngDiff = Math.PI;
  for (let i = 0; i < DOC.cutouts.length; i++) {
    for (let j = i + 1; j < DOC.cutouts.length; j++) {
      if (DOC.cutouts[i].plane === DOC.cutouts[j].plane) {
        const da = Math.abs(((DOC.cutouts[i].a - DOC.cutouts[j].a + Math.PI) % TAU + TAU) % TAU - Math.PI);
        if (da < minAngDiff) minAngDiff = da;
      }
    }
  }
  const tangencyPenalty = DOC.cutouts.length >= 2 && minAngDiff < 0.24 ? 6 : 0;
  const depthScore = Math.round(clamp(Math.min(3, planesUsed) / 3 * 15 + Math.min(5, DOC.cutouts.length) / 5 * 10 - tangencyPenalty, 0, 25));

  // 3. THERMAL LIGHT & WISH CONTRAST (0-20)
  const hasCandles = DOC.hero.candles > 0 ? 10 : 4;
  const warmBalance = DOC.light.warm >= 0.35 && DOC.light.warm <= 0.96 ? 10 : 6;
  const lightScore = clamp(hasCandles + warmBalance, 0, 20);

  // 4. PERSONAL TRACE & AUTHORSHIP (0-20): Custom assets, Etch-A-Sketch piping, or sculpted form
  const customCount = (DOC.customAssets || []).length;
  const etchPts = (DOC.etch && DOC.etch.pts) ? DOC.etch.pts.length : 0;
  const hasPhrase = DOC.etch && DOC.etch.phrase > 0 ? 6 : 0;
  const hasSculpt = Math.abs(DOC.hero.sculpt || 0) > 0.03 ? 6 : 0;
  const traceScore = Math.round(clamp(hasPhrase + hasSculpt + Math.min(10, etchPts * 0.5) + customCount * 10, 4, 20));

  // 5. TEMPORAL / ACCORDION BREATH & CHECKPOINT (0-15)
  const mistScore = (DOC.bellows > 0.02 && DOC.bellows < 0.85 ? 9 : 6) + (S.peakDoc ? 6 : 2);
  const breathScore = clamp(mistScore, 0, 15);

  const total = messScore + depthScore + lightScore + traceScore + breathScore;

  // Determine Primary Gap & Bounded Repair
  let primaryGap = 'All 5 multiplane, untidy mess, light, and personal trace invariants pass inspection.';
  let acceptance = 'Save Peak Checkpoint or Fork/Share this birthday cartridge.';
  let repairKind = 'PEAK';
  if (planesUsed < 3 || tangencyPenalty > 0) {
    primaryGap = 'FLAT PARALLAX / TANGENCY: Cutouts occupy only ' + planesUsed + ' depth plane(s) or overlap in silhouette.';
    acceptance = 'Distribute cutouts across >= 3 depth planes (Z1 Fore, Z2 Table Rim, Z3-Z5 Mid/Archive) with >= 20 deg separation.';
    repairKind = 'DEPTH';
  } else if (pCount < 9 || uniqueKinds < 6) {
    primaryGap = 'STERILE TABLETOP: Only ' + pCount + ' table props (' + uniqueKinds + ' kinds). Memories require untidy lived-in detail.';
    acceptance = 'Place >= 10 asymmetric birthday props (cut cake slice, spilled cup, wax drips, Polaroid) around the table.';
    repairKind = 'MESS';
  } else if (traceScore < 14) {
    primaryGap = 'WEAK PERSONAL TRACE: Scene lacks custom Etch-A-Sketch piping, sculpted deformation, or imported personal media.';
    acceptance = 'Pipe an icing inscription on the cake/table, sculpt the hero form, or import a personal photo/video.';
    repairKind = 'TRACE';
  } else if (!S.peakDoc || total > S.peakScore) {
    primaryGap = 'UNSAVED PEAK STATE: Current assembly (' + total + '/100) exceeds saved Peak Checkpoint (' + (S.peakScore || 0) + '/100).';
    acceptance = 'Commit current state to Peak Checkpoint so later edits cannot degrade the work.';
    repairKind = 'PEAK';
  }

  const strengths = [];
  if (messScore >= 16) strengths.push('Untidy table realism (' + pCount + ' props)');
  if (depthScore >= 20) strengths.push('Multiplane parallax (' + planesUsed + ' planes)');
  if (lightScore >= 18) strengths.push('Warm candlelit chiaroscuro');
  if (traceScore >= 15) strengths.push('Personal trace & custom piping');
  if (!strengths.length) strengths.push('Core hexagonal chamber framing');

  const verdict = total >= 88 ? 'BAR MET · EXCEPTIONAL' : total >= 74 ? 'STRONG CANDIDATE' : 'NEEDS BOUNDED REPAIR';
  return { total, messScore, depthScore, lightScore, traceScore, breathScore, verdict, primaryGap, acceptance, strengths: strengths.join(' · '), repairKind };
}

function scionRepairPrimaryGap() {
  snap(true);
  const before = evaluateScionMemory();
  if (before.repairKind === 'DEPTH') {
    // Separate cutouts across Z1 (0), Z2 (1), Z3 (2), Z4 (3) with golden-angle silhouette spacing
    const planes = [1, 0, 2, 1, 3, 4];
    DOC.cutouts.forEach((c, i) => {
      c.plane = planes[i % planes.length];
      c.a = (Math.PI - 0.95 + i * 0.52) % TAU;
    });
    if (DOC.cutouts.length < 5) {
      DOC.cutouts.push({ clip: 6, a: 0.38, plane: 0, face: -10, s: 0.96, speed: 1.0 });
    }
  } else if (before.repairKind === 'MESS') {
    while (DOC.props.length < 12) {
      const i = DOC.props.length;
      DOC.props.push({ kind: (i * 3 + 1) % PROP_KINDS.length, a: (i * 2.399) % TAU, r: 0.21 + (i % 5) * 0.065, rot: i * 1.4, s: 0.9 + (i % 3) * 0.14 });
    }
    dirty.props = true;
  } else if (before.repairKind === 'TRACE') {
    if (!DOC.etch.pts || DOC.etch.pts.length < 16) {
      DOC.etch.pts = [];
      for (let t = 0; t <= 28; t++) {
        const a = t / 28 * TAU;
        const r = 0.075 + 0.012 * Math.sin(a * 6);
        DOC.etch.pts.push(etchPoint3D(Math.cos(a) * (r / 0.095), Math.sin(a) * (r / 0.095), DOC.etch.surface || 0));
      }
    }
    if (!DOC.etch.phrase) DOC.etch.phrase = 1;
    if (Math.abs(DOC.hero.sculpt || 0) < 0.04) DOC.hero.sculpt = 0.08;
    dirty.etch = dirty.hero = true;
  } else {
    savePeakCheckpoint();
    return;
  }
  const after = evaluateScionMemory();
  if (after.total >= S.peakScore) { S.peakDoc = JSON.stringify(DOC); S.peakScore = after.total; }
  motionNote(0.75, 0, 0.45);
  say('SCION BOUNDED REPAIR (' + before.repairKind + ') · SCORE ' + before.total + ' -> ' + after.total + '/100');
  updateScionHud(); oledDirty = true; drawDialLabels();
}

function scionSwarmAutoBuild() {
  snap(true);
  // 4-Agent Swarm Pass: Staging + Untidy Mess + Piping + Lighting & Mist
  const planes = [0, 1, 1, 2, 3, 4];
  while (DOC.cutouts.length < 5) {
    const nextClip = (DOC.cutouts.length * 2 + 1) % 14;
    DOC.cutouts.push({ clip: nextClip, a: Math.PI, plane: 1, face: 0, s: 1.0, speed: 1.0 });
  }
  const goodAngles = [Math.PI, Math.PI - 0.85, Math.PI + 0.85, -1.18, 1.18, Math.PI - 1.45];
  DOC.cutouts.forEach((c, i) => {
    c.plane = planes[i % planes.length];
    c.a = goodAngles[i % goodAngles.length];
  });
  while (DOC.props.length < 12) {
    const i = DOC.props.length;
    DOC.props.push({ kind: i % PROP_KINDS.length, a: (i * 2.3999) % TAU, r: 0.22 + (i % 5) * 0.06, rot: i * 1.2, s: 0.92 + (i % 3) * 0.12 });
  }
  DOC.etch.pts = [];
  for (let t = 0; t <= 32; t++) {
    const a = t / 32 * TAU;
    DOC.etch.pts.push(etchPoint3D(Math.cos(a) * 0.78, Math.sin(a) * 0.78, DOC.etch.surface || 0));
  }
  if (!DOC.etch.phrase) DOC.etch.phrase = 2;
  if (Math.abs(DOC.hero.sculpt || 0) < 0.05) DOC.hero.sculpt = 0.09;
  if (DOC.hero.candles < 5) DOC.hero.candles = 7;
  DOC.hero.lit = 1;
  DOC.light.warm = clamp(DOC.light.warm || 0.82, 0.65, 0.92);
  if (DOC.bellows < 0.04) setBellows(0.08, true);
  dirty.hero = dirty.table = dirty.props = dirty.etch = true;
  savePeakCheckpoint();
  const ev = evaluateScionMemory();
  say('SCION SWARM AUTO-BUILD COMPLETE · VERDICT ' + ev.total + '/100 (' + ev.verdict + ')');
  updateScionHud(); oledDirty = true; drawDialLabels();
}

// C. COLLABORATIVE REMIX, FORK, MASHUP & CARTRIDGE SHARING
function forkBirthdayFromChapter(idx, mashupOnly) {
  snap(true);
  const src = TIZITA_CHAPTERS[clamp(idx, 0, TIZITA_CHAPTERS.length - 1)];
  const prevGen = (DOC.meta && DOC.meta.generation) || 1;
  if (mashupOnly) {
    // Mashup: keep current Hero cake & Table, but blend in the source chapter's Cutouts and Lighting!
    src.cutouts.slice(0, 3).forEach((c, i) => {
      DOC.cutouts.push({ ...c, a: (c.a + 0.35 * (i + 1)) % TAU, plane: (c.plane + 1) % 4 });
    });
    if (DOC.cutouts.length > 8) DOC.cutouts.splice(0, DOC.cutouts.length - 8);
    DOC.light.warm = lerp(DOC.light.warm, src.light.warm, 0.5);
    DOC.meta = {
      id: 'bday_' + Date.now().toString(36),
      title: (DOC.meta ? DOC.meta.title.split('×')[0].trim() : 'BIRTHDAY') + ' × ' + src.title.slice(5, 22),
      author: (document.getElementById('inpBdayAuthor') && document.getElementById('inpBdayAuthor').value) || 'STELLINE-BUILDER',
      generation: prevGen + 1,
      parentId: src.id
    };
    dirty.props = true;
    say('MASHUP REMIX (GEN ' + DOC.meta.generation + ') · MERGED CAST FROM ' + src.title);
  } else {
    loadTizitaChapter(idx, true);
    // Apply a subtle creative branch mutation (new icing color, extra lived-in props, slight sculpt)
    DOC.hero.sculpt = clamp((DOC.hero.sculpt || 0) + 0.08, -0.5, 0.5);
    DOC.etch.col = (DOC.etch.col + 1) % ETCH_COLS.length;
    DOC.props.push({ kind: 10, a: 0.42, r: 0.32, rot: 0.5, s: 1.1 });
    DOC.meta = {
      id: 'bday_' + Date.now().toString(36),
      title: 'REMIX · ' + src.title.slice(5),
      author: (document.getElementById('inpBdayAuthor') && document.getElementById('inpBdayAuthor').value) || 'STELLINE-BUILDER',
      generation: prevGen + 1,
      parentId: src.id
    };
    dirty.hero = dirty.props = dirty.etch = true;
    say('FORKED BIRTHDAY BRANCH (GEN ' + DOC.meta.generation + ') · ' + DOC.meta.title);
  }
  const inpT = document.getElementById('inpBdayTitle');
  if (inpT && DOC.meta) inpT.value = DOC.meta.title;
  updateScionHud(); renderRemixDeck(); oledDirty = true; drawDialLabels();
}

function serializeBirthdayCartridge() {
  const titleEl = document.getElementById('inpBdayTitle');
  const authEl = document.getElementById('inpBdayAuthor');
  DOC.meta = DOC.meta || { id: 'bday_' + Date.now().toString(36), generation: 1 };
  if (titleEl && titleEl.value) DOC.meta.title = titleEl.value.trim();
  if (authEl && authEl.value) DOC.meta.author = authEl.value.trim();
  const ev = evaluateScionMemory();
  return {
    schema: 'scion.birthday.v1',
    exportedAt: new Date().toISOString(),
    scionValidation: { score: ev.total, verdict: ev.verdict, primaryGap: ev.primaryGap, strengths: ev.strengths },
    doc: DOC
  };
}

function exportBirthdayCartridge() {
  const cart = serializeBirthdayCartridge();
  const blob = new Blob([JSON.stringify(cart, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const slug = (cart.doc.meta.title || 'tizita-birthday').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  a.href = URL.createObjectURL(blob);
  a.download = slug + '.birthday.json';
  document.body.append(a); a.click();
  setTimeout(() => a.remove(), 1000);
  say('EXPORTED CARTRIDGE · ' + slug.toUpperCase() + '.BIRTHDAY.JSON');
}

function importBirthdayCartridge(cart, asFork) {
  const d = cart && cart.doc ? cart.doc : cart;
  if (!d || !d.hero) { say('INVALID BIRTHDAY CARTRIDGE'); return; }
  snap(true);
  DOC = JSON.parse(JSON.stringify(d));
  DOC.meta = DOC.meta || { id: 'bday_' + Date.now().toString(36), title: 'IMPORTED BIRTHDAY', author: 'COMMUNITY', generation: 1 };
  if (asFork) {
    DOC.meta.generation = (DOC.meta.generation || 1) + 1;
    DOC.meta.title = 'REMIX · ' + DOC.meta.title;
  }
  // Rehydrate any embedded custom photo cutouts!
  if (Array.isArray(DOC.customAssets)) {
    DOC.customAssets.forEach(ca => {
      if (ca && ca.dataUrl) {
        const img = new Image();
        img.onload = () => {
          const cv = document.createElement('canvas'); cv.width = 192; cv.height = 192;
          cv.getContext('2d').drawImage(img, 0, 0, 192, 192);
          registerCustomCutoutFromCanvas(cv, ca.name || 'IMPORTED', { id: ca.id, skipSpawn: true, skipSaveDataUrl: true });
        };
        img.src = ca.dataUrl;
      }
    });
  }
  dirty.hero = dirty.table = dirty.props = dirty.etch = true;
  setBellows(DOC.bellows || 0, true);
  const inpT = document.getElementById('inpBdayTitle');
  if (inpT) inpT.value = DOC.meta.title;
  updateScionHud(); renderRemixDeck(); oledDirty = true; drawDialLabels();
  say((asFork ? 'FORKED' : 'LOADED') + ' BIRTHDAY · ' + DOC.meta.title + ' (GEN ' + DOC.meta.generation + ')');
}

function copyBirthdayShareLink() {
  const compact = {
    m: DOC.meta,
    h: DOC.hero,
    t: DOC.table,
    p: DOC.props.slice(0, 14),
    c: DOC.cutouts.slice(0, 7).map(c => ({ clip: c.clip < 32 ? c.clip : 0, a: +c.a.toFixed(2), plane: c.plane, face: c.face, s: +c.s.toFixed(2) })),
    e: { surface: DOC.etch.surface, phrase: DOC.etch.phrase, col: DOC.etch.col },
    l: DOC.light,
    b: +DOC.bellows.toFixed(2)
  };
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(compact))));
  const shareUrl = location.origin + location.pathname + '#bday=' + b64;
  history.replaceState(null, '', '#bday=' + b64);
  const out = document.getElementById('inpShareUrlOut');
  if (out) { out.value = shareUrl; out.select(); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(shareUrl).catch(() => {});
  }
  say('SHAREABLE REMIX URL COPIED TO CLIPBOARD');
  return shareUrl;
}

function checkUrlBirthdayHash() {
  if (!location.hash || !location.hash.startsWith('#bday=')) return;
  try {
    const raw = decodeURIComponent(escape(atob(location.hash.slice(6))));
    const c = JSON.parse(raw);
    if (c && c.h) {
      DOC.meta = c.m || { title: 'SHARED BIRTHDAY', author: 'PEER', generation: 2 };
      DOC.hero = c.h; DOC.table = c.t || DOC.table; DOC.props = c.p || DOC.props;
      DOC.cutouts = c.c || DOC.cutouts;
      DOC.etch = Object.assign(DOC.etch, c.e || {});
      DOC.light = c.l || DOC.light;
      dirty.hero = dirty.table = dirty.props = dirty.etch = true;
      setBellows(c.b || 0, true);
      say('LOADED SHARED BIRTHDAY FROM URL · ' + (DOC.meta.title || 'REMIX'));
    }
  } catch (e) {}
}

function saveToLocalRemixDeck() {
  const cart = serializeBirthdayCartridge();
  SAVED_BDAYS.unshift(cart);
  if (SAVED_BDAYS.length > 16) SAVED_BDAYS.pop();
  try { localStorage.setItem('cineosis_saved_birthdays_v1', JSON.stringify(SAVED_BDAYS)); } catch (e) {}
  renderRemixDeck();
  say('SAVED TO REMIX DECK · ' + cart.doc.meta.title);
}

function renderRemixDeck() {
  const listEl = document.getElementById('remixDeckList');
  if (!listEl) return;
  listEl.innerHTML = '';
  const totalCount = SAVED_BDAYS.length + TIZITA_CHAPTERS.length;
  const cntEl = document.getElementById('deckCountTxt');
  if (cntEl) cntEl.textContent = String(totalCount);

  // 1. User / Community Saved Remixes
  SAVED_BDAYS.forEach((cart, idx) => {
    const row = document.createElement('div'); row.className = 'remixItem';
    const meta = cart.doc.meta || {};
    const sc = cart.scionValidation ? cart.scionValidation.score : 85;
    row.innerHTML = `<div class="rmMeta"><strong style="color:#f6c978">[USER GEN ${meta.generation || 1} · ${sc}PT]</strong> ${meta.title || 'CUSTOM BIRTHDAY'} <span style="color:#7aa8a0">by ${meta.author || 'BUILDER'}</span></div>`;
    const btns = document.createElement('div'); btns.className = 'rmBtns';
    const bLoad = document.createElement('button'); bLoad.className = 'pill'; bLoad.textContent = 'LOAD';
    bLoad.onclick = () => importBirthdayCartridge(cart, false);
    const bFork = document.createElement('button'); bFork.className = 'pill amber'; bFork.textContent = 'FORK REMIX';
    bFork.onclick = () => importBirthdayCartridge(cart, true);
    btns.append(bLoad, bFork); row.append(btns); listEl.append(row);
  });

  // 2. Canonical 12 Tizita Birthdays Across Time & Space
  TIZITA_CHAPTERS.forEach((ch, idx) => {
    const row = document.createElement('div'); row.className = 'remixItem';
    row.innerHTML = `<div class="rmMeta"><strong style="color:#5ff0dc">${ch.title}</strong></div>`;
    const btns = document.createElement('div'); btns.className = 'rmBtns';
    const bLoad = document.createElement('button'); bLoad.className = 'pill'; bLoad.textContent = 'LOAD';
    bLoad.onclick = () => { loadTizitaChapter(idx); updateScionHud(); };
    const bFork = document.createElement('button'); bFork.className = 'pill amber'; bFork.textContent = 'FORK';
    bFork.onclick = () => forkBirthdayFromChapter(idx, false);
    const bMash = document.createElement('button'); bMash.className = 'pill'; bMash.textContent = 'MASHUP';
    bMash.onclick = () => forkBirthdayFromChapter(idx, true);
    btns.append(bLoad, bFork, bMash); row.append(btns); listEl.append(row);
  });
}

        <textarea class="v2gPromptBox" id="v2gPromptOut" readonly></textarea>
        <div class="v2gMetaGrid">
          <div class="v2gMetaCard" id="v2gPoseMeta"></div>
          <div class="v2gMetaCard">
            <strong>ROUND-TRIP PASTE FROM OTHER BROWSER (CMD+V):</strong><br>
            Generate your stylized frame or character sprite in another browser (<a href="https://video2game.github.io/" target="_blank" style="color:#e85d04">video2game.github.io</a> / <a href="https://github.com/lovisdotio/video-to-game" target="_blank" style="color:#e85d04">lovisdotio/video-to-game</a> / Gemini / Midjourney), copy the image, and press <strong>Cmd+V (Ctrl+V)</strong> here to place it directly on the birthday table!
            <div style="margin-top:6px;display:flex;gap:6px;">
              <label style="font-size:12px;"><input type="radio" name="v2gPasteTarget" value="cutout" checked> Paste as Cardboard Standee</label>
              <label style="font-size:12px;"><input type="radio" name="v2gPasteTarget" value="cake"> Paste onto Cake</label>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(drawer);
})();

let v2gState = { cat: 'shots', idx: 9, styleIdx: 0 };

function buildV2GPromptText() {
  const st = V2G_STYLES[v2gState.styleIdx] || V2G_STYLES[0];
  if (v2gState.cat === 'shots') {
    const s = V2G_SHOTS[v2gState.idx] || V2G_SHOTS[0];
    return [
      `[TARGET: ${st.name}]`,
      `[SCENE: ${s.code} — ${s.title}]`,
      `PROMPT: ${s.prompt}`,
      `EXACT POSE & GEOMETRY LOCK: ${s.poseSpec}`,
      `CAMERA & LENS: ${s.cam}`,
      `STYLE & CONDITIONING SPEC: ${st.suffix}`
    ].join('\n');
  } else if (v2gState.cat === 'cakes') {
    const c = V2G_CAKES[v2gState.idx] || V2G_CAKES[0];
    return [
      `[TARGET: ${st.name}]`,
      `[HERO ASSET: ${c.code} — ${c.title}]`,
      `PROMPT: ${c.prompt}`,
      `CANONICAL RECIPE PARAMETERS: ${c.recipe}`,
      `STYLE & TURNTABLE SPEC: ${st.suffix}`
    ].join('\n');
  } else {
    const ch = V2G_CHARS[v2gState.idx] || V2G_CHARS[0];
    return [
      `[TARGET: ${st.name}]`,
      `[CHARACTER POSE SHEET: ${ch.code} — ${ch.title}]`,
      `PROMPT: ${ch.prompt}`,
      `EXACT ANATOMICAL POSE: ${ch.poseSpec}`,
      `STYLE & SPRITE GRID SPEC: ${st.suffix}`
    ].join('\n');
  }
}

function renderV2GWorkbench() {
  const listEl = document.getElementById('v2gListEl');
  const platesEl = document.getElementById('v2gPlatesEl');
  const styleSel = document.getElementById('v2gStyleSel');
  const promptOut = document.getElementById('v2gPromptOut');
  const poseMeta = document.getElementById('v2gPoseMeta');
  if (!listEl) return;

  if (!styleSel.options.length) {
    V2G_STYLES.forEach((st, i) => {
      const opt = document.createElement('option');
      opt.value = i; opt.textContent = st.name;
      styleSel.appendChild(opt);
    });
    styleSel.onchange = () => {
      v2gState.styleIdx = +styleSel.value;
      promptOut.value = buildV2GPromptText();
    };
  }

  const items = v2gState.cat === 'shots' ? V2G_SHOTS : (v2gState.cat === 'cakes' ? V2G_CAKES : V2G_CHARS);
  v2gState.idx = clamp(v2gState.idx, 0, items.length - 1);

  listEl.innerHTML = '';
  items.forEach((it, idx) => {
    const btn = document.createElement('button');
    btn.className = 'v2gItem' + (idx === v2gState.idx ? ' active' : '');
    btn.innerHTML = `<span class="v2gItemCode">${it.code}</span><span class="v2gItemName">${it.title}</span>`;
    btn.onclick = () => { v2gState.idx = idx; renderV2GWorkbench(); };
    listEl.appendChild(btn);
  });

  const cur = items[v2gState.idx];
  if (v2gState.cat === 'shots') {
    platesEl.innerHTML = `
      <div class="v2gPlateCard"><img src="${cur.rgb}" alt="RGB"><div class="v2gPlateLbl"><span>1 · FILM RGB</span><a href="${cur.rgb}" download style="color:#5ff0dc">DL</a></div></div>
      <div class="v2gPlateCard"><img src="${cur.pose}" alt="POSE"><div class="v2gPlateLbl"><span>2 · OPENPOSE + EDGE</span><a href="${cur.pose}" download style="color:#5ff0dc">DL</a></div></div>
      <div class="v2gPlateCard"><img src="${cur.depth}" alt="DEPTH"><div class="v2gPlateLbl"><span>3 · MIDAS DEPTH</span><a href="${cur.depth}" download style="color:#5ff0dc">DL</a></div></div>
      <div class="v2gPlateCard"><img src="${cur.sam}" alt="SAM"><div class="v2gPlateLbl"><span>4 · SAM MATTE</span><a href="${cur.sam}" download style="color:#5ff0dc">DL</a></div></div>
    `;
    poseMeta.innerHTML = `<strong>EXACT POSE & CAMERA RIG:</strong><br>${cur.poseSpec}<br><span style="color:#e85d04">${cur.cam}</span>`;
  } else if (v2gState.cat === 'cakes') {
    platesEl.innerHTML = `
      <div class="v2gPlateCard" style="grid-column: span 2;"><img src="${cur.img}" style="height:150px;object-fit:contain;" alt="CAKE"><div class="v2gPlateLbl"><span>1 · CANONICAL CAKE REFERENCE</span><a href="${cur.img}" download style="color:#5ff0dc">DL</a></div></div>
      <div class="v2gPlateCard" style="grid-column: span 2;"><img src="${cur.pose}" style="height:150px;object-fit:cover;" alt="WIREFRAME"><div class="v2gPlateLbl"><span>2 · 3D CYLINDER & WICK WIREFRAME</span><a href="${cur.pose}" download style="color:#5ff0dc">DL</a></div></div>
    `;
    poseMeta.innerHTML = `<strong>CANONICAL CAKE RECIPE (made.json):</strong><br>${cur.recipe}`;
  } else {
    platesEl.innerHTML = `
      <div class="v2gPlateCard" style="grid-column: span 3;"><img src="${cur.img}" style="height:165px;object-fit:contain;background:#f6f1e6;" alt="POSE STRIP"><div class="v2gPlateLbl"><span>1 · 4-KEYFRAME ACTION POSE SHEET</span><a href="${cur.img}" download style="color:#5ff0dc">DL</a></div></div>
      <div class="v2gPlateCard"><img src="${cur.sheet}" style="height:165px;object-fit:cover;" alt="FULL GRID"><div class="v2gPlateLbl"><span>2 · FULL SPRITE GRID</span><a href="${cur.sheet}" download style="color:#5ff0dc">DL</a></div></div>
    `;
    poseMeta.innerHTML = `<strong>CHARACTER ANATOMICAL POSE SPEC:</strong><br>${cur.poseSpec}`;
  }

  promptOut.value = buildV2GPromptText();
}

function toggleV2GModal(forceOpen) {
  const dr = document.getElementById('v2gDrawer');
  if (!dr) return;
  const next = forceOpen != null ? forceOpen : !dr.classList.contains('open');
  dr.classList.toggle('open', next);
  if (next) {
    renderV2GWorkbench();
    say('OPENED VIDEO2GAME ICONIC SCENE, CAKE & POSE PROMPT KIT');
  } else {
    say('CLOSED VIDEO2GAME PROMPT KIT');
  }
}

// Wire up V2G Workbench buttons & tabs
(function bindV2GEvents() {
  document.querySelectorAll('.v2gTab[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.v2gTab[data-cat]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      v2gState.cat = btn.getAttribute('data-cat');
      v2gState.idx = 0;
      renderV2GWorkbench();
    });
  });

  const closeBtn = document.getElementById('v2gCloseBtn');
  if (closeBtn) closeBtn.onclick = () => toggleV2GModal(false);

  const copyPromptBtn = document.getElementById('v2gCopyPromptBtn');
  if (copyPromptBtn) {
    copyPromptBtn.onclick = () => {
      const txt = buildV2GPromptText();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).catch(() => {});
      }
      copyPromptBtn.textContent = 'COPIED PROMPT!';
      setTimeout(() => copyPromptBtn.textContent = 'COPY PROMPT', 1600);
      say('COPIED VIDEO2GAME STYLE-TRANSFER PROMPT TO CLIPBOARD');
    };
  }

  // Build composite 2x2 or side-by-side PNG for copying to clipboard or downloading
  async function buildCompositeSheetCanvas() {
    const cv = document.createElement('canvas'); cv.width = 1280; cv.height = 720;
    const cx = cv.getContext('2d');
    cx.fillStyle = '#101413'; cx.fillRect(0, 0, 1280, 720);

    const loadImg = url => new Promise(res => {
      const im = new Image(); im.crossOrigin = 'anonymous';
      im.onload = () => res(im); im.onerror = () => res(null);
      im.src = url;
    });

    if (v2gState.cat === 'shots') {
      const s = V2G_SHOTS[v2gState.idx];
      const [imRgb, imPose, imDepth, imSam] = await Promise.all([
        loadImg(s.rgb), loadImg(s.pose), loadImg(s.depth), loadImg(s.sam)
      ]);
      if (imRgb) cx.drawImage(imRgb, 0, 0, 640, 360);
      if (imPose) cx.drawImage(imPose, 640, 0, 640, 360);
      if (imDepth) cx.drawImage(imDepth, 0, 360, 640, 360);
      if (imSam) cx.drawImage(imSam, 640, 360, 640, 360);
    } else {
      const items = v2gState.cat === 'cakes' ? V2G_CAKES : V2G_CHARS;
      const cur = items[v2gState.idx];
      const [im1, im2] = await Promise.all([loadImg(cur.img), loadImg(cur.pose || cur.sheet)]);
      if (im1) cx.drawImage(im1, 20, 40, 600, 640);
      if (im2) cx.drawImage(im2, 660, 40, 600, 640);
    }
    return cv;
  }

  const copyImgBtn = document.getElementById('v2gCopyImgBtn');
  if (copyImgBtn) {
    copyImgBtn.onclick = async () => {
      try {
        const cv = await buildCompositeSheetCanvas();
        cv.toBlob(async blob => {
          if (blob && navigator.clipboard && window.ClipboardItem) {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            copyImgBtn.textContent = 'IMAGE COPIED!';
            setTimeout(() => copyImgBtn.textContent = 'COPY POSE+RGB IMAGE', 1600);
            say('COPIED COMPOSITE POSE+RGB IMAGE TO CLIPBOARD · PASTE IN OTHER BROWSER');
          }
        }, 'image/png');
      } catch (e) {
        say('USE DOWNLOAD PNG BUTTON IN THIS BROWSER');
      }
    };
  }

  const dlBtn = document.getElementById('v2gDownloadSheetBtn');
  if (dlBtn) {
    dlBtn.onclick = async () => {
      const cv = await buildCompositeSheetCanvas();
      const a = document.createElement('a');
      a.href = cv.toDataURL('image/png');
      a.download = 'v2g_conditioning_' + v2gState.cat + '_' + (v2gState.idx + 1) + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      say('DOWNLOADED 4-PLATE V2G CONDITIONING SHEET (.PNG)');
    };
  }

  const stageBtn = document.getElementById('v2gStageBtn');
  if (stageBtn) {
    stageBtn.onclick = () => {
      snap(true);
      if (v2gState.cat === 'shots') {
        const s = V2G_SHOTS[v2gState.idx];
        const st = s.stagePreset || {};
        if (st.chapter != null) loadTizitaChapter(st.chapter, true);
        if (st.preset != null) DOC.hero.preset = st.preset;
        if (st.finish != null) DOC.hero.finish = st.finish;
        if (st.candles != null) DOC.hero.candles = st.candles;
        DOC.hero.lit = st.lit != null ? st.lit : 1;
        if (st.phrase != null) DOC.etch.phrase = st.phrase;
        if (st.bellows != null) setBellows(st.bellows, true);
        if (st.view) setView(st.view);
        dirty.hero = dirty.table = dirty.props = dirty.etch = true;
        say('STAGED ICONIC SHOT ON 3D ORB · ' + s.title);
      } else if (v2gState.cat === 'cakes') {
        const c = V2G_CAKES[v2gState.idx];
        Object.assign(DOC.hero, c.heroSpec);
        if (c.heroSpec.phrase != null) DOC.etch.phrase = c.heroSpec.phrase;
        dirty.hero = dirty.etch = true;
        setMode('HERO', true);
        say('STAGED CANONICAL CAKE · ' + c.title);
      } else {
        const ch = V2G_CHARS[v2gState.idx];
        if (DOC.cutouts[S.castIdx]) {
          DOC.cutouts[S.castIdx].clip = ch.clipIdx;
        } else {
          DOC.cutouts.push({ clip: ch.clipIdx, a: Math.PI, plane: 1, face: 0, s: 1.05, speed: 1 });
          S.castIdx = DOC.cutouts.length - 1;
        }
        setMode('CAST', true);
        say('ASSIGNED CHARACTER POSE · ' + ch.title);
      }
      toggleV2GModal(false);
      oledDirty = true; drawDialLabels();
    };
  }

  addEventListener('keydown', e => {
    if (e.key === 'Escape') toggleV2GModal(false);
    else if ((e.key === 'g' || e.key === 'G') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      toggleV2GModal();
    }
  });

  // Cmd+V / Ctrl+V Clipboard Image Receiver: Paste any style-transferred image from another browser directly onto the 3D stage!
  addEventListener('paste', e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) {
        const file = items[i].getAsFile();
        if (!file) continue;
        const targetEl = document.querySelector('input[name="v2gPasteTarget"]:checked');
        const targetMode = targetEl ? targetEl.value : 'cutout';
        if (targetMode === 'cake') {
          const reader = new FileReader();
          reader.onload = ev => {
            const img = new Image();
            img.onload = () => {
              const tex = new T.Texture(img);
              tex.encoding = T.sRGBEncoding; tex.needsUpdate = true;
              benchTexCache['custom_pasted_cake'] = tex;
              HERO_PRESETS[0].kind = 'bench_cake';
              HERO_PRESETS[0].file = 'custom_pasted_cake';
              tex.repeat.set(1, 1);
              DOC.hero.preset = 0; dirty.hero = true;
              say('PASTED STYLE-TRANSFERRED CAKE IMAGE FROM CLIPBOARD!');
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        } else {
          importUserImageFile(file, 'CUTOUT');
          say('PASTED STYLE-TRANSFERRED STANDEE FROM OTHER BROWSER!');
        }
        toggleV2GModal(false);
        break;
      }
    }
  });
})();

window.toggleV2GModal = toggleV2GModal;
window.toggleV2GDrawer = toggleV2GModal;
window.setV2GTab = function(cat) {
  v2gState.cat = cat;
  v2gState.idx = 0;
  document.querySelectorAll(".v2gTab[data-cat]").forEach(b => b.classList.toggle("active", b.dataset.cat === cat));
  renderV2GWorkbench();
};
window.stageV2GScene = function(idx) {
  v2gState.cat = "shots";
  v2gState.idx = idx;
  renderV2GWorkbench();
  const btn = document.getElementById("v2gStageBtn");
  if (btn) btn.click();
};

</script>
