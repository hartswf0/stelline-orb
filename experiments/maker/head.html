<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Memory Maker</title>
<meta name="description" content="A design tool for one memory: add a cake, candles, a table, figures and a light, set their properties, and move the camera, all from the orb.">
<style>
  html, body { margin: 0; height: 100%; background: #050605; overflow: hidden; user-select: none; -webkit-user-select: none; font-family: ui-monospace, Menlo, monospace; }
  * { -webkit-tap-highlight-color: transparent; }
  .app { height: 100dvh; display: grid; grid-template-rows: minmax(0, 1fr) clamp(240px, 38vh, 400px); }
  #room, #orb { position: relative; overflow: hidden; touch-action: none; }
  #room canvas, #orb canvas { display: block; width: 100%; height: 100%; }
  #orb { background: radial-gradient(120% 140% at 50% 0%, #161816 0%, #0a0b0a 55%, #040504 100%); border-top: 1px solid #1a1c1a; }
  @media (max-width: 700px) { .app { grid-template-rows: minmax(0, 1fr) 46%; } }
  body.phone .app { grid-template-rows: 1fr; } body.phone #room { display: none; }
  body.film .app { grid-template-rows: 1fr; } body.film #orb { position: fixed; left: 24vw; bottom: -1vw; width: 52vw; height: 22vw; background: none; border: 0; }
</style>
</head>
<body>
<div class="app"><div id="room"></div><div id="orb"></div></div>
<script src="assets/three.min.js"></script>
<script src="assets/GLTFExporter.js"></script>
<script src="assets/v6/qrcode.js"></script>
<script>
/* MEMORY MAKER. A design tool for one memory scene, worked entirely from the orb.
   EDIT  ring 1 picks an object · rings 2-5 are that object's properties · ADD puts a new object in · DEL takes the picked one out
   VIEW  ring 1 chooses a camera (EYE, FRONT, SIDE, TOP, FREE) · ring 2 orbit · ring 3 tilt · ring 4 zoom · ring 5 lens
   MODE switches EDIT and VIEW. UNDO (hold: redo). KEEP writes a .glb where the page may save files. Tap the end of the grip to pair a phone.
   In the room: drag to orbit, wheel or pinch to zoom, right-drag or two fingers to pan, click to pick. */
const T = THREE, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, TAU = Math.PI * 2, sm = t => t * t * (3 - 2 * t);
let NOW = 0, AC = null;
const FILM = /[?&]film\b/.test(location.search); if (FILM) document.body.classList.add('film');
const roomEl = document.getElementById('room');
const R = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setPixelRatio(Math.min(2, devicePixelRatio)); R.outputEncoding = T.sRGBEncoding; R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.15; R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap; roomEl.append(R.domElement);
const scene = new T.Scene(); scene.background = new T.Color(0x0b0d0c); scene.fog = new T.FogExp2(0x0b0d0c, .028);
const cam = new T.PerspectiveCamera(38, 1, .02, 60);

/* =============================================================== THE DOME: dark, its seams faint, one lit line where the wall meets the floor */
(function dome() { scene.add(new T.Mesh(new T.SphereGeometry(12, 64, 32, 0, TAU, 0, Math.PI / 2), new T.MeshStandardMaterial({ color: 0x121513, roughness: 1, side: T.BackSide })));
  const fl = new T.Mesh(new T.CircleGeometry(12, 96), new T.MeshStandardMaterial({ color: 0x0c0e0d, roughness: .55, metalness: .3 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; scene.add(fl);
  const ring = (r, t, y, c, op) => { const m = new T.Mesh(new T.TorusGeometry(r, t, 6, 360), new T.MeshBasicMaterial({ color: c, transparent: op < 1, opacity: op, depthWrite: op >= 1, toneMapped: false })); m.rotation.x = Math.PI / 2; m.position.y = y; scene.add(m); };
  ring(11.4, .02, .55, 0xeef5f1, 1); ring(11.4, .17, .55, 0x9fb4ad, .1); ring(11.35, .06, .01, 0x8fa39c, .08);
  const seam = new T.LineBasicMaterial({ color: 0x1c211f }); for (let k = 0; k < 10; k++) { const a = k / 10 * TAU, p = []; for (let j = 0; j <= 24; j++) { const e = .08 + j / 24 * 1.4; p.push(new T.Vector3(Math.cos(a) * Math.cos(e) * 11.9, Math.sin(e) * 11.9, Math.sin(a) * Math.cos(e) * 11.9)); } scene.add(new T.Line(new T.BufferGeometry().setFromPoints(p), seam)); }
  })();
scene.add(new T.HemisphereLight(0x8a9894, 0x080604, .07));

/* =============================================================== MIST: every made thing can come apart into points of light */
const MU = { uMist: { value: 0 }, uTime: { value: 0 } };
function mistify(mat) { mat.onBeforeCompile = sh => { Object.assign(sh.uniforms, MU);
    sh.vertexShader = 'varying vec3 vMW;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\n vMW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = 'uniform float uMist, uTime; varying vec3 vMW;\nfloat mh(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }\n' + sh.fragmentShader.replace('void main() {', 'void main() {\n if (uMist > 0.001 && mh(floor(vMW * 640.0)) < uMist) discard;'); };
  mat.customProgramCacheKey = () => 'mist' + (mat.alphaTest ? 'a' : ''); return mat; }

/* =============================================================== THE MEMORY: a pivot the grip turns, and what is made inside it */
const TOP = .62;                                     // where the cake sits: in the air, and later on the table
const PIV = new T.Group(); PIV.position.set(0, TOP + .05, 0); scene.add(PIV); const MEM = new T.Group(); MEM.position.y = -(TOP + .05); PIV.add(MEM);
const CAKE = new T.Group(); CAKE.position.y = TOP; MEM.add(CAKE);
const TABLE = new T.Group(); MEM.add(TABLE); const KIDG = new T.Group(); MEM.add(KIDG);
const key = new T.SpotLight(0xffb878, 0, 5, .42, .6, 1.3); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -.0012; scene.add(key, key.target);
const candleLight = new T.PointLight(0xffa04a, 0, 2.2, 1.7); scene.add(candleLight);
const keyMark = new T.Group(); scene.add(keyMark); { const m = new T.Mesh(new T.SphereGeometry(.018, 16, 10), new T.MeshBasicMaterial({ color: 0xffe2b0, toneMapped: false })); keyMark.add(m); }
const keyLine = new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(), new T.Vector3(0, 1, 0)]), new T.LineBasicMaterial({ color: 0xffe2b0, transparent: true, opacity: .35 })); scene.add(keyLine);

const FORMS = { DRUM: { p: [[0, 0], [.118, 0], [.122, .006], [.122, .084], [.115, .092], [0, .092]], top: .092, edge: .118, cr: .075 },
  DOME: { p: (() => { const p = [[0, 0], [.122, 0], [.122, .02]]; for (let k = 1; k <= 14; k++) { const a = k / 14 * Math.PI / 2; p.push([.122 * Math.cos(a), .02 + .085 * Math.sin(a)]); } return p; })(), top: .1, edge: .122, cr: .05, domed: true },
  TIERS: { p: [[0, 0], [.13, 0], [.132, .006], [.132, .068], [.128, .072], [.088, .072], [.09, .078], [.09, .138], [.084, .144], [0, .144]], top: .144, edge: .086, cr: .05, low: [.13, .072] },
  RING: { p: (() => { const p = []; for (let k = 0; k <= 40; k++) { const t = -Math.PI / 2 + k / 40 * TAU; p.push([.08 + .045 * Math.cos(t), .045 + .048 * Math.sin(t)]); } return p; })(), top: .093, edge: .08, cr: .08, ring: true } };
const ICING = [['SPONGE', 0xc99b5e], ['CREAM', 0xf0e2c4], ['WHITE', 0xf8f4ec], ['ROSE', 0xeaa5b2], ['CHOCOLATE', 0x4a2b1b], ['LEMON', 0xf1d97c], ['MINT', 0xbadfcb]];
const BORDER = [['NONE', 0], ['WHITE', 0xfbf8f2], ['ROSE', 0xd9748a], ['CHOCOLATE', 0x3a2114], ['GOLD', 0xd9a640]];
const WOOD = [['OAK', 0x3a2410], ['WALNUT', 0x5e3c20], ['PALE', 0xd4c19a], ['BLACK', 0x1d1a16]];
const bump = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'), id = x.createImageData(256, 256); for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 100; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } x.putImageData(id, 0, 0); const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; return t; })();
const stripe = (() => { const c = document.createElement('canvas'); c.width = 16; c.height = 64; const x = c.getContext('2d'); x.fillStyle = '#f4ecdc'; x.fillRect(0, 0, 16, 64); x.fillStyle = '#d4483e'; for (let y = -16; y < 80; y += 12) { x.beginPath(); x.moveTo(0, y); x.lineTo(16, y + 8); x.lineTo(16, y + 13); x.lineTo(0, y + 5); x.fill(); } const t = new T.CanvasTexture(c); t.wrapT = T.RepeatWrapping; t.encoding = T.sRGBEncoding; return t; })();
const flameMat = new T.SpriteMaterial({ map: (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 128; const x = c.getContext('2d'), g = x.createRadialGradient(32, 86, 2, 32, 76, 46); g.addColorStop(0, 'rgba(255,252,230,1)'); g.addColorStop(.22, 'rgba(255,205,95,.95)'); g.addColorStop(.6, 'rgba(255,120,30,.35)'); g.addColorStop(1, 'rgba(255,90,20,0)'); x.fillStyle = g; x.beginPath(); x.ellipse(32, 76, 18, 46, 0, 0, TAU); x.fill(); return new T.CanvasTexture(c); })(), blending: T.AdditiveBlending, depthWrite: false, transparent: true, toneMapped: false });
const icingMat = mistify(new T.MeshStandardMaterial({ roughness: .78, bumpMap: bump, bumpScale: .0012 })), beadMat = mistify(new T.MeshStandardMaterial({ roughness: .5 })), candleMat = mistify(new T.MeshStandardMaterial({ map: stripe, roughness: .5 })), wickMat = new T.MeshBasicMaterial({ color: 0x1b1612 });
let FLAMES = [];
function buildCake(c) { CAKE.clear(); FLAMES = []; if (!c) return; const F = FORMS[c.form];
  icingMat.color.setHex(ICING[c.icing][1]); const body = new T.Mesh(new T.LatheGeometry(F.p.map(p => new T.Vector2(p[0], p[1])), 112), icingMat); body.castShadow = body.receiveShadow = true; CAKE.add(body);
  if (c.border) { beadMat.color.setHex(BORDER[c.border][1]); const rings = [[F.edge, F.top - (F.domed ? .07 : .002)], [F.p[1][0], .006]]; if (F.low) rings.push([F.low[0] - .003, F.low[1]]);
    rings.forEach(([r, y]) => { const n = Math.round(TAU * r / .0105), im = new T.InstancedMesh(new T.SphereGeometry(.0062, 10, 8), beadMat, n), m4 = new T.Matrix4(); for (let k = 0; k < n; k++) { const a = k / n * TAU; m4.makeTranslation(Math.cos(a) * r, y, Math.sin(a) * r); im.setMatrixAt(k, m4); } im.castShadow = true; CAKE.add(im); }); }
  for (let k = 0; k < c.candles; k++) { const a = k / c.candles * TAU + .3, r = c.candles === 1 ? 0 : Math.min(F.edge - .012, F.cr * (c.spread || 1)), g = new T.Group(); g.position.set(Math.cos(a) * r, F.domed ? F.top - .004 - (r / F.edge) ** 2 * .03 : F.top, Math.sin(a) * r);
    const L = .055 * (c.clen || 1), cy = new T.Mesh(new T.CylinderGeometry(.0034, .0034, L, 10), candleMat); cy.position.y = L / 2; cy.castShadow = true; const w = new T.Mesh(new T.CylinderGeometry(.0006, .0006, .007, 4), wickMat); w.position.y = L + .0035; g.add(cy, w);
    if (k >= (c.out || 0)) { const f = new T.Sprite(flameMat); f.scale.set(.016, .034, 1); f.position.y = L + .017; g.add(f); FLAMES.push(f); } CAKE.add(g); } CAKE.scale.setScalar(c.size || 1); }
const tableMat = mistify(new T.MeshStandardMaterial({ roughness: .88, transparent: true })), legMat = mistify(new T.MeshStandardMaterial({ color: 0x141210, roughness: .7, transparent: true }));
function buildTable(t) { TABLE.clear(); if (!t) return; tableMat.color.setHex(WOOD[t.wood][1]); const top = new T.Mesh(new T.CylinderGeometry(.6 * t.w, .6 * t.w, .035, t.shape ? 72 : 6), tableMat); top.position.y = TOP - .018; top.receiveShadow = top.castShadow = true; TABLE.add(top);
  const leg = new T.Mesh(new T.CylinderGeometry(.05, .09, TOP - .04, 16), legMat); leg.position.y = (TOP - .04) / 2; TABLE.add(leg); }
// the children: cut from the film's own frame; flat, standing round the table, lit by the same light as the cake
const KIDS = [{ file: 'child1.png', h: .56, base: -.1, slot: Math.PI - .62 }, { file: 'child2.png', h: .25, base: .05, slot: Math.PI - .04 }, { file: 'child3.png', h: .72, base: -.14, slot: Math.PI + .56 }];
KIDS.forEach(k => { k.tex = new T.TextureLoader().load('assets/weaver/' + k.file, t => { k.aspect = t.image.width / t.image.height; k.img = t.image; dirty.kids = true; dirty.mist = true; }); k.tex.encoding = T.sRGBEncoding; k.aspect = .7;
  k.mat = mistify(new T.MeshStandardMaterial({ map: k.tex, alphaTest: .35, side: T.DoubleSide, roughness: .92, emissive: 0xffffff, emissiveMap: k.tex, emissiveIntensity: .2, transparent: true })); });
const KM = {};
function placeKids(dt) { const ids = new Set(DOC.kids.map(c => c.i)); for (const i in KM) if (!ids.has(+i)) { KIDG.remove(KM[i]); delete KM[i]; }
  DOC.kids.forEach(c => { const k = KIDS[c.i]; let m = KM[c.i]; if (!m) { m = KM[c.i] = new T.Mesh(new T.PlaneGeometry(1, 1), k.mat); m.castShadow = true; m.userData.vis = 0; KIDG.add(m); }
    m.userData.vis = Math.min(1, m.userData.vis + dt * .8); k.mat.opacity = m.userData.vis; const h = k.h * c.s;
    m.scale.set(h * k.aspect, h, 1); m.position.set(Math.sin(c.a) * c.r, TOP + k.base * c.s + h / 2, Math.cos(c.a) * c.r); m.updateMatrixWorld(true); const wp = m.getWorldPosition(new T.Vector3()); m.lookAt(cam.position.x, wp.y, cam.position.z); m.rotateY(c.face * Math.PI / 180); }); }

/* =============================================================== the film's look: lifted grey-green blacks, soft contrast, grain, vignette */
const rt = new T.WebGLRenderTarget(16, 16); rt.texture.encoding = T.sRGBEncoding;
const grade = new T.ShaderMaterial({ uniforms: { tC: { value: rt.texture }, gt: { value: 0 } }, depthTest: false, depthWrite: false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `uniform sampler2D tC; uniform float gt; varying vec2 vUv; void main(){ vec3 c = texture2D(tC, vUv).rgb; vec2 q = vUv - .5; c *= 1. - dot(q, q) * 1.1;
    float l = dot(c, vec3(.299, .587, .114)); c = mix(vec3(l), c, .86); c = vec3(.034, .043, .038) + c * vec3(.97, 1., .95); c = c / (c + .72) * 1.62;
    c += (fract(sin(dot(vUv * vec2(1913., 2711.) + gt, vec2(12.9898, 78.233))) * 43758.5453) - .5) * .03; gl_FragColor = vec4(c, 1.); }` });
const gQ = new T.Scene(), gC = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1); gQ.add(new T.Mesh(new T.PlaneGeometry(2, 2), grade));

/* =============================================================== THE ORB (its body, rings and display are the weaver's) */
/*ICONS*/
/*ORB*/
/*FIT*/
/*TICK*/
/*BODY*/
</script>
</body>
</html>
