<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Memory Weaver</title>
<meta name="description" content="A cake built from nothing in Stelline's memory room: sculpt clay, pipe icing, place candles, animate it frame by frame, then weave it into light, all from the rings of one orb.">
<style>
  html, body { margin: 0; height: 100%; background: #030403; overflow: hidden; user-select: none; -webkit-user-select: none; font-family: ui-monospace, Menlo, monospace; }
  * { -webkit-tap-highlight-color: transparent; }
  .app { height: 100dvh; display: grid; grid-template-rows: minmax(0, 1fr) clamp(250px, 40vh, 420px); }
  #room, #orb { position: relative; overflow: hidden; touch-action: none; }
  #room canvas, #orb canvas { display: block; width: 100%; height: 100%; }
  #orb { background: radial-gradient(120% 140% at 50% 0%, #1a1c1a 0%, #0a0b0a 55%, #040504 100%); border-top: 1px solid #1c1e1c; }
  @media (max-width: 700px) { .app { grid-template-rows: minmax(0, 1fr) 44%; } }
  #cap { position: absolute; left: 16px; bottom: 14px; max-width: min(420px, 70%); color: #e8f2ee; pointer-events: none; text-shadow: 0 0 6px #000, 0 0 2px #000; }
  #cap .a { font: 600 11px/1.3 ui-monospace, Menlo, monospace; letter-spacing: .14em; color: #8fb8b0; }
  #cap .b { font: 700 19px/1.25 ui-monospace, Menlo, monospace; letter-spacing: .04em; margin: 3px 0 4px; }
  #cap .c { font: 500 13px/1.4 ui-monospace, Menlo, monospace; color: #b8fff6; }
  #cap .d { margin-top: 8px; display: flex; gap: 8px; pointer-events: auto; }
  #cap button { font: 600 11px ui-monospace, Menlo, monospace; letter-spacing: .1em; color: #5ff0dc; background: rgba(4,10,9,.7); border: 1px solid #2e7a70; padding: 6px 10px; border-radius: 3px; cursor: pointer; }
  #cap button:hover { background: #0d3a34; }
  #cap .bar { height: 2px; background: #123630; margin-top: 8px; } #cap .bar i { display: block; height: 100%; background: #5ff0dc; }
  body.phone .app { grid-template-rows: 1fr; } body.phone #room { display: none; }
  body.cine .app { grid-template-rows: 1fr; } body.cine #orb { position: fixed; right: 1.5vw; bottom: 1.5vw; width: 25vw; height: 13vw; background: none; border: 0; opacity: .92; } body.cine #cap { display: none; } #labBtn { display: none; } body.cine #labBtn { display: block; position: fixed; left: 12px; top: 12px; font: 600 10px ui-monospace, Menlo, monospace; letter-spacing: .1em; color: #8fb8b0; background: rgba(0,0,0,.4); border: 1px solid #2e4a45; padding: 5px 8px; opacity: .45; cursor: pointer; } body.cine #labBtn:hover { opacity: 1; }
</style>
</head>
<body>
<div class="app"><div id="room"><div id="cap"></div></div><div id="orb"></div></div>
<script src="assets/three.min.js"></script>
<script src="assets/GLTFExporter.js"></script>
<script src="assets/OBJExporter.js"></script>
<script src="assets/v6/qrcode.js"></script>
<script>
/* MEMORY WEAVER. Two layers that never mix: the physical lab (glass, floor, ring light, the observer outside) and the memory (table, cake, icing, candles,
   children), which is solid while you build it and becomes light when you weave it. Every control is on the orb: five rings, five buttons, one display.
   Ring 1 is always MODE (LOOK, MAKE, MOVE, TURN, SIZE, TIME, WEAVE). Ring 2 is always PICK: it walks the scene graph (cake, each kind of thing on it and each
   one, each child); clicking a thing in the room picks it too. Rings 3 to 5 do the mode's work:
   LOOK orbit · tilt · dolly (the view always circles the picked thing; the knurled grip turns the view in any mode)
   MAKE verb (base, pull, push, smooth, frost, pipe, candles, berries, a child, blow out) · height on the cake · amount (each click works once; back takes it away)
   MOVE across X · up Y · near Z   TURN pitch X · spin Y · roll Z   SIZE all · height · width/spread. The gizmo in the room drives the same rings.
   TIME frame · hold · playback (DO keeps a frame)   WEAVE time · materialize · mist.
   Drag a ring up or down for its clicks, sideways to scrub between them; pinch or ctrl-wheel the orb to stretch it. Tap the end of the grip to pair a phone.
   Buttons: MODE (hold: LOOK and back) · UNDO (hold: redo) · DO · PLAY (hold, or outside TIME/WEAVE: SHOW ME the guide's step) · KEEP (export). */
const T = THREE, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, TAU = Math.PI * 2;
const sm = t => t * t * (3 - 2 * t);
let NOW = 0;

/* =============================================================== sound and touch */
let AC = null;
function tick(kind, i) { if (window.SNDLOG) window.SNDLOG.push({ t: NOW, k: kind, i: i || 0 }); try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); const n = AC.createBufferSource(), L = kind === 'press' ? 900 : 380, b = AC.createBuffer(1, L, AC.sampleRate), d = b.getChannelData(0);
  for (let k = 0; k < L; k++) d[k] = (Math.random() * 2 - 1) * Math.exp(-k / (kind === 'dead' ? 25 : kind === 'press' ? 140 : 50)); n.buffer = b; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = kind === 'press' ? 1100 : kind === 'dead' ? 650 : [2700, 2300, 1900, 2500, 3100][i || 0]; f.Q.value = 2.5;
  const g = AC.createGain(); g.gain.value = kind === 'dead' ? .2 : .8; n.connect(f).connect(g).connect(AC.destination); n.start(); } catch (e) { }
  if (navigator.vibrate) navigator.vibrate(kind === 'press' ? 14 : kind === 'dead' ? 3 : 6); }

/* =============================================================== the room */
const roomEl = document.getElementById('room');
const R = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setPixelRatio(Math.min(2, devicePixelRatio)); R.outputEncoding = T.sRGBEncoding; R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.1; R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap; roomEl.append(R.domElement);
const scene = new T.Scene(); scene.background = new T.Color(0x050605); scene.fog = new T.FogExp2(0x060807, .05);
const cam = new T.PerspectiveCamera(40, 1, .01, 40);
const LAB = new T.Group(), MEM = new T.Group(); scene.add(LAB, MEM);
const CINE = { on: /[?&]cinema/.test(location.search), shot: -1, t: 0, inset: true }; if (CINE.on) document.body.classList.add('cine');   // 01 physical lab, 02 the memory
// light
const hemi = new T.HemisphereLight(0x8a9894, 0x080604, .14); scene.add(hemi);
const over = new T.SpotLight(0xe6efff, .78, 5.5, .36, .85, 1.4); over.position.set(0, 2.75, 0); over.target.position.set(0, .7, 0); over.castShadow = true; over.shadow.mapSize.set(1024, 1024); over.shadow.bias = -.0015; scene.add(over, over.target);
const warm = new T.PointLight(0xffc690, .55, 3.4, 1.8); warm.position.set(.9, 1.45, 1.2); scene.add(warm);
const candleLight = new T.PointLight(0xffa04a, 0, 2.4, 1.7); candleLight.castShadow = true; candleLight.shadow.mapSize.set(512, 512); scene.add(candleLight);
const holoLight = new T.PointLight(0x7fe8dc, 0, 3, 1.5); holoLight.position.set(0, 1.1, 0); scene.add(holoLight);
// floor and the recessed pit
const concrete = new T.MeshStandardMaterial({ color: 0x060706, roughness: .96 });
const floor = new T.Mesh(new T.RingGeometry(1.15, 9, 96), concrete); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; LAB.add(floor);
const pit = new T.Mesh(new T.CircleGeometry(1.15, 96), new T.MeshStandardMaterial({ color: 0x141614, roughness: .95 })); pit.rotation.x = -Math.PI / 2; pit.position.y = -.08; pit.receiveShadow = true; LAB.add(pit);
const pitWall = new T.Mesh(new T.CylinderGeometry(1.15, 1.15, .08, 96, 1, true), new T.MeshStandardMaterial({ color: 0x232523, roughness: .9, side: T.BackSide })); pitWall.position.y = -.04; LAB.add(pitWall);
// the glass partition, its mullions, the lit horizon band and the overhead ring
const glass = new T.Mesh(new T.CylinderGeometry(2.2, 2.2, 3, 128, 1, true), new T.MeshStandardMaterial({ color: 0xbfd6d0, transparent: true, opacity: .06, roughness: .05, metalness: .3, side: T.DoubleSide, depthWrite: false })); glass.position.y = 1.5; LAB.add(glass);
for (let k = 0; k < 16; k++) { const a = k / 16 * TAU, m = new T.Mesh(new T.BoxGeometry(.018, 3, .018), new T.MeshStandardMaterial({ color: 0x2a2d2b, roughness: .5, metalness: .6 })); m.position.set(Math.cos(a) * 2.2, 1.5, Math.sin(a) * 2.2); LAB.add(m); }
const band = new T.Mesh(new T.TorusGeometry(2.17, .007, 6, 200), new T.MeshBasicMaterial({ color: 0x9bb5ae, transparent: true, opacity: .42 })); band.rotation.x = Math.PI / 2; band.position.y = .88; LAB.add(band);
const bandGlow = new T.Mesh(new T.TorusGeometry(2.17, .06, 6, 200), new T.MeshBasicMaterial({ color: 0x7a9690, transparent: true, opacity: .1, depthWrite: false })); bandGlow.rotation.x = Math.PI / 2; bandGlow.position.y = .88; LAB.add(bandGlow);
const ringLamp = new T.Mesh(new T.TorusGeometry(.95, .025, 10, 160), new T.MeshBasicMaterial({ color: 0xf4f8ff })); ringLamp.rotation.x = Math.PI / 2; ringLamp.position.y = 2.8; LAB.add(ringLamp);
const ceiling = new T.Mesh(new T.CircleGeometry(2.2, 96), new T.MeshStandardMaterial({ color: 0x0c0d0c, roughness: 1, side: T.DoubleSide })); ceiling.rotation.x = Math.PI / 2; ceiling.position.y = 2.95; LAB.add(ceiling);
// the observer outside the glass, a silhouette with a rim of light
(function observer() { const k = new T.Group(), dark = new T.MeshStandardMaterial({ color: 0x050505, roughness: .9 });
  const coat = new T.Mesh(new T.CylinderGeometry(.17, .27, 1.25, 24), dark); coat.position.y = .78; const chest = new T.Mesh(new T.CylinderGeometry(.21, .19, .42, 24), dark); chest.position.y = 1.5;
  const head = new T.Mesh(new T.SphereGeometry(.11, 24, 16), dark); head.position.y = 1.86; head.scale.set(1, 1.15, 1); const neck = new T.Mesh(new T.CylinderGeometry(.06, .07, .12, 12), dark); neck.position.y = 1.74;
  const legs = new T.Mesh(new T.CylinderGeometry(.13, .15, .2, 16), dark); legs.position.y = .1; k.add(coat, chest, head, neck, legs); k.position.set(2.75, 0, -1.55); k.lookAt(0, 0, 0); LAB.add(k);
  const rim = new T.SpotLight(0x9fb6ff, 1.2, 4, .5, .6); rim.position.set(3.8, 2.4, -2.6); rim.target = k; LAB.add(rim); })();
// haze: a cone of light under the ring, and dust
const coneMat = new T.ShaderMaterial({ uniforms: { haze: { value: .5 } }, transparent: true, depthWrite: false, blending: T.AdditiveBlending, side: T.DoubleSide,
  vertexShader: 'varying float vy; varying vec3 vn; varying vec3 vp; void main(){ vy=uv.y; vn=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.); vp=mv.xyz; gl_Position=projectionMatrix*mv; }',
  fragmentShader: 'uniform float haze; varying float vy; varying vec3 vn; varying vec3 vp; void main(){ float e=pow(abs(dot(normalize(-vp),vn)),1.6); gl_FragColor=vec4(vec3(.62,.7,.72)*haze*.13*vy*e,1.); }' });
const cone = new T.Mesh(new T.CylinderGeometry(.9, 1.45, 2.7, 64, 1, true), coneMat); cone.position.y = 1.45; LAB.add(cone);
const DUST = 900, dustGeo = new T.BufferGeometry(), dp = new Float32Array(DUST * 3); for (let i = 0; i < DUST; i++) { const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * 1.6; dp[i * 3] = Math.cos(a) * r; dp[i * 3 + 1] = Math.random() * 2.7; dp[i * 3 + 2] = Math.sin(a) * r; }
const dustTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d'), g = x.createRadialGradient(16, 16, 0, 16, 16, 16); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.45, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 32, 32); return new T.CanvasTexture(c); })();
dustGeo.setAttribute('position', new T.BufferAttribute(dp, 3)); const dustMat = new T.PointsMaterial({ color: 0xdfe8e4, map: dustTex, size: .009, transparent: true, opacity: .5, blending: T.AdditiveBlending, depthWrite: false }); const dust = new T.Points(dustGeo, dustMat); LAB.add(dust);

/* =============================================================== CINEMA: the set as the film has it. A dark dome, its seams faint, one lit line where wall meets floor;
   the booth at the back, white and lit, a man standing in it; the maker kneeling by the cake. Nothing of the lab shows. */
const CSET = new T.Group(); CSET.visible = false; scene.add(CSET);
(function cineSet() { const dark = new T.MeshStandardMaterial({ color: 0x0b0d0c, roughness: 1, side: T.BackSide });
  CSET.add(new T.Mesh(new T.SphereGeometry(12, 64, 32, 0, TAU, 0, Math.PI / 2), dark));
  const fl = new T.Mesh(new T.CircleGeometry(12, 96), new T.MeshStandardMaterial({ color: 0x060707, roughness: .5, metalness: .4 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; CSET.add(fl);
  const line = new T.Mesh(new T.TorusGeometry(11.4, .02, 6, 360), new T.MeshBasicMaterial({ color: 0xf2f7f3, toneMapped: false })); line.rotation.x = Math.PI / 2; line.position.y = .55; CSET.add(line);
  const glow = new T.Mesh(new T.TorusGeometry(11.4, .16, 6, 360), new T.MeshBasicMaterial({ color: 0x9fb4ad, transparent: true, opacity: .1, depthWrite: false })); glow.rotation.x = Math.PI / 2; glow.position.y = .55; CSET.add(glow);
  const refl = new T.Mesh(new T.TorusGeometry(11.35, .07, 6, 360), new T.MeshBasicMaterial({ color: 0x8fa39c, transparent: true, opacity: .07, depthWrite: false })); refl.rotation.x = Math.PI / 2; refl.position.y = .01; CSET.add(refl);
  const seam = new T.LineBasicMaterial({ color: 0x161a18, transparent: true, opacity: .5 }); for (let k = 0; k < 10; k++) { const a = k / 10 * TAU, pts = []; for (let j = 0; j <= 24; j++) { const e = .08 + j / 24 * 1.4; pts.push(new T.Vector3(Math.cos(a) * Math.cos(e) * 11.9, Math.sin(e) * 11.9, Math.sin(a) * Math.cos(e) * 11.9)); } CSET.add(new T.Line(new T.BufferGeometry().setFromPoints(pts), seam)); }
  // the booth: a rounded arch, lit from inside
  const B = new T.Group(); B.position.set(6.2, 0, -7.6); B.scale.setScalar(.72); B.lookAt(0, 0, 0); CSET.add(B);
  const arch = (w, h, r) => { const s = new T.Shape(); s.moveTo(-w / 2, 0); s.lineTo(-w / 2, h - r); s.quadraticCurveTo(-w / 2, h, -w / 2 + r, h); s.lineTo(w / 2 - r, h); s.quadraticCurveTo(w / 2, h, w / 2, h - r); s.lineTo(w / 2, 0); s.lineTo(-w / 2, 0); return s; };
  const outer = arch(2.6, 2.3, .55), hole = arch(2.36, 2.16, .45); outer.holes.push(hole); const shell = new T.Mesh(new T.ExtrudeGeometry(outer, { depth: 1.8, bevelEnabled: false, curveSegments: 16 }), new T.MeshStandardMaterial({ color: 0xdfe6e2, emissive: 0x9aa59f, emissiveIntensity: .32, roughness: .6, side: T.DoubleSide })); shell.position.z = -1.8; B.add(shell);
  const back = new T.Mesh(new T.ShapeGeometry(hole, 16), new T.MeshBasicMaterial({ color: 0x6f7874, toneMapped: false, side: T.DoubleSide })); back.position.z = -1.79; B.add(back);
  const fl2 = new T.Mesh(new T.PlaneGeometry(2.36, 1.8), new T.MeshBasicMaterial({ color: 0x9aa39f, toneMapped: false })); fl2.rotation.x = -Math.PI / 2; fl2.position.set(0, .002, -.9); B.add(fl2);
  const ceil = new T.Mesh(new T.PlaneGeometry(2.0, 1.6), new T.MeshBasicMaterial({ color: 0xf6fbf8, toneMapped: false })); ceil.rotation.x = Math.PI / 2; ceil.position.set(0, 2.14, -.9); B.add(ceil);
  const spill = new T.PointLight(0xdbe8e2, .3, 2.6, 2); spill.position.set(0, 1.7, -.6); B.add(spill);
  const blk = new T.MeshStandardMaterial({ color: 0x030303, roughness: .9 }), man = new T.Group();
  [[.16, .24, 1.15, .62], [.21, .19, .42, 1.42]].forEach(([a, b, h, y]) => { const m = new T.Mesh(new T.CylinderGeometry(a, b, h, 20), blk); m.position.y = y; man.add(m); });
  const hd = new T.Mesh(new T.SphereGeometry(.105, 20, 14), blk); hd.position.y = 1.8; hd.scale.y = 1.15; man.add(hd); man.position.set(.15, 0, -1.0); B.add(man);
  const desk = new T.Mesh(new T.BoxGeometry(.5, .05, .4), new T.MeshStandardMaterial({ color: 0xeef2f0, roughness: .4 })); desk.position.set(.75, .8, -1.3); B.add(desk);
  // the maker, kneeling by the cake, in a pale coat: only her shape and the candle on her
  const coat = new T.MeshStandardMaterial({ color: 0x24211c, roughness: .9 }), hair = new T.MeshStandardMaterial({ color: 0x0c0907, roughness: .9 }), K = new T.Group();
  const thighs = new T.Mesh(new T.CylinderGeometry(.15, .16, .2, 18), coat); thighs.position.y = .1; thighs.scale.z = 1.6; K.add(thighs);
  const torso = new T.Mesh(new T.CylinderGeometry(.13, .17, .5, 20), coat); torso.position.set(0, .45, .02); torso.rotation.x = .1; K.add(torso);
  const sh = new T.Mesh(new T.SphereGeometry(.17, 20, 12, 0, TAU, 0, Math.PI / 2), coat); sh.position.y = .68; sh.scale.set(1.05, .45, .7); K.add(sh);
  const neck = new T.Mesh(new T.CylinderGeometry(.045, .05, .1, 12), new T.MeshStandardMaterial({ color: 0x2a1f19, roughness: .8 })); neck.position.y = .76; K.add(neck);
  const head = new T.Mesh(new T.SphereGeometry(.095, 24, 16), hair); head.position.set(0, .87, -.005); head.scale.set(1, 1.12, 1.05); K.add(head);
  const face = new T.Mesh(new T.SphereGeometry(.082, 20, 14), new T.MeshStandardMaterial({ color: 0x33261e, roughness: .8 })); face.position.set(0, .86, .03); face.scale.set(.92, 1.1, .9); K.add(face);
  for (const sx of [-1, 1]) { const arm = new T.Mesh(new T.CylinderGeometry(.045, .04, .42, 12), coat); arm.position.set(sx * .17, .5, .1); arm.rotation.x = -.7; K.add(arm); }
  K.traverse(o => { if (o.isMesh) o.castShadow = true; }); CINE.maker = K; CSET.add(K); })();
const cineKey = new T.SpotLight(0xffb878, 0, 4, .2, .55, 1.2); cineKey.position.set(.55, 1.45, .75); scene.add(cineKey, cineKey.target);
/* =============================================================== hologram: every memory material gets the same light treatment */
const HU = { uHolo: { value: 0 }, uMat: { value: 1 }, uScan: { value: .5 }, uTime: { value: 0 }, uMist: { value: 0 } };
function holo(mat) { mat.onBeforeCompile = sh => { Object.assign(sh.uniforms, HU);
    sh.vertexShader = 'varying vec3 vWP; varying vec3 vWN;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\n vWP = (modelMatrix * vec4(transformed, 1.0)).xyz; vWN = normalize(mat3(modelMatrix) * objectNormal);');
    sh.fragmentShader = 'uniform float uHolo, uMat, uScan, uTime, uMist; varying vec3 vWP; varying vec3 vWN;\nfloat h3(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }\nfloat vnz(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y), mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }\n' + sh.fragmentShader.replace('#include <dithering_fragment>', `#include <dithering_fragment>
      if (uMist > 0.001 && h3(floor(vWP * 700.0) + floor(uTime * 6.0) * 0.0) < uMist * 0.93) discard;
      if (uHolo > 0.001) { float h = clamp((0.55 * vnz(vWP * 34.0) + 0.3 * vnz(vWP * 90.0) + 0.15 * vnz(vWP * 240.0) - 0.27) / 0.46, 0.0, 1.0);
        if (h > uMat) discard;
        vec3 V = normalize(cameraPosition - vWP); float fr = pow(1.0 - abs(dot(normalize(vWN), V)), 2.2);
        float scan = 0.5 + 0.5 * sin(vWP.y * 520.0 - uTime * 5.0); float flick = 0.94 + 0.06 * sin(uTime * 41.0) * sin(uTime * 7.3);
        vec3 lit = gl_FragColor.rgb * (1.0 - uScan * 0.45 + uScan * 0.45 * scan) * flick;
        vec3 rim = vec3(0.45, 0.95, 0.88) * fr * 1.1 + vec3(1.0, 0.72, 0.4) * fr * 0.25;
        float edge = smoothstep(uMat - 0.07, uMat, h) * step(uMat, 0.995); rim += vec3(0.6, 1.0, 0.95) * edge * 1.5;
        gl_FragColor.rgb = mix(gl_FragColor.rgb, lit * 0.9 + rim * 0.8, uHolo); }`); };
  mat.customProgramCacheKey = () => 'holo'; return mat; }

/* =============================================================== the memory: table, plate, and the made things */
const TABLE_Y = .74, BASE_Y = TABLE_Y + .008;
const tableTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  const g = x.createRadialGradient(256, 256, 28, 256, 256, 256); g.addColorStop(0, '#dfb060'); g.addColorStop(.38, '#b88234'); g.addColorStop(.78, '#6e4919'); g.addColorStop(1, '#3b250b');
  x.fillStyle = g; x.fillRect(0, 0, 512, 512);
  x.strokeStyle = 'rgba(40,22,6,.08)'; for (let i = 0; i < 180; i++) { x.beginPath(); x.moveTo(0, i * 2.9); x.bezierCurveTo(170, i * 2.9 + Math.sin(i) * 6, 340, i * 2.9 - Math.cos(i) * 6, 512, i * 2.9); x.stroke(); }
  const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; return t; })();
const tableMat = holo(new T.MeshStandardMaterial({ map: tableTex, color: 0xe8d2a6, roughness: .62 }));
const table = new T.Mesh(new T.CylinderGeometry(.62, .62, .04, 6), tableMat); table.position.y = TABLE_Y - .02; table.castShadow = table.receiveShadow = true; table.userData.table = true; MEM.add(table);
