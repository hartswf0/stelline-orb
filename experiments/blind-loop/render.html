<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind loop render</title>
<style>html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<!-- One candidate of the blind loop, rendered at the film's framing (shot A ~146 s, shot B ~152-155 s) at 1280x720.
     Built with the EVOLVE-ALL modules (cake, candles, inscription, table) and the shared look (swarms/shared/look.js).
     render.js calls window.go(candidate) and screenshots the canvas. No film pixels on this page. -->
<script src="../../ana/assets/three.min.js"></script>
<script src="../swarms/shared/look.js"></script>
<script src="../swarms/evolve-all/ui/relations.js"></script>
<script src="../swarms/evolve-all/modules/cake.js"></script>
<script src="../swarms/evolve-all/modules/candles.js"></script>
<script src="../swarms/evolve-all/modules/inscription.js"></script>
<script src="../swarms/evolve-all/modules/table.js"></script>
<script>
'use strict';
const T = THREE, M = window.EVOMOD, W = 1280, H = 720;
async function json(u) { const r = await fetch(u); return r.json(); }
function vec(mod, o) { return Float64Array.from(mod.genes.map(g => o && o[g[0]] != null ? o[g[0]] : g[4])); }
const BASE = {   // the framings in swarms/shared/look-test.html, set to land the cake where the film has it
  A: { cam: [0.0, 1.235, 1.065], look: [0.215, 0.675, 0.0], fov: 30 },
  B: { cam: [0.0, 0.735, 1.38], look: [-0.015, 0.665, 0.0], fov: 30 } };
window.go = async function (C) {
  const S = C.scene, refs = {};
  for (const n of ['cake', 'candles', 'inscription', 'table']) refs[n] = await json('../swarms/evolve-all/refs/' + n + '.json');
  refs.cake.target = S.shot === 'A' ? 'cream' : 'cream_table';
  const R = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setPixelRatio(1); document.body.append(R.domElement);
  const scene = new T.Scene(), cam = new T.PerspectiveCamera(30, W / H, 0.02, 40);
  const P = {}; for (const n of ['cake', 'candles', 'inscription', 'table']) P[n] = { mod: M[n], G: vec(M[n], C[n]) };
  /* TOOL v2 (round 02): the hand layer. The module builds stay the source of shape and colour; on top of them this page
     roughens what the critic named as machine-made (see LOG.md, tool mutations M1-M8). Every random choice is seeded by S.seed. */
  const rnd = (() => { let a = ((S.seed || 7) * 2654435761) >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();
  const def = (k, v) => (S[k] == null ? v : S[k]); const clampV = (v, a, b) => Math.max(a, Math.min(b, v));
  const waves = Array.from({ length: 9 }, () => { const d = new T.Vector3(rnd() - .5, rnd() - .5, rnd() - .5).normalize(); return { d, f: 180 + rnd() * 220, ph: rnd() * 6.28 }; });   // v3: surface scale only (wavelength 1.5-3.5 cm), no change of the cake's form
  const noise = p => waves.reduce((s, w) => s + Math.sin(w.d.dot(p) * w.f + w.ph), 0) / 3;
  // M5: the table: a thin hexagonal top with no visible leg (module table hidden)
  const tableTopY = S.shot === 'B' ? (REL.findA(M.table.anchors(P.table.G), ['topCentre']) || [0, 0.5, 0])[1] : 0.5;
  if (S.shot === 'B') { const tg = C.table || {}, rad = def('tableR', 0.36);
    const top = new T.Mesh(new T.CylinderGeometry(rad, rad, 0.018, 6), LOOK.material('table', { seed: 3 })); top.rotation.y = Math.PI / 6 + (tg.yaw || 0) * Math.PI / 180;
    top.scale.x = tg.stretch || 1; top.position.y = tableTopY - 0.009; top.receiveShadow = true; scene.add(top); }
  // the cake: on the table (B) or in the air, tilted toward her (A)
  const cakeHolder = new T.Group(); scene.add(cakeHolder);
  const tint = [S.tintR, S.tintG, S.tintB];
  const cake = M.cake.build(T, P.cake.G, { t: 1, tint, refs: refs.cake }); cakeHolder.add(cake); cake.updateMatrixWorld(true);
  const A = M.cake.anchors(P.cake.G), sup = REL.supportInfo('cake', M.cake, P.cake.G);
  const topA = REL.findA(A, ['top']) || [0, 0.1, 0], insA = REL.findA(A, ['inscription']) || topA, rimA = REL.findA(A, ['rim']) || [0.12, 0.1, 0], baseA = REL.findA(A, ['bodyBase', 'base']) || [0, 0, 0];
  const R0 = rimA[0], TY = topA[1];
  // M2: no perfect borders or identical beads: the module's instanced pieces (shell borders, beads) are hidden
  // M2/M3: every cake surface gets a seeded lumpy displacement and a lopsided top, and the LOOK buttercream material (bump, speckle)
  const lump = Math.min(def('lump', 0.0008), 0.0015), lop = clampV(def('lop', 0.001), -0.002, 0.002), ridge = def('ridge', 0.0006), mats = [];
  cake.traverse(o => { if (!o.isMesh) return; if (o.isInstancedMesh) { o.visible = def('modBeads', 0) > .5; return; }
    o.castShadow = o.receiveShadow = true; o.geometry = o.geometry.clone(); const pa = o.geometry.attributes.position, inv = new T.Matrix4().copy(o.matrixWorld).invert(), v = new T.Vector3();
    for (let i = 0; i < pa.count; i++) { v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld); const rr = Math.hypot(v.x, v.z), n = noise(v);
      const onTop = v.y > TY - .004 && rr < R0 - .002, ang = Math.atan2(v.z, v.x);
      // v3 M9: straight wall, flat-ish top. Side: radial surface noise plus horizontal trowel ridges. Top: shallow arc-shaped spatula ridges. No sag.
      if (!onTop) { const d = lump * n + ridge * Math.sin(v.y * 700 + 2 * n) * (.5 + .5 * Math.sin(ang * 3 + n)); const k = rr > 1e-4 ? d / rr : 0; v.x += v.x * k; v.z += v.z * k; }
      else v.y += lump * .5 * n + ridge * .8 * Math.sin(rr * 380 + ang * 2 + 1.5 * n) + lop * v.x / R0;
      v.applyMatrix4(inv); pa.setXYZ(i, v.x, v.y, v.z); }
    o.geometry.computeVertexNormals();
    if (def('lookIcing', 1) > .5 && o.material && o.material.color) { const c = o.material.color.clone().convertLinearToSRGB();
      const m = LOOK.material('icing', { color: c.getHex(), speckle: 1, seed: 3 + mats.length, repeat: [2, 1] }); m.side = T.DoubleSide; o.material = m; mats.push(m); } });
  // M3: a lumpy hand-piped rim with toasted speckle (a tube whose radius and height wander)
  { const pts = [], n = 160; for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2, p = new T.Vector3(Math.cos(a) * (R0 - .004), TY, Math.sin(a) * (R0 - .004));
      const q = noise(p); p.multiplyScalar(1 + lump * q / R0); p.y = TY + .0015 + lop * p.x / R0 + .0008 * noise(p.clone().multiplyScalar(2.3)); pts.push(p); }
    const tube = new T.TubeGeometry(new T.CatmullRomCurve3(pts, true), 320, clampV(def('rimW', 0.0035), 0.002, 0.005), 8, true), pa = tube.attributes.position, v = new T.Vector3();
    for (let i = 0; i < pa.count; i++) { v.fromBufferAttribute(pa, i); v.addScaledVector(v.clone().normalize(), .0006 * noise(v.clone().multiplyScalar(3))); pa.setXYZ(i, v.x, v.y, v.z); } tube.computeVertexNormals();
    const col = mats[0] ? mats[0].userData : null; const rm = LOOK.material('icing', { color: def('rimCol', 0xe3c48c), speckle: 1, seed: 11 }); const rim = new T.Mesh(tube, rm); rim.castShadow = rim.receiveShadow = true; cake.add(rim); }
  // v3 M10: one visible layer seam: a shallow darker groove round the wall at mid height
  if (def('seam', 1) > .5) { const sy = baseA[1] + (TY - baseA[1]) * def('seamY', .5); const sm = LOOK.material('icing', { color: def('seamCol', 0xb89a62), seed: 13 });
    const seam = new T.Mesh(new T.TorusGeometry(R0 + .0004, .0011, 6, 160), sm); seam.rotation.x = Math.PI / 2; seam.position.y = sy; seam.scale.set(1, 1, .6); cake.add(seam); }
  // M4: dark dots pressed into the side frosting at irregular spacing (flattened, half sunk, sizes vary)
  { const nd = Math.round(def('dots', 34)), dm = LOOK.material('chocolate', { color: 0x24160d, seed: 6 }), y0 = baseA[1] + .012, y1 = TY - .01;
    for (let i = 0; i < nd; i++) { const a = rnd() * Math.PI * 2, y = y0 + rnd() * (y1 - y0), s = def('dotS', .0048) * (.7 + .6 * rnd());
      const p = new T.Vector3(Math.cos(a) * R0, y, Math.sin(a) * R0); p.multiplyScalar(1 + lump * noise(p) / R0); p.y = y;
      const d = new T.Mesh(new T.SphereGeometry(s, 10, 8), dm); d.position.copy(p).addScaledVector(new T.Vector3(Math.cos(a), 0, Math.sin(a)), -s * .45); d.scale.set(1, .85, .55); d.lookAt(p.clone().multiplyScalar(2)); d.scale.set(1, .85, .5); cake.add(d); } }
  // M8: a thin metal cake board
  if (S.shot === 'B' && def('metalBoard', 1) > .5) { const bd = new T.Mesh(new T.CylinderGeometry(R0 * 1.12, R0 * 1.12, .004, 64), new T.MeshStandardMaterial({ color: 0x8a8580, metalness: .85, roughness: .35 })); bd.position.y = baseA[1] - .002; bd.receiveShadow = true; cake.add(bd); }
  // inscription (module tubes = piped relief), lifted out of the coat, wobble raised by the genome
  const ins = M.inscription.build(T, P.inscription.G, { t: 1, support: sup, refs: refs.inscription });
  const insH = new T.Group(); insH.position.set(insA[0], insA[1] + (S.insLift || 0) + lop * insA[0] / R0, insA[2]); insH.add(ins); cake.add(insH);
  // M1: seven mismatched hand-placed candles (the module's layout for where; the film's kinds; each leans and sinks differently) with teardrop flames
  const cand = M.candles.build(T, P.candles.G, { t: 1, support: sup, refs: refs.candles, time: 0, blown: 0, light: false }); cand.visible = false;
  const wa = M.candles.anchors(P.candles.G, { support: sup, refs: refs.candles }), cg = C.candles || {}, flames = [];
  const KINDS = [null, '#c9362a', null, '#4a6fc4', null, '#c9362a', null];
  const flameTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 128; const x = c.getContext('2d');
    const g = x.createRadialGradient(32, 92, 2, 32, 80, 46); g.addColorStop(0, 'rgba(255,250,235,1)'); g.addColorStop(.35, 'rgba(255,214,140,.95)'); g.addColorStop(.7, 'rgba(255,140,50,.5)'); g.addColorStop(1, 'rgba(255,90,20,0)');
    x.fillStyle = g; x.beginPath(); x.moveTo(32, 8); x.bezierCurveTo(44, 50, 52, 80, 46, 100); x.bezierCurveTo(42, 118, 22, 118, 18, 100); x.bezierCurveTo(12, 80, 20, 50, 32, 8); x.fill();
    const b = x.createRadialGradient(32, 108, 0, 32, 108, 10); b.addColorStop(0, 'rgba(80,110,255,.8)'); b.addColorStop(1, 'rgba(80,110,255,0)'); x.globalCompositeOperation = 'lighter'; x.fillStyle = b; x.fillRect(16, 96, 32, 24);
    const t = new T.CanvasTexture(c); return t; })();
  const V4 = def('v4', 0) > .5;   // TOOL v4 (round 04): thin scattered candles, flames as a separate overlay, candle-only light
  const H0 = V4 ? .045 * def('candleLen4', 1) : (cg.height || .0485) * def('candleLen', .78), TH = V4 ? .002 : (cg.thick || .0075) * .5 * def('candleThick', 1.3);
  // v4 M17: seven seats scattered over the top (back half and sides, clear of the writing), at least 0.17 R apart; not a ring or a row
  const seats = []; if (V4) { let guard = 0; while (seats.length < 7 && guard++ < 4000) { const rr = Math.sqrt(rnd()) * .74 * R0, a = rnd() * Math.PI * 2, x = Math.cos(a) * rr, z = Math.sin(a) * rr;
      if (z > .12 * R0 && x > -.35 * R0) continue; if (seats.some(q => Math.hypot(q[0] - x, q[2] - z) < .17 * R0)) continue; seats.push([x, 0, z]); } }
  const KINDS4 = [null, '#c9362a', null, '#4a6fc4', '#c9362a', null, '#4a6fc4'], flameSpots = [];
  for (let k = 0; k < 7; k++) { const w = V4 ? seats[k] : wa['wick' + k]; if (!w) continue; const g = new T.Group(); const h = H0 * (V4 ? .7 + .5 * rnd() : .85 + .3 * rnd()), sink = .003 + .008 * rnd();
    g.position.set(w[0] + topA[0], topA[1] - sink + lop * w[0] / R0, w[2] + topA[2]); const ln = def('lean', 7) * Math.PI / 180; g.rotation.set((rnd() - .5) * 2 * ln, rnd() * 6.28, (rnd() - .5) * 2 * ln, 'YXZ');
    const kind = V4 ? KINDS4[k] : KINDS[k]; const wax = LOOK.material('wax', V4 && !kind ? { color: 0xf0d27a } : { stripe: kind }); const sh = new T.Mesh(new T.CylinderGeometry(TH * .95, TH, h, 12), wax); sh.position.y = h / 2; sh.castShadow = true; g.add(sh);
    const wk = new T.Mesh(new T.CylinderGeometry(.0005, .0005, .005, 4), new T.MeshBasicMaterial({ color: 0x120a06 })); wk.position.y = h + .0025; g.add(wk);
    const cr = new T.Mesh(new T.TorusGeometry(TH * 1.5, TH * .55, 6, 16), LOOK.material('icing', { color: 0xa88a58, seed: 21 })); cr.rotation.x = Math.PI / 2; cr.position.y = sink; cr.scale.z = .5; g.add(cr);   // v3 M11: a crater where it goes in
    if (V4) { const fa = new T.Object3D(); fa.position.y = h + .002 + .0055; g.add(fa); const tip = new T.Object3D(); tip.position.y = h + .002 + .013 * S.flameH; g.add(tip);
      const pl = new T.PointLight(0xffb468, def('wickLight', .35), .28, 2); pl.position.y = h + .008; g.add(pl);
      flameSpots.push({ fa, tip, base: (() => { const o = new T.Object3D(); o.position.y = h + .002; g.add(o); return o; })(), rot: (rnd() - .5) * .3, gain: .85 + .3 * rnd() });
      cake.add(g); flames.push(fa); continue; }
    const fm = new T.SpriteMaterial({ map: flameTex, blending: T.AdditiveBlending, depthWrite: false, transparent: true }); fm.color.setScalar(def('flameGain', 1.6));
    fm.rotation = (rnd() - .5) * .35; const f = new T.Sprite(fm); const fh = .013 * S.flameH * (.85 + .3 * rnd()); f.scale.set(fh * .42 * S.flameW, fh, 1); f.position.y = h + .002 + fh * .38; g.add(f);
    const hl = new T.Sprite(LOOK.material('halo')); hl.scale.set(.03 * Math.min(S.halo, .6), .03 * Math.min(S.halo, .6), 1); hl.position.copy(f.position); g.add(hl);
    cake.add(g); flames.push(f); }
  // pose
  const r0 = 0.12;
  if (S.shot === 'A') { cakeHolder.position.set(S.cx, 0.5 + S.lift, S.cz); cakeHolder.rotation.set(S.tiltX, S.yaw, S.tiltZ, 'YXZ'); cakeHolder.scale.setScalar(S.scale); }
  else { cakeHolder.position.set(S.cx, tableTopY, S.cz); cakeHolder.rotation.set(0, S.yaw, 0); cakeHolder.scale.setScalar(S.scale); }
  // camera
  const b = BASE[S.shot], dy = S.shot === 'B' ? tableTopY - 0.5 : 0;
  cam.position.set(b.cam[0] + S.camX, b.cam[1] + S.camY + dy, b.cam[2] + S.camZ); cam.fov = b.fov * S.fov; cam.updateProjectionMatrix();
  cam.lookAt(new T.Vector3(b.look[0] + S.lookX, b.look[1] + S.lookY + dy, b.look[2]));
  // the look
  const target = cakeHolder.position.clone().add(new T.Vector3(0, 0.08, 0));
  const Hd = LOOK.apply(R, scene, cam, { target, room: S.room > 0.5, genome: C.look });
  if (Hd.room) Hd.room.position.y = S.bandY;
  Hd.setSize(W, H); Hd.setCandles(flames); Hd.focus(target.clone().add(new T.Vector3(0, 0.03, 0)));
  for (let i = 0; i < 3; i++) Hd.render(0.016, true);
  // v4 M18: the flames, drawn at full resolution on a transparent layer; maker.js lays it over the frame after the blur, before the grain or the codec
  window.FLAMES = null;
  if (flameSpots.length) { scene.updateMatrixWorld(true); const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
    const scr = o => { const v = o.getWorldPosition(new T.Vector3()).project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
    for (const f of flameSpots) { const b = scr(f.base), t = scr(f.tip); const hp = Math.max(4, Math.hypot(t[0] - b[0], t[1] - b[1])), wp = hp * .36 * S.flameW;
      x.save(); x.translate(b[0], b[1]); x.rotate(Math.atan2(t[0] - b[0], b[1] - t[1]) + f.rot);
      const glow = x.createRadialGradient(0, -hp * .45, 0, 0, -hp * .45, hp * 1.6); glow.addColorStop(0, 'rgba(255,190,110,' + (.22 * f.gain) + ')'); glow.addColorStop(1, 'rgba(255,150,60,0)'); x.fillStyle = glow; x.fillRect(-hp * 2, -hp * 2.2, hp * 4, hp * 4);
      x.beginPath(); x.moveTo(0, -hp); x.bezierCurveTo(wp * .5, -hp * .55, wp * .62, -hp * .2, wp * .45, -hp * .05); x.bezierCurveTo(wp * .3, hp * .05, -wp * .3, hp * .05, -wp * .45, -hp * .05); x.bezierCurveTo(-wp * .62, -hp * .2, -wp * .5, -hp * .55, 0, -hp); x.closePath();
      const g = x.createRadialGradient(0, -hp * .3, 0, 0, -hp * .4, hp * .75); g.addColorStop(0, 'rgba(255,253,235,1)'); g.addColorStop(.35, 'rgba(255,236,160,1)'); g.addColorStop(.75, 'rgba(255,170,70,.9)'); g.addColorStop(1, 'rgba(240,110,30,.6)');
      x.fillStyle = g; x.fill();
      const bl = x.createRadialGradient(0, -hp * .06, 0, 0, -hp * .06, wp * .55); bl.addColorStop(0, 'rgba(90,120,255,.55)'); bl.addColorStop(1, 'rgba(90,120,255,0)'); x.globalCompositeOperation = 'lighter'; x.fillStyle = bl; x.fillRect(-wp, -hp * .3, wp * 2, hp * .4);
      x.restore(); }

  return true;
};
window.READY = true;
</script>
