let lastL = -1; function drainEvents() { if (W.val.ROOM_k / 8 !== lastL) { lastL = W.val.ROOM_k / 8; const e = { t: +W.t.toFixed(4), k: 'light', L: lastL }; W.log.push(e); W.events.push(e); }
  W.events.forEach(e => { if (e.k === 'puff') FLAMES[e.i].outAt = FT; if (!REC) sound(e); }); W.events.length = 0; }

/* =============================================================== THE OPERATOR PANEL (behind the (i), and the end card): the machine, never the memory */
const opEl = document.getElementById('op'); let opOn = false, opEnd = false;
function toggleOp(force) { opOn = force == null ? !opOn : force; opEl.classList.toggle('on', opOn); if (opOn) buildOp(); }
const SCOL = { watch: '#8fa39c', approach: '#7fd3a2', retreat: '#e0a060', hide: '#7c8cc9', refuse: '#e0645a', blow: '#f2d16b' };
function buildOp() { opEl.innerHTML = `<h3><span id="opT">THE MACHINE</span><span><button class="x" id="opDl">TRACE</button> <button class="x" id="opX">CLOSE</button></span></h3>
  <div class="row" id="opNow"></div><canvas id="opU" height="120"></canvas><canvas id="opD" height="170"></canvas><table id="opTr"></table>
  <p style="color:#6f7c77;margin:8px 0 0">This panel is the girl's machine: declared states and sub-states, the utilities she compares, the guards, her drives (P pressure, U unease, F fear, M memory of being pushed, C curiosity, T trust, A the candles' pull) and what she believes she has seen. The memory itself never shows these.</p>`;
  document.getElementById('opX').onclick = () => toggleOp(false); document.getElementById('opDl').onclick = () => { const b = new Blob([JSON.stringify(traceOut(), null, 1)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'her-birthday-trace.json'; a.click(); };
  drawOp(); }
function drawOp() { if (!opOn) return; const g = W.girl, el = id => document.getElementById(id); if (!el('opNow')) return;
  el('opT').textContent = opEnd ? 'END CARD · THE MACHINE, THIS TIME' : 'THE MACHINE · NOW';
  const yes = b => b ? 'yes' : 'no', ana = Memory.anaPose(W.val.scale);
  el('opNow').innerHTML = `<span>state <b>${g.st}.${g.sub}</b> for ${(g.t - g.since).toFixed(1)} s</span><span>believes you are <b>${Memory.anaWords(g.wm && g.wm.anaH > 1.1 ? 0 : 4)}</b> (eye ${(g.wm ? g.wm.anaH : 0).toFixed(2)} m; true ${ana.h.toFixed(2)} m)</span><span>believes cake <b>${g.wm && g.wm.cakeH < .12 ? 'low' : 'held up'}</b></span><span>sees: you ${g.vis.ana ? g.vis.ana.toFixed(2) : 0}, cake ${g.vis.cake ? g.vis.cake.toFixed(2) : 0}, children ${g.vis.kids ? g.vis.kids.toFixed(2) : 0}</span><span>candles ${W.candles.reduce((a, b) => a + b, 0)} of 7</span>`;
  // utilities with guards
  const cu = el('opU'), w = cu.clientWidth || 300; cu.width = w * 2; cu.height = 240; cu.style.height = '120px'; const x = cu.getContext('2d'); x.scale(2, 2); x.clearRect(0, 0, w, 120); x.font = '11px Arial';
  Memory.STATES.forEach((s, i) => { const y = 6 + i * 18, u = g.u[s] || 0, ok = g.guards[s], allowed = s === g.st || Memory.ALLOWED[g.st].includes(s), bx = 74, bw = w - bx - 40, z = bx + bw * .4;
    x.fillStyle = s === g.st ? SCOL[s] : '#9aa6a2'; x.fillText(s, 4, y + 10); x.fillStyle = '#1b201f'; x.fillRect(bx, y, bw, 12); x.fillStyle = ok && allowed ? SCOL[s] : '#3a403e'; const v = clamp(u, -1, 1.5);
    x.fillRect(Math.min(z, z + v * bw * .4), y + 2, Math.abs(v) * bw * .4, 8); x.fillStyle = '#556'; x.fillRect(z, y - 1, 1, 14); x.fillStyle = '#9aa6a2'; x.fillText(u.toFixed(2), bx + bw + 4, y + 10);
    if (!ok || !allowed) { x.fillStyle = '#6f7c77'; x.fillText(!allowed ? 'not from here' : 'guard', bx + 4, y + 10); } });
  // drives over time with the state band
  const cd = el('opD'), w2 = cd.clientWidth || 300; cd.width = w2 * 2; cd.height = 340; cd.style.height = '170px'; const d = cd.getContext('2d'); d.scale(2, 2); d.clearRect(0, 0, w2, 170);
  const S = g.samples, span = opEnd ? Math.max(10, W.t) : 30, t1 = W.t, t0 = t1 - span, X = t => 4 + (t - t0) / span * (w2 - 8), Y = v => 150 - clamp(v, 0, 1.2) / 1.2 * 120;
  S.forEach((s, i) => { if (s.t < t0) return; d.fillStyle = SCOL[s.st]; d.fillRect(X(s.t), 156, Math.max(1, (w2 - 8) / span * .1 + .5), 10); });
  const DR = [['P', '#e0645a'], ['U', '#c98a5c'], ['F', '#ff9a8a'], ['M', '#b06ad0'], ['C', '#6fb6e0'], ['T', '#7fd3a2'], ['A', '#f2d16b']];
  DR.forEach(([k, col], j) => { d.strokeStyle = col; d.lineWidth = 1.3; d.beginPath(); let st = false; S.forEach(s => { if (s.t < t0) return; st ? d.lineTo(X(s.t), Y(s[k])) : d.moveTo(X(s.t), Y(s[k])); st = true; }); d.stroke(); d.fillStyle = col; d.font = '10px Arial'; d.fillText(k, 6 + j * 16, 12); });
  d.fillStyle = '#6f7c77'; d.fillText(`${span.toFixed(0)} s`, w2 - 30, 12);
  g.trans.length; const rows = g.trans.slice(opEnd ? 0 : -8).reverse().map(t => { const why = Object.entries(t.util).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k, v]) => `${k} ${v}`).join(', ');
    return `<tr><td>${t.t.toFixed(2)} s</td><td>${t.from} → <b>${t.to}</b></td><td class="w">${why} · P ${t.drives.P} F ${t.drives.F} T ${t.drives.T}</td></tr>`; }).join('');
  el('opTr').innerHTML = rows; }
function traceOut() { return { page: 'experiments/swarms/state/index.html', seed: 7, t: +W.t.toFixed(3), candles: W.candles, transitions: W.girl.trans, samples: W.girl.samples, inputs: W.log.filter(e => ['hand', 'select', 'hold', 'off', 'dead'].includes(e.k)) }; }

/* =============================================================== EVERY FRAME */
function resize() { const r = viewEl.getBoundingClientRect(); R.setSize(r.width, r.height, false); cam.aspect = r.width / r.height;
  const hf = (cam.aspect < 1 ? 52 : 64) * Math.PI / 180, vf = 2 * Math.atan(Math.tan(hf / 2) / cam.aspect) * 180 / Math.PI; cam.fov = Math.max(36, Math.min(62, vf)); cam.updateProjectionMatrix(); layoutDev(); }
addEventListener('resize', resize);
let camPos = null; const tv = new T.Vector3();
function render(dt) { const ana = Memory.anaPose(W.val.scale), g = W.girl, lit = W.candles.reduce((a, b) => a + b, 0), L = W.val.ROOM_k / 8, dark = W.off;
  if (!camPos) camPos = new T.Vector3(ana.x, ana.h, ana.z); camPos.lerp(tv.set(ana.x, ana.h, ana.z), 1 - Math.exp(-dt / .15)); cam.position.copy(camPos);
  cam.lookAt(Memory.GEO.look.x + Math.sin(ana.yaw) * .15, lerp(.62, .5, clamp((1.55 - ana.h) / .9, 0, 1)), Memory.GEO.look.z);
  // the light the ROOM ring sets; dark when switched off
  over.intensity = L * 1.1 * (1 - dark); hemi.intensity = (.04 + .4 * L) * (1 - dark); bandMat.color.setScalar((.25 + .75 * L) * (1 - dark) * .88 + .02); scene.background.setRGB(.012 + .03 * L, .014 + .034 * L, .014 + .034 * L).multiplyScalar(1 - dark); scene.fog.color.copy(scene.background);
  candleLight.position.set(W.cake.x, W.cake.y + .2, W.cake.z); candleLight.intensity = lit * .3 * (.95 + Math.sin(FT * 19) * .04) * (1 - dark);
  CAKE.position.set(W.cake.x, W.cake.y + .012, W.cake.z); CAKE.visible = dark < 1;
  { const rc = Math.hypot(W.cake.x, W.cake.z), bot = rc < .36 ? TT : 0, h = W.cake.y - bot; STAND.visible = dark < 1 && h > .015; standCol.scale.y = Math.max(.001, h); standCol.position.set(W.cake.x, bot + h / 2, W.cake.z); standBase.position.set(W.cake.x, bot + .01, W.cake.z); }
  FLAMES.forEach((f, i) => { const on = W.candles[i] ? 1 : 0; f.v = on ? 1 : Math.max(0, f.v - dt / .12); const fl = .92 + Math.sin(FT * 23 + f.ph) * .05 + Math.sin(FT * 7.1 + f.ph) * .04;
    const lean = W.girl.st === 'blow' && W.girl.sub === 'blow' ? .5 : 0; f.f.material.opacity = f.v * (1 - dark); f.hl.material.opacity = f.v * .9 * fl * (1 - dark); f.f.scale.set(.016 * (1 + lean * .4), .034 * fl * (1 - lean * .4), 1); f.f.material.rotation = lean * .6;
    const sa = FT - f.outAt; f.sm.material.opacity = sa > 0 && sa < 1.6 ? .5 * (1 - sa / 1.6) * (1 - dark) : 0; f.sm.position.y = .09 + sa * .07; f.sm.scale.setScalar(.02 + sa * .03); });
  KIDS.forEach((k, i) => { const p = W.kids[i]; if (p >= 1 && !W.hold && W.songBeat >= 0) k.t += dt; kidFrame(k); k.mat.opacity = (p >= 1 ? 1 : p * .55) * (1 - dark); k.m.visible = p > 0; k.m.quaternion.copy(cam.quaternion);
    k.mat.color.setRGB(1, .89, .75).multiplyScalar(.45 + .55 * (lit / 7) + .3 * L); });
  // her: placed by her machine, turned against your eye
  const tc = new T.Vector2(cam.position.x - g.x, cam.position.z - g.z).normalize(), rgt = new T.Vector3(1, 0, 0).applyQuaternion(cam.quaternion), rv = new T.Vector2(rgt.x, rgt.z).normalize();
  const dh = new T.Vector2(Math.cos(g.th), Math.sin(g.th)), dhh = new T.Vector2(Math.cos(g.th + g.psi), Math.sin(g.th + g.psi));
  drawGirl(g, { c: dh.dot(tc), sx: dh.dot(rv), ch: dhh.dot(tc), sxh: dhh.dot(rv) });
  GIRL.position.set(g.x, GH / 2 - FOOT, g.z); GIRL.rotation.set(0, Math.atan2(tc.x, tc.y), 0); shadow.position.set(g.x, .003, g.z);
  const dC = Math.hypot(g.x - W.cake.x, g.z - W.cake.z), warm = lit / 7 * .95 / (1 + 2.5 * dC * dC), amb = .1 + .75 * L, k = (1 - dark);
  girlMat.color.setRGB(Math.min(1.1, amb * .95 + warm * 1.0) * k, Math.min(1.1, amb * .97 + warm * .78) * k, Math.min(1.1, amb + warm * .52) * k); girlMat.opacity = 1 - dark;
  R.render(scene, cam); drawDev(); if (opOn && Math.floor(FT * 10) !== Math.floor((FT - dt) * 10)) drawOp(); }
let acc = 0;
function advance(dt) { FT += dt; acc += dt; while (acc >= Memory.DT - 1e-9) { acc -= Memory.DT; runDemo(); Memory.step(W); drainEvents(); }
  if (W.ended && W.offAt && W.off >= 1 && !opEnd) { opEnd = true; toggleOp(true); } render(dt); }   // the end card only after her birthday is over and the memory has gone dark
let last = performance.now(); function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; advance(dt); requestAnimationFrame(frame); }
document.fonts && document.fonts.load('400 20px Oswald').then(() => drawDev());
resize(); syncRings(); drainEvents(); if (!REC) requestAnimationFrame(frame); else render(0);
window.MM = { get W() { return W; }, advance, press, handTurn, renderAudio, traceOut, toggleOp, BANDS: () => BANDS, BTNS: () => BTNS, RV, devRect: () => DC.getBoundingClientRect(), ready: () => KIDS.every(k => k.tex.image) && !!WAVBYTES };
