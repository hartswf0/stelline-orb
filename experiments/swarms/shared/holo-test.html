<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HOLO bench</title>
<style>
@font-face { font-family: 'Oswald'; src: url('../../../ana/assets/oswald-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Oswald'; src: url('../../../ana/assets/oswald-latin-500-normal.woff2') format('woff2'); font-weight: 500 700; }
:root { --bg: #040505; --ink: #d9e2de; --dim: #6f7c77; --amber: #e8b264; }
* { box-sizing: border-box; } html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font: 12px/1.35 'Oswald', 'Arial Narrow', sans-serif; letter-spacing: .06em; -webkit-user-select: none; user-select: none; }
.app { height: 100dvh; display: grid; grid-template-rows: minmax(0, 1fr) clamp(190px, 36vh, 320px); }
#view { position: relative; overflow: hidden; } #view canvas { display: block; width: 100%; height: 100%; }
#dev { position: relative; background: radial-gradient(120% 140% at 50% 0%, #121413 0%, #070807 60%, #030303 100%); border-top: 1px solid #161918; }
#dev canvas { display: block; width: 100%; height: 100%; }
#hud { position: absolute; left: 10px; top: 8px; right: 10px; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; color: var(--dim); font-size: 11px; }
#hud b { color: var(--amber); font-weight: 500; }
#tests { position: absolute; left: 10px; bottom: 8px; right: 10px; color: var(--dim); font-size: 10.5px; pointer-events: none; }
</style></head><body>
<div class="app"><div id="view"><div id="hud"><span id="what">HOLO BENCH</span><span id="val"></span></div><div id="tests"></div></div><div id="dev"></div></div>
<script src="../../../ana/assets/three.min.js"></script>
<script src="holo.js"></script>
<script>
'use strict';
/* A bench for every HOLO element, worked from the device:
   SELECT cycles: INSCRIPTION (knurl steps the arc's mark 0-4 and types the readout), CHILD 1, CHILD 2 (knurl = arrival, the mark shows while she arrives), CAKE (knurl = which cake; a change flares and decays).
   SCALE ring = where you kneel. TRIANGLES ring = tilt. HOLD = freeze the flames; hold it down = switch the memory off (banks of neon, then dark); press again to switch on (spots). */
const T = THREE, TAU = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const viewEl = document.getElementById('view'), R = new T.WebGLRenderer({ antialias: true }); R.setPixelRatio(Math.min(2, devicePixelRatio)); R.outputEncoding = T.sRGBEncoding; R.toneMapping = T.ACESFilmicToneMapping; viewEl.prepend(R.domElement);
const scene = new T.Scene(); scene.background = new T.Color(0x030404); scene.fog = new T.FogExp2(0x030404, .08);
const cam = new T.PerspectiveCamera(38, 1, .02, 40);
// the room: a band of light where wall meets floor
const band = new T.Mesh(new T.CylinderGeometry(3.2, 3.2, .012, 96, 1, true), new T.MeshBasicMaterial({ color: 0x9aa39f, side: T.BackSide })); band.position.y = .72; scene.add(band);
scene.add(new T.AmbientLight(0x404848, .35)); const candle = new T.PointLight(0xffb470, 1.2, 2.2, 2); candle.position.set(0, .78, 0); scene.add(candle);
// a stand-in cake (the swarms bring their own): sponge, icing, seven candles
const CAKE = new T.Group(); CAKE.position.set(0, .6, 0); scene.add(CAKE);
const COLS = [[0x3a2418, 0xd2702a], [0x7fb8a4, 0xd9efe6], [0xc4502c, 0xe58a4a], [0x6b4127, 0x8a5634], [0xe2c48c, 0xf3e6c8]];
const side = new T.MeshStandardMaterial({ color: 0xe2c48c, roughness: .8 }), topM = new T.MeshStandardMaterial({ color: 0xf3e6c8, roughness: .7 });
CAKE.add(new T.Mesh(new T.CylinderGeometry(.12, .12, .075, 48), [side, topM, side]));
const FL = []; for (let i = 0; i < 7; i++) { const a = i / 7 * TAU + .3, r = i ? .075 : 0; const c = new T.Mesh(new T.CylinderGeometry(.0035, .0035, .04, 8), new T.MeshStandardMaterial({ color: 0xe8d8c0 })); c.position.set(Math.cos(a) * r, .058, Math.sin(a) * r); CAKE.add(c);
  const f = new T.Mesh(new T.SphereGeometry(.006, 8, 8), new T.MeshBasicMaterial({ color: 0xffd08a })); f.scale.y = 2.2; f.position.set(c.position.x, .086, c.position.z); CAKE.add(f); FL.push(f); }
// two arriving children, seen at a distance as soft rounded forms (no faces)
const KIDS = [[-.2, -.3], [.16, -.36]].map(([x, z], i) => { const g = new T.Group(); g.position.set(x, .45, z); const m = new T.MeshStandardMaterial({ color: i ? 0xd8cbb8 : 0x8a6a58, roughness: .9, transparent: true, opacity: 0 });
  const body = new T.Mesh(new T.CylinderGeometry(.06, .085, .3, 20), m); const head = new T.Mesh(new T.SphereGeometry(.06, 20, 16), m); head.position.y = .24; g.add(body, head); scene.add(g);
  const anchor = new T.Object3D(); anchor.position.set(0, .3, 0); g.add(anchor); return { g, m, p: 0, anchor, mark: HOLO.childMark(scene, anchor, { size: .055 }) }; });
// the hologram UI
const anchor = new T.Vector3(0, .66, 0);
const ARC = HOLO.arc(scene, anchor, { size: .16, camera: cam }), READ = HOLO.readout(scene, anchor, { size: .16, camera: cam, offset: .155 });
const SP = HOLO.spots(CAKE); KIDS.forEach(k => k.spots = HOLO.spots(k.g));
// the device
const devEl = document.getElementById('dev'), DC = document.createElement('canvas'); devEl.append(DC); DC.style.width = '100%'; DC.style.height = '100%';
const DEV = HOLO.device(DC, { targets: ['INSCRIPTION', 'CHILD 1', 'CHILD 2', 'CAKE'], rings: [{ id: 'scale', min: -36, max: 36, deg: 5 }, { id: 'knurl', min: 0, max: 20, deg: 9 }, { id: 'tri', min: -4, max: 8, deg: 6 }] });
const S = { ins: 0, cake: 4, kid: [0, 0], tilt: 0, yaw: 0, off: false, hold: false, lastWork: -9, now: 0 };
DEV.setLabel('scale', 'WHERE YOU KNEEL', v => `${v * 5}°`); DEV.setLabel('tri', 'TILT', v => `${v * 3}°`);
function knurlFor(t) { if (t === 0) { DEV.setRange('knurl', 0, 20); DEV.setValue('knurl', S.ins); DEV.setLabel('knurl', 'THE INSCRIPTION', v => `${Math.min(4, Math.floor(v / 5))} OF 4 MARKS`); }
  else if (t < 3) { DEV.setRange('knurl', 0, 10); DEV.setValue('knurl', S.kid[t - 1] ); DEV.setLabel('knurl', 'ARRIVING', v => `${v * 10}%`); }
  else { DEV.setRange('knurl', 0, 4); DEV.setValue('knurl', S.cake); DEV.setLabel('knurl', 'WHICH CAKE', v => ['DARK, ORANGE TOP', 'MINT', 'RED-ORANGE', 'BROWN DOME', 'SPONGE'][v]); } }
DEV.on('select', t => { knurlFor(t); S.lastWork = S.now; });
DEV.on('step', (id, v) => { S.lastWork = S.now; const t = DEV.target;
  if (id === 'scale') S.yaw = v * 5; else if (id === 'tri') { if (v !== S.tilt) HOLO.sound.sweep(); S.tilt = v; }
  else if (t === 0) { const was = Math.min(4, Math.floor(S.ins / 5)); S.ins = v; READ.feed(14); const now = Math.min(4, Math.floor(v / 5)); if (now !== was) { ARC.step(now); if (now === 4) READ.clear(); } ARC.show(true); }
  else if (t < 3) { const k = KIDS[t - 1], was = k.p; k.p = v / 10; S.kid[t - 1] = v; if (k.p >= 1 && was < 1) HOLO.sound.wash(.9); }
  else { S.cake = v; const [s1, t1] = COLS[v]; side.color.setHex(s1); topM.color.setHex(t1); SP.flash(); HOLO.sound.wash(.6); } });
DEV.on('hold', on => { if (S.off) { switchOn(); return; } S.hold = on; });
DEV.on('off', () => { if (S.off) return; S.off = true; const far = new T.Vector3(0, .6, 0).sub(cam.position).setY(0).normalize().multiplyScalar(1.3).add(new T.Vector3(0, .6, 0));
  SP.off(1.6, { origin: far }); KIDS.forEach(k => k.spots.off(1.6, { origin: far })); ARC.off(.9); READ.show(false); });
function switchOn() { S.off = false; SP.set(0); SP.on(.9); KIDS.forEach(k => { k.spots.set(0); k.spots.on(.9); }); ARC.show(true); READ.show(true); HOLO.sound.wash(.5); }
knurlFor(0); ARC.step(0);
function resize() { const r = viewEl.getBoundingClientRect(); R.setSize(r.width, r.height, false); cam.aspect = r.width / r.height; cam.updateProjectionMatrix(); DEV.layout(); }
addEventListener('resize', resize); resize();
const what = document.getElementById('what'), val = document.getElementById('val'), tests = document.getElementById('tests');
let last = performance.now();
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; S.now += dt;
  const yaw = S.yaw * Math.PI / 180, D = .9 / Math.min(1, cam.aspect * 1.25); cam.position.set(Math.sin(yaw) * D + Math.cos(yaw) * .07, .74, Math.cos(yaw) * D - Math.sin(yaw) * .07); cam.lookAt(Math.cos(yaw) * .1, .62, -Math.sin(yaw) * .1);
  const right = new T.Vector3(1, 0, 0).applyQuaternion(cam.quaternion); CAKE.quaternion.slerp(new T.Quaternion().setFromAxisAngle(right, S.tilt * 3 * Math.PI / 180), Math.min(1, dt * 5));
  // the arc and the readout stand beside the cake at candle height, on the side nearer her hands, while the cake or its writing is worked
  const working = !S.off && (DEV.target === 0 || DEV.target === 3) && S.now - S.lastWork < 3; ARC.want = working ? 1 : ARC.want * (S.off ? 1 : 0); READ.want = working ? 1 : 0;
  KIDS.forEach(k => { k.m.opacity = k.p >= 1 ? 1 : k.p * .5; k.g.visible = k.p > 0; k.mark.show(S.off ? 0 : k.p); });
  FL.forEach((f, i) => { const fl = S.hold ? 1 : .9 + Math.sin(S.now * 23 + i) * .06 + Math.sin(S.now * 7.1 + i * 2) * .04; f.scale.set(1, 2.2 * fl, 1); }); candle.intensity = 1.2 * (S.hold ? 1 : .95 + Math.sin(S.now * 19) * .04) * SP.k;
  [ARC, READ].forEach(o => o.update(0, cam)); KIDS.forEach(k => k.mark.update(0, cam));
  R.render(scene, cam);
  what.innerHTML = `<b>${DEV.targets[DEV.target]}</b> &nbsp; ${S.off ? 'SWITCHED OFF' : S.hold ? 'HELD' : 'LIVE'}`;
  const k = DEV.rings[1]; val.textContent = k.target !== k.applied ? `STEPPING ${k.applied} TO ${k.target} AT ${(DEV.machine.run >= DEV.machine.g.fastAfter ? DEV.machine.g.fastRate : DEV.machine.g.rate).toFixed(1)} A SECOND` : `SET ${k.applied}`;
  tests.textContent = 'TURN A RING (DRAG UP OR DOWN), SELECT CYCLES, HOLD FREEZES, HOLD DOWN SWITCHES OFF';
  requestAnimationFrame(frame); }
requestAnimationFrame(frame);
// for tests and recordings
window.BENCH = { DEV, ARC, READ, KIDS, SP, S, turn(id, deg) { DEV.turn(id, deg); }, select() { DEV.press('select'); } };
</script>
</body></html>
