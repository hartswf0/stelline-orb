<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Living Memory</title>
<meta name="description" content="A backdrop for the landing page: Ana's memory making itself in a loop behind the page, drawn by the ORB TOOL scene renderer. No controls.">
<style>
  :root { --bg: #000; --ink: #c9d2cd; --dim: #5d6662; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  /* the backdrop: fixed behind everything, never takes a touch */
  #memory { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #memory canvas { display: block; width: 100%; height: 100%; }
  /* a veil so page text laid over it stays legible */
  #veil { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(120% 80% at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%); }
  /* demo only: what a landing page would put over it (remove when embedding) */
  #demo { position: relative; z-index: 2; padding: 24px 16px; color: var(--ink); font: 500 13px/1.4 "Helvetica Neue", Arial, sans-serif; letter-spacing: .02em; max-width: 520px; }
  #demo h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; letter-spacing: .08em; text-transform: uppercase; }
  #demo p { margin: 0; color: var(--dim); }
  body.embed #demo, body.embed #veil { display: none; }
</style>
</head>
<body>
<div id="memory"></div><div id="veil"></div>
<div id="demo"><h1>Stelline Memory Orb</h1><p>The memory behind this page is made by the same tool: the cake is made, written, lit, the children arrive, the candles go out and the memory switches off in round spots, then it begins again.</p></div>
<script>
/* Living memory. The ORB TOOL scene renderer (orb-tool/scene/scene.js) drawing a scripted memory: no core, no device, no controls.
   Loop (about 36 s): the cake arrives as a sponge and is made; 生日快乐 is written stroke by stroke; seven candles are set and lit; the table comes up;
   three children arrive; the candles are blown out one by one; the memory switches off in banks of round spots; it comes back.
   The viewpoint drifts round the cake slowly. Phone-safe: device pixel ratio capped at 1, no depth of field, paused when the tab is hidden.
   prefers-reduced-motion: one still frame of the finished memory (rendered again only on resize).
   ?embed hides the demo text and the veil. Embed as an iframe or copy this page's script beside the landing page's content. */
(function () {
  'use strict';
  if (/[?&]embed/.test(location.search)) document.body.classList.add('embed');
  const BASE = new URL('scene/scene.js', location.href).href;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const load = u => new Promise((ok, no) => { const s = document.createElement('script'); s.src = u; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  // a scripted memory: the same state shape as core/SCHEMA.md, stepped by time instead of hands
  const LIB = [{ form: 'drum', side: '#3b2014', top: '#d9782c', dots: 1, height: 0.1, radius: 0.12, layers: 1 }, { form: 'drum', side: '#e2c286', top: '#f1dca9', dots: 1, height: 0.1, radius: 0.12, layers: 2 }];
  function stateAt(t) {   // t: seconds into the loop
    const L = 36, u = ((t % L) + L) % L, step = (a, rate) => Math.max(0, Math.floor((u - a) * rate));
    const stage = Math.min(4, u < 1 ? 0 : 1 + step(1.2, 0.8)), written = Math.min(24, step(7, 11.8 / 2)), count = u > 10 ? 7 : 0;
    const blowAt = 27, lit = u < 12 ? 0 : u < blowAt ? Math.min(7, step(12, 3)) : Math.max(0, 7 - step(blowAt, 6));
    const arrive = k => Math.min(10, step(15 + k * 2.2, 6));
    return {
      scene: { place: 'dome', light: 6, look: 'film' },
      cake: { kind: 4, stage, tilt: u < 6 ? Math.round(4 - u * 0.6) : 0, genome: LIB[Math.floor(t / L) % 2 ? 0 : 1] },
      inscription: { text: '生日快乐', written },
      candles: { count, lit },
      table: { up: u > 13.5 ? 1 : 0 },
      people: [{ id: 'child-1', kind: 'child', arrived: arrive(0), offset: 0, x: -0.36, z: -0.5 }, { id: 'child-2', kind: 'child', arrived: arrive(1), offset: 3, x: 0.02, z: -0.56 }, { id: 'child-3', kind: 'child', arrived: arrive(2), offset: 7, x: 0.38, z: -0.48 }],
      props: [], proposals: [],
      camera: { yaw: reduce ? 0 : Math.round(Math.sin(t / 23) * 28 / 5) * 5, kneel: 8, focus: 'cake' },
      time: { hold: false, off: u > 31.5 && u < 34.5, blown: u > blowAt },
      selection: 'cake' };
  }
  const subs = {}, bus = { t: 0, view() { return stateAt(this.t); }, on(ev, fn) { (subs[ev] = subs[ev] || []).push(fn); return () => {}; } };
  async function start() {
    if (!window.THREE) await load(new URL('../../ana/assets/three.min.js', location.href).href);
    await load(BASE);
    const host = document.getElementById('memory'), cv = document.createElement('canvas'); host.appendChild(cv);
    const h = SCENE.mount(cv, bus, { quality: 'mid', maxDpr: 1, base: BASE });
    await h.ready; window.BACKDROP = { h, bus };
    if (reduce) { bus.t = 26; for (let i = 0; i < 40; i++) h.frame(i * 33); addEventListener('resize', () => { h.resize(); h.frame(9e9); }); return; }
    let last = 0, prevKey = '', running = true; const t0 = performance.now();
    const tick = now => { if (!running) return; bus.t = (now - t0) / 1000; const v = bus.view(), key = v.cake.stage + ':' + v.inscription.written + ':' + v.candles.lit + ':' + v.table.up + ':' + v.time.off;
      if (key !== prevKey) { (subs.change || []).forEach(f => f(v, prevKey ? { op: 'set', args: {} } : null)); prevKey = key; }
      h.frame(now); last = now; requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) requestAnimationFrame(tick); });
  }
  start().catch(e => console.error('backdrop', e));
})();
</script>
</body>
</html>
