function buildCake(c) { CAKE.clear(); FLAMES = []; if (!c) return; const F = FORMS[c.form];

    rings.forEach(([r, y]) => { const n = Math.round(TAU * r / .0105), im = new T.InstancedMesh(new T.SphereGeometry(.0062, 10, 8), beadMat, n), m4 = new T.Matrix4(); for (let k = 0; k < n; k++) { const a = k / n * TAU; m4.makeTranslation(Math.cos(a) * r, y, Math.sin(a) * r); im.setMatrixAt(k, m4); } im.castShadow = true; CAKE.add(im); }); }
  buildCandles(c, F); buildWriting(c, F); CAKE.scale.setScalar(c.size || 1); }
// candles: eight kinds; each can be steered on its own (around the cake, in or out, lit or out)
const CTYPES = [['STRIPED', { map: 'stripe' }], ['SPIRAL', { map: 'spiral' }], ['PINK', { c: 0xf2a3bd }], ['BLUE', { c: 0x9cc2ee }], ['WHITE TAPER', { c: 0xf4efe4, len: 1.7, r: .0024 }], ['GOLD', { c: 0xd4a23c, metal: true }], ['NUMBER', {}], ['SPARKLER', {}]];

  if (ty === 'NUMBER') { const ds = String(n).split(''); ds.forEach((d, k) => { const g = new T.Group(); g.userData.candle = k; g.position.set((k - (ds.length - 1) / 2) * .042, F.domed ? F.top - .006 : F.top, 0); const pl = new T.Mesh(new T.PlaneGeometry(.045, .06), mistify(new T.MeshStandardMaterial({ map: digitTex(d), transparent: true, alphaTest: .4, side: T.DoubleSide, roughness: .4 }))); pl.position.y = .03; pl.castShadow = true; g.add(pl);

    if (ty === 'SPARKLER') { const L = .09 * (c.clen || 1), st = new T.Mesh(new T.CylinderGeometry(.0011, .0011, L, 6), new T.MeshStandardMaterial({ color: 0x6d6a66, metalness: .7, roughness: .4 })); st.position.y = L / 2; g.add(st); if (!sp.out) addFlame(g, L, true); CAKE.add(g); continue; }
    const L = .055 * (o.len || 1) * (c.clen || 1), rr = o.r || .0034, cy = new T.Mesh(new T.CylinderGeometry(rr, rr * (o.len ? 1.25 : 1), L, 12), cMat(c.ctype || 0)); cy.position.y = L / 2; cy.castShadow = true;

// writing: piped letters on the top of the cake, read from where you kneel
const WCOLS = [['ROSE', '#d9748a'], ['CHOCOLATE', '#4a2b1b'], ['WHITE', '#fbf8f2'], ['GOLD', '#d9a640'], ['RED', '#c9302c'], ['BLUE', '#5a86c8']];
