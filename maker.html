<!doctype html>
<html lang="en">

<title>The Memory Maker</title>
<meta name="description" content="Make a memory from where Ana kneels: a cake in the dark, a table, three children cut from the film, a light, and the mist it all returns to. Every control is on the orb.">
<style>

  * { -webkit-tap-highlight-color: transparent; }
  .app { height: 100dvh; display: grid; grid-template-rows: minmax(0, 1fr) clamp(240px, 38vh, 400px); }
  #room, #orb { position: relative; overflow: hidden; touch-action: none; }
  #room canvas, #orb canvas { display: block; width: 100%; height: 100%; }
  #orb { background: radial-gradient(120% 140% at 50% 0%, #161816 0%, #0a0b0a 55%, #040504 100%); border-top: 1px solid #1a1c1a; }
  @media (max-width: 700px) { .app { grid-template-rows: minmax(0, 1fr) 46%; } }
  body.phone .app { grid-template-rows: 1fr; } body.phone #room { display: none; }
  body.film .app { grid-template-rows: 1fr; } body.film #orb { position: fixed; right: 1.4vw; bottom: 1.4vw; width: 24vw; height: 12.5vw; background: none; border: 0; }
</style>
</head>
<body>
<div class="app"><div id="room"></div><div id="orb"></div></div>
<script src="assets/three.min.js"></script>
<script src="assets/GLTFExporter.js"></script>
<script src="assets/v6/qrcode.js"></script>
<script>
/* THE MEMORY MAKER. You kneel where Ana kneels; the memory forms in front of you, out of the dark.
   Nothing is on the table until you put it there, and there is no table until you set it.
   THE ORB  grip end: drag it to turn and tilt the memory · lens end: pull it out to bring the memory close, push it in to let it go back
            ring 1 picks what you are working on (only when there is more than one thing) · rings 2 to 5 are that thing's properties, and only those
            DO does the next thing the memory needs, and says what it is · UNDO (hold: redo) · RECALL plays the memory back as it was made
            KEEP writes the memory out (where the page may save files) · tap the end of the grip to pair a phone: it becomes the orb.
   A ring that has nothing to do is dark and says nothing. */
const T = THREE, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, TAU = Math.PI * 2, sm = t => t * t * (3 - 2 * t);
let NOW = 0, AC = null;
const FILM = /[?&]film\b/.test(location.search); if (FILM) document.body.classList.add('film');
const roomEl = document.getElementById('room');
const R = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setPixelRatio(Math.min(2, devicePixelRatio)); R.outputEncoding = T.sRGBEncoding; R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.15; R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap; roomEl.append(R.domElement);
const scene = new T.Scene(); scene.background = new T.Color(0x0b0d0c); scene.fog = new T.FogExp2(0x0b0d0c, .028);
const cam = new T.PerspectiveCamera(38, 1, .02, 60);

/* =============================================================== THE DOME: dark, its seams faint, one lit line where the wall meets the floor, the booth far off */
(function dome() { scene.add(new T.Mesh(new T.SphereGeometry(12, 64, 32, 0, TAU, 0, Math.PI / 2), new T.MeshStandardMaterial({ color: 0x121513, roughness: 1, side: T.BackSide })));
  const fl = new T.Mesh(new T.CircleGeometry(12, 96), new T.MeshStandardMaterial({ color: 0x0c0e0d, roughness: .55, metalness: .3 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; scene.add(fl);
  const ring = (r, t, y, c, op) => { const m = new T.Mesh(new T.TorusGeometry(r, t, 6, 360), new T.MeshBasicMaterial({ color: c, transparent: op < 1, opacity: op, depthWrite: op >= 1, toneMapped: false })); m.rotation.x = Math.PI / 2; m.position.y = y; scene.add(m); };
  ring(11.4, .02, .55, 0xeef5f1, 1); ring(11.4, .17, .55, 0x9fb4ad, .1); ring(11.35, .06, .01, 0x8fa39c, .08);
  const seam = new T.LineBasicMaterial({ color: 0x1c211f }); for (let k = 0; k < 10; k++) { const a = k / 10 * TAU, p = []; for (let j = 0; j <= 24; j++) { const e = .08 + j / 24 * 1.4; p.push(new T.Vector3(Math.cos(a) * Math.cos(e) * 11.9, Math.sin(e) * 11.9, Math.sin(a) * Math.cos(e) * 11.9)); } scene.add(new T.Line(new T.BufferGeometry().setFromPoints(p), seam)); }
  // the booth, far to one side, lit from inside, a man standing in it
  const B = new T.Group(); B.position.set(4.2, 0, -9.3); B.scale.setScalar(.72); B.lookAt(0, 0, 0); scene.add(B);
  const arch = (w, h, r) => { const s = new T.Shape(); s.moveTo(-w / 2, 0); s.lineTo(-w / 2, h - r); s.quadraticCurveTo(-w / 2, h, -w / 2 + r, h); s.lineTo(w / 2 - r, h); s.quadraticCurveTo(w / 2, h, w / 2, h - r); s.lineTo(w / 2, 0); s.lineTo(-w / 2, 0); return s; };
  const o = arch(2.6, 2.3, .55), hole = arch(2.36, 2.16, .45); o.holes.push(hole); const sh = new T.Mesh(new T.ExtrudeGeometry(o, { depth: 1.8, bevelEnabled: false, curveSegments: 16 }), new T.MeshStandardMaterial({ color: 0xdfe6e2, emissive: 0x9aa59f, emissiveIntensity: .3, roughness: .6, side: T.DoubleSide })); sh.position.z = -1.8; B.add(sh);
  const back = new T.Mesh(new T.ShapeGeometry(hole, 16), new T.MeshBasicMaterial({ color: 0x6f7874, side: T.DoubleSide, toneMapped: false })); back.position.z = -1.79; B.add(back);
  const blk = new T.MeshStandardMaterial({ color: 0x030303, roughness: .9 }), man = new T.Group(); [[.16, .24, 1.15, .62], [.21, .19, .42, 1.42]].forEach(([a, b, h, y]) => { const m = new T.Mesh(new T.CylinderGeometry(a, b, h, 20), blk); m.position.y = y; man.add(m); });
  const hd = new T.Mesh(new T.SphereGeometry(.105, 20, 14), blk); hd.position.y = 1.8; man.add(hd); man.position.set(.15, 0, -1.0); B.add(man); })();
const DUSTN = 700, dustG = new T.BufferGeometry(), dp = new Float32Array(DUSTN * 3); for (let i = 0; i < DUSTN; i++) { const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * 2.4; dp[i * 3] = Math.cos(a) * r; dp[i * 3 + 1] = Math.random() * 2.2; dp[i * 3 + 2] = Math.sin(a) * r - .3; }
dustG.setAttribute('position', new T.BufferAttribute(dp, 3)); const dust = new T.Points(dustG, new T.PointsMaterial({ color: 0xdfe8e4, size: .005, transparent: true, opacity: .35, blending: T.AdditiveBlending, depthWrite: false })); scene.add(dust);
scene.add(new T.HemisphereLight(0x8a9894, 0x080604, .07));

/* =============================================================== MIST: every made thing can come apart into points of light */
const MU = { uMist: { value: 0 }, uTime: { value: 0 } };
function mistify(mat) { mat.onBeforeCompile = sh => { Object.assign(sh.uniforms, MU);
    sh.vertexShader = 'varying vec3 vMW;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\n vMW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = 'uniform float uMist, uTime; varying vec3 vMW;\nfloat mh(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }\n' + sh.fragmentShader.replace('void main() {', 'void main() {\n if (uMist > 0.001 && mh(floor(vMW * 640.0)) < uMist) discard;'); };
  mat.customProgramCacheKey = () => 'mist' + (mat.alphaTest ? 'a' : ''); return mat; }

/* =============================================================== THE MEMORY: a pivot the grip turns, and what is made inside it */
const TOP = .62;                                     // where the cake sits: in the air, and later on the table
const PIV = new T.Group(); PIV.position.set(0, TOP + .05, 0); scene.add(PIV); const MEM = new T.Group(); MEM.position.y = -(TOP + .05); PIV.add(MEM);
const CAKE = new T.Group(); CAKE.position.y = TOP; MEM.add(CAKE);
const TABLE = new T.Group(); MEM.add(TABLE); const KIDG = new T.Group(); MEM.add(KIDG);
const key = new T.SpotLight(0xffb878, 0, 5, .42, .6, 1.3); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -.0012; scene.add(key, key.target);
const candleLight = new T.PointLight(0xffa04a, 0, 2.2, 1.7); scene.add(candleLight);
const keyMark = new T.Group(); scene.add(keyMark); { const m = new T.Mesh(new T.SphereGeometry(.018, 16, 10), new T.MeshBasicMaterial({ color: 0xffe2b0, toneMapped: false })); keyMark.add(m); }
const keyLine = new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(), new T.Vector3(0, 1, 0)]), new T.LineBasicMaterial({ color: 0xffe2b0, transparent: true, opacity: .35 })); scene.add(keyLine);

const FORMS = { DRUM: { p: [[0, 0], [.118, 0], [.122, .006], [.122, .084], [.115, .092], [0, .092]], top: .092, edge: .118, cr: .075 },
  DOME: { p: (() => { const p = [[0, 0], [.122, 0], [.122, .02]]; for (let k = 1; k <= 14; k++) { const a = k / 14 * Math.PI / 2; p.push([.122 * Math.cos(a), .02 + .085 * Math.sin(a)]); } return p; })(), top: .1, edge: .122, cr: .05, domed: true },
  TIERS: { p: [[0, 0], [.13, 0], [.132, .006], [.132, .068], [.128, .072], [.088, .072], [.09, .078], [.09, .138], [.084, .144], [0, .144]], top: .144, edge: .086, cr: .05, low: [.13, .072] },
  RING: { p: (() => { const p = []; for (let k = 0; k <= 40; k++) { const t = -Math.PI / 2 + k / 40 * TAU; p.push([.08 + .045 * Math.cos(t), .045 + .048 * Math.sin(t)]); } return p; })(), top: .093, edge: .08, cr: .08, ring: true } };
const ICING = [['SPONGE', 0xc99b5e], ['CREAM', 0xf0e2c4], ['WHITE', 0xf8f4ec], ['ROSE', 0xeaa5b2], ['CHOCOLATE', 0x4a2b1b], ['LEMON', 0xf1d97c], ['MINT', 0xbadfcb]];
const BORDER = [['NONE', 0], ['WHITE', 0xfbf8f2], ['ROSE', 0xd9748a], ['CHOCOLATE', 0x3a2114], ['GOLD', 0xd9a640]];
const WOOD = [['OAK', 0x3a2410], ['WALNUT', 0x5e3c20], ['PALE', 0xd4c19a], ['BLACK', 0x1d1a16]];
const bump = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'), id = x.createImageData(256, 256); for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 100; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } x.putImageData(id, 0, 0); const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; return t; })();
const stripe = (() => { const c = document.createElement('canvas'); c.width = 16; c.height = 64; const x = c.getContext('2d'); x.fillStyle = '#f4ecdc'; x.fillRect(0, 0, 16, 64); x.fillStyle = '#d4483e'; for (let y = -16; y < 80; y += 12) { x.beginPath(); x.moveTo(0, y); x.lineTo(16, y + 8); x.lineTo(16, y + 13); x.lineTo(0, y + 5); x.fill(); } const t = new T.CanvasTexture(c); t.wrapT = T.RepeatWrapping; t.encoding = T.sRGBEncoding; return t; })();
const flameMat = new T.SpriteMaterial({ map: (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 128; const x = c.getContext('2d'), g = x.createRadialGradient(32, 86, 2, 32, 76, 46); g.addColorStop(0, 'rgba(255,252,230,1)'); g.addColorStop(.22, 'rgba(255,205,95,.95)'); g.addColorStop(.6, 'rgba(255,120,30,.35)'); g.addColorStop(1, 'rgba(255,90,20,0)'); x.fillStyle = g; x.beginPath(); x.ellipse(32, 76, 18, 46, 0, 0, TAU); x.fill(); return new T.CanvasTexture(c); })(), blending: T.AdditiveBlending, depthWrite: false, transparent: true, toneMapped: false });
const icingMat = mistify(new T.MeshStandardMaterial({ roughness: .78, bumpMap: bump, bumpScale: .0012 })), beadMat = mistify(new T.MeshStandardMaterial({ roughness: .5 })), candleMat = mistify(new T.MeshStandardMaterial({ map: stripe, roughness: .5 })), wickMat = new T.MeshBasicMaterial({ color: 0x1b1612 });
let FLAMES = [];
function buildCake(c) { CAKE.clear(); FLAMES = []; if (!c) return; const F = FORMS[c.form];
  icingMat.color.setHex(ICING[c.icing][1]); const body = new T.Mesh(new T.LatheGeometry(F.p.map(p => new T.Vector2(p[0], p[1])), 112), icingMat); body.castShadow = body.receiveShadow = true; CAKE.add(body);
  if (c.border) { beadMat.color.setHex(BORDER[c.border][1]); const rings = [[F.edge, F.top - (F.domed ? .07 : .002)], [F.p[1][0], .006]]; if (F.low) rings.push([F.low[0] - .003, F.low[1]]);
    rings.forEach(([r, y]) => { const n = Math.round(TAU * r / .0105), im = new T.InstancedMesh(new T.SphereGeometry(.0062, 10, 8), beadMat, n), m4 = new T.Matrix4(); for (let k = 0; k < n; k++) { const a = k / n * TAU; m4.makeTranslation(Math.cos(a) * r, y, Math.sin(a) * r); im.setMatrixAt(k, m4); } im.castShadow = true; CAKE.add(im); }); }
  for (let k = 0; k < c.candles; k++) { const a = k / c.candles * TAU + .3, r = c.candles === 1 ? 0 : F.cr, g = new T.Group(); g.position.set(Math.cos(a) * r, F.domed ? F.top - .004 - (r / F.edge) ** 2 * .03 : F.top, Math.sin(a) * r);
    const cy = new T.Mesh(new T.CylinderGeometry(.0034, .0034, .055, 10), candleMat); cy.position.y = .0275; cy.castShadow = true; const w = new T.Mesh(new T.CylinderGeometry(.0006, .0006, .007, 4), wickMat); w.position.y = .0585; g.add(cy, w);
    if (k >= (c.out || 0)) { const f = new T.Sprite(flameMat); f.scale.set(.016, .034, 1); f.position.y = .072; g.add(f); FLAMES.push(f); } CAKE.add(g); } }
const tableMat = mistify(new T.MeshStandardMaterial({ roughness: .88, transparent: true })), legMat = mistify(new T.MeshStandardMaterial({ color: 0x141210, roughness: .7, transparent: true }));
function buildTable(t) { TABLE.clear(); if (!t) return; tableMat.color.setHex(WOOD[t.wood][1]); const top = new T.Mesh(new T.CylinderGeometry(.6 * t.w, .6 * t.w, .035, 6), tableMat); top.position.y = TOP - .018; top.receiveShadow = top.castShadow = true; TABLE.add(top);
  const leg = new T.Mesh(new T.CylinderGeometry(.05, .09, TOP - .04, 16), legMat); leg.position.y = (TOP - .04) / 2; TABLE.add(leg); }
// the children: cut from the film's own frame; flat, standing round the table, lit by the same light as the cake
const KIDS = [{ file: 'child1.png', h: .56, base: -.1, slot: Math.PI - .62 }, { file: 'child2.png', h: .25, base: .05, slot: Math.PI - .04 }, { file: 'child3.png', h: .72, base: -.14, slot: Math.PI + .56 }];
KIDS.forEach(k => { k.tex = new T.TextureLoader().load('assets/weaver/' + k.file, t => { k.aspect = t.image.width / t.image.height; k.img = t.image; dirty.kids = true; dirty.mist = true; }); k.tex.encoding = T.sRGBEncoding; k.aspect = .7;
  k.mat = mistify(new T.MeshStandardMaterial({ map: k.tex, alphaTest: .35, side: T.DoubleSide, roughness: .92, emissive: 0xffffff, emissiveMap: k.tex, emissiveIntensity: .2, transparent: true })); });
const KM = {};
function placeKids(dt) { const ids = new Set(DOC.kids.map(c => c.i)); for (const i in KM) if (!ids.has(+i)) { KIDG.remove(KM[i]); delete KM[i]; }
  DOC.kids.forEach(c => { const k = KIDS[c.i]; let m = KM[c.i]; if (!m) { m = KM[c.i] = new T.Mesh(new T.PlaneGeometry(1, 1), k.mat); m.castShadow = true; m.userData.vis = 0; KIDG.add(m); }
    m.userData.vis = Math.min(1, m.userData.vis + dt * .8); k.mat.opacity = m.userData.vis; const h = k.h * c.s;
    m.scale.set(h * k.aspect, h, 1); m.position.set(Math.sin(c.a) * c.r, TOP + k.base * c.s + h / 2, Math.cos(c.a) * c.r); m.updateMatrixWorld(true); const wp = m.getWorldPosition(new T.Vector3()); m.lookAt(cam.position.x, wp.y, cam.position.z); m.rotateY(c.face * Math.PI / 180); }); }

// the mist itself: points taken from everything made, rising slowly while the solid comes apart
const MISTN = 9000, mistG = new T.BufferGeometry(); mistG.setAttribute('position', new T.BufferAttribute(new Float32Array(MISTN * 3), 3)); mistG.setAttribute('color', new T.BufferAttribute(new Float32Array(MISTN * 3), 3)); mistG.setAttribute('seed', new T.BufferAttribute(new Float32Array(MISTN), 1)); mistG.setDrawRange(0, 0);
const mistMat = new T.ShaderMaterial({ uniforms: { uMist: MU.uMist, uTime: MU.uTime, uPx: { value: 1 } }, transparent: true, depthWrite: false, blending: T.AdditiveBlending,
  vertexShader: 'attribute vec3 color; attribute float seed; uniform float uMist, uTime, uPx; varying vec3 vC; varying float vA; void main(){ vec3 p = position; float t = uTime * .12 + seed * 6.28; p += vec3(sin(t * 1.3 + seed * 9.), mod(uTime * .015 + seed, 1.) * 2.2 - .2, cos(t * 1.1 + seed * 7.)) * .03 * uMist * uMist; vec4 mv = modelViewMatrix * vec4(p, 1.); gl_Position = projectionMatrix * mv; gl_PointSize = max(1.5, uPx * (.0025 + seed * .003) / -mv.z); vC = color; vA = uMist * (.55 + .45 * sin(uTime * 2. + seed * 40.)); }',
  fragmentShader: 'varying vec3 vC; varying float vA; void main(){ vec2 q = gl_PointCoord - .5; float d = length(q); if (d > .5) discard; gl_FragColor = vec4(vC * vA * (1. - d * 2.), 1.); }' });
const MISTP = new T.Points(mistG, mistMat); MEM.add(MISTP);
function buildMist() { const P = mistG.attributes.position.array, Cc = mistG.attributes.color.array, Sd = mistG.attributes.seed.array; let n = 0; const col = new T.Color();
  const push = (v, c) => { if (n >= MISTN) return; P.set([v.x, v.y, v.z], n * 3); Cc.set([c.r, c.g, c.b], n * 3); Sd[n] = Math.random(); n++; };
  MEM.updateMatrixWorld(true); const inv = new T.Matrix4().copy(MEM.matrixWorld).invert();
  const sample = (mesh, k) => { const g = mesh.geometry, pa = g.attributes.position, c = mesh.material.color || new T.Color(1, 1, 1); const m4 = inv.clone().multiply(mesh.matrixWorld); for (let i = 0; i < pa.count; i += k) push(new T.Vector3().fromBufferAttribute(pa, i).applyMatrix4(m4), c); };
  CAKE.traverse(o => { if (o.isMesh && !o.isInstancedMesh) sample(o, 1); if (o.isInstancedMesh) { const m4 = new T.Matrix4(); for (let i = 0; i < o.count; i++) { o.getMatrixAt(i, m4); push(new T.Vector3().applyMatrix4(m4).applyMatrix4(inv.clone().multiply(o.matrixWorld)), o.material.color); } } if (o.isSprite) { const w = o.getWorldPosition(new T.Vector3()).applyMatrix4(inv); for (let k = 0; k < 20; k++) push(w.clone().add(new T.Vector3((Math.random() - .5) * .006, (Math.random() - .5) * .02, 0)), col.setRGB(1, .7, .3)); } });
  TABLE.traverse(o => { if (o.isMesh && o.geometry.type === 'CylinderGeometry' && o.position.y > .3) { const r = o.geometry.parameters.radiusTop, y = o.position.y + .018; for (let k = 0; k < 1600; k++) { const a = Math.random() * TAU, rr = Math.sqrt(Math.random()) * r * Math.cos(Math.PI / 6); push(new T.Vector3(Math.cos(a) * rr, y, Math.sin(a) * rr), o.material.color); } } });
  for (const i in KM) { const m = KM[i], k = KIDS[i]; if (!k.img) continue; if (!k.px) { const c = document.createElement('canvas'); c.width = 96; c.height = Math.round(96 / k.aspect); const x = c.getContext('2d'); x.drawImage(k.img, 0, 0, c.width, c.height); k.px = { w: c.width, h: c.height, d: x.getImageData(0, 0, c.width, c.height).data }; }
    const m4 = inv.clone().multiply(m.matrixWorld), { w, h, d } = k.px; for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) { const j = (y * w + x) * 4; if (d[j + 3] < 120) continue; push(new T.Vector3(x / w - .5, .5 - y / h, 0).applyMatrix4(m4), col.setRGB(d[j] / 200, d[j + 1] / 200, d[j + 2] / 200)); } }
  mistG.setDrawRange(0, n); mistG.attributes.position.needsUpdate = mistG.attributes.color.needsUpdate = mistG.attributes.seed.needsUpdate = true; }

/* =============================================================== the film's look: lifted grey-green blacks, soft contrast, grain, vignette */
const rt = new T.WebGLRenderTarget(16, 16); rt.texture.encoding = T.sRGBEncoding;
const grade = new T.ShaderMaterial({ uniforms: { tC: { value: rt.texture }, gt: { value: 0 } }, depthTest: false, depthWrite: false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `uniform sampler2D tC; uniform float gt; varying vec2 vUv; void main(){ vec3 c = texture2D(tC, vUv).rgb; vec2 q = vUv - .5; c *= 1. - dot(q, q) * 1.1;
    float l = dot(c, vec3(.299, .587, .114)); c = mix(vec3(l), c, .86); c = vec3(.034, .043, .038) + c * vec3(.97, 1., .95); c = c / (c + .72) * 1.62;
    c += (fract(sin(dot(vUv * vec2(1913., 2711.) + gt, vec2(12.9898, 78.233))) * 43758.5453) - .5) * .03; gl_FragColor = vec4(c, 1.); }` });
const gQ = new T.Scene(), gC = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1); gQ.add(new T.Mesh(new T.PlaneGeometry(2, 2), grade));

/* =============================================================== THE ORB (its body, rings and display are the weaver's) */

function centerOf(key) { if (key === 'cake') { const b = new T.Box3().setFromObject(CAKE); return b.isEmpty() ? null : { c: b.getCenter(new T.Vector3()), r: b.getSize(new T.Vector3()).length() / 2 }; }

function updSight(dt) { const show = !S.recall && !FILM ? NOW - S.retT < 2.4 : NOW - S.retT < 2.4, ce = show ? centerOf(S.pick) : null; const want = ce ? .75 : 0; sMat.opacity += (want - sMat.opacity) * Math.min(1, dt * 6); SIGHT.visible = sMat.opacity > .02; if (!ce) return;
  const right = new T.Vector3(1, 0, 0).applyQuaternion(cam.quaternion), s = clamp(ce.r * .42, .025, .16); SIGHT.position.copy(ce.c).addScaledVector(right, ce.r * 1.05 + s * 1.3); SIGHT.quaternion.copy(cam.quaternion); SIGHT.scale.setScalar(s);
  const r = rings()[S.lastRing], u = v01(r), a = Math.PI * .5 + (TAU - 4.2) / 2 + Math.PI - 4.2 / 2 + u * 4.2; sBox.position.set(Math.cos(a), Math.sin(a), 0); sBox.rotation.z = a; }

/* =============================================================== THE ROOM: rebuild what changed; the camera is your eye, kneeling */
function apply(dt) { if (dirty.cake) { buildCake(DOC.cake); dirty.cake = false; dirty.mist = true; } if (dirty.table) { buildTable(DOC.table); dirty.table = false; dirty.mist = true; }
  if (DOC.table) { DOC.table.k = Math.min(1, (DOC.table.k || 0) + dt * .9); tableMat.opacity = legMat.opacity = DOC.table.k; tableMat.transparent = legMat.transparent = DOC.table.k < 1; } placeKids(dt);
  const Lt = DOC.light, cw = CAKE.getWorldPosition(new T.Vector3()).add(new T.Vector3(0, .05, 0)), la = Lt.a * Math.PI / 180;
  key.position.set(cw.x + Math.sin(la) * .95, cw.y + Lt.h, cw.z + Math.cos(la) * .95); key.target.position.copy(cw); key.color.setRGB(lerp(.72, 1, Lt.warm), lerp(.82, .72, Lt.warm), lerp(1, .45, Lt.warm)); key.intensity = DOC.cake ? Lt.k : 0;
  keyMark.position.copy(key.position); keyMark.visible = keyLine.visible = S.pick === 'light' && NOW - S.retT < 3 && !FILM; keyLine.geometry.setFromPoints([key.position, cw]);
  const lit = FLAMES.length; candleLight.position.set(cw.x, cw.y + .15, cw.z); candleLight.intensity = lit ? (.25 + Math.min(lit, 12) * .12) * (.94 + Math.sin(NOW * 21) * .04 + Math.sin(NOW * 7) * .03) : 0;
  FLAMES.forEach((f, i) => { const k = 1 + Math.sin(NOW * 13 + i * 1.7) * .06 + Math.sin(NOW * 31 + i) * .04; f.scale.set(.016 * k, .034 * (2 - k), 1); });
  MU.uMist.value = DOC.mist; MISTP.visible = DOC.mist > .01; if (MISTP.visible && dirty.mist) { buildMist(); dirty.mist = false; }
  PIV.rotation.set(S.tilt, S.turn, 0, 'XYZ'); if (!DOC.table) { PIV.rotation.z = Math.sin(NOW * .45) * .03; PIV.rotation.x += Math.sin(NOW * .31 + 1) * .025; } }
function placeCam() { const k = sm(S.close); cam.position.set(Math.sin(NOW * .23) * .004, lerp(.98, .8, k) + Math.sin(NOW * .9) * .003, lerp(1.32, .5, k)); cam.lookAt(0, lerp(.69, .68, k), 0); }
function tickAnim(dt) { const A = S.anim; if (!A) return; A.t += dt;
  if (A.k === 'blow') { const C = DOC.cake; if (A.t > .45) { A.t = 0; C.out = (C.out || 0) + 1; dirty.cake = true; tone(320, 120, .35, .04, 'triangle'); if (C.out >= C.candles) { S.anim = null; say('MAKE A WISH'); } } }
  if (A.k === 'mist') { const u = clamp(A.t / A.dur, 0, 1); DOC.mist = lerp(A.from, A.to, sm(u)); if (u >= 1) { S.anim = null; say(A.to ? 'ALL OF IT IS MIST' : 'IT COMES BACK'); } } }
function tickRecall(dt) { const Rc = S.recall; if (!Rc) return; Rc.t += dt; if (Rc.t > .55) { Rc.t = 0; Rc.i++; if (Rc.i >= Rc.frames.length) { S.recall = null; setDoc(JSON.parse(S.recallEnd)); say('THAT IS HOW IT WAS MADE'); return; } setDoc(JSON.parse(Rc.frames[Rc.i])); tick('ring', Rc.i % 5); } }
function resize() { const w = Math.max(2, roomEl.clientWidth), h = Math.max(2, roomEl.clientHeight); R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); const pr = R.getPixelRatio(); rt.setSize(Math.round(w * pr), Math.round(h * pr)); mistMat.uniforms.uPx.value = h * pr / (2 * Math.tan(cam.fov * Math.PI / 360)); fitOrb(); }
addEventListener('resize', resize);
function update(dt) { NOW += dt; MU.uTime.value = NOW; tickAnim(dt); tickRecall(dt); apply(dt); placeCam(); updSight(dt);
  const dpos = dustG.attributes.position; for (let i = 0; i < DUSTN; i++) { let y = dpos.array[i * 3 + 1] + dt * (.015 + (i % 7) * .003); if (y > 2.2) y = 0; dpos.array[i * 3 + 1] = y; } dpos.needsUpdate = true;
  RINGS.forEach((r, i) => { r.ang += (r.target - r.ang) * Math.min(1, dt * 18); r.g.rotation.x = r.ang; const on = !!rings()[i]; r.lit.visible = on; r.lit.material.color.setHex(i === S.lastRing ? 0x8ffff0 : i === 0 ? 0xb07a20 : 0x2fae9f); });
  const can = { CAPTURE: true, UNDO: UNDO.length > 0, PLAY: UNDO.length > 0 || !!S.recall, KEEP: !!DOC.cake };
  for (const k in BTN) { const b = BTN[k]; if (odrag && odrag.btn === k) b.down = 1; else b.down = Math.max(0, b.down - dt * 6); b.cap.position.z = b.z0 - b.down * .008; b.lab.material.opacity = can[k] ? 1 : .25; b.g.visible = true; }
  orbPitchV += ((.18 - ORB.rotation.x) * 42 - orbPitchV * 9) * dt; ORB.rotation.x += orbPitchV * dt;
  ORB.userData.iris.material.opacity = .55 + .35 * (.5 + .5 * Math.sin(NOW * 1.6));
  drawDialLabels(); if (oledDirty || (S.msg && NOW - S.msgT < 3.6)) { drawOLED(); oledDirty = false; } }
