<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cake Rig</title>
<meta name="description" content="The birthday cake made on the orb: select, extrude, rotate, bevel, inspect, accept, cancel, undo, and a shot camera you carry with a clutch.">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #050605; --ink: #e8e4da; --dim: #7d7a72; --cy: #5ff0dc; --amb: #f0b040; --red: #ff5a3c; --oled: #030504; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 12px/1.3 "IBM Plex Mono", ui-monospace, monospace; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .app { height: 100dvh; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
  #room { position: relative; overflow: hidden; touch-action: none; }
  #room canvas { display: block; width: 100%; height: 100%; }
  .tag { position: absolute; transform: translate(-50%, -50%); color: var(--cy); font-weight: 600; font-size: 13px; white-space: nowrap; pointer-events: none; text-shadow: 0 0 6px #000, 0 0 2px #000; }
  .tag.fault { color: var(--red); }
  #pipfr { position: absolute; border: 1px solid rgba(95,240,220,.55); pointer-events: none; }
  #pipfr span { position: absolute; left: 6px; top: 4px; font-size: 10px; color: var(--cy); text-shadow: 0 0 3px #000; }
  #frame { position: absolute; inset: 0; pointer-events: none; display: none; }
  #frame.on { display: block; }
  #frame i { position: absolute; width: 26px; height: 26px; border: 2px solid var(--cy); }
  #frame .a { left: 14px; top: 14px; border-right: 0; border-bottom: 0; } #frame .b { right: 14px; top: 14px; border-left: 0; border-bottom: 0; }
  #frame .c { left: 14px; bottom: 14px; border-right: 0; border-top: 0; } #frame .d { right: 14px; bottom: 14px; border-left: 0; border-top: 0; }
  #frame .hz { position: absolute; left: 30%; right: 30%; top: 50%; border-top: 1px solid rgba(95,240,220,.45); }
  #frame .aim { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border: 1px solid var(--cy); border-radius: 50%; }
  #frame .rec { position: absolute; right: 50px; top: 18px; color: var(--red); font-weight: 600; display: none; } #frame .rec.on { display: block; }
  /* the controller */
  #dev { padding: 10px 10px 12px; background: linear-gradient(#0a0b0a, #040504); border-top: 1px solid #1d1f1c; }
  .slab { position: relative; max-width: 980px; margin: 0 auto; border-radius: 34px; padding: 12px 14px 12px; background: linear-gradient(180deg, #cfcac0, #a8a399 40%, #8c877d 75%, #6f6b63); box-shadow: inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 6px rgba(0,0,0,.35), 0 8px 26px rgba(0,0,0,.6); }
  .keys { position: absolute; top: -9px; left: 64px; right: 64px; display: flex; gap: 8px; justify-content: space-between; }
  .key { height: 18px; padding: 0 10px; border-radius: 6px 6px 3px 3px; border: 0; background: linear-gradient(#e6e1d7, #9a958b); color: #23221f; font: 600 9px "IBM Plex Mono", monospace; letter-spacing: .08em; cursor: pointer; box-shadow: 0 -1px 0 rgba(0,0,0,.3) inset; }
  .key.on { background: linear-gradient(#7ff5e3, #2ea898); color: #032a24; }
  .key[disabled] { opacity: .45; cursor: default; }
  .oled { display: grid; grid-template-columns: 1fr 2fr 1fr; height: 84px; background: var(--oled); border-radius: 12px; border: 1px solid #000; box-shadow: inset 0 0 0 2px #2a2b28, inset 0 3px 8px rgba(0,0,0,.9); overflow: hidden; }
  .oled > div { position: relative; display: flex; align-items: center; justify-content: center; padding: 4px 8px; }
  .oled > div + div { border-left: 1px solid #1c3d38; }
  .oled svg { position: absolute; left: 8px; top: 15px; width: calc(100% - 16px); height: calc(100% - 32px); }
  .oled .st { position: absolute; left: 8px; top: 5px; font-size: 9px; letter-spacing: .12em; color: #3fa898; }
  .oled .nm { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 10px; color: #8fe9dc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .mid { display: grid; grid-template-columns: 74px 1fr 74px; gap: 10px; margin-top: 10px; align-items: stretch; }
  .wing { border: 0; border-radius: 14px; background: linear-gradient(#ebe7de, #b6b1a6); box-shadow: inset 0 1px 0 #fff, 0 2px 0 #5c5850, 0 3px 6px rgba(0,0,0,.4); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #1f1e1b; font: 600 9px "IBM Plex Mono", monospace; letter-spacing: .08em; padding: 6px 2px; }
  .wing svg { width: 34px; height: 34px; }
  .wing.go { background: linear-gradient(#18201f, #0b1110); color: var(--cy); box-shadow: inset 0 0 0 1px #2c5a52, 0 2px 0 #2a2925; }
  .wing.quiet { opacity: .45; cursor: default; }
  .wing:active:not(.quiet) { transform: translateY(1px); }
  .rollers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 6px; border-radius: 10px; background: linear-gradient(#3c3a35, #22211e); box-shadow: inset 0 2px 6px rgba(0,0,0,.7); }
  .roller { position: relative; height: 150px; border-radius: 8px; cursor: ns-resize; touch-action: none; overflow: hidden; background-color: #b9b4aa; }
  .roller .tex { position: absolute; inset: -40px 0; }
  .roller::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.62), rgba(0,0,0,.08) 26%, rgba(255,255,255,.22) 48%, rgba(0,0,0,.05) 70%, rgba(0,0,0,.66)); pointer-events: none; }
  .r1 .tex { background-image: repeating-linear-gradient(90deg, #8d887e 0 1px, #d9d4ca 1px 4px); }
  .r2 .tex { background-image: repeating-linear-gradient(45deg, rgba(60,58,52,.7) 0 1px, transparent 1px 7px), repeating-linear-gradient(-45deg, rgba(60,58,52,.7) 0 1px, transparent 1px 7px); background-color: #cfcac0; }
  .r3 .tex { background-image: repeating-linear-gradient(90deg, #77736a 0 3px, #e3ded4 3px 9px, #a39e94 9px 12px); }
  .r4 .tex { background-image: radial-gradient(circle, #6f6b63 1.6px, transparent 2.2px); background-size: 9px 9px; background-color: #d3cec4; }
  .r5 .tex { background-image: repeating-linear-gradient(60deg, #7b776e 0 2px, #dcd7cd 2px 8px); }
  .roller .line { position: absolute; left: 50%; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; background: var(--cy); box-shadow: 0 0 8px var(--cy); z-index: 1; display: none; }
  .roller.on .line { display: block; }
  .roller .tickL, .roller .tickR { position: absolute; top: 50%; width: 6px; height: 2px; background: var(--red); z-index: 1; } .roller .tickL { left: 0; } .roller .tickR { right: 0; }
  .roller.on .tickL, .roller.on .tickR { background: var(--cy); }
  .roller.quiet { filter: saturate(.6) brightness(.82); }
  .roller.flash { animation: flash .5s ease-out; }
  @keyframes flash { from { box-shadow: inset 0 0 0 3px var(--cy); } to { box-shadow: inset 0 0 0 0 transparent; } }
  .labs { display: grid; grid-template-columns: 74px 1fr 74px; gap: 10px; margin-top: 6px; }
  .labs .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 0 6px; }
  .labs .row div { text-align: center; font-size: 9.5px; font-weight: 600; color: #2a2925; min-height: 24px; line-height: 1.2; letter-spacing: .04em; }
  .labs .row div small { display: block; font-weight: 500; color: #3c3a35; }
  .labs .row div.quiet { color: transparent; }
  .slab.open .rollers { gap: 22px; } .slab.open .oled { box-shadow: inset 0 0 0 2px var(--amb), inset 0 3px 8px rgba(0,0,0,.9); }
  @media (max-width: 720px) {
    #dev { padding: 8px 6px 8px; } .slab { border-radius: 24px; padding: 10px 8px 8px; }
    .keys { left: 30px; right: 30px; gap: 4px; } .key { padding: 0 6px; font-size: 8px; }
    .oled { height: 74px; } .mid { grid-template-columns: 48px 1fr 48px; gap: 6px; } .labs { grid-template-columns: 48px 1fr 48px; gap: 6px; }
    .wing svg { width: 24px; height: 24px; } .wing { font-size: 8px; border-radius: 10px; }
    .roller { height: 108px; } .rollers { gap: 4px; padding: 4px; } .labs .row { gap: 4px; padding: 0 4px; } .labs .row div { font-size: 8px; }
    .oled .nm { font-size: 9px; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="room"><div id="tags"></div><div id="pipfr"><span>SHOT</span></div>
    <div id="frame"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><div class="hz"></div><div class="aim"></div><div class="rec">REC</div></div></div>
  <div id="dev">
    <div class="slab" id="slab">
      <div class="keys">
        <button class="key" id="kClutch" aria-label="Clutch: hold to connect your movement">CLUTCH</button>
        <button class="key" id="kUndo" aria-label="Undo the last accepted edit">UNDO</button>
        <button class="key" id="kFrame" aria-label="Frame the selection">FRAME</button>
        <button class="key" id="kOpen" aria-label="Open the controller to inspect construction">OPEN</button>
        <button class="key" id="kExit" aria-label="Exit">EXIT</button>
      </div>
      <div class="oled" aria-live="polite"><div id="oL"></div><div id="oC"></div><div id="oR"></div></div>
      <div class="mid">
        <button class="wing" id="wL"></button>
        <div class="rollers" id="rollers"></div>
        <button class="wing" id="wR"></button>
      </div>
      <div class="labs"><div></div><div class="row" id="labs"></div><div></div></div>
    </div>
  </div>
</div>
<script src="assets/three.min.js"></script>
<script>
/* CAKE RIG. The room carries the consequence, the controller carries the controls.
   One target is latched at a time; one operation owns the rollers at a time; every geometry change is a preview until it is accepted.
   Cancel restores the geometry before the pending operation; Undo reverses the last accepted one; Back only moves through menus. */
const T = THREE, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), $ = s => document.querySelector(s), mm = v => Math.round(v * 1000);
const deep = o => JSON.parse(JSON.stringify(o));

/* ---------------- the model: a lathe profile (r, y) from the base centre to the top centre, candles on the top face, a transform, the shot camera */
const M0 = { P: [[0, 0], [.12, 0], [.12, .085], [0, .085]], cn: 7, lit: [1, 1, 1, 1, 1, 1, 1], pos: [0, 0, 0], rot: [0, 0, 0], s: 1,
  cam: { p: [.48, 1.06, .62], yaw: .66, pitch: -.27, f: 50, N: 2.8, fd: .78 } };
let M = deep(M0); const HIST = [], REDO = [];
const topEdge = P => P.length - 2;           // the top face is the last edge: P[n-2] to the axis
const isAxis = p => p[0] < 1e-6;

/* ---------------- operations. Each takes a copy of the model and the roller values, returns the changed model or throws a fault */
const fault = (msg, at) => { const e = new Error(msg); e.fault = true; e.at = at; throw e; };
const OPS = {
  EXTRUDE: { on: 'top', diag: 'extrude', p: { main: ['DISTANCE', 'mm', -80, 150, 0], aux: ['INSET', '%', 0, 70, 0], con: ['SNAP', ['1 mm', '5 mm', '10 mm']] },
    step: v => [1, 5, 10][v.con] / 1000, apply(m, v) { const P = m.P, n = P.length, d = v.main, k = v.aux / 100, [rt, yt] = P[n - 2];
      if (k === 0) { const ny = yt + d; const below = P[n - 3][1]; if (ny < below + .004 && d < 0) fault('THE TOP WOULD PASS THE EDGE BELOW IT', [rt, ny]); P[n - 2] = [rt, ny]; P[n - 1] = [0, ny]; }
      else { const ri = rt * (1 - k), ny = yt + d; if (ny < .006) fault('THE WELL GOES THROUGH THE BASE', [ri, ny]); if (d < 0 && ri < .006) fault('THE WELL IS TOO NARROW', [ri, ny]);
        P.splice(n - 1, 1, [ri, yt], [ri, ny], [0, ny]); } return m; },
    say: v => (v.aux ? `INSET ${v.aux}% · ` : '') + (v.main >= 0 ? 'RAISED ' : 'SUNK ') + Math.abs(mm(v.main)) + ' MM' },
  CANDLES: { on: 'top', diag: 'candles', p: { main: ['COUNT', '', 0, 12, 0] }, step: () => 1, init: m => ({ main: m.cn }),
    apply(m, v) { m.cn = Math.round(v.main); m.lit = Array.from({ length: m.cn }, (_, i) => m.lit[i] == null ? 1 : m.lit[i]); return m; }, say: v => v.main + ' CANDLES' },
  INFLATE: { on: 'side', diag: 'inflate', p: { main: ['OUTWARD', 'mm', -60, 60, 0] }, step: () => .001,
    apply(m, v, t) { const P = m.P, e = t.e; for (const i of [e, e + 1]) { if (isAxis(P[i])) continue; P[i] = [P[i][0] + v.main, P[i][1]]; if (P[i][0] < .01) fault('THE SIDE WOULD CROSS THE CENTRE', P[i]); } return m; },
    say: v => (v.main >= 0 ? 'OUT ' : 'IN ') + Math.abs(mm(v.main)) + ' MM' },
  BEVEL: { on: 'edge', diag: 'bevel', p: { main: ['WIDTH', 'mm', 0, 40, 0], con: ['SEGMENTS', ['1', '2', '3', '4', '6']] }, step: () => .001,
    apply(m, v, t) { const P = m.P, c = t.c, w = v.main; if (w <= 0) return m; const A = P[c - 1], C = P[c], B = P[c + 1];
      const la = Math.hypot(A[0] - C[0], A[1] - C[1]), lb = Math.hypot(B[0] - C[0], B[1] - C[1]); if (w >= la - .002 || w >= lb - .002) fault('WIDER THAN THE FACE BESIDE IT', C);
      const p0 = [C[0] + (A[0] - C[0]) / la * w, C[1] + (A[1] - C[1]) / la * w], p1 = [C[0] + (B[0] - C[0]) / lb * w, C[1] + (B[1] - C[1]) / lb * w]; const seg = [1, 2, 3, 4, 6][v.con]; const pts = [];
      for (let i = 0; i <= seg; i++) { const u = i / seg, a = (1 - u) * (1 - u), b = 2 * u * (1 - u), cc = u * u; pts.push([a * p0[0] + b * C[0] + cc * p1[0], a * p0[1] + b * C[1] + cc * p1[1]]); }
      P.splice(c, 1, ...pts); return m; }, say: v => 'BEVEL ' + mm(v.main) + ' MM' },
  MOVE: { on: 'object', diag: 'move', p: { main: ['DISTANCE', 'mm', -400, 400, 0], con: ['AXIS', ['X', 'Y', 'Z']] }, step: () => .005,
    apply(m, v) { m.pos[v.con] += v.main; if (m.pos[1] < -.0005) fault('THE CAKE WOULD SINK INTO THE TABLE', null); return m; }, say: v => 'MOVED ' + mm(v.main) + ' MM ' + 'XYZ'[v.con] },
  ROTATE: { on: 'object', diag: 'rotate', p: { main: ['ANGLE', '°', -180, 180, 0], con: ['AXIS', ['Y', 'X', 'Z']] }, step: () => 5,
    apply(m, v) { m.rot[[1, 0, 2][v.con]] += v.main; return m; }, say: v => 'TURNED ' + v.main + '° ' + 'YXZ'[v.con] },
  SCALE: { on: 'object', diag: 'scale', p: { main: ['FACTOR', '%', 40, 250, 100] }, step: () => 5, apply(m, v) { m.s *= v.main / 100; return m; }, say: v => 'SCALED ' + v.main + '%' },
  FLAME: { on: 'candle', diag: 'flame', p: { main: ['FLAME', ['OUT', 'LIT']] }, init: (m, t) => ({ main: m.lit[t.i] ? 1 : 0 }), step: () => 1,
    apply(m, v, t) { m.lit[t.i] = v.main ? 1 : 0; return m; }, say: (v, t) => 'CANDLE ' + (t.i + 1) + (v.main ? ' LIT' : ' OUT') },
  LENS: { on: 'camera', diag: 'lens', p: { main: ['FOCAL', ' MM', 14, 135, 50], aux: ['APERTURE', 'f/', 1.4, 16, 2.8] }, init: m => ({ main: m.cam.f, aux: m.cam.N }), step: () => 1,
    apply(m, v) { m.cam.f = v.main; m.cam.N = v.aux; return m; }, say: v => v.main + ' MM f/' + v.aux },
  FOCUS: { on: 'camera', diag: 'focus', p: { main: ['DISTANCE', 'm', .15, 4, .78], con: ['ON', null] }, init: m => ({ main: m.cam.fd }), step: () => .01,
    apply(m, v) { m.cam.fd = v.main; return m; }, say: v => 'FOCUS ' + v.main.toFixed(2) + ' M' },
  'LOOK THROUGH': { on: 'camera', diag: 'look', action: true }
};
const FAMILIES = { object: ['MOVE', 'ROTATE', 'SCALE'], top: ['EXTRUDE', 'CANDLES'], side: ['INFLATE'], edge: ['BEVEL'], candle: ['FLAME'], camera: ['LOOK THROUGH', 'LENS', 'FOCUS'] };
const AUX_STEP = { INSET: 1, APERTURE: .1 };

/* ---------------- interface state */
const S = { entered: false, sel: null, pre: null, tools: null, op: null, opV: null, prev: null, fault: null, done: null, open: false, look: false, clutch: false, exitAsk: false,
  orbit: { yaw: .55, pitch: -.42, dist: 1.25, tgt: [0, .82, 0] }, rev: 0, takes: [], rec: null, say: '' };
const ROLLERS = ['grooves', 'knurl', 'ribs', 'stipple', 'flutes'];

/* ---------------- three.js room */
const room = $('#room'), R = new T.WebGLRenderer({ antialias: true }); R.setPixelRatio(Math.min(2, devicePixelRatio)); R.outputEncoding = T.sRGBEncoding; R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.15; R.shadowMap.enabled = true; room.prepend(R.domElement);
const scene = new T.Scene(); scene.background = new T.Color(0x040504); scene.fog = new T.Fog(0x040504, 3, 9);
const eye = new T.PerspectiveCamera(42, 1, .01, 30), shot = new T.PerspectiveCamera(30, 16 / 9, .01, 30);
scene.add(new T.HemisphereLight(0xb8c2bc, 0x2a1a0c, .5)); const fill = new T.DirectionalLight(0xffc98a, .55); fill.position.set(.6, 1.3, 1.4); scene.add(fill); const bounce = new T.PointLight(0xffa850, .5, 1.6, 2); bounce.position.set(0, .86, .45); scene.add(bounce);
const amb = new T.PointLight(0xffb060, 0, 2.2, 1.6); amb.castShadow = true; amb.shadow.mapSize.set(1024, 1024); amb.shadow.bias = -.002; scene.add(amb);
const key = new T.SpotLight(0xdfe8ff, .35, 6, .5, .8); key.position.set(-1.2, 2.4, 1.2); key.target.position.set(0, .8, 0); scene.add(key, key.target);
// the dome: a dark floor and the lit horizon ring
const floor = new T.Mesh(new T.CircleGeometry(8, 64), new T.MeshStandardMaterial({ color: 0x0b0c0b, roughness: .9 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const ring = new T.Mesh(new T.TorusGeometry(4.2, .012, 6, 160), new T.MeshBasicMaterial({ color: 0xcfe0da })); ring.rotation.x = Math.PI / 2; ring.position.y = 1.15; scene.add(ring);
const halo = new T.Mesh(new T.TorusGeometry(4.2, .09, 6, 160), new T.MeshBasicMaterial({ color: 0x6f8580, transparent: true, opacity: .12 })); halo.rotation.x = Math.PI / 2; halo.position.y = 1.15; scene.add(halo);
// the film's hex table, warm under the candles
const TABLE_Y = .74; const table = new T.Mesh(new T.CylinderGeometry(.62, .62, .04, 6), new T.MeshStandardMaterial({ color: 0xc89a4a, roughness: .55, metalness: .05 })); table.position.y = TABLE_Y - .02; table.receiveShadow = true; scene.add(table);
const leg = new T.Mesh(new T.CylinderGeometry(.05, .08, TABLE_Y - .04, 12), new T.MeshStandardMaterial({ color: 0x1a1714 })); leg.position.y = (TABLE_Y - .04) / 2; scene.add(leg);
const plate = new T.Mesh(new T.CylinderGeometry(.165, .17, .008, 48), new T.MeshStandardMaterial({ color: 0xe9e4da, roughness: .3 })); plate.position.y = TABLE_Y + .004; plate.receiveShadow = true; scene.add(plate);
const BASE_Y = TABLE_Y + .008;
// the cake
const cream = new T.MeshStandardMaterial({ color: 0xf0e2c2, roughness: .78, side: T.FrontSide });
(function bumps() { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const id = x.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 90; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } x.putImageData(id, 0, 0);
  const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(6, 3); cream.bumpMap = t; cream.bumpScale = .0015; })();
const cakeG = new T.Group(); scene.add(cakeG);
let cakeMesh = null, ghost = null, beads = null, candleG = new T.Group(); cakeG.add(candleG);
const stripeTex = (() => { const c = document.createElement('canvas'); c.width = 16; c.height = 64; const x = c.getContext('2d'); x.fillStyle = '#f4ecdc'; x.fillRect(0, 0, 16, 64); x.fillStyle = '#d4483e'; for (let y = -16; y < 80; y += 12) { x.beginPath(); x.moveTo(0, y); x.lineTo(16, y + 8); x.lineTo(16, y + 13); x.lineTo(0, y + 5); x.fill(); } const t = new T.CanvasTexture(c); t.wrapT = T.RepeatWrapping; return t; })();
const flameTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 128; const x = c.getContext('2d'); const g = x.createRadialGradient(32, 84, 2, 32, 76, 46); g.addColorStop(0, 'rgba(255,250,225,1)'); g.addColorStop(.25, 'rgba(255,200,90,.95)'); g.addColorStop(.6, 'rgba(255,120,30,.35)'); g.addColorStop(1, 'rgba(255,90,20,0)'); x.fillStyle = g; x.beginPath(); x.ellipse(32, 76, 18, 46, 0, 0, Math.PI * 2); x.fill(); return new T.CanvasTexture(c); })();
