<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film versions</title>
<style>
  html,body{margin:0;background:#000;color:#fff;font:400 12px/1.4 "Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.07em;text-transform:uppercase}
  main{max-width:1280px;margin:0 auto;padding:18px}
  h1{font:600 14px/1 inherit;margin:0 0 14px;letter-spacing:.14em}
  .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
  figure{margin:0;border:1px solid rgba(255,255,255,.25)}
  video{width:100%;display:block;background:#000}
  figcaption{padding:8px 10px;opacity:.85}
  figcaption b{display:block;font-weight:600;margin-bottom:2px}
  figcaption span{opacity:.65;text-transform:none;letter-spacing:.02em}
</style>
</head>
<body><main>
<h1>The birthday, in versions</h1>
<div class="g" id="g"></div>
<p style="opacity:.6;margin-top:16px;text-transform:none;letter-spacing:.02em">V0 is the original film (213 s). V1 to V3 are generated from the original frame with Kling 2.1 (image to video). Each starts on the same frame.</p>
</main>
<script>
var V=[['v0_original','V0 · Original','The film, 4 s.'],['v1_blowout','V1 · Blow-out','Breath, flames bend and go out, smoke, the light falls.'],['v2_pushin','V2 · Push-in','Slow push toward the cake and the birthday girl; her eyes leave the flames, a faint smile.'],['v3_hologram','V3 · Hologram','Edges like mist, the faces turn toward the cake, faint scanlines.']];
var g=document.getElementById('g');V.forEach(function(v){var f=document.createElement('figure');f.innerHTML='<video src="assets/versions/'+v[0]+'.mp4" poster="assets/versions/'+v[0]+'.jpg" controls loop muted playsinline preload="metadata"></video><figcaption><b>'+v[1]+'</b><span>'+v[2]+'</span></figcaption>';g.appendChild(f)});
[].forEach.call(document.querySelectorAll('video'),function(v){v.addEventListener('mouseenter',function(){v.play().catch(function(){})});v.addEventListener('mouseleave',function(){v.pause()})});
</script></body></html>
