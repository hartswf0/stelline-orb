<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stelline Bench</title>
<meta name="description" content="The film's people and trees as cut-outs, the cakes and bugs as 3D models. Pick one, turn it, hold the rest.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--w:#fff;--d:rgba(255,255,255,.25);--f:"Barlow Semi Condensed","DIN Alternate","Roboto Condensed","Arial Narrow",Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#000;color:var(--w);font:400 13px/1.3 var(--f);letter-spacing:.06em;overflow:hidden}
  button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid #fff;outline-offset:3px}
  #app{position:fixed;inset:0;display:grid;grid-template-rows:40px minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr) 168px;grid-template-areas:"top top" "stage gal" "orb gal"}
  #top{grid-area:top;display:flex;gap:26px;align-items:center;padding:0 18px;text-transform:uppercase}
  #top button{opacity:.55;padding:4px 0;border-bottom:1px solid transparent}#top button[aria-pressed=true]{opacity:1;border-bottom-color:#fff}
  #top .r{margin-left:auto;opacity:.7}
  #stage{grid-area:stage;position:relative;min-height:0;padding:0 0 0 18px;display:flex;align-items:center;justify-content:center}
  #cv{max-width:100%;max-height:100%;aspect-ratio:16/9;width:100%;border:1px solid rgba(255,255,255,.55);background:#000;touch-action:none}
  #gal{grid-area:gal;overflow-y:auto;padding:0 14px 10px 10px;display:flex;flex-direction:column;gap:8px}
  #gal h2{margin:2px 0 4px;font:600 12px var(--f);text-transform:uppercase;opacity:.7}
  .th{position:relative;border:1px solid rgba(255,255,255,.28);aspect-ratio:4/3;background-color:#000;background-repeat:no-repeat;flex:0 0 auto;text-align:left}
  .th[aria-pressed=true]{border-color:#fff;border-width:2px}
  .th span{position:absolute;left:5px;bottom:3px;font-size:11px;text-transform:uppercase;text-shadow:0 0 4px #000,0 0 4px #000}
  #eye{border:1px solid #fff;padding:7px 10px;text-transform:uppercase}
  #eye[aria-pressed=true]{background:#fff;color:#000}
  #orbrow{grid-area:orb;display:flex;align-items:center;gap:18px;padding:4px 0 10px 18px;min-width:0}
  #orbwrap{flex:0 0 min(46vw,440px)}
  svg#orb{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
  .ring{cursor:ns-resize;outline:none}.ring.off{opacity:.35;cursor:not-allowed}
  .ring:focus-visible .hit{stroke:#fff;stroke-width:3;fill:rgba(255,255,255,.08)}
  #thumb{cursor:pointer;outline:none}#thumb:focus-visible .keycap{stroke:#fff;stroke-width:3}
  #read{text-transform:uppercase;font-size:12px;line-height:1.7;min-width:0}
  #read b{font-weight:600}
  #read .l{opacity:.6}
  @media(max-width:860px){
    #app{grid-template-columns:minmax(0,1fr);grid-template-rows:40px minmax(0,1fr) 92px auto;grid-template-areas:"top" "stage" "gal" "orb"}
    #stage{padding:0 8px}#gal{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:4px 8px}#gal h2{display:none}.th{height:84px;aspect-ratio:auto;width:112px}
    #orbrow{padding:0 8px 6px;flex-direction:column;align-items:stretch;gap:6px}#orbwrap{flex-basis:auto;max-width:360px}
    #top{gap:16px;padding:0 8px}
  }
</style>
</head>

le": "PHIDIPPUS VIRIDIS \u00b7 35MM", "n": 12, "period": 12, "eye": true}, {"id": "bug_jumper", "kind": "bug", "title": "CERAMBYX UMBROSA \u00b7 37MM", "n": 12, "period": 12, "eye": true}]};
(function(){

/* ---------- drawing ---------- */

  g.fillStyle='#000';g.fillRect(0,0,W,H);
  var fl=flame(h);
  g.save();g.strokeStyle='rgba(255,255,255,.38)';g.lineWidth=2;g.beginPath();g.ellipse(640,640,760,360,0,Math.PI*1.12,Math.PI*1.88);g.stroke();g.restore();
  var t=IM.table;if(ready(t))g.drawImage(t,BOX.table[0],BOX.table[1]);
  var k=IM.kids;if(ready(k)){var tc=amb.t(h);ox.clearRect(0,0,W,H);var bx=BOX.kids[0],by=BOX.kids[1],kw=k.naturalWidth,kh=k.naturalHeight,s=1+.007*Math.sin(tc*1.5),dy=Math.sin(tc*.9)*2.2;
    ox.save();ox.translate(bx+kw/2,by+kh);ox.scale(s,s);ox.translate(-(bx+kw/2),-(by+kh)+dy);ox.drawImage(k,bx,by);ox.restore();
    ox.globalCompositeOperation='source-atop';var gr=ox.createRadialGradient(650,440,10,650,440,430);gr.addColorStop(0,'rgba(255,170,70,'+(.16+.12*fl)+')');gr.addColorStop(1,'rgba(255,170,70,0)');ox.fillStyle=gr;ox.fillRect(0,0,W,H);ox.globalCompositeOperation='source-over';
    g.drawImage(off,0,0)}
  var gl=g.createRadialGradient(650,500,10,650,500,360);gl.addColorStop(0,'rgba(255,160,60,'+(.20+.12*fl)+')');gl.addColorStop(1,'rgba(255,160,60,0)');g.save();g.globalCompositeOperation='screen';g.fillStyle=gl;g.fillRect(0,0,W,H);g.restore();
  g.save();g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(650,512,150,26,0,0,7);g.fill();g.restore();
  frameDraw(g,cur(),subj.t(h),650,536,270);
}
function forest(g,h){
  var c=IM.chamber;if(ready(c))g.drawImage(c,0,0,W,H);else{g.fillStyle='#222';g.fillRect(0,0,W,H)}
  g.save();g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,0,W,H);g.restore();
  var names=['forest_far','forest_mid','forest_near'],tc=amb.t(h),S=8,sw=W/S;
  for(var li=0;li<3;li++){var im=IM[names[li]];if(!ready(im))continue;var px=Math.sin(tc*.35)*(li+1)*3.5;
    for(var s=0;s<S;s++){var p=clamp((field*1.6-(2-li)*.22-s*.045)/.5,0,1);p=ease(p);if(p>=1)continue;
      g.save();g.globalAlpha=1-p*.85;g.beginPath();g.rect(s*sw+px,0,sw+1,H);g.clip();g.drawImage(im,px,p*H*.85,W,H);g.restore()}
  }
  var pn=ease(clamp((field*1.6)/.5,0,1));if(pn<1){var bw=280;g.save();g.globalAlpha=1-pn;g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(250,668,bw*.4,14,0,0,7);g.fill();frameDraw(g,cur(),subj.t(h),250,672,bw);g.restore()}
}
function leaf(g,h){
  eyeP+=((eye?1:0)-eyeP)*.12;var e=ease(clamp(eyeP,0,1)),tc=amb.t(h),lf=IM.leaf;
  g.save();if(ready(lf)){var z=1.04+.012*Math.sin(tc*.5);g.translate(W/2,H/2);g.rotate(Math.sin(tc*.31)*.004);g.scale(z,z);g.translate(-W/2,-H/2);if(e>.01)g.filter='blur('+(e*16)+'px)';g.drawImage(lf,0,0,W,H)}g.restore();
  if(e>.01){g.fillStyle='rgba(0,0,0,'+(.55*e)+')';g.fillRect(0,0,W,H)}
  var it=cur();
  if(e<.98){g.save();g.globalAlpha=1-e;g.fillStyle='rgba(10,30,0,.35)';g.beginPath();g.ellipse(640,462,210,30,-.05,0,7);g.fill();var im=IM[it.id];frameDraw(g,it,subj.t(h),620,480,560);g.restore()}
  var ei=IM[it.id+'_eye'];if(e>.02&&ready(ei)){var ew=ei.naturalWidth,eh=ei.naturalHeight,sc=(.65+.35*e)*Math.min(W*.82/ew,H*.92/eh);ox.clearRect(0,0,W,H);ox.globalCompositeOperation='source-over';ox.drawImage(ei,W/2-ew*sc/2,H/2-eh*sc/2,ew*sc,eh*sc);ox.globalCompositeOperation='destination-in';var mk=ox.createRadialGradient(W/2,H/2,H*.18,W/2,H/2,H*.62);mk.addColorStop(0,'rgba(0,0,0,1)');mk.addColorStop(1,'rgba(0,0,0,0)');ox.fillStyle=mk;ox.fillRect(0,0,W,H);ox.globalCompositeOperation='source-over';g.save();g.globalAlpha=e;g.drawImage(off,0,0);g.restore()}
  else if(e>.02){g.save();g.globalAlpha=e;g.fillStyle='#fff';g.fillText('no eye render for this bug',40,60);g.restore()}
}
var last=0;
function frame(){var h=host();
  if(scene==='birthday')birthday(cx,h);else if(scene==='forest')forest(cx,h);else leaf(cx,h);
  if(Math.floor(h*4)!==last){last=Math.floor(h*4);upd()}
  requestAnimationFrame(frame)}
/* ---------- boot ---------- */
var hs=(location.hash||'').slice(1);setScene(hs==='forest'||hs==='leaf'?hs:'birthday');frame();
window.__bench={pick:pick,setScene:setScene,state:function(){return{scene:scene,idx:idx,field:field,subj:subj.t(host()),amb:amb.t(host()),held:amb.held}}};
})();
