  else if (G.phase === 'lost' && G.phaseT > 3 * BEAT) setLevel(G.li); }

/* ------------------------------------------------------------------ what is drawn over the room: the crescent (lung, bar, burn), the look, and almost no words */
const grainC = document.createElement('canvas'); grainC.width = grainC.height = 128; (() => { const x = grainC.getContext('2d'), d = x.createImageData(128, 128); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); })();
function drawHud() { const w = hud.width, h = hud.height, x = hx; x.clearRect(0, 0, w, h);
  if (G.level && G.phase !== 'loading') { // the `)` crescent stands right of the cake, its open side toward it: the long arc is the lung, the pip the beat, the lower arc the candles' time
    tmp.set(G.R * 1.05, TABLE_Y + .008 + G.crown * .55, 0).project(cam); const cx0 = (tmp.x + 1) / 2 * w, cy0 = (1 - tmp.y) / 2 * h, r0 = Math.min(h * .2, Math.max(44, w * .055)), cx = Math.min(w - r0 * 1.2, cx0 + r0 * .5), cy = cy0, r1 = r0 * .79, D = a => a * Math.PI / 180;
    const sect = (a0, a1, col) => { x.beginPath(); x.arc(cx, cy, r0, D(a0), D(a1)); x.arc(cx, cy, r1, D(a1), D(a0), true); x.closePath(); x.fillStyle = col; x.fill(); };
    [[-102, -88, .1], [-87, -71, .22], [-69, -46, .3], [-45, -12, .26], [-11, 3, .18], [7, 16, .4], [19, 44, .26], [45, 58, .16], [59, 68, .08]].forEach(s => sect(s[0], s[1], `rgba(226,236,234,${s[2]})`));
    sect(-12 - 90 * G.lung, -12, G.winded ? 'rgba(255,120,90,.55)' : G.blowing && G.onBeat ? 'rgba(160,255,240,.7)' : 'rgba(248,252,251,.5)');           // the lung
    const left = clamp(1 - (G.bar * 4 + G.beat) / (G.bars * 4), 0, 1); sect(7, 7 + 61 * left, 'rgba(255,196,110,.5)');                                   // the candles' time
    const pa = -102 + (G.beat / 4) * 170; sect(pa - 3, pa + 3, Math.abs(G.beat - 2) < .22 ? 'rgba(160,255,240,.95)' : 'rgba(248,252,251,.8)');            // the beat; it brightens on the third
    x.strokeStyle = 'rgba(236,245,243,.6)'; x.lineWidth = 1.2; x.beginPath(); x.arc(cx, cy, r0 * .965, D(-92), D(60)); x.stroke(); }
  // cakes done and lost, as small marks, never words
  for (let i = 0; i < G.cakes; i++) { x.fillStyle = 'rgba(255,196,110,.8)'; x.fillRect(22 + i * 12, h - 26, 7, 7); } for (let i = 0; i < G.lost; i++) { x.strokeStyle = 'rgba(255,255,255,.4)'; x.strokeRect(22 + (G.cakes + i) * 12 + .5, h - 25.5, 6, 6); }
  const g = x.createRadialGradient(w / 2, h / 2, h * .42, w / 2, h / 2, Math.max(w, h) * .72); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)'); x.fillStyle = g; x.fillRect(0, 0, w, h);
  if (LOOK !== 'clean') { x.globalAlpha = LOOK === 'camcorder90' ? .09 : .05; x.globalCompositeOperation = 'overlay'; const ox = Math.random() * 128, oy = Math.random() * 128; for (let yy = -oy; yy < h; yy += 128) for (let xx = -ox; xx < w; xx += 128) x.drawImage(grainC, xx, yy); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; }
  if (LOOK === 'camcorder90') { x.fillStyle = 'rgba(0,0,0,.14)'; for (let yy = 0; yy < h; yy += 3) x.fillRect(0, yy, w, 1); }
  if (G.phase === 'won' || G.phase === 'lost' || G.phase === 'end') { x.fillStyle = `rgba(0,0,0,${clamp(G.phaseT / (G.phase === 'end' ? 1.5 : 3), 0, G.phase === 'end' ? .86 : .6)})`; x.fillRect(0, 0, w, h); }
  if (G.phase === 'title' || G.phase === 'end') { x.textAlign = 'center'; x.fillStyle = 'rgba(240,244,242,.94)'; x.font = `600 ${Math.round(Math.min(w * .07, 64))}px "Inter Display", "Helvetica Neue", Arial, sans-serif`; x.fillText(G.phase === 'title' ? 'THE BREATH' : G.cakes + ' CAKES · ' + G.breaths + ' BREATHS', w / 2, h * .24);
    x.font = `500 ${Math.round(Math.min(w * .02, 15))}px ui-monospace, Menlo, monospace`; x.fillStyle = 'rgba(255,204,102,.9)'; x.fillText(G.phase === 'title' ? 'MOUSE OR ARROWS AIM · HOLD SPACE TO BLOW · ON THE THIRD BEAT IT CARRIES FURTHER' : 'SPACE FOR THE NEXT FIVE', w / 2, h * .24 + 30); } }
if (LOOK === 'camcorder90') gl.style.filter = 'saturate(1.3) contrast(1.08) blur(.4px)';

/* ------------------------------------------------------------------ the loop, and what a playtest may read */
function frame(dt) { update(dt); R.render(scene, cam); drawHud(); }
let last = performance.now(); function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; frame(dt); if (!MANUAL) requestAnimationFrame(loop); }
window.__game = { get state() { CAKE.updateMatrixWorld(); return { phase: G.phase, clip: G.level && G.level.id, level: G.li, lit: G.lit, total: G.candles.length, lung: +G.lung.toFixed(3), winded: G.winded, blowing: G.blowing, onBeat: !!G.onBeat, beat: +G.beat.toFixed(3), bar: G.bar, bars: G.bars, aim: [+G.aim.x.toFixed(4), +G.aim.y.toFixed(4)], cakes: G.cakes, lost: G.lost, breaths: G.breaths,
    targets: G.candles.map(c => { const p = c.g.getWorldPosition(new THREE.Vector3()); return { x: +p.x.toFixed(4), z: +p.z.toFixed(4), lit: !c.out, heat: +c.heat.toFixed(2), trick: c.trick && !c.relit }; }) }; }, advance(dt, unseen) { if (!MANUAL) return; if (unseen) update(dt); else frame(dt); } };      // unseen: the game steps without drawing, for tuning runs
const startId = Q.get('clip'), si = Math.max(0, L.levels.findIndex(l => l.id === startId)); if (Q.has('autostart')) G.started = true; frameCam(); setLevel(startId ? si : 0); if (!MANUAL) requestAnimationFrame(loop);
</script>
