<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Arcs</title>
<meta name="description" content="Ana's working view of the birthday: one arc beside the cake chooses the cake, one arc over each child times her reaction to the candles going out.">
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;font:400 11px/1.3 "Barlow Semi Condensed","DIN Alternate","Arial Narrow",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;-webkit-user-select:none;user-select:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #ret,#menu{display:none}
  #ov{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
  #ov text{font:500 8.5px "Barlow Semi Condensed","DIN Alternate",Arial,sans-serif;letter-spacing:.1em;fill:#fff}
  #ov .a{fill:none;stroke:#fff;stroke-width:1.4;opacity:.45}#ov .sel .a{opacity:1;stroke-width:2.6}
  #ov .n{stroke:#fff;stroke-width:1.2;opacity:.8}
  #state{position:fixed;left:16px;bottom:14px;opacity:.85;pointer-events:none;line-height:1.7}
  #hint{position:fixed;right:16px;bottom:14px;opacity:.5;pointer-events:none;text-align:right;line-height:1.7}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<svg id="ov"></svg>
<div id="ret"><svg id="rsvg"><path id="rBand"/><path id="rWedge"/><g id="rTicks"></g><g id="rNotch"></g><rect id="rMark"/><path id="rInner"/><path id="rInner2"/><line id="rN1"/><line id="rN2"/><text id="rL1"></text><text id="rL2"></text><g id="rCode"></g></svg></div>
<div id="menu"></div>
<div id="state"></div><div id="hint">[ ] turn the orb · tab choose an arc · space hold / play · v her seat · r back to the pause</div>
<script src="assets/three.min.js"></script>
<script src="assets/stage/glyphs.js"></script>
<script src="assets/stage/stage.js"></script>
<script>
(function () {
  'use strict';
  var ST = window.STAGE, T = ST.T, N = ST.nodes, C = ST.C, clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var TE = 5.5, TEND = 7.4, PAUSE = TE - .7;                      // the flame goes out at TE; Ana stops the party just before the breath
  var VARIANTS = [
    { name: 'LOW', t: { r: 1.7, h: .5 }, drip: .3, gloss: .5, shells: 52, candles: 5, ch: .32, ring: .62, tilt: 0 },
    { name: 'TALL CANDLES', t: { r: 1.25, h: .75 }, drip: .5, gloss: .5, shells: 38, candles: 5, ch: 1.2, ring: .5, tilt: 0 },
    { name: 'HOMEMADE', t: { r: 1.45, h: .8 }, drip: .95, gloss: .1, shells: 22, candles: 4, ch: .62, ring: .6, tilt: .08 }
  ];
  var PERF = [   // each child: a cut-out played from her clip; key = the moment of her performance that matters; delay = how late it lands against the shared event
    { id: 'A', name: 'BIRTHDAY GIRL', clip: 'girl_a', key: 5.5, keyName: 'BREATH OUT', delay: 0, x: 0, z: -1.7, hh: 2.7, face: .3 },
    { id: 'C', name: 'GUEST', clip: 'boy_c', key: .6, keyName: 'SMILE', delay: 3.4, x: -2.2, z: -1.5, hh: 2.3, face: .3 }
  ];
  var v = 0, view = 'ana', held = true, t = PAUSE, sel = 'cake', clips = {}, imgs = {}, cards = {}, start0 = null;
  /* the cards: cut-outs standing in the room */
  PERF.forEach(function (p) { var cv = document.createElement('canvas'), tex = new T.CanvasTexture(cv); tex.encoding = T.sRGBEncoding; var m = new T.MeshBasicMaterial({ map: tex, alphaTest: .4, side: T.DoubleSide, color: 0x100a05 }), mesh = new T.Mesh(new T.PlaneGeometry(1, 1), m); mesh.visible = false; ST.SETA.add(mesh); cards[p.id] = { cv: cv, g: cv.getContext('2d'), tex: tex, mat: m, mesh: mesh }; });
  fetch('assets/girls/boys.json').then(function (r) { return r.json(); }).then(function (j) { var need = j.clips.length, done = 0; j.clips.forEach(function (c) { clips[c.id] = c; var i = new Image(); i.onload = function () { if (++done === need) go(); }; i.src = 'assets/girls/' + c.id + '.webp'; imgs[c.id] = i; }); });
  /* the cake: built once, then swapped in place */
  function cake() {
    var g = 0; while (ST.S.history.length && g++ < 40) ST.undo(); var V = VARIANTS[v];
    N.tier1.p = { r: V.t.r, h: V.t.h }; N.icing.p = { t: .06, drip: V.drip, gloss: V.gloss }; N.border.p = { size: .11, count: V.shells }; N.candles.p = { n: 0, h: V.ch, ring: V.ring, rot: .4 };
    ['table', 'tier', 'icing', 'border'].forEach(function (s) { ST.place(s); }); for (var i = 0; i < V.candles; i++) ST.place('candle'); ST.place('flame');
    ST.instant(); ST.cakeG.rotation.z = V.tilt; ST.cakeG.position.y = V.tilt ? -.02 : 0; ST.cakeG.position.x = V.tilt ? .03 : 0; if (V.tilt) { N.tier1.obj.scale.set(1.1, 1, .92); }
    if (t >= TE) N.flames.exists = false;
  }
  function setView(w) {
    view = w; if (w === 'ana') Object.assign(C, { yaw: 0, pitch: 7, roll: 0, D: 9.4, ty: 1.6, tx: 0, tz: 0, focal: 42, stop: 2.8 });
    else Object.assign(C, { yaw: 180, pitch: -3, roll: 0, D: 4.9, ty: 1.35, tx: 0, tz: 2.0, focal: 30, stop: 2.8 });
    C.foff = view === 'ana' ? 1.7 : -2.0; C.iy = C.ip = C.ir = 0;
  }
  /* world points to the screen */
  var _v = new T.Vector3(); function scr(x, y, z) { _v.set(x, y, z); ST.SETA.localToWorld(_v); _v.project(ST.cam); return [(_v.x * .5 + .5) * innerWidth, (-_v.y * .5 + .5) * innerHeight]; }
  var ov = document.getElementById('ov'), NS = 'http://www.w3.org/2000/svg';
  function arcPath(cx, cy, r, a0, a1) { var p = function (a) { return (cx + Math.cos(a * Math.PI / 180) * r).toFixed(1) + ' ' + (cy + Math.sin(a * Math.PI / 180) * r).toFixed(1); }; return 'M' + p(a0) + ' A' + r + ' ' + r + ' 0 ' + ((a1 - a0) > 180 ? 1 : 0) + ' 1 ' + p(a1); }
  function el(n, at, txt) { var e = document.createElementNS(NS, n); for (var k in at) e.setAttribute(k, at[k]); if (txt) e.textContent = txt; return e; }
  var lastClear = 100;
  function draw() {
    while (ov.firstChild) ov.removeChild(ov.firstChild);
    // the cake arc: a row of possible cakes folded into a curve, above and a little to the side of the cake, clear of the flames and faces
    var ti = ST.topInfo(), ca = scr(1.9, ti.y + 1.5, 0.2), g = el('g', { 'class': sel === 'cake' ? 'sel' : '' }); ov.appendChild(g);
    var R = 86, a0 = -150, a1 = -30; g.appendChild(el('path', { d: arcPath(ca[0], ca[1] + R * .6, R, a0, a1), 'class': 'a' }));
    VARIANTS.forEach(function (V, i) { var a = a0 + (a1 - a0) * (i / 2), x = ca[0] + Math.cos(a * Math.PI / 180) * R, y = ca[1] + R * .6 + Math.sin(a * Math.PI / 180) * R; g.appendChild(el('line', { x1: x, y1: y, x2: x + Math.cos(a * Math.PI / 180) * 9, y2: y + Math.sin(a * Math.PI / 180) * 9, 'class': 'n' })); g.appendChild(el('text', { x: x + (i === 0 ? -6 : i === 2 ? 6 : 0), y: y - 14, 'text-anchor': i === 0 ? 'end' : i === 2 ? 'start' : 'middle', opacity: i === v ? 1 : .5 }, V.name));
      if (i === v) g.appendChild(el('circle', { cx: x, cy: y, r: 4.5, fill: '#fff' })); });
    g.appendChild(el('text', { x: ca[0], y: ca[1] + R * .6 + 20, 'text-anchor': 'middle', opacity: .85 }, 'EYES CLEAR ' + Math.round(lastClear) + '%'));
    // the arc over each child: when she reacts, against when the flame goes out
    PERF.forEach(function (p) {
      var cd = cards[p.id]; if (!cd.mesh.visible) return; var top = scr(p.x + .2, .62 + p.hh + .15, p.z), W2 = 70, g2 = el('g', { 'class': sel === p.id ? 'sel' : '' }); ov.appendChild(g2);
      var xs = function (tt) { return top[0] - W2 + 2 * W2 * clamp(tt / TEND, 0, 1); }, ys = function (tt) { var u = clamp(tt / TEND, 0, 1); return top[1] - 22 * Math.sin(u * Math.PI); };
      var d = ''; for (var i = 0; i <= 20; i++) d += (i ? 'L' : 'M') + xs(i / 20 * TEND).toFixed(1) + ' ' + ys(i / 20 * TEND).toFixed(1); g2.appendChild(el('path', { d: d, 'class': 'a' }));
      g2.appendChild(el('line', { x1: xs(TE), y1: ys(TE) - 9, x2: xs(TE), y2: ys(TE) + 9, 'class': 'n', stroke: '#fff' })); g2.appendChild(el('text', { x: xs(TE), y: ys(TE) - 13, 'text-anchor': 'middle', opacity: .7 }, 'FLAME OUT'));
      var kt = p.key + p.delay; g2.appendChild(el('path', { d: 'M' + xs(kt) + ' ' + (ys(kt) - 7) + 'l5 7l-5 7l-5 -7z', fill: '#fff' }));
      g2.appendChild(el('circle', { cx: xs(t), cy: ys(t), r: 3, fill: 'none', stroke: '#fff', 'stroke-width': 1.6 }));
      var dd = kt - TE; g2.appendChild(el('text', { x: top[0], y: top[1] + 22, 'text-anchor': 'middle', opacity: .9 }, p.name + ' · ' + p.keyName + (Math.abs(dd) < .05 ? ' ON THE FLAME' : ' ' + Math.abs(dd).toFixed(1) + ' S ' + (dd < 0 ? 'BEFORE' : 'AFTER') + ' THE FLAME')));
    });
  }
  /* does a candle cross the birthday girl's eyes, from where the camera is? */
  function clearEyes() {
    var cd = cards.A; if (!cd.mesh.visible) return 100; var P = PERF[0], cx = P.x, cyE = .62 + P.hh * (1 - P.face) - .12, wE = cd.mesh.scale.x * .32;
    var a = scr(cx - wE / 2, cyE + .08, P.z), b = scr(cx + wE / 2, cyE - .08, P.z), ex0 = Math.min(a[0], b[0]), ex1 = Math.max(a[0], b[0]), ey0 = Math.min(a[1], b[1]), ey1 = Math.max(a[1], b[1]), cov = []; var cn = N.candles;
    if (!cn.exists || !cn.obj) return 100; cn.obj.children.forEach(function (c) { var base = new T.Vector3(); c.getWorldPosition(base); var top = base.clone(); top.y += cn.p.h + .5; var pa = base.clone().project(ST.cam), pb = top.clone().project(ST.cam), x = (pa.x * .5 + .5) * innerWidth, y0 = (-pa.y * .5 + .5) * innerHeight, y1 = (-pb.y * .5 + .5) * innerHeight, hw = 7;
      if (y1 < ey1 && y0 > ey0) cov.push([x - hw, x + hw]); });
    var covered = 0; cov.sort(function (p, q) { return p[0] - q[0]; }); var cur = ex0; cov.forEach(function (c) { var s = Math.max(c[0], cur, ex0), e = Math.min(c[1], ex1); if (e > s) { covered += e - s; cur = e; } }); return 100 * (1 - covered / Math.max(1, ex1 - ex0));
  }
  function go() {
    ST.start(); cake(); setView('ana'); document.getElementById('state').textContent = ''; var last = performance.now();
    window.__frameHook = function (dt) {
      if (!held) { t = Math.min(TEND, t + dt); }
      // the shared event: the flame goes out
      var out = t >= TE; if (N.flames.exists === out) { N.flames.exists = !out; if (!out) N.flames.lit = 1; }
      PERF.forEach(function (p) { var cd = cards[p.id], c = clips[p.clip], im = imgs[p.clip]; if (!c || !im.naturalWidth) return; var ct = clamp(t - p.delay, 0, c.n / c.fps - .01), k = clamp(Math.floor(ct * c.fps), 0, c.n - 1);
        if (cd.cv.width !== c.w) { cd.cv.width = c.w; cd.cv.height = c.h; } cd.g.clearRect(0, 0, c.w, c.h); cd.g.drawImage(im, (k % c.cols) * c.w, Math.floor(k / c.cols) * c.h, c.w, c.h, 0, 0, c.w, c.h); cd.tex.needsUpdate = true;
        var hh = p.hh, ww = hh * c.w / c.h; cd.mesh.scale.set(ww, hh, 1); cd.mesh.position.set(p.x, .62 + hh / 2, p.z); cd.mesh.visible = !(view === 'seat' && p.id === 'A');
        var ki = ST.keyLight.intensity, f = .08 + clamp(ki / 5, 0, 1.2) * .9; cd.mat.color.setRGB(f, f * .82, f * .6); });
      lastClear = clearEyes(); draw();
      document.getElementById('state').innerHTML = (view === 'ana' ? 'ANA, WORKING' : 'THE BIRTHDAY SEAT') + '<br>' + (held ? 'HELD' : out ? 'FLAME OUT' : 'PLAYING') + ' · ' + t.toFixed(1) + ' S<br>' + (sel === 'cake' ? 'ARC: CAKE · ' + VARIANTS[v].name : 'ARC: ' + PERF.filter(function (p) { return p.id === sel; })[0].name);
    };
  }
  /* the orb: one roll = one detent on the chosen arc */
  function roll(d) { if (sel === 'cake') { var nv = clamp(v + d, 0, 2); if (nv !== v) { v = nv; cake(); } } else { var p = PERF.filter(function (q) { return q.id === sel; })[0]; p.delay = clamp(p.delay + d * .1, -1, 7); } }
  addEventListener('keydown', function (e) { var k = e.key; if (k === ']' || k === 'ArrowRight') roll(1); else if (k === '[' || k === 'ArrowLeft') roll(-1); else if (k === 'Tab') { e.preventDefault(); var ids = ['cake'].concat(PERF.map(function (p) { return p.id; })); sel = ids[(ids.indexOf(sel) + 1) % ids.length]; } else if (k === ' ') { e.preventDefault(); held = !held; if (!held && t >= TEND - .01) t = PAUSE; } else if (k.toLowerCase() === 'v') setView(view === 'ana' ? 'seat' : 'ana'); else if (k.toLowerCase() === 'r') { t = PAUSE; held = true; } });
  addEventListener('wheel', function (e) { roll(e.deltaY > 0 ? 1 : -1); }, { passive: true });
  var sx = null; document.getElementById('gl').addEventListener('pointerdown', function (e) { sx = e.clientX; }); addEventListener('pointermove', function (e) { if (sx == null) return; if (Math.abs(e.clientX - sx) > 36) { roll(e.clientX > sx ? 1 : -1); sx = e.clientX; } }); addEventListener('pointerup', function () { sx = null; });
  window.__arcs = { roll: roll, sel: function (s) { sel = s; }, view: setView, hold: function (h) { held = h; }, t: function (x) { t = x; }, state: function () { return { v: v, t: t, clear: lastClear, delay: PERF.map(function (p) { return p.delay; }) }; } };
})();
</script>
</body>
</html>
