<title>Arcs</title>

<body>

      if (pts.length < 2) return; var v3 = pts.map(function (q) { return new T.Vector3(q[0], 0, q[1]); }), curve = new T.CatmullRomCurve3(v3, false, 'catmullrom', .2), m = new T.Mesh(new T.TubeGeometry(curve, Math.max(4, pts.length * 6), k === strokes.length - 1 ? .022 : .03, 6, false), insMat); m.castShadow = true; insG.add(m); var tip = v3[v3.length - 1]; if (u < 1) { var nz = new T.Mesh(new T.SphereGeometry(.04, 8, 6), insMat); nz.position.copy(tip); insG.add(nz); } });

      g2.appendChild(el('circle', { cx: xs(t), cy: ys(t), r: 3, fill: 'none', stroke: '#fff', 'stroke-width': 1.6 }));

    });
  }

    if (!cn.exists || !cn.obj) return 100; cn.obj.children.forEach(function (c) { var base = new T.Vector3(); c.getWorldPosition(base); var top = base.clone(); top.y += cn.p.h + .5; var pa = base.clone().project(ST.cam), pb = top.clone().project(ST.cam), x = (pa.x * .5 + .5) * innerWidth, y0 = (-pa.y * .5 + .5) * innerHeight, y1 = (-pb.y * .5 + .5) * innerHeight, hw = 7;
