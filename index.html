<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stelline Memory Orb</title>
<meta name="description" content="One surface linking every Stelline Memory Orb build: studio, designs, moments, orb prototypes, archive and specification.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--k:#000;--w:#fff;--d:rgba(255,255,255,.28);--f:"Barlow Semi Condensed","DIN Alternate","Roboto Condensed","Arial Narrow",Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--k);color:var(--w);font:400 13px/1.3 var(--f);letter-spacing:.06em;overflow:hidden}
  button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--w);outline-offset:3px}
  /* tags row: state, always the same place */
  #tags{position:fixed;left:0;right:0;top:0;height:44px;display:flex;gap:44px;align-items:center;padding:0 5vw;z-index:30;pointer-events:none;text-transform:uppercase}
  #tags span:last-child{margin-left:auto}
  #tags b{font-weight:600}
  /* REST: the machine */
  #m{position:fixed;inset:0;width:100%;height:100%;overflow:visible}
  #m .rule{stroke:var(--d);stroke-width:1;vector-effect:non-scaling-stroke}
  #m .orbit{fill:none;stroke:var(--w);stroke-width:3}
  #m .link{stroke:rgba(255,255,255,.55);stroke-width:1;vector-effect:non-scaling-stroke}
  #m .trail{fill:none;stroke:rgba(255,255,255,.35);stroke-width:1;vector-effect:non-scaling-stroke}
  .node{cursor:pointer;outline:none}
  .node .dot{fill:var(--w)} .node .halo{fill:none;stroke:var(--w);stroke-width:2;opacity:0}
  .node.seen .dot{fill:var(--k);stroke:var(--w);stroke-width:2}
  .node:hover .halo,.node:focus-visible .halo,.node.on .halo{opacity:1}
  .node text{fill:var(--w);font:500 15px var(--f);letter-spacing:.08em;opacity:0;pointer-events:none}
  .node:hover text,.node:focus-visible text,.node.on text{opacity:1}
  #card{position:fixed;z-index:20;width:240px;background:var(--k);border:1px solid var(--w);pointer-events:none;opacity:0;transition:opacity .12s}
  #card.show{opacity:1}
  #card img{display:block;width:100%;height:135px;object-fit:cover;filter:grayscale(1) contrast(1.1)}
  #card div{padding:10px 12px 12px}#card b{display:block;font-weight:600;font-size:15px;text-transform:uppercase;margin-bottom:3px}#card span{opacity:.75}
  #rest{position:fixed;left:5vw;bottom:34px;z-index:10;text-transform:uppercase}
  #rest button{border-bottom:1px solid var(--w);padding-bottom:2px}
  /* READY/WORKING/CHANGED: the frame */
  #frame{position:fixed;inset:44px 3vw 3vh;z-index:25;border:1px solid rgba(255,255,255,.7);background:var(--k);display:none}
  body[data-s=working] #frame,body[data-s=ready] #frame,body[data-s=changed] #frame,body[data-s=fault] #frame{display:block}
  body:not([data-s=rest]) #m{opacity:.0;pointer-events:none}
  body:not([data-s=rest]) #rest{display:none}
  #frame .view{position:absolute;left:34px;right:76px;top:14px;bottom:56px;background:#000;overflow:hidden}
  #frame iframe{width:100%;height:100%;border:0;display:block;background:#000}
  #frame .pt{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--w);top:50%;margin-top:-3px}
  #frame .pt.l{left:-4px}#frame .pt.r{right:-4px}
  #rail{position:absolute;right:0;top:14px;bottom:56px;width:70px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:0 0 0 0}
  #rail button{width:54px;padding:5px 0;text-align:center;font-size:12px;font-weight:500;border-left:2px solid transparent;opacity:.55}
  #rail button:hover{opacity:1}#rail button[aria-current=true]{opacity:1;border-left-color:var(--w);font-weight:600}
  #rail button.seen::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--w);margin:3px auto 0}
  #bar{position:absolute;left:34px;right:76px;bottom:12px;height:34px;display:flex;align-items:center;gap:22px;text-transform:uppercase}
  #bar .rec{white-space:nowrap}#bar .rec b{font-weight:600}
  #prog{display:flex;gap:6px;flex:0 0 auto}#prog i{display:block;height:5px;background:rgba(255,255,255,.25);width:46px;border-radius:2px}
  #prog i.on{background:var(--w)}
  body[data-s=working] #prog i:nth-child(1){animation:pulse 1s infinite}
  body[data-s=working] #prog i:nth-child(2){animation:pulse 1s .2s infinite}
  body[data-s=working] #prog i:nth-child(3){animation:pulse 1s .4s infinite}
  body[data-s=working] #prog i:nth-child(4){animation:pulse 1s .6s infinite}
  @keyframes pulse{0%,100%{background:rgba(255,255,255,.25)}50%{background:#fff}}
  #acts{margin-left:auto;display:flex;gap:20px}
  #acts button{border-bottom:1px solid var(--w);padding-bottom:1px}
  #acts [hidden]{display:none}
  #msg{position:absolute;left:34px;top:14px;right:76px;bottom:56px;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;text-transform:uppercase;background:var(--k);z-index:2}
  body[data-s=fault] #msg{display:flex}
  #msg b{font-size:22px;font-weight:600}
  @media(max-width:760px){
    #tags{gap:16px;padding:0 16px;font-size:11px}#tags span:nth-child(2){display:none}
    #frame{inset:44px 8px 8px}
    #frame .view,#msg{left:8px;right:8px;bottom:104px}
    #rail{left:8px;right:8px;top:auto;bottom:56px;width:auto;height:44px;flex-direction:row;overflow-x:auto;justify-content:flex-start;gap:4px}
    #rail button{flex:0 0 auto;width:46px;border-left:0;border-bottom:2px solid transparent}#rail button[aria-current=true]{border-bottom-color:var(--w)}
    #bar{left:8px;right:8px;gap:12px}#prog i{width:22px}
    #frame .pt{display:none}
  }
  @media(prefers-reduced-motion:reduce){#card{transition:none}body[data-s=working] #prog i{animation:none!important;background:var(--w)}}
</style>
</head>
<body data-s="rest">

<div id="tags" role="status" aria-live="polite"><span id="tN">1</span><span>User <b>Operator</b></span><span id="tS"><b>Rest</b></span><span id="tO">Select a node</span></div>

<svg id="m" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Stelline Memory Orb. Twenty-one nodes on an orbit; each opens one build.">
  <g id="rules"></g>
  <circle class="orbit" cx="800" cy="600" r="490"/>
  <g id="lines"></g>
  <polyline class="trail" id="trail" points=""/>
  <g id="nodes"></g>
  <g id="us" transform="translate(800 598)"><path d="M0-26 26 20H-26Z" fill="#fff"/><title>Operator</title></g>
</svg>

<div id="card" aria-hidden="true"><img alt=""><div><b></b><span></span></div></div>
<div id="rest"><button id="resume" hidden></button></div>

<section id="frame" aria-label="Open build">
  <span class="pt l"></span><span class="pt r"></span>
  <div class="view"><iframe id="fr" title="Build" ></iframe></div>
  <div id="msg"><b id="mT"></b><span id="mS"></span><button id="mR" style="border-bottom:1px solid #fff">Return</button></div>
  <nav id="rail" aria-label="Builds"></nav>
  <div id="bar">
    <span class="rec">Record <b id="rC"></b></span>
    <span id="prog"><i></i><i></i><i></i><i></i></span>
    <span id="acts"><button id="aStop" hidden>Stop</button><button id="aBack" hidden>Back</button><button id="aOpen">Open in tab ↗</button><button id="aExit">Exit</button></span>
  </div>
</section>

<script>
(function(){
'use strict';
var N=[
 {id:'film',    s:'FLM',c:'FLM-0021',t:'Director Film',h:'film.html',                       d:'49-second 1280x720 film of the 3D Horizontal 5-Ring Scroll Engine building the birthday cake, staging the 3 children, pulling DOF focus, and weaving spacetime mist.', i:'assets/cake/c5.jpg',a:6,r:11},
 {id:'stage',   s:'STG',c:'STG-0019',t:'Stage',       h:'stage.html',                        d:'Second screen. Pair the handheld orb: five rings, tilt, spread, a lens with real depth of field, a cake built from nothing.', i:'assets/bench/kids.webp',a:13,r:11},
 {id:'weaver',  s:'WVR',c:'WVR-0020',t:'Weaver',      h:'weaver.html',                       d:'Memory Weaver (3D Horizontal 5-Ring Scroll Engine): sculpt clay, pipe icing, stage the 3 children with 3D reticles & DOF focus, animate stop-motion, and weave into spacetime mist.', i:'assets/cake/c0.jpg',a:25,r:10},
 {id:'mist',    s:'MST',c:'MST-0020',t:'Mist',        h:'mist.html',                         d:'The birthday memory, kept by what it felt like. Hold to recall, slide to data.', i:'assets/sec_156.jpg',a:33,r:9},
 {id:'bench',   s:'BNC',c:'BNC-0000',t:'Bench',       h:'bench.html',                        d:'Film cut-outs of the people and trees, with 3D cakes and bugs. Pick one, turn it, hold the rest.', i:'assets/bench/kids.webp',a:41,r:11},
 {id:'studio',  s:'STU',c:'STU-0001',t:'Studio',      h:'studio.html',                       d:'Cake, bug eye, face and writing. The orb is the whole interface.', i:'assets/site/cakes.jpg',a:20, r:11},
 {id:'designs', s:'DSN',c:'DSN-0002',t:'Designs',     h:'designs.html',                      d:'Stelline Designs.',                                                i:'assets/depth_bugeye.png',a:52,r:7},
 {id:'cakeorb', s:'CKO',c:'CKO-0018',t:'Cake orb',    h:'cake-orb.html',                     d:'Every cake, bug and film reference, turned by three rings and one thumb.', i:'assets/shelf/cake_film_00.jpg',a:66,r:8},
 {id:'moments', s:'MOM',c:'MOM-0003',t:'Moments',     h:'moments.html',                      d:'Her hands on the orb, the change on screen and the reticle, read together.',                                                i:'assets/sec_141.jpg',a:82,r:7},
 {id:'cake',    s:'CAK',c:'CAK-0015',t:'The Cake',    h:'cake.html',                         d:'Blender\'s first lesson is a donut; the orb\'s first lesson is the cake.', i:'assets/cake/c0.jpg',a:104,r:8},
 {id:'orbv5',   s:'OV5',c:'ORB-0504',t:'Orb v5',      h:'hand-orb-v5.html',                  d:'Stelline Memory Orb, v5.',                                          i:'assets/sam_blowcandles.png',a:126,r:7},
 {id:'orb',     s:'ORB',c:'ORB-0405',t:'Hand orb',    h:'hand-orb.html',                     d:'Stelline Memory Orb.',                                              i:'assets/depth_clearing.png',a:146,r:6},
 {id:'proof',   s:'PRF',c:'PRF-0406',t:'Proof',       h:'hand-orb-proof.html',               d:'Hand Orb Proof.',                                                   i:'assets/depth_leaf.png',a:166,r:6},
 {id:'lot',     s:'L31',c:'LOT-0131',t:'Lot 131',     h:'stelline-memory-orb.html',          d:'Stelline Laboratories animatronic memory orb, lot 131.',            i:'assets/sec_026.jpg',a:196,r:8},
 {id:'mobile',  s:'MOB',c:'MOB-0008',t:'Mobile',      h:'mobile.html',                       d:'Stelline Laboratories memory orb, mobile.',                         i:'assets/sec_035.jpg',a:216,r:6},
 {id:'versions',s:'VER',c:'VER-0009',t:'Versions',    h:'versions.html',                     d:'All versions and the mobile archive.',                              i:'assets/depth_miniature.png',a:256,r:7},

 {id:'process', s:'PRC',c:'PRC-0011',t:'Process',     h:'process.html',                      d:'Case study: process and prompts.',                                  i:'assets/sec_153.jpg',a:304,r:6},

 {id:'orb05',   s:'F05',c:'ORB-0505',t:'Field Orb 05',h:'field-orb-05.html',                 d:'3D Horizontal 5-Ring Scroll Engine: 5 normal-mapped rings, 5 housing buttons, angled glass OLED, 28-tap DOF, and spacetime mist.',i:'assets/cake/c7.jpg',a:326,r:10},
 {id:'field',   s:'FLD',c:'FLD-0012',t:'Field orb',   h:'field-orb.html',                    d:'Hold and jog: independent layer clocks, live.',                     i:'assets/sec_146.jpg',a:338,r:8},
 {id:'ident',   s:'IDN',c:'IDN-0013',t:'Identity',    h:'identity.html',                     d:'The type, grid and colour rules.',                                  i:'',a:346,r:5},
 {id:'spec',    s:'SPC',c:'SPC-0014',t:'Specification',h:'docs/Vesper_Field_Orb_04_Patent_Specification.pdf',d:'Fictional patent specification, 14 pages.',                   i:'',a:2,r:5}
];
var CX=800,CY=600,R=490,NS='http://www.w3.org/2000/svg';
var $=function(s){return document.querySelector(s)},body=document.body;
function el(n,at,p){var e=document.createElementNS(NS,n);for(var k in at)e.setAttribute(k,at[k]);if(p)p.appendChild(e);return e}
function pos(a){var t=(a-90)*Math.PI/180;return [CX+R*Math.cos(t),CY+R*Math.sin(t)]}
/* persisted trace (recovery): visited nodes in order */
var trace=[],hist=[],cur=null,store=null;
try{store=window.localStorage;trace=JSON.parse(store.getItem('orb.trace')||'[]').filter(function(i){return N.some(function(n){return n.id===i})})}catch(e){trace=[]}
function save(){try{store&&store.setItem('orb.trace',JSON.stringify(trace))}catch(e){}}
function byId(i){return N.filter(function(n){return n.id===i})[0]}
/* rules: vertical hairlines, like the instrument's own frame */
[.395,.485,.505,.595,.62].forEach(function(x){el('line',{x1:x*1600,x2:x*1600,y1:-2400,y2:3600,'class':'rule'},$('#rules'))});
/* nodes */
var gN=$('#nodes');
N.forEach(function(n,ix){
  var p=pos(n.a);n.x=p[0];n.y=p[1];
  var g=el('g',{'class':'node',tabindex:0,role:'button','aria-label':n.t+'. '+n.d,'data-id':n.id,transform:'translate('+n.x+' '+n.y+')'},gN);
  el('circle',{r:Math.max(24,n.r*2.6),fill:'transparent'},g);el('circle',{'class':'halo',r:n.r*2.3},g);el('circle',{'class':'dot',r:n.r},g);
  var right=n.x>CX;var t=el('text',{x:right?n.r*2.3+14:-(n.r*2.3+14),y:5,'text-anchor':right?'start':'end'},g);t.textContent=n.c;
  n.g=g;
  g.addEventListener('mouseenter',function(){hover(n)});g.addEventListener('focus',function(){hover(n)});
  g.addEventListener('mouseleave',unhover);g.addEventListener('blur',unhover);
  g.addEventListener('click',function(){open(n.id)});
  g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open(n.id)}});
});
/* rail inside the frame: every build is one press away */
var rail=$('#rail');N.forEach(function(n){var b=document.createElement('button');b.textContent=n.s;b.title=n.t;b.setAttribute('data-id',n.id);b.setAttribute('aria-label',n.t);b.addEventListener('click',function(){open(n.id)});rail.appendChild(b)});
function paint(){
  N.forEach(function(n){n.g.classList.toggle('seen',trace.indexOf(n.id)>-1);n.g.classList.toggle('on',cur===n.id)});
  [].forEach.call(rail.children,function(b){var id=b.getAttribute('data-id');b.classList.toggle('seen',trace.indexOf(id)>-1);b.setAttribute('aria-current',cur===id)});
  $('#trail').setAttribute('points',trace.map(function(i){var n=byId(i);return n.x+','+n.y}).join(' '));
  var L=$('#lines');L.innerHTML='';
  if(hov||cur){var n=hov||byId(cur);el('line',{x1:CX,y1:CY,x2:n.x,y2:n.y,'class':'link'},L)}
}
/* card */
var hov=null,card=$('#card');
function hover(n){hov=n;var im=card.querySelector('img');im.style.display=n.i?'block':'none';if(n.i)im.src=n.i;card.querySelector('b').textContent=n.t;card.querySelector('span').textContent=n.d;
  var r=n.g.getBoundingClientRect(),w=240,h=card.offsetHeight||210;var x=r.left+r.width/2<innerWidth/2?r.right+18:r.left-w-18;x=Math.max(8,Math.min(innerWidth-w-8,x));var y=Math.max(52,Math.min(innerHeight-h-8,r.top+r.height/2-h/2));
  card.style.left=x+'px';card.style.top=y+'px';card.classList.add('show');$('#tO').textContent=n.c;paint()}
function unhover(){hov=null;card.classList.remove('show');$('#tO').textContent=cur?byId(cur).c:(trace.length?'Trace '+trace.length+'/'+N.length:'Select a node');paint()}
/* states */
function setS(s,label){body.dataset.s=s;$('#tS').innerHTML='<b>'+(label||s)+'</b>'}
var fr=$('#fr'),token=0,loadTimer=0;
function setProg(n){[].forEach.call($('#prog').children,function(i,ix){i.classList.toggle('on',ix<n)})}
function open(id,quiet){
  var n=byId(id);if(!n)return;var prev=cur;hov=null;card.classList.remove('show');
  var my=++token;cur=id;if(prev&&hist[hist.length-1]!==prev)hist.push(prev);
  $('#rC').textContent=n.c;$('#tO').textContent=n.c;$('#tN').textContent=String(N.indexOf(n)+1);
  var r=n.g.getBoundingClientRect();$('#frame').style.transformOrigin=(r.left+r.width/2)+'px '+(r.top+r.height/2)+'px';
  $('#aBack').hidden=!hist.length;$('#aStop').hidden=false;setProg(0);
  setS('working','Working');paint();
  location.replace('#'+id);
  var fail=function(why){if(my!==token)return;$('#aStop').hidden=true;setProg(0);$('#mT').textContent=n.c+' not loaded';$('#mS').textContent=why+' · trace kept';setS('fault','Fault')};
  var go=function(){
    fr.onload=function(){if(my!==token||fr.getAttribute('src')==='about:blank')return;clearTimeout(loadTimer);$('#aStop').hidden=true;setProg(4);
      if(trace.indexOf(id)<0)trace.push(id);save();
      setS(prev&&prev!==id&&!quiet?'changed':'ready',prev&&prev!==id&&!quiet?'Changed':'Ready');
      if(prev&&prev!==id&&!quiet){$('#tO').textContent=byId(prev).s+' → '+n.s;setTimeout(function(){if(my===token){setS('ready','Ready');$('#tO').textContent=n.c}},1600)}
      paint()};
    fr.src=n.h;clearTimeout(loadTimer);loadTimer=setTimeout(function(){fail('No response in 15 s')},15000);
  };
  /* is it there? same-origin check, skipped when the browser cannot ask (file://) */
  var ok=function(r){if(my!==token)return;r&&r.ok===false?fail('Not found ('+r.status+')'):go()};
  try{fetch(n.h,{method:'HEAD'}).then(ok,function(){if(my===token)go()})}catch(e){go()}
}
function stop(){token++;clearTimeout(loadTimer);fr.onload=null;fr.src='about:blank';$('#aStop').hidden=true;setProg(0);exit()}
function exit(){token++;clearTimeout(loadTimer);var was=cur;fr.onload=null;fr.src='about:blank';cur=null;hist=[];setS('rest','Rest');$('#tN').textContent='1';location.replace('#');unhover();
  var rb=$('#resume');if(was||trace.length){var last=was||trace[trace.length-1];rb.hidden=false;rb.textContent='Resume '+byId(last).c;rb.onclick=function(){open(last,true)}}paint()}
function back(){var p=hist.pop();if(p){cur=null;open(p)}}
$('#aStop').onclick=stop;$('#aExit').onclick=exit;$('#mR').onclick=exit;$('#aBack').onclick=back;
$('#aOpen').onclick=function(){var n=byId(cur);if(n)window.open(n.h,'_blank','noopener')};
addEventListener('keydown',function(e){if(e.key==='Escape'&&body.dataset.s!=='rest'){body.dataset.s==='working'?stop():exit()}});
/* boot: REST (or a deep link) */
var h=(location.hash||'').slice(1);
if(h&&byId(h))open(h,true);else{setS('rest','Rest');var l=trace[trace.length-1];if(l){var rb=$('#resume');rb.hidden=false;rb.textContent='Resume '+byId(l).c;rb.onclick=function(){open(l,true)}}paint()}
addEventListener('hashchange',function(){var i=(location.hash||'').slice(1);if(i&&byId(i)&&i!==cur)open(i,true)});
window.__machine={open:open,exit:exit,state:function(){return body.dataset.s}};
})();
</script>
