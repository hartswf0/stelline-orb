// WALLACE ARCHIVE MEMORY BEARING READER VIEW (TESTED VIDEO PART 1)
// ============================================================================
function renderWallaceBearingReader(ctx, w, h) {
  const cx = w * 0.5;
  const cy = h * 0.54;
  const br = state.bearingReader;

  ctx.fillStyle = '#151a21';
  ctx.strokeStyle = '#3a4654';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(cx - 270, cy - 122, 540, 244, 8);
  ctx.fill();
  ctx.stroke();

  const platX = cx - 102;
  const platY = cy;
  ctx.fillStyle = '#0b0e12';
  ctx.beginPath();
  ctx.arc(platX, platY, 86, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  const beamCols = { teal: '#38d9c0', amber: '#f0a848', white: '#e8f2ff' };
  const activeCol = beamCols[br.beamColor] || '#38d9c0';

  const missedIndices = new Set([3, 4, 11, 17, 18, 22]);
  for (let i = 0; i < 24; i++) {
    const rotIdx = (i + Math.floor(br.ledChasePhase)) % 24;
    const ang = (i / 24) * Math.PI * 2 + br.platterAngle * 0.3;
    const lx = platX + Math.cos(ang) * 72;
    const ly = platY + Math.sin(ang) * 72;
    const isMissed = missedIndices.has(rotIdx);

    ctx.fillStyle = isMissed ? '#1a2028' : activeCol;
    ctx.beginPath();
    ctx.arc(lx, ly, 3.4, 0, Math.PI * 2);
    ctx.fill();
  }

  const liftOffset = br.spindlePos * 38;
  ctx.strokeStyle = '#8fa0b2';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(platX, platY + 30);
  ctx.lineTo(platX, platY - liftOffset);
  ctx.stroke();

  const sphereY = platY - 12 - liftOffset;
  const sphereGrad = ctx.createRadialGradient(platX - 8, sphereY - 8, 3, platX, sphereY, 28);
  sphereGrad.addColorStop(0, '#ffffff');
  sphereGrad.addColorStop(0.35, activeCol);
  sphereGrad.addColorStop(1, 'rgba(10, 20, 30, 0.9)');
  ctx.fillStyle = sphereGrad;
  ctx.beginPath();
  ctx.arc(platX, sphereY, 27, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = activeCol;
  ctx.lineWidth = 1.4;
  ctx.stroke();

  registerHitbox('bearing_sphere', 'GLASS MEMORY BEARING SPHERE [CLICK TO ACTUATE 12V CAR-ANTENNA SPINDLE]', platX - 32, sphereY - 32, 64, 64,
    () => toggleBearingElevator()
  );

  const monX = cx + 18;
  const monY = cy - 82;
  ctx.fillStyle = '#091017';
  ctx.strokeStyle = activeCol;
  ctx.lineWidth = 1.4;
  ctx.fillRect(monX, monY, 224, 164);
  ctx.strokeRect(monX, monY, 224, 164);

  ctx.fillStyle = activeCol;
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('WALLACE BEARING READER // ARCHIVE', monX + 12, monY + 22);
  ctx.fillStyle = '#8fa0b2';
  ctx.font = '9px monospace';
  ctx.fillText(`SPINDLE ACTUATOR: ${br.spindleUp ? 'RAISED' : 'SEATED'}`, monX + 12, monY + 42);
  ctx.fillText(`OPTICAL FILTER: ${br.beamColor.toUpperCase()}`, monX + 12, monY + 58);
  ctx.fillText('LED RING: 24x RGB [MISSED-LIGHT CADENCE]', monX + 12, monY + 74);
  ctx.fillText(`ENGRAM ID: ${state.scene.toUpperCase()}-2049`, monX + 12, monY + 90);
  ctx.fillText('ACTUATOR: 12V CAR-ANTENNA WORM GEAR', monX + 12, monY + 106);
  ctx.fillStyle = '#f0a848';
  ctx.fillText('CLICK GLASS BEARING TO EJECT / INSERT', monX + 12, monY + 138);
}

// ============================================================================
// DIRECT POINTER / TOUCH INTERACTION & HOVER INSPECTION ON ORB CANVAS
// ============================================================================
orbCanvas.addEventListener('pointerdown', e => {
  ensureAudio();
  const rect = orbCanvas.getBoundingClientRect();
  const orbScale = getOrbLayoutScale(rect.width, rect.height);
  const baseCy = getOrbLayoutCenterY(rect.height);
  const rawX = e.clientX - rect.left;
  const rawY = e.clientY - rect.top;
  const x = (rawX - rect.width * 0.5) / orbScale + rect.width * 0.5;
  const y = (rawY - baseCy) / orbScale + baseCy;

  // 1. Check specific machined button / control hitboxes first (reverse order for top-most)
  for (let i = currentHitboxes.length - 1; i >= 0; i--) {
    const hb = currentHitboxes[i];
    if (x >= hb.x && x <= hb.x + hb.w && y >= hb.y && y <= hb.y + hb.h) {
      if (hb.onDown) {
        hb.onDown(x, y, e);
        state.drag.activeHitbox = hb;
        orbCanvas.setPointerCapture(e.pointerId);
        return;
      }
    }
  }

  // 2. Check if user grabbed one of the 5 center rings (drag vertically to spin ring)
  const cx = rect.width * 0.5 + state.tiltX * 9;
  const spreadPx = state.accordionSpread * 84;
  const ringOffsets = [
    -74 - spreadPx * 0.36,
    -38 - spreadPx * 0.17,
      0,
     37 + spreadPx * 0.17,
     74 + spreadPx * 0.36
  ];
  for (let i = 0; i < 5; i++) {
    const rx = cx + ringOffsets[i];
    if (Math.abs(x - rx) < 21) {
      state.drag.active = true;
      state.drag.mode = 'ring';
      state.drag.ringIndex = i;
      state.drag.startY = y;
      state.drag.startVal = state.rings[i].angle;
      orbCanvas.setPointerCapture(e.pointerId);
      playDetentTick(i, 1.0);
      return;
    }
  }

  // 3. Otherwise dragging outer left/right hand pods expands/contracts the accordion!
  state.drag.active = true;
  state.drag.mode = 'accordion';
  state.drag.startX = x;
  state.drag.startVal = state.accordionTarget * 100;
  orbCanvas.setPointerCapture(e.pointerId);
});

orbCanvas.addEventListener('pointermove', e => {
  const rect = orbCanvas.getBoundingClientRect();
  const orbScale = getOrbLayoutScale(rect.width, rect.height);
  const baseCy = getOrbLayoutCenterY(rect.height);
  const rawX = e.clientX - rect.left;
  const rawY = e.clientY - rect.top;
  const x = (rawX - rect.width * 0.5) / orbScale + rect.width * 0.5;
  const y = (rawY - baseCy) / orbScale + baseCy;

  // Update bimanual wrist tilt target from cursor position
  state.targetTiltX = ((x / rect.width) - 0.5) * 1.4;
  state.targetTiltY = ((y / rect.height) - 0.5) * 1.4;

  // Hover part inspection
  let foundHover = null;
  for (let i = currentHitboxes.length - 1; i >= 0; i--) {
    const hb = currentHitboxes[i];
    if (x >= hb.x && x <= hb.x + hb.w && y >= hb.y && y <= hb.y + hb.h) {
      foundHover = hb;
      break;
    }
  }
  state.hoveredHitbox = foundHover;
  const hoverEl = document.getElementById('hoverPartReadout');
  if (hoverEl) {
    hoverEl.textContent = foundHover
      ? foundHover.label
      : 'OUTER BEAD-BLASTED 6061 ALUMINUM PODS [DRAG HORIZONTALLY TO SPREAD CALLIOPE]';
  }

  if (!state.drag.active) return;

  if (state.drag.mode === 'ring') {
    const dy = y - state.drag.startY;
    state.rings[state.drag.ringIndex].vel = (dy * 0.12);
    setRingAngle(state.drag.ringIndex, state.drag.startVal + dy * 1.35, true);
  } else if (state.drag.mode === 'accordion') {
    const cx = rect.width * 0.5;
    const dir = x >= cx ? 1 : -1;
    const dx = (x - state.drag.startX) * dir;
    setAccordionSpread(state.drag.startVal + dx * 0.62, true);
  } else if (state.drag.mode === 'dome') {
    const dy = state.drag.startY - y;
    setSpeedDome(state.drag.startVal + dy * 0.018);
  } else if (state.drag.mode === 'jog') {
    const dy = y - state.drag.startY;
    state.jogWheelPhase = Math.abs(dy);
    setRingAngle(2, state.drag.startVal + dy * 0.9, true);
  }
});

function handleOrbPointerUp() {
  if (state.drag.activeHitbox && state.drag.activeHitbox.onUp) {
    state.drag.activeHitbox.onUp();
  }
  state.drag.activeHitbox = null;
  state.drag.active = false;
}

orbCanvas.addEventListener('pointerup', handleOrbPointerUp);
orbCanvas.addEventListener('pointercancel', handleOrbPointerUp);

holoCanvas.addEventListener('pointerdown', e => {
  ensureAudio();
  state.cam3D.dragging = true;
  state.cam3D.lastX = e.clientX;
  state.cam3D.lastY = e.clientY;
  holoCanvas.setPointerCapture(e.pointerId);
});

holoCanvas.addEventListener('pointermove', e => {
  if (!state.cam3D.dragging) return;
  const dx = e.clientX - state.cam3D.lastX;
  const dy = e.clientY - state.cam3D.lastY;
  state.cam3D.lastX = e.clientX;
  state.cam3D.lastY = e.clientY;
  state.cam3D.yaw += dx * 0.0085;
  state.cam3D.pitch = Math.max(-1.15, Math.min(1.15, state.cam3D.pitch + dy * 0.0075));
});

holoCanvas.addEventListener('pointerup', () => { state.cam3D.dragging = false; });
holoCanvas.addEventListener('pointercancel', () => { state.cam3D.dragging = false; });

holoCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  state.cam3D.dist = Math.max(175, Math.min(580, state.cam3D.dist + e.deltaY * 0.35));
}, { passive: false });

// Also allow mouse wheel directly on the 5 Orb rings to rotate them smoothly!
orbCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  ensureAudio();
  const rect = orbCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const cx = rect.width * 0.5 + state.tiltX * 9;
  const spreadPx = state.accordionSpread * 84;
  const ringOffsets = [-74 - spreadPx * 0.36, -38 - spreadPx * 0.17, 0, 37 + spreadPx * 0.17, 74 + spreadPx * 0.36];
  for (let i = 0; i < 5; i++) {
    if (Math.abs(x - (cx + ringOffsets[i])) < 22) {
      state.userHoldTimer = 3.5;
      setRingAngle(i, state.rings[i].angle + e.deltaY * 0.25, true);
      return;
    }
  }
  state.userHoldTimer = 3.5;
  setAccordionSpread(state.accordionTarget * 100 + e.deltaY * 0.12, true);
}, { passive: false });

// ============================================================================
// MAIN 60FPS ANIMATRONIC, SPRING-MASS-DAMPER & VOLUMETRIC SIMULATION LOOP
// ============================================================================
function tick() {
  state.time += 0.016;

  // 1. Bimanual 1.42 kg Wrist Tilt Inertia (heavy damped low-pass filter)
  state.tiltX += (state.targetTiltX - state.tiltX) * 0.08;
  state.tiltY += (state.targetTiltY - state.tiltY) * 0.08;

  // 2. Dual Rack-and-Pinion Calliope Spring-Mass-Damper Physics
  const spreadForce = (state.accordionTarget - state.accordionSpread) * 0.18;
  state.accordionVel = (state.accordionVel + spreadForce) * 0.76;
  state.accordionSpread += state.accordionVel;

  // Trigger brass rack-and-pinion tooth clicks as the calliope slides
  const currentTooth = Math.floor(state.accordionSpread * 65);
  if (currentTooth !== state.lastRackTooth) {
    const atEnd = (currentTooth <= 0 || currentTooth >= 65);
    playRackPinionTooth(atEnd);
    state.lastRackTooth = currentTooth;
  }

  let totalTorque = 0;

  if (state.powerOn) {
    let activeMotors = 0;

    if (state.autoDance) {
      const t = state.time;
      setAccordionSpread(46 + Math.sin(t * 0.85) * 34, true);
      state.rings.forEach((r, idx) => {
        const dir = idx % 2 === 0 ? 1 : -1;
        r.vel = dir * (0.65 + idx * 0.22) * state.speedDome;
      });
      activeMotors = 5;
    }

    // 3. Process 5 Concentric Ring Rotor Inertia & Spur-Gear Momentum
    state.rings.forEach((r, idx) => {
      if (r.motorDir !== 0) {
        const targetVel = r.motorDir * (2.6 * state.speedDome) * (state.batteryVolts / 9.0);
        r.vel += (targetVel - r.vel) * 0.16; // Rotor spin-up inertia
        activeMotors++;
      } else {
        r.vel *= 0.91; // Gear-train coast-down friction
      }
      if (Math.abs(r.vel) > 0.015) {
        setRingAngle(idx, r.angle + r.vel, r.motorDir === 0 && Math.abs(r.vel) > 0.35);
        totalTorque += Math.abs(r.vel) * 1.8;
      }
    });

    // Update continuous 5-motor Web Audio synthesizer
    updateContinuousMotorAudio();

    if (activeMotors > 0) {
      state.batteryVolts = Math.max(7.1, state.batteryVolts - activeMotors * 0.00018);
      if (Math.floor(state.time * 30) % 15 === 0) updateBatteryUI();
    }

    // Update Wallace Archive Bearing Reader animation
    const targetSpindle = state.bearingReader.spindleUp ? 1.0 : 0.0;
    state.bearingReader.spindlePos += (targetSpindle - state.bearingReader.spindlePos) * 0.12;
    if (state.bearingReader.platterSpin) {
      state.bearingReader.platterAngle += 0.04;
      state.bearingReader.ledChasePhase = (state.bearingReader.ledChasePhase + 0.22) % 24;
    }
  } else {
    updateContinuousMotorAudio();
  }

  // Update live kinetic / inertial gauge in Left Column
  const kinEl = document.getElementById('kineticReadout');
  if (kinEl) {
    const rackForceN = (Math.abs(state.accordionVel) * 420).toFixed(1);
    const tiltDeg = (Math.hypot(state.tiltX, state.tiltY) * 6.5).toFixed(1);
    kinEl.innerHTML = `TORQUE: ${totalTorque.toFixed(1)} N·cm · RACK: ${rackForceN} N<br>DETENT: ${totalTorque > 0.2 ? 'ROTATING' : 'LOCKED'} · TILT: ${tiltDeg}°`;
  }

  updateInverseWeaveSequencer();
  if (state.engineVersion === 'v1') {
    const wgl = document.getElementById('webglCanvas');
    if (wgl && wgl.style.display !== 'none') wgl.style.display = 'none';
    renderHologramChamber();
  } else if (typeof window.renderStellineWebGLScene === 'function') {
    const wgl = document.getElementById('webglCanvas');
    if (wgl && wgl.style.display === 'none') wgl.style.display = 'block';
    window.renderStellineWebGLScene(state, holoCanvas, holoCtx);
  } else {
    renderHologramChamber();
  }
  renderOrbHardware();
  if (Math.floor(state.time * 60) % 6 === 0) syncMobileDockUI();
  requestAnimationFrame(tick);
}

window.state = state;
window.setRingAngle = setRingAngle;
window.setAccordionSpread = setAccordionSpread;
window.addEventListener('DOMContentLoaded', () => {
  resizeCanvases();
  const params = new URLSearchParams(window.location.search);
  const engParam = params.get('engine');
  if (engParam) cycleEngineVersion(engParam.toLowerCase());
  if (params.get('mobile') === '1') document.body.classList.add('force-mobile');
  const r0 = params.get('r0') ?? params.get('a1');
  const r1 = params.get('r1') ?? params.get('a2');
  const r2 = params.get('r2') ?? params.get('a3');
  const r3 = params.get('r3') ?? params.get('a4');
  const r4 = params.get('r4') ?? params.get('a5');
  const spreadP = params.get('spread');
  const xrayP = params.get('xray');
  if (params.get('static') === '1') {
    state.staticMode = true;
    state.liveModeling = false;
  } else if (r0 !== null || r1 !== null || r2 !== null || r3 !== null || r4 !== null || spreadP !== null) {
    state.liveModeling = false;
    state.userHoldTimer = 12.0;
  }
  const protoParam = params.get('protocol');
  const stepParam = params.get('step');
  const otherwiseParam = params.get('otherwise');
  if (protoParam) {
    activateOperatorProtocol(protoParam, stepParam !== null ? parseInt(stepParam, 10) : 0, true);
    state.liveModeling = false;
    state.userHoldTimer = 12.0;
  }
  const shotParam = params.get('shot');
  if (shotParam && SHOT_CONFIGS[shotParam]) {
    selectFilmShot(shotParam);
    if (r0 !== null || r1 !== null || r2 !== null || r3 !== null || r4 !== null || spreadP !== null || otherwiseParam !== null) {
      state.liveModeling = false;
      state.userHoldTimer = 12.0;
    }
  }
  if (otherwiseParam !== null) {
    const pKey = protoParam || (state.scene === 'birthday' ? 'cake' : 'bug');
    cycleOtherwiseVariant(pKey, parseInt(otherwiseParam, 10));
  }
  const nodeParam = params.get('node');
  if (nodeParam !== null && typeof window.selectSceneObject === 'function') {
    window.selectSceneObject(parseInt(nodeParam, 10) || 0);
  }
  const tParam = params.get('t');
  if (tParam !== null) {
    state.shotTime = parseFloat(tParam);
    state.time = parseFloat(tParam);
  }
  if (r0 !== null) setRingAngle(0, parseFloat(r0), false);
  if (r1 !== null) setRingAngle(1, parseFloat(r1), false);
  if (r2 !== null) setRingAngle(2, parseFloat(r2), false);
  if (r3 !== null) setRingAngle(3, parseFloat(r3), false);
  if (r4 !== null) setRingAngle(4, parseFloat(r4), false);
  if (spreadP !== null) setAccordionSpread(parseFloat(spreadP), false);
  if (xrayP === '1') state.renderMode = 'xray';
  renderOperatorProtocolUI();
  updateTelemetryUI();
  updateBatteryUI();
  requestAnimationFrame(tick);
});
</script>
