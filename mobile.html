<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STELLINE MEMORY ORB // MOBILE TOUCH EDITION</title>
<style>
  :root {
    --bg-void: #05070a;
    --accent-teal: #38d9c0;
    --accent-amber: #f0a848;
    --text-main: #d8e2ec;
    --text-muted: #6e8094;
    --font-mono: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg-void);
    color: var(--text-main);
    font-family: var(--font-mono);
  }

  .studio-viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: radial-gradient(circle at 50% 52%, #131d27 0%, #05070a 80%);
  }

  .hologram-stage {
    position: relative;
    width: 100%;
    height: 58vh;
    overflow: hidden;
    background: #040608;
  }

  #webglCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }

  #hologramCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
    z-index: 2;
  }

  .orb-stage {
    position: relative;
    width: 100%;
    height: 42vh;
    min-height: 230px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 35%, rgba(28, 38, 50, 0.55) 0%, rgba(5, 7, 10, 0.95) 80%);
  }

  #orbCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }

  #orbCanvas:active {
    cursor: grabbing;
  }

  /* Minimal floating corner controls — zero clutter */
  .minimal-corner {
    position: fixed;
    top: 14px;
    left: 16px;
    display: flex;
    gap: 6px;
    z-index: 20;
    opacity: 0.45;
    transition: opacity 0.2s ease;
  }

  .minimal-corner:hover {
    opacity: 1;
  }

  .pill-btn {
    background: rgba(10, 15, 22, 0.75);
    border: 1px solid rgba(110, 128, 148, 0.35);
    color: var(--text-muted);
    padding: 4px 9px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: all 0.15s ease;
  }

  .pill-btn:hover {
    color: var(--text-main);
    border-color: rgba(216, 226, 236, 0.65);
  }

  .pill-btn.active {
    color: var(--accent-teal);
    border-color: var(--accent-teal);
    background: rgba(56, 217, 192, 0.12);
  }

  .pill-btn.amber {
    color: var(--accent-amber);
    border-color: rgba(240, 168, 72, 0.5);
  }

  .pill-btn.amber.active {
    background: rgba(240, 168, 72, 0.2);
    color: #fff;
  }

  .minimal-sep {
    width: 1px;
    background: rgba(110, 128, 148, 0.25);
    margin: 0 2px;
    flex-shrink: 0;
  }

  .mobile-thumb-dock {
    display: none;
    position: absolute;
    bottom: 6px;
    left: 8px;
    right: 8px;
    z-index: 18;
    background: rgba(6, 10, 15, 0.86);
    border: 1px solid rgba(56, 217, 192, 0.32);
    padding: 6px 8px;
    backdrop-filter: blur(8px);
    flex-direction: column;
    gap: 5px;
  }

  body.force-mobile .mobile-thumb-dock {
    display: flex;
  }

  .mobile-sam-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
  }

  .mobile-dial-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
  }

  .mobile-dial-slider {
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: rgba(16, 24, 34, 0.85);
    border: 1px solid rgba(110, 128, 148, 0.35);
    padding: 3px 5px;
  }

  .mobile-dial-slider input[type="range"] {
    width: 100%;
    accent-color: var(--accent-teal);
    height: 16px;
    margin: 0;
  }

  @media (max-width: 820px) {
    .minimal-corner {
      top: 6px;
      left: 6px;
      right: 6px;
      max-width: calc(100vw - 12px) !important;
      opacity: 0.94;
    }
    .minimal-corner > div {
      flex-wrap: nowrap !important;
      overflow-x: auto;
      max-width: 100%;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .minimal-corner > div::-webkit-scrollbar {
      display: none;
    }
    .pill-btn {
      flex-shrink: 0;
      padding: 5px 8px;
      font-size: 9.5px;
    }
    .hologram-stage {
      height: 54vh;
    }
    .orb-stage {
      height: 46vh;
      min-height: 210px;
      align-items: flex-start;
      padding-top: 4px;
    }
    .mobile-thumb-dock {
      display: flex;
    }
  }
</style>

<script>
// ============================================================================
// STELLINE LABORATORIES // ANIMATRONIC MEMORY ORB & HOLOGRAPHIC DOME ENGINE
// Complete physical mass, micro-finish, exact button topology & 8-layer sound
// ============================================================================

const FOCAL_STOPS = [10, 18, 28, 35, 50, 70, 100, 135, 200, 220, 255, 300];
const CAM_NAMES = ['CAM-L2 [-70°]', 'CAM-L1 [-35°]', 'CAM-MASTER [0° DEAKINS]', 'CAM-R1 [+35°]', 'CAM-R2 [+70°]'];

const SCENE_QUOTES = {
  beetle: '"Do you mind if I work while you talk? I promise I hear every word." — Dr. Ana Stelline',
  birthday: '"They say you\'re the best memory maker there is." / "Well, they\'re kind. I love birthday parties."',
  horse: '"They all think it\'s about more detail. That\'s not how memory works. We recall with our feelings. Anything real should be a mess."',
  snow: '"I was locked in a sterile chamber all day, so if I wanted to see the world I had to imagine it. I got very good at imagining."'
};

const state = {
  engineVersion: 'v4',
  viewMode: 'sculpt',
  scene: 'beetle',
  powerOn: true,
  batteryVolts: 9.04,
  audioEnabled: true,
  autoDance: false,
  neckClaspOpen: true,
  savageWindowLight: false,

  // Spring-mass-damper physical state for the 1.42 kg CNC aluminum assembly
  accordionTarget: 0.32,
  accordionSpread: 0.32,
  accordionVel: 0,
  lastRackTooth: 32,

  // Bimanual hand weight & gyroscopic wrist tilt
  tiltX: 0,
  tiltY: 0,
  targetTiltX: 0,
  targetTiltY: 0,

  speedDome: 1.0,
  jogWheelPhase: 0,
  cameraStation: 2,
  targetOffset: { x: 0, y: 0 },
  imprintFlash: 0,
  activeDpadDir: null,
  pressedOnPropBtn: null,
  hoveredHitbox: null,

  // 5 Concentric Motorized Rings with authentic rotor inertia & detent tracking
  rings: [
    { angle: 72,  vel: 0, motorDir: 0, lastDetent: 7,  baseFreq: 285, ratio: 1.00 },
    { angle: 140, vel: 0, motorDir: 0, lastDetent: 14, baseFreq: 332, ratio: 1.18 },
    { angle: 180, vel: 0, motorDir: 0, lastDetent: 18, baseFreq: 418, ratio: 1.42 },
    { angle: 230, vel: 0, motorDir: 0, lastDetent: 23, baseFreq: 364, ratio: 1.25 },
    { angle: 110, vel: 0, motorDir: 0, lastDetent: 11, baseFreq: 308, ratio: 1.08 }
  ],

  // Wallace Archive Memory Bearing Reader state
  bearingReader: {
    spindleUp: false,
    spindlePos: 0.0,
    platterSpin: true,
    platterAngle: 0,
    beamColor: 'teal',
    ledChasePhase: 0
  },

  drag: {
    active: false,
    mode: null, // 'ring' | 'accordion' | 'dome' | 'jog' | 'button'
    ringIndex: -1,
    startX: 0,
    startY: 0,
    startVal: 0
  },

  time: 0
};

// Pre-generate bead-blasted micro-grain points for the outer aluminum grip shells
const BEAD_GRAIN_POINTS = Array.from({ length: 420 }, () => ({
  rx: Math.random(),
  ry: Math.random(),
  alpha: 0.04 + Math.random() * 0.14,
  bright: Math.random() > 0.5
}));

// ============================================================================
// PHYSICAL MODELING & DIEGETIC BLADE RUNNER 2049 SOUND ENGINE
// Inspired by Mark Mangini, Theo Green & Ron Bartlett's Stelline Dome Mix
// Uses short noise-burst impulse responses, damped modal resonators,
// lubricated helicoid friction, and whisper-quiet coreless DC motor purr.
// ============================================================================
let audioCtx = null;
let noiseBuffer = null;
let motorAudioNodes = [null, null, null, null, null];
let ambientNode = null;

function ensureAudio() {
  if (!state.audioEnabled) return null;
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      audioCtx = new AC();
      // Create reusable 2-second pink/white noise buffer for physical impulse modeling
      const sr = audioCtx.sampleRate;
      noiseBuffer = audioCtx.createBuffer(1, sr * 2, sr);
      const data = noiseBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < data.length; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.04;
        b6 = white * 0.115926;
      }
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function setAcousticReadout(msg) {
  const el = document.getElementById('activeSoundReadout');
  if (el) el.textContent = `ACOUSTIC BUS: ${msg}`;
}

// ============================================================================
// TRANSIENT-ONLY MECHANICAL FOLEY ENGINE (ZERO OSCILLATOR DRONES / ZERO SYNTH PADS)
// Only crisp, quiet, ultra-short (3ms-5ms) filtered noise micro-clicks when a
// physical ring crosses a detent or a switch is pressed — never a continuous drone.
// ============================================================================
let lastDetentClickTime = 0;

function stopAllLegacyOscillators() {
  for (let i = 0; i < motorAudioNodes.length; i++) {
    const node = motorAudioNodes[i];
    if (node) {
      try { node.subOsc && node.subOsc.stop(); } catch (e) {}
      try { node.harmonicOsc && node.harmonicOsc.stop(); } catch (e) {}
      try { node.noiseSrc && node.noiseSrc.stop(); } catch (e) {}
      try { node.masterGain && node.masterGain.disconnect(); } catch (e) {}
      motorAudioNodes[i] = null;
    }
  }
}

// 1. Silent motor state tracker (zero continuous oscillator drone)
function updateContinuousMotorAudio() {
  stopAllLegacyOscillators();
}

// 2. Precision Machined Micro-Switch Click (Sub-4ms filtered noise transient only, zero oscillators)
function playMicroSwitchClick(isDown = true, pitchOffset = 0) {
  const ctx = ensureAudio();
  if (!ctx || !noiseBuffer) return;
  try {
    const now = ctx.currentTime;
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = (isDown ? 2600 : 1950) + pitchOffset;
    bp.Q.value = 4.5;

    const clickGain = ctx.createGain();
    clickGain.gain.setValueAtTime(isDown ? 0.045 : 0.025, now);
    clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.005);

    noise.connect(bp);
    bp.connect(clickGain);
    clickGain.connect(ctx.destination);

    noise.start(now, Math.random() * 0.5, 0.006);
    setAcousticReadout(isDown ? 'TACTILE MICRO-SWITCH ACTUATION' : 'MICRO-SWITCH RELEASE');
  } catch (e) {}
}

// 3. Cinema Lens Ball-Bearing Aperture Detent Tick (Rate-limited 3.5ms noise impulse, zero oscillators)
function playDetentTick(ringIdx = 0, vel = 1.0) {
  const perfNow = performance.now();
  if (perfNow - lastDetentClickTime < 55) return; // Rate-limit so auto-animation never buzzes
  lastDetentClickTime = perfNow;

  const ctx = ensureAudio();
  if (!ctx || !noiseBuffer) return;
  try {
    const now = ctx.currentTime;
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1850 + ringIdx * 160;
    bp.Q.value = 5.5;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.032, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.0045);

    noise.connect(bp);
    bp.connect(gain);
    gain.connect(ctx.destination);

    noise.start(now, Math.random() * 0.8, 0.005);
    setAcousticReadout(`LENS BALL-DETENT CLICK [RING 0${ringIdx + 1}]`);
  } catch (e) {}
}

// 4. Dual Rack-and-Pinion Lubricated Brass Tooth Slide (Ultra-quiet transient only)
function playRackPinionTooth(isEndStop = false) {
  const perfNow = performance.now();
  if (perfNow - lastDetentClickTime < 65) return;
  lastDetentClickTime = perfNow;

  const ctx = ensureAudio();
  if (!ctx || !noiseBuffer) return;
  try {
    const now = ctx.currentTime;
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;
    const lp = ctx.createBiquadFilter();
    lp.type = 'bandpass';
    lp.frequency.value = isEndStop ? 620 : (1100 + state.accordionSpread * 320);
    lp.Q.value = 4.2;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(isEndStop ? 0.04 : 0.022, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.005);

    noise.connect(lp);
    lp.connect(gain);
    gain.connect(ctx.destination);
    noise.start(now, Math.random() * 0.7, 0.006);
  } catch (e) {}
}

function playLatchClunk() {
  playMicroSwitchClick(true, -350);
}

// 5. Top Butterfly Neck-Strap Clasp Precision Spring-Latch
function playButterflyClaspClack(deploying = true) {
  playMicroSwitchClick(deploying, -120);
}

// 6. Wallace Archive Spindle Elevator (Discrete switch click, zero motor hum drone)
function playCarAntennaActuator(raising = true) {
  playMicroSwitchClick(raising, -180);
}

// 7. Silent Harmonic Marker (No synth chord drone)
function playChordChime() {
  stopAllLegacyOscillators();
}

// ============================================================================
// UI & HARDWARE CONTROL HANDLERS
// ============================================================================
function setViewMode(mode) {
  state.viewMode = mode;
  const xBtn = document.getElementById('xrayBtn');
  const bBtn = document.getElementById('bearingBtn');
  if (xBtn) xBtn.classList.toggle('active', mode === 'xray');
  if (bBtn) bBtn.classList.toggle('active', mode === 'bearing');
  playMicroSwitchClick(true, 120);
}

state.activeShot = 'bugeye';
state.selectedNodeIdx = 0;
state.bundtMorph = 0.0; // 0 = classic cylinder cake, 1 = tall scalloped bundt dome with 2 candles (Screenshot 3)
state.domeDissolve = 0.0;

  selectSceneObject(st.node, true);
  st.rings.forEach((ang, rIdx) => setRingAngle(rIdx, ang, false));

  renderOperatorProtocolUI();

function setRingAngle(idx, deg, playClick = false) {
  const norm = ((parseFloat(deg) % 360) + 360) % 360;
  const ring = state.rings[idx];
  ring.angle = norm;
  state.activeCoupledRing = idx;

  // Store this dial adjustment into the currently selected SAM object's 5-dial parameter state!
  if (!state._syncingNode) {
    const shot = state.activeShot || 'bugeye';
    const params = ensureObjectParams(shot);
    const selIdx = ((state.selectedNodeIdx || 0) % 4 + 4) % 4;
    if (params[selIdx]) {
      params[selIdx][idx] = norm;
    }
  }

  const detentBucket = Math.floor(norm / 9);
  if (detentBucket !== ring.lastDetent) {
    ring.lastDetent = detentBucket;
    if (playClick) playDetentTick(idx, ring.vel || 1.2);
  }
}

function startMotorSpin(idx, dir) {
  playMicroSwitchClick(true, idx * 90);

  state.rings[idx].motorDir = dir;

  if (state.rings[idx].motorDir !== 0) {

function smoothEase(x) {
  const c = Math.max(0, Math.min(1, x));
  return c * c * (3 - 2 * c);
}

function lerpNum(a, b, t) {
  return a + (b - a) * smoothEase(t);
}

// ============================================================================
// REAL-TIME FILM MODELING CHOREOGRAPHY SEQUENCER (TIME-DRIVEN 3D CONSTRUCTION)
// Animates the physical Orb rings AND the 3D scene modeling operations over time
// for every shot, matching Stelline's hand-sculpting gestures in the film.
// ============================================================================
function updateInverseWeaveSequencer() {
  if (state.staticMode) return;
  if (state.drag.active) {
    state.userHoldTimer = 3.5;
    return;
  }
  if (state.userHoldTimer > 0) {
    state.userHoldTimer = Math.max(0, state.userHoldTimer - 0.016);
    return;
  }
  if (!state.liveModeling) {
    state.inverseWeave.activeRingIdx = -1;
    return;
  }

  const dt = 0.016 * state.speedDome;
  state.shotTime += dt;
  const cycleDur = 6.5;

  // If WEAVE SEQUENCE is active, automatically step through all film shots chronologically!
  if (state.inverseWeave.active && state.shotTime >= cycleDur) {
    const curIdx = FILM_SHOT_SEQUENCE.indexOf(state.activeShot);
    const nextKey = FILM_SHOT_SEQUENCE[(curIdx + 1) % FILM_SHOT_SEQUENCE.length];
    selectFilmShot(nextKey, true);
    return;
  }

  const p = (state.shotTime % cycleDur) / cycleDur;
  const shot = state.activeShot || 'bugeye';
  const iw = state.inverseWeave;

  if (shot === 'bugeye') {
    // 00:31 -> 00:35 BUG EYE MACRO (5 Consecutive Film Keyframes: sec_031..sec_035):
    // Phase 0 (0..0.05): Lock 3D Chitin Subsurface Relief (L1: 85 -> 165)
    // Phase 1 (0.05..0.72): Sweep Right Compound Eye Focus -> Sprout Setae -> Rack Focus to Left Eye (sec_031 -> sec_035)
    // Phase 2 (0.72..1.00): Hold Left-Eye Macro Focus Climax (sec_035)
    if (p < 0.05) {
      iw.activeRingIdx = 0;
      setRingAngle(0, lerpNum(85, 165, p / 0.05), true);
      setRingAngle(1, 75, false);
      setRingAngle(2, 102, false);
      state.selectedNodeIdx = 0;
    } else if (p < 0.72) {
      const u = (p - 0.05) / 0.67;
      iw.activeRingIdx = u < 0.35 ? 1 : (u < 0.72 ? 2 : 1);
      setRingAngle(0, 165, false);
      setRingAngle(1, lerpNum(75, 192, u), true);
      setRingAngle(2, lerpNum(102, 176, u), true);
      state.selectedNodeIdx = u < 0.34 ? 1 : (u < 0.70 ? 2 : 3);
    } else {
      iw.activeRingIdx = 1;
      setRingAngle(0, 165, false);
      setRingAngle(1, 192, false);
      setRingAngle(2, 176, false);
      state.selectedNodeIdx = 3;
    }
  }
  else if (shot === 'leaf') {
    // 00:25 -> 00:28 WET LEAF & SCARAB WALK (sec_025 -> sec_028):
    if (p < 0.05) {
      iw.activeRingIdx = 0;
      setRingAngle(0, lerpNum(85, 165, p / 0.05), true);
      setRingAngle(1, 142, false);
      setRingAngle(3, 135, false);
      state.selectedNodeIdx = 0;
    } else if (p < 0.72) {
      iw.activeRingIdx = 3;
      const u = (p - 0.05) / 0.67;
      setRingAngle(0, 165, false);
      setRingAngle(1, lerpNum(142, 168, u), false);
      setRingAngle(3, lerpNum(135, 210, u), true);
      state.selectedNodeIdx = u < 0.25 ? 1 : 2;
    } else {
      iw.activeRingIdx = 3;
      setRingAngle(0, 165, false);
      setRingAngle(1, 168, false);
      setRingAngle(3, 210, false);
      state.selectedNodeIdx = 2;
    }
  }
  else if (shot === 'canopy') {
    iw.activeRingIdx = 1;
    setRingAngle(0, lerpNum(45, 160, Math.min(1, p * 2.5)), false);

  }
  else if (shot === 'clearing') {
    iw.activeRingIdx = 3;
    setRingAngle(0, 165, false);
    setAccordionSpread(lerpNum(5, 78, Math.sin(p * Math.PI * 0.85)), true);
  }
  else if (shot === 'cakespawn') {
    // 02:17 -> 02:21 CAKE SPAWN (sec_138 [3 Candles + Smarties] -> ref_0217 [7 Candles + Smarties] -> sec_141 [7 Candles, Smarties Cleared]):
    state.bundtMorph = 0.0;

      setRingAngle(1, 45, false);

    } else if (p < 0.72) {
      iw.activeRingIdx = 1;
      const u = (p - 0.05) / 0.67;
      setRingAngle(0, 165, false);
      setRingAngle(1, lerpNum(45, 150, u), true);

// ============================================================================
// DIEGETIC TRANSLUCENT RADIAL C-ARC MENU OVERLAYS (Screenshots 2, 3, 4, 5)
// ============================================================================
function drawDiegeticRadialArcMenu(ctx, x, y, radius, rotRad, activeSector, numSectors, scale, flipLeft, showTelemetry) {
  ctx.save();
  ctx.translate(x, y);
  const r = radius * scale;
  const innerR = r * 0.68;
  const midR = r * 0.88;
  const outerR = r * 1.02;

  // Base C-arc span (approx 210 deg open on one side, matching Screenshots 2, 3, 4)
  const startBase = flipLeft ? Math.PI * 0.42 : -Math.PI * 0.58;
  const totalSpan = Math.PI * 1.16;
  const gap = 0.04;
  const segSpan = (totalSpan - gap * (numSectors - 1)) / numSectors;

  // 1. Segmented translucent white-cyan radial C-sectors
  for (let s = 0; s < numSectors; s++) {
    const a0 = startBase + s * (segSpan + gap) + rotRad * 0.25;
    const a1 = a0 + segSpan;
    const isAct = (s === (activeSector % numSectors));
    const fillAlpha = isAct ? 0.46 : (0.11 + (s % 2) * 0.06);

    ctx.fillStyle = `rgba(210, 238, 245, ${fillAlpha})`;
    ctx.beginPath();
    ctx.arc(0, 0, midR, a0, a1);
    ctx.arc(0, 0, innerR, a1, a0, true);
    ctx.closePath();
    ctx.fill();

    // Bright highlight sub-wedge inside active sector (Screenshot 4)
    if (isAct) {
      const midA = (a0 + a1) * 0.5;
      ctx.fillStyle = 'rgba(240, 252, 255, 0.78)';
      ctx.beginPath();
      ctx.arc(0, 0, midR * 0.98, midA - segSpan * 0.18, midA + segSpan * 0.18);
      ctx.arc(0, 0, innerR * 1.04, midA + segSpan * 0.18, midA - segSpan * 0.18, true);
      ctx.closePath();
      ctx.fill();
    }
  }

  // 2. Crisp thin inner & outer concentric C-ring hairlines
  ctx.strokeStyle = 'rgba(215, 242, 248, 0.52)';
  ctx.lineWidth = 1.0;
  ctx.beginPath();
  ctx.arc(0, 0, innerR * 0.94, startBase + 0.08, startBase + totalSpan - 0.08);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(215, 242, 248, 0.38)';
  ctx.beginPath();
  ctx.arc(0, 0, outerR, startBase - 0.05, startBase + totalSpan + 0.05);
  ctx.stroke();

  // 3. Radial callout whiskers with angled elbows (──╲) as seen in Screenshots 3, 4, 5
  const whiskerAngles = [startBase + totalSpan * 0.12, startBase + totalSpan * 0.52, startBase + totalSpan * 0.88];
  ctx.strokeStyle = 'rgba(220, 245, 250, 0.55)';
  ctx.lineWidth = 0.85;
  whiskerAngles.forEach((wa, idx) => {
    const x0 = Math.cos(wa) * innerR * 0.82;
    const y0 = Math.sin(wa) * innerR * 0.82;
    const x1 = Math.cos(wa) * (outerR + 10 * scale);
    const y1 = Math.sin(wa) * (outerR + 10 * scale);
    const x2 = x1 + (Math.cos(wa) >= 0 ? 12 : -12) * scale;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y1);
    ctx.stroke();
  });

  // 4. Fine horizontal micro-telemetry lines extending toward the sculpted subject (Screenshot 4)
  if (showTelemetry) {
    const dir = flipLeft ? 1 : -1;
    const tx0 = dir * (innerR * 0.35);
    const ty0 = r * 0.36;
    ctx.strokeStyle = 'rgba(205, 235, 242, 0.42)';
    ctx.lineWidth = 0.85;
    for (let line = 0; line < 3; line++) {
      const ly = ty0 + line * 4.2 * scale;
      const len = (78 - line * 16 + Math.sin(state.time * 3 + line) * 6) * scale;
      ctx.beginPath();
      ctx.moveTo(tx0, ly);
      ctx.lineTo(tx0 + dir * len, ly);
      ctx.stroke();
      // Tiny micro-dots simulating fine diegetic glyph clusters
      for (let d = 0; d < 8; d++) {
        ctx.fillStyle = 'rgba(220, 248, 255, 0.48)';
        ctx.fillRect(tx0 + dir * (d * 8 * scale), ly - 2 * scale, 3.5 * scale, 1.2 * scale);
      }
    }
  }
  ctx.restore();
}

// Per-Subject Cutout / Readymade Head-Tracked Radial Node Overlay (Exact match to Screenshot 5)
function drawSubjectNodeOverlay(ctx, nodeX, nodeY, headX, headY, scale, isSelected, phase) {
  ctx.save();
  const r = 18 * scale;
  const alphaBoost = isSelected ? 1.35 : 0.92;

  // 1. 12-bar vertical micro-scan column on the left side of the C-arc (Screenshot 5)
  const colX = nodeX - r * 1.45;
  const colY = nodeY - r * 0.85;
  for (let b = 0; b < 11; b++) {
    const bw = (6 + ((b * 7) % 9)) * scale;
    const by = colY + b * 3.0 * scale;
    ctx.fillStyle = `rgba(205, 235, 242, ${(0.22 + (b % 3) * 0.1) * alphaBoost})`;
    ctx.fillRect(colX, by, bw, 1.4 * scale);
  }

  // 2. Compact right-side C-arc with 5 segments & 3 radial whiskers
  drawDiegeticRadialArcMenu(ctx, nodeX, nodeY, 18, phase, isSelected ? 2 : 1, 5, scale * alphaBoost, false, false);

  // 3. 45-degree diagonal leader line pointing toward the child cutout's temple/head (Screenshot 5)
  const dirX = headX >= nodeX ? 1 : -1;
  const pStartX = nodeX + dirX * (r * 0.9);
  const pStartY = nodeY + r * 0.65;
  const pEndX = pStartX + dirX * (16 * scale);
  const pEndY = pStartY + 14 * scale;

  ctx.strokeStyle = `rgba(220, 245, 252, ${0.62 * alphaBoost})`;
  ctx.lineWidth = 1.05;
  ctx.beginPath();
  ctx.moveTo(pStartX - dirX * 5 * scale, pStartY);
  ctx.lineTo(pStartX, pStartY);
  ctx.lineTo(pEndX, pEndY);
  ctx.stroke();

  ctx.restore();
}

// ============================================================================
// 3D MATH & MESH PRIMITIVE BUILDERS
// ============================================================================
function create3DSceneCollector() {
  return {
    faces: [],
    lines: [],
    points: [],
    overlays: [] // { p3d, head3d, type: 'main'|'node', radius, flipLeft, isSelected, phase }
  };
}

function vec3Sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function vec3Cross(a, b) {
  return [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0]
  ];
}
function vec3Normalize(v) {
  const len = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / len, v[1] / len, v[2] / len];
}
function vec3Dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }

function rotY3D(p, ang) {
  const c = Math.cos(ang), s = Math.sin(ang);
  return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c];
}
function rotX3D(p, ang) {
  const c = Math.cos(ang), s = Math.sin(ang);
  return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c];
}
function rotZ3D(p, ang) {
  const c = Math.cos(ang), s = Math.sin(ang);
  return [p[0] * c - p[1] * s, p[0] * s + p[1] * c, p[2]];
}
function add3D(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }

function addQuad3D(sc, v0, v1, v2, v3, hue, sat, lum, alpha, emission = 0) {
  const e1 = vec3Sub(v1, v0);
  const e2 = vec3Sub(v3, v0);
  const norm = vec3Normalize(vec3Cross(e1, e2));
  const cx = (v0[0] + v1[0] + v2[0] + v3[0]) * 0.25;
  const cy = (v0[1] + v1[1] + v2[1] + v3[1]) * 0.25;
  const cz = (v0[2] + v1[2] + v2[2] + v3[2]) * 0.25;
  sc.faces.push({
    verts: [v0, v1, v2, v3],
    center: [cx, cy, cz],
    normal: norm,
    hue, sat, lum, alpha, emission
  });
}

function addTri3D(sc, v0, v1, v2, hue, sat, lum, alpha, emission = 0) {
  const e1 = vec3Sub(v1, v0);
  const e2 = vec3Sub(v2, v0);
  const norm = vec3Normalize(vec3Cross(e1, e2));
  const cx = (v0[0] + v1[0] + v2[0]) / 3;
  const cy = (v0[1] + v1[1] + v2[1]) / 3;
  const cz = (v0[2] + v1[2] + v2[2]) / 3;
  sc.faces.push({
    verts: [v0, v1, v2],
    center: [cx, cy, cz],
    normal: norm,
    hue, sat, lum, alpha, emission
  });
}

function add3DTubeChain(sc, joints, radii, sides, hue, sat, lum, alpha) {
  if (joints.length < 2) return;
  const rings = [];
  for (let i = 0; i < joints.length; i++) {
    const p = joints[i];
    const dir = i < joints.length - 1
      ? vec3Normalize(vec3Sub(joints[i + 1], p))
      : vec3Normalize(vec3Sub(p, joints[i - 1]));
    const up = Math.abs(dir[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    const right = vec3Normalize(vec3Cross(dir, up));
    const fwd = vec3Normalize(vec3Cross(right, dir));
    const r = radii[i];
    const ring = [];
    for (let s = 0; s < sides; s++) {
      const a = (s / sides) * Math.PI * 2;
      const ca = Math.cos(a) * r, sa = Math.sin(a) * r;
      ring.push([
        p[0] + right[0] * ca + fwd[0] * sa,
        p[1] + right[1] * ca + fwd[1] * sa,
        p[2] + right[2] * ca + fwd[2] * sa
      ]);
    }
    rings.push(ring);
  }
  for (let i = 0; i < rings.length - 1; i++) {
    for (let s = 0; s < sides; s++) {
      const ns = (s + 1) % sides;
      addQuad3D(sc, rings[i][s], rings[i][ns], rings[i + 1][ns], rings[i + 1][s], hue, sat, lum, alpha);
    }
  }
}

function add3DBox(sc, cx, cy, cz, wx, wy, wz, hue, sat, lum, alpha) {
  const x0 = cx - wx / 2, x1 = cx + wx / 2;
  const y0 = cy - wy / 2, y1 = cy + wy / 2;
  const z0 = cz - wz / 2, z1 = cz + wz / 2;
  const p = [
    [x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0],
    [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]
  ];
  addQuad3D(sc, p[0], p[1], p[2], p[3], hue, sat, lum, alpha);
  addQuad3D(sc, p[5], p[4], p[7], p[6], hue, sat, lum, alpha);
  addQuad3D(sc, p[4], p[0], p[3], p[7], hue, sat, lum, alpha);
  addQuad3D(sc, p[1], p[5], p[6], p[2], hue, sat, lum, alpha);
  addQuad3D(sc, p[3], p[2], p[6], p[7], hue, sat, lum, alpha);
  addQuad3D(sc, p[4], p[5], p[1], p[0], hue, sat, lum, alpha);
}

      add3DTubeChain(sc, [antRoot, antMid, antTip], [4.8, 3.6, 2.4], 6, hue - 5, 65, 28, 0.7 + L4 * 0.28);

      add3DTubeChain(sc, [legShoulder, legKnee, legTibia], [5.5, 4.5, 3.2], 6, hue - 10, 70, 20, 0.75 + L4 * 0.22);
    }

    // Attach Diegetic Radial C-Arc Menu Overlay onto the Right Compound Eye (or selected part)
    const eyeTargets = [

// ============================================================================
function build3DBirthdayScene(sc, L1, L2, L3, L4, L5, spread, t, hue) {
  if (L1 < 0.01) return;

  // 1. Far-Left Horizon Silhouette of the 4-Legged Rectangular Prop Table (Screenshot 2 / sec_138)

  const showHexTable = (state.activeShot === 'cutouts' || state.activeShot === 'blowcandles' || state.activeShot === 'miniature' || L2 > 0.45);
  const tableY = 22 + spread * 10;
  if (showHexTable) {
    const hexR = 96 + spread * 16;
    const hexVerts = [];
    for (let h = 0; h < 6; h++) {
      const a = (h / 6) * Math.PI * 2 + Math.PI / 6;
      hexVerts.push([Math.cos(a) * hexR, tableY, Math.sin(a) * hexR]);
    }
    for (let h = 0; h < 6; h++) {

      const b0 = [hexVerts[h][0], tableY + 5, hexVerts[h][2]];
      const b1 = [hexVerts[nh][0], tableY + 5, hexVerts[nh][2]];
      addQuad3D(sc, hexVerts[h], hexVerts[nh], b1, b0, 32, 75, 26, 0.7);
    }
  }

  // 3. 3D Morphing Birthday Cake (Morphs between Tall Scalloped Bundt Dome in Screenshot 3 & Broad Frosted Cylinder in Screenshot 4!)
  // Ring 02 in bundtmorph shot or state.bundtMorph controls the bundt-to-cylinder shape morph
  const bundt = state.activeShot === 'bundtmorph'
    ? Math.max(0.25, Math.sin((state.rings[1].angle / 180) * Math.PI))
    : state.bundtMorph;

  const cakeSegs = Math.max(10, Math.round(10 + L2 * 10));
  const baseR = (38 * (1 - bundt * 0.22)) * L1;
  const topR = (36 * (1 - bundt * 0.48)) * L1;
  const cakeH = (24 + bundt * 18) * L1;
  const cakeBaseY = tableY - 1;
  const cakeTopY = cakeBaseY - cakeH;

  // Cake tilt when floating in mid-air during shaping (Screenshots 2, 3, 4)
  const cakeTiltZ = (!showHexTable) ? 0.18 : 0;
  const cakeTiltX = (state.activeShot === 'bundtmorph') ? -0.28 : 0;
  const xfCake = (pt) => {
    let q = vec3Sub(pt, [0, cakeBaseY - cakeH * 0.5, 0]);
    if (cakeTiltZ) q = rotZ3D(q, cakeTiltZ);
    if (cakeTiltX) q = rotX3D(q, cakeTiltX);
    return add3D(q, [0, cakeBaseY - cakeH * 0.5, 0]);
  };

  for (let i = 0; i < cakeSegs; i++) {
    const a0 = (i / cakeSegs) * Math.PI * 2;
    const a1 = ((i + 1) / cakeSegs) * Math.PI * 2;
    // Fluted scallop ribbing when morphed toward the bundt pudding dome (Screenshot 3)
    const flute0 = 1 + bundt * 0.08 * Math.sin(a0 * 8);
    const flute1 = 1 + bundt * 0.08 * Math.sin(a1 * 8);

    const b0 = xfCake([Math.cos(a0) * baseR * flute0, cakeBaseY, Math.sin(a0) * baseR * flute0]);
    const b1 = xfCake([Math.cos(a1) * baseR * flute1, cakeBaseY, Math.sin(a1) * baseR * flute1]);
    const t1 = xfCake([Math.cos(a1) * topR * flute1, cakeTopY, Math.sin(a1) * topR * flute1]);

    addQuad3D(sc, b0, b1, t1, t0, 40, 82, 48, 0.45 + L4 * 0.52);
    addTri3D(sc, xfCake([0, cakeTopY - bundt * 6, 0]), t0, t1, 45, 92, 68, 0.5 + L4 * 0.48, 0.18);

    // Colorful Smarties / chocolate candy studs on the sides & top of the cake (Screenshots 2, 3, 4)

      sc.points.push({ p: sidePt, radius: 2.2, color: candyColors[i % candyColors.length], glow: false });

  if (L3 > 0.25 && bundt < 0.5) {
    const yIcing = cakeTopY - 0.6;

      // '生'
      [[-14, yIcing, 6], [-8, yIcing, 6]], [[-11, yIcing, 3], [-11, yIcing, 12]], [[-14, yIcing, 9], [-8, yIcing, 9]], [[-15, yIcing, 12], [-7, yIcing, 12]],

      [[-4, yIcing, 4], [1, yIcing, 4], [1, yIcing, 12], [-4, yIcing, 12], [-4, yIcing, 4]], [[-4, yIcing, 8], [1, yIcing, 8]],
