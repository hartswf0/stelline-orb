    ];
    const numStrokes = Math.ceil(L3 * redStrokes.length);
    for (let s = 0; s < numStrokes; s++) {
      const poly = redStrokes[s];
      for (let p = 0; p < poly.length - 1; p++) {
        sc.lines.push({
          a: xfCake(poly[p]),
          b: xfCake(poly[p + 1]),
          color: 'rgba(215, 38, 28, 0.92)',
          width: 2.1
        });
      }
    }
  }

  // 5. Lit Birthday Candles (2 candles in Bundt Morph Screenshot 3; 7 striped candles in Screenshot 4 & 5!)
  if (L3 > 0.05) {
    const targetCandles = bundt > 0.6 ? 2 : 7;
    const numCandles = Math.min(targetCandles, Math.ceil(L3 * 7));
    const candlePositions = bundt > 0.6
      ? [[-7, -2], [6, 2]]
      : [[-20, -4], [-13, 3], [-9, -12], [-2, -6], [6, -11], [13, -3], [21, 2]];
    const candleHues = [0, 48, 210, 45, 355, 48, 42]; // Red-striped, yellow, blue-striped candles (Screenshot 4)

    // Breath wind when blowing out candles in Shot 09 (02:56 blowcandles or high L5)
    const blowWind = (state.activeShot === 'blowcandles') ? (0.8 + Math.sin(t * 5) * 0.35) : Math.max(0, (L5 - 0.78) * 2.5);

    for (let c = 0; c < numCandles; c++) {
      const [cx, cz] = candlePositions[c];
      const cHeight = (15 + (c % 2) * 2.5) * L3;
      const pBot = xfCake([cx, cakeTopY, cz]);
      const pTop = xfCake([cx, cakeTopY - cHeight, cz]);
      add3DTubeChain(sc, [pBot, pTop], [1.4, 1.25], 5, candleHues[c], 85, 78, 0.92);

      if (L5 > 0.04) {
        const flickerX = Math.sin(t * 8 + c * 1.9) * (1.8 + L5 * 2.5) - blowWind * 5.5;
        const flickerZ = Math.cos(t * 7 + c * 2.3) * (1.8 + L5 * 2.5) + blowWind * 6.5;
        const flameTip = add3D(pTop, [flickerX, -(6 + Math.cos(t * 10 + c) * 2) * L5 + blowWind * 2.2, flickerZ]);
        sc.lines.push({ a: pTop, b: flameTip, color: 'rgba(255, 245, 190, 0.95)', width: 2.2 });
        sc.points.push({
          p: flameTip,
          radius: (5.2 + L5 * 4.5),
          color: `rgba(255, 195, 75, ${0.9 * L5})`,
          glow: true
        });
      }
    }
  }

  // Attach Primary Radial C-Arc Menu Overlay beside the floating cake (Screenshots 2, 3, 4)
  if (!showHexTable || state.selectedNodeIdx === 0) {
    sc.overlays.push({
      p3d: xfCake([baseR + 28, cakeTopY - 6, 0]),
      type: 'main',
      radius: 42,
      flipLeft: false,
      showTelemetry: state.activeShot === 'redicing' || state.selectedNodeIdx === 0
    });
  }

  // 6. Volumetric Children Cutouts / Readymades + Per-Child Head-Tracked Radial Node Overlays (Screenshot 5 & sec_153-186)
  if (showHexTable && L2 > 0.15) {
    // Up to 6 children around the hexagonal table:
    // 0: Dark-haired girl on left leaning chin on hands (Screenshot 5 left)
    // 1: Blonde birthday girl in white cardigan on right (Screenshot 5 right, blows candles in sec_178)
    // 2: Small toddler peeking in center (sec_155)
    // 3: Girl in yellow dress far-left (sec_182)
    // 4: Asian girl on right (sec_173 / sec_182)
    // 5: Young boy on far-right foreground looking at candle (sec_174 / sec_182)
    const cutouts = [
      { x: -46, z: -48, h: 52, w: 26, hairHue: 22, hairLum: 18, shirtHue: 35, shirtLum: 38, pose: 'lean_hands', hasOverlay: true },
      { x:  24, z: -52, h: 58, w: 28, hairHue: 44, hairLum: 68, shirtHue: 42, shirtLum: 82, pose: 'birthday_girl', hasOverlay: true },
      { x: -10, z: -56, h: 38, w: 20, hairHue: 38, hairLum: 52, shirtHue: 36, shirtLum: 48, pose: 'toddler', hasOverlay: false },
      { x: -78, z: -18, h: 50, w: 24, hairHue: 20, hairLum: 14, shirtHue: 42, shirtLum: 62, pose: 'side_left', hasOverlay: false },
      { x:  62, z: -26, h: 52, w: 25, hairHue: 18, hairLum: 12, shirtHue: 215, shirtLum: 28, pose: 'side_right', hasOverlay: false },
      { x:  74, z:  24, h: 46, w: 24, hairHue: 24, hairLum: 16, shirtHue: 38, shirtLum: 65, pose: 'boy_fg', hasOverlay: false }
    ];

    const maxVisibleCutouts = state.activeShot === 'cutouts'
      ? Math.max(2, Math.min(3, Math.ceil((state.rings[1].angle / 180) * 3)))
      : Math.min(6, Math.ceil(L2 * 6));

    for (let k = 0; k < maxVisibleCutouts; k++) {
      const c = cutouts[k];
      const sway = Math.sin(t * 2.2 + k * 1.4) * (L5 * 2.5);
      const cx = c.x + sway;
      const cz = c.z - spread * 18;
      const shoulderY = tableY - c.h * 0.52;
      const headY = tableY - c.h * 0.84;

      // Volumetric Cutout Torso / Cardigan Silhouette
      add3DTubeChain(
        sc,
        [[cx, tableY + 4, cz], [cx, shoulderY, cz]],
        [c.w * 0.48, c.w * 0.42],
        6, c.shirtHue, 45, c.shirtLum, 0.42 + L4 * 0.48
      );

      // Volumetric Cutout Head & Warm Candle-Lit Face
      const headR = c.w * 0.36;
      add3DBox(sc, cx, headY, cz, headR * 1.7, headR * 2.0, headR * 1.6, 34, 68, 58, 0.5 + L4 * 0.45, 0.15);
      // Hair framing crown
      add3DBox(sc, cx, headY - headR * 0.45, cz - 2, headR * 1.85, headR * 1.4, headR * 1.7, c.hairHue, 55, c.hairLum, 0.55 + L4 * 0.4);

      // Arms leaning on the hexagonal tabletop (Screenshot 5)
      for (let side of [-1, 1]) {
        const sh = [cx + side * c.w * 0.42, shoulderY + 2, cz];
        const elbow = [cx + side * c.w * 0.32, tableY - 2, cz + 12];
        const hand = c.pose === 'lean_hands'
          ? [cx + side * 4, headY + headR * 0.9, cz + 10]
          : [cx + side * 8, tableY - 1, cz + 18];
        add3DTubeChain(sc, [sh, elbow, hand], [3.2, 2.6, 2.0], 4, c.shirtHue, 40, c.shirtLum * 0.9, 0.45 + L4 * 0.45);
      }

      // Facial Expression & Pursed "O" Mouth when blowing out candles (sec_178)
      const fZ = cz + headR * 0.85;
      if (c.pose === 'birthday_girl' && (state.activeShot === 'blowcandles' || L5 > 0.72)) {
        // Pursed "O" lips blowing air stream toward the candles
        sc.points.push({ p: [cx, headY + 3.5, fZ], radius: 2.2, color: 'rgba(65, 25, 20, 0.95)', glow: false });
      }

      // Attach Head-Tracked Diegetic Radial C-Arc Node Overlay (Exact match to Screenshot 5!)
      const isNodeSelected = (state.selectedNodeIdx - 1) === k;
      if (c.hasOverlay || isNodeSelected) {
        const dir = cx <= 0 ? -1 : 1;
        sc.overlays.push({
          p3d: [cx + dir * 28, headY - 16, cz],
          head3d: [cx + dir * 10, headY - 4, cz],
          type: 'node',
          isSelected: isNodeSelected,
          phase: (state.rings[2].angle / 180) * Math.PI + k
        });
      }
    }
  }
}

// ============================================================================
// ACT III: 3D ORPHANAGE BOILER & CSG CARVED WOODEN HORSE [6·10·21]
// ============================================================================
function build3DHorseScene(sc, L1, L2, L3, L4, L5, spread, t, hue) {
  if (L1 < 0.01) return;
  const carve = L2;
  const sides = Math.max(4, Math.round(4 + L2 * 6));
  const lerpPt = (a, b, m) => [
    (a[0] * (1 - m) + b[0] * m) * L1,
    (a[1] * (1 - m) + b[1] * m) * L1,
    (a[2] * (1 - m) + b[2] * m) * L1
  ];

  const furnaceZ = -78 - spread * 38;
  add3DBox(sc, 0, -6, furnaceZ - 14, 145 * L1, 95 * L1, 22 * L1, 18, 75, 26, 0.16 + L4 * 0.35);
  const numBars = Math.ceil(L1 * 7);
  for (let b = 0; b < numBars; b++) {
    const bx = (b - 3) * 18 * L1;
    add3DTubeChain(sc, [[bx, -52 * L1, furnaceZ], [bx, 40 * L1, furnaceZ]], [2.2, 2.2], 4, 22, 85, 42, 0.45 + L4 * 0.45);
  }
  if (L4 > 0.05) {
    for (let f = -2; f <= 2; f++) {
      sc.points.push({
        p: [f * 20, 12 + Math.sin(t * 5 + f) * 8, furnaceZ - 6],
        radius: 14 * L4,
        color: `rgba(255, 110, 30, ${0.45 * L4})`,
        glow: true
      });
    }
  }

  if (carve < 0.92) {
    const cageAlpha = (1 - carve * 0.85) * 0.55;
    const bx = 48 * L1, by0 = -48 * L1, by1 = 30 * L1, bz = 20 * L1;
    const corners = [
      [-bx, by0, -bz], [bx, by0, -bz], [bx, by1, -bz], [-bx, by1, -bz],
      [-bx, by0,  bz], [bx, by0,  bz], [bx, by1,  bz], [-bx, by1,  bz]
    ];
    [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(([i, j]) => {
      sc.lines.push({ a: corners[i], b: corners[j], color: `rgba(245, 175, 85, ${cageAlpha})`, width: 1.0 });
    });
  }

  const sepY = spread * 16;
  const spineBlock = [[-38, -12, 0], [-12, -12, 0], [16, -12, 0], [28, -28, 0], [36, -42, 0], [48, -38, 0]];
  const spineCarved = [
    [-34, -4 - sepY * 0.3, 0], [-8, -8 - sepY * 0.3, 0], [18, -10 - sepY * 0.3, 0],
    [28, -30 - sepY * 0.6, 0], [35, -46 - sepY * 0.8, 0], [52, -36 - sepY * 0.8, 0]
  ];
  const radiiBlock = [20, 20, 20, 18, 16, 14];
  const radiiCarved = [13, 14.5, 15, 10.5, 8.5, 5.5];

  const horseSpine = spineCarved.map((pt, i) => lerpPt(spineBlock[i], pt, carve));
  const horseRadii = radiiCarved.map((r, i) => (radiiBlock[i] * (1 - carve) + r * carve) * L1);
  add3DTubeChain(sc, horseSpine, horseRadii, sides, hue + 6, 76, 42, 0.25 + L4 * 0.68);

  const legDefs = [
    { raw: [[-30, -2, -10], [-30, 14, -10], [-30, 28, -10]], carved: [[-28, -2, -9], [-32, 14, -10], [-36, 28, -10]] },
    { raw: [[-30, -2,  10], [-30, 14,  10], [-30, 28,  10]], carved: [[-26, -2,  9], [-24, 14,  10], [-22, 28,  10]] },
    { raw: [[ 16, -2, -10], [ 16, 14, -10], [ 16, 28, -10]], carved: [[ 16, -4, -9], [ 18, 13, -10], [ 15, 28, -10]] },
    { raw: [[ 16, -2,  10], [ 16, 14,  10], [ 16, 28,  10]], carved: [[ 18, -4,  9], [ 24, 12,  10], [ 26, 28,  10]] }
  ];
  legDefs.forEach(ld => {
    const chain = ld.carved.map((pt, idx) => lerpPt(ld.raw[idx], pt, carve));
    add3DTubeChain(sc, chain, [6.5 * L1, 4.2 * L1, 3.0 * L1], Math.max(4, sides - 2), hue + 4, 72, 38, 0.25 + L4 * 0.68);
  });

  if (L3 > 0.03) {
    const baseY = 35 + sepY * 0.7;
    add3DBox(sc, -4, baseY, 0, 96 * L3, 14 * L3, 32 * L3, hue - 4, 65, 24, 0.35 + L4 * 0.6);
    const zFace = 16.5 * L3 + 0.5;
    const yMid = baseY;
    const glyphs = [
      [[-32, yMid - 4], [-37, yMid - 4], [-37, yMid + 4], [-32, yMid + 4], [-32, yMid], [-37, yMid]],
      [[-24, yMid], [-23, yMid]],
      [[-14, yMid - 4], [-14, yMid + 4]],
      [[-9, yMid - 4], [-4, yMid - 4], [-4, yMid + 4], [-9, yMid + 4], [-9, yMid - 4]],
      [[4, yMid], [5, yMid]],
      [[13, yMid - 4], [18, yMid - 4], [18, yMid], [13, yMid], [13, yMid + 4], [18, yMid + 4]],
      [[24, yMid - 4], [24, yMid + 4]]
    ];
    const visGlyphs = Math.ceil(L3 * glyphs.length);
    for (let g = 0; g < visGlyphs; g++) {
      const pts = glyphs[g];
      for (let p = 0; p < pts.length - 1; p++) {
        sc.lines.push({
          a: [pts[p][0], pts[p][1], zFace],
          b: [pts[p + 1][0], pts[p + 1][1], zFace],
          color: '#ffd28a',
          width: 2.0
        });
      }
    }
  }

  sc.overlays.push({
    p3d: [58, -14, 10],
    type: 'main',
    radius: 40,
    flipLeft: false,
    showTelemetry: true
  });
}

// ============================================================================
// ACT IV: 3D STELLINE GEODESIC BIODOME & VOLUMETRIC HEXAGONAL CRYSTALS
// ============================================================================
function build3DSnowScene(sc, L1, L2, L3, L4, L5, spread, t, hue) {
  if (L1 < 0.01) return;
  const maxCrystals = L2 > 0.05 ? 1 + Math.ceil(L2 * 6) : 1;
  const crystalSeeds = [
    { pos: [0, 0, 0], scale: 1.15, rot: [0.3, 0.2, 0] },
    { pos: [-78, -22, -45], scale: 0.65, rot: [0.8, -0.4, 0.2] },
    { pos: [82, -16, -38], scale: 0.68, rot: [-0.5, 0.7, -0.3] },
    { pos: [-64, 34, 48], scale: 0.58, rot: [0.4, 0.9, 0.5] },
    { pos: [72, 28, 52], scale: 0.62, rot: [-0.7, -0.5, 0.4] },
    { pos: [0, -52, -62], scale: 0.52, rot: [1.1, 0.2, -0.4] },
    { pos: [0, 48, 64], scale: 0.54, rot: [-0.9, 0.4, 0.2] }
  ].slice(0, maxCrystals);

  crystalSeeds.forEach((cs, idx) => {
    const sp = idx === 0 ? 0 : (0.4 + spread * 0.9) * L2;
    const cx = cs.pos[0] * sp;
    const cy = cs.pos[1] * sp + Math.sin(t * 1.4 + idx) * (L5 * 12);
    const cz = cs.pos[2] * sp;
    const rad = 52 * cs.scale * L1;
    const rx = cs.rot[0] + t * 0.35 * L5 * (idx % 2 === 0 ? 1 : -1);
    const ry = cs.rot[1] + t * 0.45 * L5;
    const rz = cs.rot[2] + t * 0.25 * L5;

    const xf = (p) => {
      let q = rotX3D(p, rx);
      q = rotY3D(q, ry);
      q = rotZ3D(q, rz);
      return [q[0] + cx, q[1] + cy, q[2] + cz];
    };

    const coreR = rad * 0.34;
    const apexF = xf([0, 0, 8 * cs.scale]);
    const apexB = xf([0, 0, -8 * cs.scale]);
    const hexPts = [];
    for (let a = 0; a < 6; a++) {
      const ang = (a / 6) * Math.PI * 2;
      hexPts.push(xf([Math.cos(ang) * coreR, Math.sin(ang) * coreR, 0]));
    }
    for (let a = 0; a < 6; a++) {
      const na = (a + 1) % 6;
      addTri3D(sc, apexF, hexPts[a], hexPts[na], hue + 8, 88, 72, 0.2 + L4 * 0.55);
      addTri3D(sc, apexB, hexPts[na], hexPts[a], hue - 8, 88, 62, 0.2 + L4 * 0.55);
    }

    const numArms = Math.ceil(L1 * 6);
    for (let a = 0; a < numArms; a++) {
      const ang = (a / 6) * Math.PI * 2;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const tip = xf([ca * rad, sa * rad, 0]);
      const leftRim = xf([ca * rad * 0.55 - sa * 4.5, sa * rad * 0.55 + ca * 4.5, 3]);
      const rightRim = xf([ca * rad * 0.55 + sa * 4.5, sa * rad * 0.55 - ca * 4.5, -3]);
      addTri3D(sc, hexPts[a], leftRim, tip, hue + 15, 92, 78, 0.28 + L4 * 0.6);
      addTri3D(sc, hexPts[a], tip, rightRim, hue, 85, 65, 0.28 + L4 * 0.6);

      if (L3 > 0.05) {
        [0.48, 0.74].forEach((frac, bIdx) => {
          if (bIdx === 1 && L3 < 0.45) return;
          const bLen = rad * (bIdx === 0 ? 0.34 : 0.22) * L3;
          const root = [ca * rad * frac, sa * rad * frac, 0];
          for (let side of [-1, 1]) {
            const bAng = ang + side * (Math.PI / 3);
            const bTip = [root[0] + Math.cos(bAng) * bLen, root[1] + Math.sin(bAng) * bLen, side * 2.5];
            const bMid = [root[0] + Math.cos(bAng) * bLen * 0.5, root[1] + Math.sin(bAng) * bLen * 0.5, side * 4];
            addTri3D(sc, xf(root), xf(bMid), xf(bTip), hue + 25, 95, 82, 0.32 + L4 * 0.58);
          }
        });
      }
    }
  });
}

// ============================================================================
// MAIN 3D PERSPECTIVE PROJECTION & DIEGETIC RADIAL OVERLAY RENDERER
// ============================================================================
function renderHologramChamber() {
  const w = holoCanvas.clientWidth;
  const h = holoCanvas.clientHeight;
  const ctx = holoCtx;
  ctx.clearRect(0, 0, w, h);

  // Authentic Stelline Dome Background + Glowing White Horizon Strip (Screenshots 2, 3, 4, 5)
  const isForestBg = state.scene === 'beetle' && (state.activeShot === 'bugeye' || state.activeShot === 'leaf');
  const wallGrad = ctx.createLinearGradient(0, 0, 0, h);
  if (isForestBg) {
    wallGrad.addColorStop(0, '#2a3d1c');
    wallGrad.addColorStop(0.55, '#3b5424');
    wallGrad.addColorStop(1, '#121d0c');
  } else {
    wallGrad.addColorStop(0, '#040608');
    wallGrad.addColorStop(0.49, '#080c10');
    wallGrad.addColorStop(0.52, '#d8e4ec'); // Glowing white clean-room horizon strip!
    wallGrad.addColorStop(0.54, '#0c1015');
    wallGrad.addColorStop(1, '#040608');
  }
  ctx.fillStyle = wallGrad;
  ctx.fillRect(0, 0, w, h);

  // Diagonal architectural dome ribs above the horizon strip (Screenshots 2 & 3)
  if (!isForestBg) {
    ctx.strokeStyle = 'rgba(10, 14, 18, 0.65)';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(w * 0.38, 0); ctx.lineTo(w * 0.31, h * 0.52);
    ctx.moveTo(w * 0.88, 0); ctx.lineTo(w * 0.78, h * 0.52);
    ctx.stroke();
  }

  if (!state.powerOn) return;

  const { L1, L2, L3, L4, L5 } = getPrimitiveLayers();
  const colorShift = state.rings[4].angle / 360;
  const spread = state.accordionSpread;
  const scrubTime = state.time * 0.85 + (state.rings[2].angle / 360) * Math.PI * 2;

  const camYaw = state.cam3D.yaw + state.tiltX * 0.22;
  const camPitch = Math.max(-1.1, Math.min(1.1, state.cam3D.pitch + state.tiltY * 0.18 + state.targetOffset.y * 0.6));
  const fovScale = 440;
  const camDist = state.cam3D.dist;

  const cx = w * (0.5 + state.targetOffset.x * 0.45);
  const cy = h * 0.54;

  const baseHue = state.scene === 'beetle' ? 115 : state.scene === 'birthday' ? 38 : state.scene === 'horse' ? 24 : 196;
  const tunedHue = (baseHue + (colorShift - 0.5) * 42 + 360) % 360;

  // Warm floor reflection under the birthday party / miniature hologram (sec_196 & Screenshot 3)
  if (state.scene === 'birthday') {
    const floorGlow = ctx.createRadialGradient(cx, h * 0.82, 10, cx, h * 0.82, w * 0.35);
    floorGlow.addColorStop(0, `rgba(235, 165, 55, ${0.22 * L4})`);
    floorGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = floorGlow;
    ctx.fillRect(0, h * 0.52, w, h * 0.48);
  }

  const cyaw = Math.cos(camYaw), syaw = Math.sin(camYaw);
  const cpitch = Math.cos(camPitch), spitch = Math.sin(camPitch);

  function project3D(p) {
    const x1 = p[0] * cyaw + p[2] * syaw;
    const z1 = -p[0] * syaw + p[2] * cyaw;
    const y2 = p[1] * cpitch - z1 * spitch;
    const z2 = p[1] * spitch + z1 * cpitch;
    const depth = camDist + z2;
    if (depth < 20) return null;
    const scale = fovScale / depth;
    return { x: cx + x1 * scale, y: cy + y2 * scale, z: z2, scale };
  }

  // Build 3D Scene
  const sc = create3DSceneCollector();
  if (state.scene === 'beetle') {
    build3DBeetleScene(sc, L1, L2, L3, L4, L5, spread, scrubTime, tunedHue);
  } else if (state.scene === 'birthday') {
    build3DBirthdayScene(sc, L1, L2, L3, L4, L5, spread, scrubTime, tunedHue);
  } else if (state.scene === 'horse') {
    build3DHorseScene(sc, L1, L2, L3, L4, L5, spread, scrubTime, tunedHue);
  } else {
    build3DSnowScene(sc, L1, L2, L3, L4, L5, spread, scrubTime, tunedHue);
  }

  // Project & Depth-Sort 3D Faces
  const lightDir = vec3Normalize([0.35, -0.78, -0.50]);
  const viewDir = vec3Normalize([-Math.sin(camYaw) * Math.cos(camPitch), -Math.sin(camPitch), -Math.cos(camYaw) * Math.cos(camPitch)]);
  const rMode = state.cam3D.renderMode;

  const projectedFaces = [];
  for (let i = 0; i < sc.faces.length; i++) {
    const f = sc.faces[i];
    const pts2d = [];
    let zSum = 0, valid = true;
    for (let v = 0; v < f.verts.length; v++) {
      const pr = project3D(f.verts[v]);
      if (!pr) { valid = false; break; }
      pts2d.push(pr);
      zSum += pr.z;
    }
    if (!valid) continue;
    projectedFaces.push({ f, pts2d, zAvg: zSum / f.verts.length });
  }
  projectedFaces.sort((a, b) => b.zAvg - a.zAvg);

  const showShaded = rMode === 'hybrid' || rMode === 'shaded';
  const showWire = rMode === 'hybrid' || rMode === 'wire' || L4 < 0.75;
  const showNormals = rMode === 'wire';
  const showVoxels = rMode === 'voxel';

  for (let i = 0; i < projectedFaces.length; i++) {
    const { f, pts2d } = projectedFaces[i];
    const ndotl = Math.abs(vec3Dot(f.normal, lightDir));
    const fresnel = Math.pow(1 - Math.abs(vec3Dot(f.normal, viewDir)), 1.6);
    const litLum = Math.min(88, f.lum * (0.55 + ndotl * 0.65) + fresnel * 22 + (f.emission || 0) * 28);

    if (showVoxels) {
      const c2d = project3D(f.center);
      if (c2d) {
        ctx.fillStyle = `hsla(${f.hue}, ${f.sat}%, ${litLum + 10}%, 0.88)`;
        ctx.beginPath();
        ctx.arc(c2d.x, c2d.y, Math.max(1.3, 2.2 * c2d.scale), 0, Math.PI * 2);
        ctx.fill();
      }
      continue;
    }

    ctx.beginPath();
    ctx.moveTo(pts2d[0].x, pts2d[0].y);
    for (let v = 1; v < pts2d.length; v++) ctx.lineTo(pts2d[v].x, pts2d[v].y);
    ctx.closePath();

    if (showShaded && L4 > 0.04) {
      ctx.fillStyle = `hsla(${f.hue}, ${f.sat}%, ${litLum}%, ${f.alpha})`;
      ctx.fill();
    }
    if (showWire) {
      const wireAlpha = rMode === 'shaded' ? 0.12 : Math.max(0.18, 0.72 - L4 * 0.42);
      ctx.strokeStyle = `hsla(${f.hue + 14}, 88%, ${Math.min(92, litLum + 16)}%, ${wireAlpha})`;
      ctx.lineWidth = rMode === 'wire' ? 1.0 : 0.65;
      ctx.stroke();
    }
    if (showNormals && i % 2 === 0) {
      const c0 = project3D(f.center);
      const c1 = project3D(add3D(f.center, [f.normal[0] * 8, f.normal[1] * 8, f.normal[2] * 8]));
      if (c0 && c1) {
        ctx.strokeStyle = 'rgba(255, 185, 85, 0.68)';
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(c0.x, c0.y); ctx.lineTo(c1.x, c1.y); ctx.stroke();
      }
    }
  }

  // Render 3D Lines (Icing strokes, Bristles, Rib contours, Carvings)
  for (let i = 0; i < sc.lines.length; i++) {
    const ln = sc.lines[i];
    const pA = project3D(ln.a), pB = project3D(ln.b);
    if (!pA || !pB) continue;
    ctx.strokeStyle = ln.color;
    ctx.lineWidth = ln.width || 1.0;
    ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.stroke();
  }

  // Render 3D Points (Candle Flames, Water Droplets, Smarties Candies, Furnace Core)
  for (let i = 0; i < sc.points.length; i++) {
    const pt = sc.points[i];
    const pr = project3D(pt.p);
    if (!pr) continue;
    const rad = Math.max(1.4, pt.radius * pr.scale);
    if (pt.glow) {
      const g = ctx.createRadialGradient(pr.x, pr.y, 0.5, pr.x, pr.y, rad * 2.4);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.35, pt.color);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, rad * 2.4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, rad, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Render Diegetic 3D-Anchored Radial C-Arc Menu Overlays (Screenshots 2, 3, 4, 5!)
  const ringRotSum = (state.rings[0].angle + state.rings[1].angle + state.rings[2].angle) * (Math.PI / 180);
  const activeSec = Math.floor(((state.rings[0].angle + state.rings[2].angle) / 30)) % 7;

  sc.overlays.forEach(ov => {
    const pr = project3D(ov.p3d);
    if (!pr) return;
    const uiScale = Math.max(0.65, Math.min(1.45, pr.scale * 0.72));
    if (ov.type === 'main') {
      drawDiegeticRadialArcMenu(ctx, pr.x, pr.y, ov.radius, ringRotSum, activeSec, 7, uiScale, ov.flipLeft, ov.showTelemetry);
    } else if (ov.type === 'node') {
      const hPr = ov.head3d ? project3D(ov.head3d) : { x: pr.x - 18, y: pr.y + 18 };
      if (hPr) {
        drawSubjectNodeOverlay(ctx, pr.x, pr.y, hPr.x, hPr.y, uiScale, ov.isSelected, ov.phase);
      }
    }
  });

  // Render 3D Atmospheric Bokeh
  holoParticles3D.forEach(p => {
    const pr = project3D([
      p.x + Math.sin(scrubTime + p.phase) * (4 + L5 * 14),
      p.y + Math.cos(scrubTime * 0.8 + p.phase) * (4 + L5 * 10),
      p.z
    ]);
    if (!pr) return;
    const coc = Math.abs(pr.z) / 95;
    const bokehR = Math.max(0.8, p.size * pr.scale * (1 + L5 * coc * 2.4));
    const alpha = Math.max(0.03, (0.22 - L5 * coc * 0.08) * (0.5 + 0.5 * Math.sin(scrubTime * 1.5 + p.phase)));
    ctx.fillStyle = `hsla(${tunedHue + p.layer * 14}, 85%, 74%, ${alpha})`;
    ctx.beginPath(); ctx.arc(pr.x, pr.y, bokehR, 0, Math.PI * 2); ctx.fill();
  });

  if (state.imprintFlash > 0.01) {
    ctx.fillStyle = `rgba(56, 217, 192, ${state.imprintFlash * 0.35})`;
    ctx.fillRect(0, 0, w, h);
    state.imprintFlash *= 0.9;
  }
}

// ============================================================================
// CANVAS 2: PROPSTORE LOT #131 ANIMATRONIC MEMORY ORB HARDWARE RENDERER
// Exact microscopic surface finishes, dual/triple sub-bands, red stencils,
// concave coated outer lenses, and interactive hitboxes for every component
// ============================================================================
const orbCanvas = document.getElementById('orbCanvas');
const orbCtx = orbCanvas.getContext('2d');
let currentHitboxes = [];

function registerHitbox(id, label, x, y, w, h, onDown, onUp) {
  currentHitboxes.push({ id, label, x, y, w, h, onDown, onUp });
}

function getOrbLayoutScale(w, h) {
  const naturalW = 550 + state.accordionSpread * 168;
  const naturalH = (window.innerWidth <= 820 || document.body.classList.contains('force-mobile')) ? 320 : 255;
  return Math.min(1.0, Math.min((w - 12) / naturalW, (h - 10) / naturalH));
}

function getOrbLayoutCenterY(h) {
  return (window.innerWidth <= 820 || document.body.classList.contains('force-mobile')) ? h * 0.34 : h * 0.47;
}

function cycleEngineVersion(explicitVer = null) {
  const order = ['v4', 'v3', 'v2', 'v1'];
  const labels = {
    v4: 'ENGINE: V4 SAM-RELIEF',
    v3: 'ENGINE: V3 HYBRID-3D',
    v2: 'ENGINE: V2 PURE-3D',
    v1: 'ENGINE: V1 CANVAS-LAB'
  };
  const nextVer = (explicitVer && order.includes(explicitVer))
    ? explicitVer
    : order[(order.indexOf(state.engineVersion || 'v4') + 1) % order.length];
  state.engineVersion = nextVer;
  const btn = document.getElementById('engineVerBtn');
  if (btn) btn.textContent = labels[nextVer] || labels.v4;
  const wgl = document.getElementById('webglCanvas');
  if (wgl) wgl.style.display = (nextVer === 'v1') ? 'none' : 'block';
  playMicroSwitchClick(true, 180);
}
window.cycleEngineVersion = cycleEngineVersion;

function syncMobileDockUI() {
  const shot = state.activeShot || 'bugeye';
  const samShot = (window.STELLINE_SAM_DB && window.STELLINE_SAM_DB.shots && window.STELLINE_SAM_DB.shots[shot])
    ? window.STELLINE_SAM_DB.shots[shot]
    : null;
  const samRow = document.getElementById('mobileSamRow');
  if (samRow && samShot && Array.isArray(samShot.objects)) {
    const btns = samRow.querySelectorAll('button');
    const selIdx = ((state.selectedNodeIdx || 0) % 4 + 4) % 4;
    btns.forEach((b, idx) => {
      const obj = samShot.objects[idx];
      if (obj) b.textContent = `${idx + 1}:${obj.id}`;
      b.classList.toggle('active', idx === selIdx);
    });
  }
  const pKey = (state.scene === 'birthday') ? 'cake' : 'bug';
  const proto = (typeof OPERATOR_PROTOCOLS !== 'undefined' && OPERATOR_PROTOCOLS[pKey]) ? OPERATOR_PROTOCOLS[pKey] : null;
  for (let i = 0; i < 5; i++) {
    const lbl = document.getElementById(`mDialLbl${i}`);
    const inp = document.getElementById(`mDialIn${i}`);
    if (lbl && proto && proto.dialLabels && proto.dialLabels[i]) {
      lbl.textContent = proto.dialLabels[i];
      lbl.style.color = (state.activeCoupledRing === i) ? '#f0a848' : '#38d9c0';
    }
    if (inp && document.activeElement !== inp && state.rings[i]) {
      inp.value = Math.round(state.rings[i].angle);
    }
  }
  const spIn = document.getElementById('mSpreadIn');
  if (spIn && document.activeElement !== spIn) {
    spIn.value = Math.round(state.accordionSpread * 100);
  }
}

function renderOrbHardware() {
  const w = orbCanvas.clientWidth;
  const h = orbCanvas.clientHeight;
  const ctx = orbCtx;
  ctx.clearRect(0, 0, w, h);
  currentHitboxes = [];

  if (state.viewMode === 'bearing') {
    renderWallaceBearingReader(ctx, w, h);
    return;
  }

  const orbScale = getOrbLayoutScale(w, h);
  const baseCy = getOrbLayoutCenterY(h);
  ctx.save();
  if (orbScale < 0.999) {
    ctx.translate(w * 0.5, baseCy);
    ctx.scale(orbScale, orbScale);
    ctx.translate(-w * 0.5, -baseCy);
  }

  // Apply subtle bimanual wrist mass inertia offset
  const cx = w * 0.5 + state.tiltX * 9;
  const cy = baseCy + state.tiltY * 7;
  const spreadPx = state.accordionSpread * 84;
  const isXray = state.viewMode === 'xray';
  const isSpecs = state.viewMode === 'specs';
  const specShift = state.tiltY * 18; // Dynamic specular highlight shift with wrist tilt

  // Ambient shadow beneath the 1.42 kg prop
  const shadowGrad = ctx.createRadialGradient(cx, cy + 132, 16, cx, cy + 132, 290 + spreadPx);
  shadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0.82)');
  shadowGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = shadowGrad;
  ctx.fillRect(0, cy + 75, w, h - (cy + 75));

  // --------------------------------------------------------------------------
  // 1. UNDERSIDE DUAL RACK-AND-PINION SYNCHRONIZER (Kyle Martin / Adam Savage)
  // --------------------------------------------------------------------------
  const rackY = cy + 98;
  const rackSpan = 114 + spreadPx;
  ctx.save();
  ctx.fillStyle = isXray ? 'rgba(240, 168, 72, 0.22)' : '#545d66';
  ctx.strokeStyle = isXray ? '#f0a848' : '#8b95a0';
  ctx.lineWidth = 1.4;
  ctx.fillRect(cx - rackSpan, rackY - 8, rackSpan * 2, 16);
  ctx.strokeRect(cx - rackSpan, rackY - 8, rackSpan * 2, 16);

  for (let tx = -rackSpan + 8; tx < rackSpan - 8; tx += 6.5) {
    ctx.fillStyle = isXray ? '#f0a848' : '#232930';
    ctx.fillRect(cx + tx, rackY - 6, 3, 3.5);
    ctx.fillRect(cx - tx, rackY + 2.5, 3, 3.5);
  }

  ctx.save();
  ctx.translate(cx, rackY);
  ctx.rotate(state.accordionSpread * Math.PI * 5);
  ctx.fillStyle = isXray ? '#f0a848' : '#d0dae4';
  ctx.beginPath();
  ctx.arc(0, 0, 11, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  for (let g = 0; g < 10; g++) {
    ctx.rotate(Math.PI / 5);
    ctx.fillRect(-1.5, -13, 3, 26);
  }
  ctx.restore();
  ctx.restore();

  registerHitbox(
    'rack_pinion',
    'UNDERSIDE DUAL RACK & PINION SYNCHRONIZER [BALANCES ACCORDION CALLIOPE SPREAD]',
    cx - rackSpan, rackY - 10, rackSpan * 2, 22,
    () => setAccordionSpread(state.accordionTarget > 0.5 ? 18 : 82, true)
  );

  // --------------------------------------------------------------------------
  // 2. TOP BRIDGE BAR & BUTTERFLY NECK-STRAP CLASP (crop_center_rings.jpg)
  // --------------------------------------------------------------------------
  const bridgeY = cy - 102;
  ctx.save();
  ctx.fillStyle = '#7c858f';
  ctx.strokeStyle = '#b8c2cc';
  ctx.lineWidth = 1.3;
  ctx.fillRect(cx - (104 + spreadPx), bridgeY, (104 + spreadPx) * 2, 9);
  ctx.strokeRect(cx - (104 + spreadPx), bridgeY, (104 + spreadPx) * 2, 9);

  ctx.translate(cx, bridgeY);
  ctx.fillStyle = '#525a63';
  ctx.fillRect(-28, -15, 56, 17);
  ctx.strokeRect(-28, -15, 56, 17);
  // Hinge pin & machined slots on clasp base
  ctx.fillStyle = '#252b32';
  ctx.fillRect(-18, -11, 8, 9);
  ctx.fillRect(10, -11, 8, 9);

  if (state.neckClaspOpen) {
    for (let side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * 8, -15);
      ctx.lineTo(side * 52, -26);
      ctx.lineTo(side * 47, -17);
      ctx.lineTo(side * 10, -9);
      ctx.closePath();
      ctx.fillStyle = '#2c333b';
      ctx.fill();
      ctx.stroke();
    }
    ctx.fillStyle = '#1b2026';
    ctx.fillRect(-11, -54, 22, 39);
    ctx.strokeRect(-11, -54, 22, 39);
    ctx.strokeStyle = '#454e58';
    ctx.strokeRect(-6, -48, 12, 26);
  }
  ctx.restore();

  registerHitbox(
    'neck_clasp',
    'TOP BUTTERFLY NECK-STRAP CLASP [CLICK TO DEPLOY / FOLD LATCH]',
    cx - 54, bridgeY - 56, 108, 58,
    () => toggleNeckClasp()
  );

  // --------------------------------------------------------------------------
  // 3. TELESCOPIC ACCORDION SLEEVE SEGMENTS
  // --------------------------------------------------------------------------
  if (spreadPx > 2) {
    for (let side of [-1, 1]) {
      const baseEdge = cx + side * 90;
      const outerEdge = cx + side * (90 + spreadPx);
      const segs = 3;
      for (let s = 0; s < segs; s++) {
        const t0 = s / segs;
        const t1 = (s + 1) / segs;
        const x0 = baseEdge + (outerEdge - baseEdge) * t0;
        const x1 = baseEdge + (outerEdge - baseEdge) * t1;
        const hSeg = 84 - s * 5;
        const leftX = Math.min(x0, x1);
        const widthX = Math.abs(x1 - x0);

        const grad = ctx.createLinearGradient(0, cy - hSeg, 0, cy + hSeg);
        grad.addColorStop(0, '#4f5862');
        grad.addColorStop(0.28, '#b6c0ca');
        grad.addColorStop(0.68, '#626d79');
        grad.addColorStop(1, '#262c33');
        ctx.fillStyle = isXray ? 'rgba(88, 166, 255, 0.14)' : grad;
        ctx.strokeStyle = isXray ? '#58a6ff' : '#2a3139';
        ctx.fillRect(leftX, cy - hSeg, widthX, hSeg * 2);
        ctx.strokeRect(leftX, cy - hSeg, widthX, hSeg * 2);
      }
    }
  }

  // --------------------------------------------------------------------------
  // 4. THE 5 CONCENTRIC MOTORIZED CENTER RINGS
  // Rendered with true 3D cylindrical cosine perspective wrapping (sin/cos)
  // and flush coaxial lens-barrel geometry (sec_030.jpg).
  // --------------------------------------------------------------------------
  const ringConfigs = [
    { idx: 0, xOff: -82 - spreadPx * 0.36, width: 34, radius: 95, type: 'collarL', title: 'RING 01 [CHROME COLLAR: 10-30 VR / MICRO-CT X-RAY TO CHITIN & APERTURE]' },
    { idx: 1, xOff: -42 - spreadPx * 0.17, width: 46, radius: 91, type: 'focal',   title: 'RING 02 [DUAL-BAND: BLUE-SLATE FOCAL 10-300 + RED VERNIER / 5-CAM PARALLAX]' },
    { idx: 2, xOff:   0,                   width: 34, radius: 89, type: 'knurl',   title: 'RING 03 [DUAL-BAND: RED VERNIER + 120-TOOTH KNURL / TIME-SLICE SCRUBBING]' },
    { idx: 3, xOff:  42 + spreadPx * 0.17, width: 46, radius: 91, type: 'moire',   title: 'RING 04 [3-BAND PEWTER MOIRE: BLACK TRIANGLES & SLOTS / AFFECTIVE MESS & ELYTRA]' },
    { idx: 4, xOff:  82 + spreadPx * 0.36, width: 34, radius: 95, type: 'collarR', title: 'RING 05 [CHROME COLLAR: W-T VR / HERO CAKE VARIATION & KELVIN WARMTH]' }
  ];

  ringConfigs.forEach(rc => {
    const ring = state.rings[rc.idx];
    const rx = cx + rc.xOff - rc.width / 2;
    const ry = cy - rc.radius;
    const rw = rc.width;
    const rh = rc.radius * 2;
    const R = rc.radius;
    const rotRad = (ring.angle * Math.PI) / 180;

    ctx.save();
    ctx.beginPath();
    ctx.rect(rx, ry, rw, rh);
    ctx.clip();

    if (isXray) {
      ctx.fillStyle = 'rgba(18, 30, 44, 0.68)';
      ctx.fillRect(rx, ry, rw, rh);
      for (let i = 0; i < 36; i++) {
        const theta = (i / 36) * Math.PI * 2 + rotRad;
        const sinT = Math.sin(theta);
        const cosT = Math.cos(theta);
        if (cosT <= 0) continue;
        const yPos = cy + sinT * R;
        ctx.strokeStyle = `rgba(56, 217, 192, ${0.15 + cosT * 0.45})`;
        ctx.lineWidth = Math.max(0.6, cosT * 1.4);
        ctx.beginPath();
        ctx.moveTo(rx + 2, yPos);
        ctx.lineTo(rx + rw - 2, yPos);
        ctx.stroke();
      }
      const motorY = cy + (rc.idx - 2) * 28;
      ctx.fillStyle = '#1b2c3e';
      ctx.strokeStyle = '#f0a848';
      ctx.fillRect(rx + 3, motorY - 10, rw - 6, 20);
      ctx.strokeRect(rx + 3, motorY - 10, rw - 6, 20);
      ctx.fillStyle = '#f0a848';
      ctx.beginPath();
      ctx.arc(rx + rw / 2, motorY, 5.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (rc.type === 'focal') {
      // RING 2: Sub-Band 2A (Blue-Slate Anodized) & Sub-Band 2B (Brushed Steel with Red Triangular Verniers)
      const splitW = rw * 0.60;
      const g2A = ctx.createLinearGradient(0, ry + specShift, 0, ry + rh + specShift);
      g2A.addColorStop(0, '#161e27');
      g2A.addColorStop(0.22, '#8b9fb8');
      g2A.addColorStop(0.48, '#46576b');
      g2A.addColorStop(0.78, '#7589a1');
      g2A.addColorStop(1, '#121820');
      ctx.fillStyle = g2A;
      ctx.fillRect(rx, ry, splitW, rh);

      const g2B = ctx.createLinearGradient(0, ry + specShift, 0, ry + rh + specShift);
      g2B.addColorStop(0, '#222830');
      g2B.addColorStop(0.22, '#d0d8e0');
      g2B.addColorStop(0.48, '#7a848f');
      g2B.addColorStop(0.78, '#b4bec8');
      g2B.addColorStop(1, '#1a1f25');
      ctx.fillStyle = g2B;
      ctx.fillRect(rx + splitW, ry, rw - splitW, rh);

      // Machined groove & white index baseline between 2A and 2B
      ctx.strokeStyle = 'rgba(235, 245, 255, 0.72)';
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(rx + splitW - 0.5, ry);
      ctx.lineTo(rx + splitW - 0.5, ry + rh);
      ctx.stroke();

      // Cylindrical perspective focal numbers (10..300, ∞) + elongated crimson vernier pointers
      const stopsWithInf = [...FOCAL_STOPS, '∞'];
      stopsWithInf.forEach((num, i) => {
        const theta = (i / stopsWithInf.length) * Math.PI * 2 + rotRad;
        const sinT = Math.sin(theta);
        const cosT = Math.cos(theta);
        if (cosT <= 0.04) return;
        const yPos = cy + sinT * R;
        const alpha = Math.pow(cosT, 0.55);

        ctx.save();
        ctx.translate(rx, yPos);
        ctx.scale(1, cosT); // True cylindrical vertical foreshortening!

        // White engraved focal number
        ctx.fillStyle = `rgba(244, 249, 255, ${alpha * 0.95})`;
        ctx.font = '600 8.5px -apple-system, BlinkMacSystemFont, "Inter", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(String(num), 3.5, 3);

        // White perpendicular index tick touching baseline
        ctx.strokeStyle = `rgba(244, 249, 255, ${alpha * 0.9})`;
        ctx.lineWidth = 1.0;
        ctx.beginPath();
        ctx.moveTo(splitW - 5.5, 0);
        ctx.lineTo(splitW - 0.5, 0);
        ctx.stroke();

        // Sharp elongated crimson-red vernier pointer on Sub-Band 2B (matching decal_rings_zoom.jpg)
        ctx.fillStyle = `rgba(218, 38, 42, ${alpha * 0.95})`;
        ctx.beginPath();
        ctx.moveTo(splitW + 1.5, 0);
        ctx.lineTo(rw - 2, -1.2);
        ctx.lineTo(rw - 2, 1.2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });
    } else if (rc.type === 'knurl') {
      // RING 3: Sub-Band 3A (Satin Silver with Crimson Hairlines) + Sub-Band 3B (120-Flute Gear Knurl)
      const splitW = rw * 0.44;
      const g3 = ctx.createLinearGradient(0, ry + specShift, 0, ry + rh + specShift);
      g3.addColorStop(0, '#252b32');
      g3.addColorStop(0.22, '#e4ebf2');
      g3.addColorStop(0.5, '#8c96a0');
      g3.addColorStop(0.78, '#d4dce4');
      g3.addColorStop(1, '#1e2329');
      ctx.fillStyle = g3;
      ctx.fillRect(rx, ry, rw, rh);

      // Subtle machined seam between 3A and 3B
      ctx.strokeStyle = 'rgba(30, 36, 42, 0.55)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(rx + splitW, ry);
      ctx.lineTo(rx + splitW, ry + rh);
      ctx.stroke();

      // Cylindrical 120-flute precision gear knurling on 3B
      for (let k = 0; k < 72; k++) {
        const theta = (k / 72) * Math.PI * 2 + rotRad;
        const sinT = Math.sin(theta);
        const cosT = Math.cos(theta);
        if (cosT <= 0.02) continue;
        const yPos = cy + sinT * R;
        ctx.strokeStyle = `rgba(24, 30, 36, ${0.25 + cosT * 0.52})`;
        ctx.lineWidth = Math.max(0.5, cosT * 1.15);
        ctx.beginPath();
        ctx.moveTo(rx + splitW + 1, yPos);
        ctx.lineTo(rx + rw - 1, yPos);
        ctx.stroke();
      }

      // Crimson vernier alignment hairlines on 3A
      for (let rt = 0; rt < 16; rt++) {
        const theta = (rt / 16) * Math.PI * 2 + rotRad;
        const sinT = Math.sin(theta);
        const cosT = Math.cos(theta);
        if (cosT <= 0.05) continue;
        const yPos = cy + sinT * R;
        ctx.strokeStyle = `rgba(215, 38, 42, ${Math.pow(cosT, 0.6) * 0.9})`;
        ctx.lineWidth = Math.max(0.6, cosT * 1.2);
        ctx.beginPath();
        ctx.moveTo(rx + 1, yPos);
        ctx.lineTo(rx + splitW - 2, yPos);
        ctx.stroke();
      }
    } else if (rc.type === 'moire') {
      // RING 4: 3 Brushed Pewter Sub-Bands (◄ Equilateral Triangles | Recessed Dash Slots | ◄ Equilateral Triangles)
      const g4 = ctx.createLinearGradient(0, ry + specShift, 0, ry + rh + specShift);
      g4.addColorStop(0, '#22272d');
      g4.addColorStop(0.22, '#d2d9e0');
      g4.addColorStop(0.5, '#76808a');
      g4.addColorStop(0.78, '#c0c8d0');
      g4.addColorStop(1, '#1a1f24');
      ctx.fillStyle = g4;
      ctx.fillRect(rx, ry, rw, rh);

      const b1 = rw * 0.33;
      const b2 = rw * 0.66;
      ctx.strokeStyle = 'rgba(28, 34, 40, 0.78)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(rx + b1, ry);
      ctx.lineTo(rx + b1, ry + rh);
      ctx.moveTo(rx + b2, ry);
      ctx.lineTo(rx + b2, ry + rh);
      ctx.stroke();

      for (let ti = 0; ti < 18; ti++) {
        const theta = (ti / 18) * Math.PI * 2 + rotRad;
        const sinT = Math.sin(theta);
        const cosT = Math.cos(theta);
        if (cosT <= 0.04) continue;
        const yPos = cy + sinT * R;
        const alpha = Math.pow(cosT, 0.55);

        ctx.save();
        ctx.translate(0, yPos);
        ctx.scale(1, cosT);

        // Band A & Band C: Pad-printed matte black equilateral triangles pointing left (◄)
        ctx.fillStyle = `rgba(18, 22, 27, ${alpha * 0.92})`;
        for (let bx of [rx + 3.5, rx + b2 + 3.5]) {
          ctx.beginPath();
          ctx.moveTo(bx, 0);
          ctx.lineTo(bx + 6.2, -2.5);
          ctx.lineTo(bx + 6.2, 2.5);
          ctx.closePath();
          ctx.fill();
        }

        // Band B (Middle): Recessed machined axial slot with bottom specular edge
        ctx.fillStyle = `rgba(22, 27, 33, ${alpha * 0.88})`;
        ctx.fillRect(rx + b1 + 3, -1.1, (b2 - b1) - 6, 2.2);
        ctx.fillStyle = `rgba(240, 248, 255, ${alpha * 0.45})`;
        ctx.fillRect(rx + b1 + 3, 1.1, (b2 - b1) - 6, 0.7);
        ctx.restore();
      }
    } else {
      // RINGS 1 & 5: Mirror-Polished Chrome Collars with Cylindrical "10-30 VR", "◄ W — T ►", "05-01" & Dog-Clutch Slots
      const gChrome = ctx.createLinearGradient(0, ry + specShift, 0, ry + rh + specShift);
      gChrome.addColorStop(0, '#262c34');
      gChrome.addColorStop(0.18, '#f7fbff');
      gChrome.addColorStop(0.45, '#828d98');
      gChrome.addColorStop(0.76, '#eef4fa');
      gChrome.addColorStop(1, '#1e232a');
      ctx.fillStyle = gChrome;
      ctx.fillRect(rx, ry, rw, rh);

      const collarDecals = [
        { type: 'text', text: '10-30' },
        { type: 'text', text: 'VR' },
        { type: 'slot' },
        { type: 'arrows', text: 'W   T' },
        { type: 'text', text: '05-01' },
        { type: 'slot' },
        { type: 'text', text: '10-30' },
        { type: 'arrows', text: 'T   W' }
      ];
      collarDecals.forEach((item, i) => {
        const theta = (i / collarDecals.length) * Math.PI * 2 + rotRad;
        const sinT = Math.sin(theta);
        const cosT = Math.cos(theta);
        if (cosT <= 0.05) return;
        const yPos = cy + sinT * R;
        const alpha = Math.pow(cosT, 0.6);

        ctx.save();
        ctx.translate(rx, yPos);
        ctx.scale(1, cosT);
        if (item.type === 'slot') {
          // Machined rectangular dog-clutch index notch (visible in decal_rings_zoom.jpg)
          ctx.fillStyle = `rgba(28, 34, 42, ${alpha * 0.75})`;
          ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.5})`;
          ctx.lineWidth = 0.8;
          ctx.fillRect(6, -2.5, rw - 12, 5);
          ctx.strokeRect(6, -2.5, rw - 12, 5);
        } else {
          ctx.fillStyle = `rgba(24, 30, 38, ${alpha * 0.9})`;
          ctx.font = '700 7.2px -apple-system, BlinkMacSystemFont, "Inter", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(item.text, rw / 2, 2.5);
          if (item.type === 'arrows') {
            // Tiny crisp arrowheads above/below W and T
            ctx.beginPath();
            ctx.moveTo(4, 0); ctx.lineTo(7, -2); ctx.lineTo(7, 2); ctx.closePath();
            ctx.moveTo(rw - 4, 0); ctx.lineTo(rw - 7, -2); ctx.lineTo(rw - 7, 2); ctx.closePath();
            ctx.fill();
          }
        }
        ctx.restore();
      });
    }

    // Subtle cylindrical top/bottom edge shadow & specular highlight
    const rimShadow = ctx.createLinearGradient(0, ry, 0, ry + rh);
    rimShadow.addColorStop(0, 'rgba(0,0,0,0.52)');
    rimShadow.addColorStop(0.08, 'rgba(0,0,0,0)');
    rimShadow.addColorStop(0.92, 'rgba(0,0,0,0)');
    rimShadow.addColorStop(1, 'rgba(0,0,0,0.58)');
    ctx.fillStyle = rimShadow;
    ctx.fillRect(rx, ry, rw, rh);

    ctx.restore();

    ctx.strokeStyle = isXray ? '#38d9c0' : '#181d23';
    ctx.lineWidth = 1.3;
    ctx.strokeRect(rx, ry, rw, rh);

    // Subtle 3D elliptical seam highlight along the vertical ring boundary
    if (!isXray) {
      ctx.save();
      ctx.strokeStyle = 'rgba(240, 248, 255, 0.22)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.ellipse(rx + rw, cy, 2.2, rh * 0.49, 0, -Math.PI * 0.48, Math.PI * 0.48);
      ctx.stroke();
      ctx.restore();
    }

    registerHitbox(rc.type + '_' + rc.idx, rc.title + ' [DRAG VERTICALLY TO ROTATE]', rx, ry, rw, rh);
  });

  // --------------------------------------------------------------------------
  // 5. LEFT & RIGHT OUTER HAND-GRIP PODS (Flush Coaxial Barrel Proportions)
  // --------------------------------------------------------------------------
  drawOuterGripPod(ctx, cx, cy, -1, spreadPx, isXray, specShift);
  drawOuterGripPod(ctx, cx, cy,  1, spreadPx, isXray, specShift);

  // --------------------------------------------------------------------------
  // 5A. DIEGETIC 5-RING OPERATIVE COUPLING & SAM ITEM ADDRESSING STRIP
  // Connects all 5 Physical Rings (L1..R2) + [SELECT] Stencil 1:1 to Selected SAM Item
  // --------------------------------------------------------------------------
  if (!isXray && !isSpecs) {
    const samShot = (window.STELLINE_SAM_DATA && window.STELLINE_SAM_DATA[state.activeShot]) || null;
    const graph = (window.SCENE_OPERATIVE_GRAPH && (window.SCENE_OPERATIVE_GRAPH[state.activeShot] || window.SCENE_OPERATIVE_GRAPH.bugeye)) || null;
    const nodes = Array.isArray(samShot) ? samShot : (samShot && samShot.objects ? samShot.objects : (Array.isArray(graph) ? graph : (graph && graph.nodes ? graph.nodes : [])));
    const selIdx = nodes.length > 0 ? (state.selectedNodeIdx || 0) % nodes.length : 0;
    const selNode = nodes[selIdx] || null;
    const stripY = cy - 118;
    const rOffs = [-82 - spreadPx * 0.36, -42 - spreadPx * 0.17, 0, 42 + spreadPx * 0.17, 82 + spreadPx * 0.36];
    const protoKey = (state.scene === 'birthday') ? 'cake' : 'bug';
    const protoObj = (window.OPERATOR_PROTOCOLS && window.OPERATOR_PROTOCOLS[protoKey]) || null;
    const rTags = (protoObj && protoObj.dialLabels) ? protoObj.dialLabels : ['L1:SOLID', 'L2:FOCUS', 'L3:MORPH', 'R1:LUMA', 'R2:TINT'];
    const vIdx = (state.otherwiseVariant && state.otherwiseVariant[protoKey]) || 0;
    const vObj = (protoObj && protoObj.otherwise && protoObj.otherwise[vIdx]) || null;
    ctx.save();
    if (selNode) {
      const targetName = selNode.name || selNode.label || selNode.id || `ITEM.0${selIdx + 1}`;
      const protoTitle = protoObj ? protoObj.id.split('//')[1].trim() : 'ORB.OS';
      const otherwiseTag = (vIdx > 0 && vObj) ? ` // ${vObj.code.split('[')[0].trim()}` : '';
      ctx.fillStyle = vIdx > 0 ? '#ffd080' : 'rgba(235, 244, 252, 0.88)';
      ctx.font = '600 6.8px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`${protoTitle} -> SAM[${selIdx + 1}/4]: ${targetName}${otherwiseTag}`, cx, stripY - 12);
    }
    for (let i = 0; i < 5; i++) {
      const tagX = cx + rOffs[i];
      const isMovingRing = (state.activeCoupledRing === i);
      const isWeaveRing = state.inverseWeave && state.inverseWeave.active && state.inverseWeave.activeRingIdx === i;
      const active = isMovingRing || isWeaveRing;
      ctx.fillStyle = active ? 'rgba(240, 168, 72, 0.25)' : 'rgba(12, 16, 22, 0.78)';
      ctx.strokeStyle = active ? 'rgba(240, 168, 72, 0.95)' : 'rgba(210, 224, 238, 0.38)';
      ctx.lineWidth = active ? 1.15 : 0.8;
      ctx.fillRect(tagX - 20, stripY - 7, 40, 13);
      ctx.strokeRect(tagX - 20, stripY - 7, 40, 13);
      ctx.fillStyle = active ? '#ffd080' : 'rgba(225, 236, 246, 0.88)';
      ctx.font = '700 5.3px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`${rTags[i]}`, tagX, stripY + 1.5);
    }
    ctx.restore();
  }

  // --------------------------------------------------------------------------
  // 5B. SCENE -> INTERFACE OPTICAL REFLECTION COUPLING
  // The active 3D hologram casts its live chromatic light field onto the
  // brushed aluminum barrel flutes, chrome collars, and outer glass lenses!
  // --------------------------------------------------------------------------
  if (state.sceneLightTint && !isXray) {
    const lt = state.sceneLightTint;
    const reflGrad = ctx.createRadialGradient(cx, cy - 88, 12, cx, cy - 42, 220 + spreadPx);
    reflGrad.addColorStop(0, `rgba(${lt.r}, ${lt.g}, ${lt.b}, ${(lt.intensity * 0.24).toFixed(3)})`);
    reflGrad.addColorStop(0.55, `rgba(${lt.r}, ${lt.g}, ${lt.b}, ${(lt.intensity * 0.08).toFixed(3)})`);
    reflGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = reflGrad;
    ctx.fillRect(cx - 210 - spreadPx, cy - 108, (210 + spreadPx) * 2, 165);
    ctx.restore();
  }

  // --------------------------------------------------------------------------
  // 6. HIGHLIGHT HOVERED COMPONENT & X-RAY / BLUEPRINT CALLOUTS
  // --------------------------------------------------------------------------
  // Highlight active ring & banner during Inverse-Design Auto-Weave
  if (state.inverseWeave && state.inverseWeave.active) {
    const aIdx = state.inverseWeave.activeRingIdx;
    if (aIdx >= 0 && aIdx < 5) {
      const rOffs = [-82 - spreadPx * 0.36, -42 - spreadPx * 0.17, 0, 42 + spreadPx * 0.17, 82 + spreadPx * 0.36];
      const rx = cx + rOffs[aIdx] - 18;
      const ry = cy - 95;
      ctx.save();
      ctx.strokeStyle = '#f0a848';
      ctx.lineWidth = 2.0;
      ctx.shadowColor = '#f0a848';
      ctx.shadowBlur = 10;
      ctx.strokeRect(rx - 3, ry - 3, 36, 190);
      ctx.restore();
    }
  }

  if (state.hoveredHitbox) {
    const hb = state.hoveredHitbox;
    ctx.save();
    ctx.strokeStyle = 'rgba(56, 217, 192, 0.85)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(hb.x - 2, hb.y - 2, hb.w + 4, hb.h + 4);
    ctx.restore();
  }

  if (isXray) {
    ctx.save();
    ctx.strokeStyle = '#38d9c0';
    ctx.fillStyle = 'rgba(10, 18, 26, 0.88)';
    ctx.fillRect(cx - 64, cy - 24, 128, 48);
    ctx.strokeRect(cx - 64, cy - 24, 128, 48);
    ctx.fillStyle = '#38d9c0';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('INTERNAL 9V CELL + REED SW', cx, cy - 6);
    ctx.fillStyle = '#f0a848';
    ctx.fillText(`5x SPUR MOTORS [${state.batteryVolts.toFixed(2)}V]`, cx, cy + 11);
    ctx.restore();
  }

  if (isSpecs) {
    ctx.save();
    ctx.strokeStyle = '#f0a848';
    ctx.fillStyle = '#f0a848';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    const totalW = 208 + spreadPx;
    ctx.beginPath();
    ctx.moveTo(cx - totalW, cy - 135);
    ctx.lineTo(cx + totalW, cy - 135);
    ctx.stroke();
    ctx.fillText(
      `OVERALL WIDTH: ${(6.3 + state.accordionSpread * 2.05).toFixed(2)}" (${(160 + state.accordionSpread * 52).toFixed(1)} MM) · HEIGHT: 5.0" · DEPTH: 4.4" · MASS: 1.42 KG`,
      cx, cy - 141
    );
    ctx.restore();
  }
}

function drawOuterGripPod(ctx, cx, cy, side, spreadPx, isXray, specShift) {
  const podCenter = cx + side * (135 + spreadPx * 0.56);
  const podW = 74;
  const podH = 194;
  const x0 = podCenter - podW / 2;
  const y0 = cy - podH / 2;

  ctx.save();

  // 1. OUTER CONCAVE OPTICAL GLASS ELEMENT + BLACK FLUTED ELASTOMER LENS RING
  const lensX = podCenter + side * 30;
  const glassGrad = ctx.createRadialGradient(lensX + side * 6, cy - 14, 4, lensX, cy, 74);
  glassGrad.addColorStop(0, 'rgba(88, 210, 235, 0.42)');
  glassGrad.addColorStop(0.45, 'rgba(42, 68, 110, 0.55)');
  glassGrad.addColorStop(1, '#090d12');
  ctx.fillStyle = glassGrad;
  ctx.strokeStyle = '#7c8794';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(lensX + side * 8, cy, 16, 74, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#14171b';
  ctx.strokeStyle = '#323942';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(lensX - 18, cy - 84, 36, 168, 9);
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = '#272d35';
  for (let ry = cy - 76; ry <= cy + 76; ry += 4.5) {
    ctx.beginPath();
    ctx.moveTo(lensX - 16, ry);
    ctx.lineTo(lensX + 16, ry);
    ctx.stroke();
  }

  // 2. MAIN BEAD-BLASTED MATTE GREY ANODIZED ALUMINUM SHELL
  const bodyGrad = ctx.createLinearGradient(0, y0 + specShift, 0, y0 + podH + specShift);
  bodyGrad.addColorStop(0, '#555d66');
  bodyGrad.addColorStop(0.2, '#c5cdd5');
  bodyGrad.addColorStop(0.5, '#919aa4');
  bodyGrad.addColorStop(0.84, '#69717a');
  bodyGrad.addColorStop(1, '#2d333a');

  ctx.fillStyle = isXray ? 'rgba(42, 54, 68, 0.5)' : bodyGrad;
  ctx.strokeStyle = isXray ? '#58a6ff' : '#22272d';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(x0, y0, podW, podH, 11);
  ctx.fill();
  ctx.stroke();

  if (!isXray) {
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(x0, y0, podW, podH, 11);
    ctx.clip();
    BEAD_GRAIN_POINTS.forEach(pt => {
      const gx = x0 + pt.rx * podW;
      const gy = y0 + pt.ry * podH;
      ctx.fillStyle = pt.bright ? `rgba(255,255,255,${pt.alpha})` : `rgba(20,25,30,${pt.alpha})`;
      ctx.fillRect(gx, gy, 1.2, 1.2);
    });
    ctx.restore();
  }

  // Stepped mid-body grip plate with recessed chamfer & silk-screened ◄|► slide pills
  const plateX = side === -1 ? x0 + 8 : x0 + 12;
  const plateY = y0 + 80;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
  ctx.fillRect(plateX, plateY, 54, 56);
  ctx.strokeStyle = '#363e47';
  ctx.lineWidth = 1.1;
  ctx.strokeRect(plateX, plateY, 54, 56);
  drawPillArrowIcon(ctx, plateX + 27, plateY - 6);
  drawPillArrowIcon(ctx, plateX + 27, plateY + 63);

  if (side === -1) {
    // ========================================================================
    // LEFT HAND POD SILK-SCREENED DECALS & CONTROLS (decal_left_top.jpg)
    // ========================================================================
    // Inner bezel ZOOM slot engraving
    ctx.strokeStyle = '#2d343d';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(x0 + 56, y0 + 10, 6, 22);
    ctx.fillStyle = '#252b33';
    ctx.font = '600 5px sans-serif';
    ctx.fillText('ZOOM', x0 + 40, y0 + 14);

    // 1. Top Red-Dot Spun Button + Precision Crimson Silk-Screen Callout Lines
    const bLockX = x0 + 34, bLockY = y0 + 20;
    drawSpunMetalButton(ctx, bLockX, bLockY, 8.5, true, state.pressedOnPropBtn === 'lock_btn');
    drawRedStencilCallout(ctx, bLockX - 6, bLockY + 9, -8, 7, 'AF');
    registerHitbox('lock_btn', 'LEFT POD RED-DOT LOCK / IMPRINT BUTTON [IMPRINTS MEMORY TO WALLACE GLASS BEARING]', bLockX - 10, bLockY - 10, 20, 20,
      () => { state.pressedOnPropBtn = 'lock_btn'; triggerBearingImprint(); },
      () => { state.pressedOnPropBtn = null; playMicroSwitchClick(false, 300); }
    );

    // 2. Adjacent Aux Spun Button + Pad-Printed "ON •" Label & Crimson Brackets
    const bAuxX = x0 + 15, bAuxY = y0 + 29;
    drawSpunMetalButton(ctx, bAuxX, bAuxY, 6.2, false, state.pressedOnPropBtn === 'aux_btn');
    ctx.fillStyle = '#1b2026';
    ctx.font = '700 5.5px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('ON', x0 + 5, y0 + 43);
    ctx.fillStyle = '#14181d';
    ctx.beginPath();
    ctx.arc(x0 + 17, y0 + 41, 1.4, 0, Math.PI * 2);
    ctx.fill();
    drawRedStencilCallout(ctx, x0 + 11, y0 + 46, -4, 12, 'M');

    registerHitbox('aux_btn', 'LEFT POD AUX POWER / MAGNETIC REED TOGGLE BUTTON', bAuxX - 8, bAuxY - 8, 16, 16,
      () => { state.pressedOnPropBtn = 'aux_btn'; toggleMagneticReed(); },
      () => { state.pressedOnPropBtn = null; }
    );

    // 3. Black Concave 4-Way Rocker with Pad-Printed Camera Glyphs (+/-, Flower, ∞)
    const dpadX = x0 + 26, dpadY = y0 + 50;
    const dpadGrad = ctx.createRadialGradient(dpadX - 3, dpadY - 3, 1, dpadX, dpadY, 12);
    dpadGrad.addColorStop(0, '#2a3038');
    dpadGrad.addColorStop(0.75, '#12161b');
    dpadGrad.addColorStop(1, '#090c0f');
    ctx.fillStyle = dpadGrad;
    ctx.strokeStyle = '#3c4550';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(dpadX, dpadY, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Crisp vector pad-printed icons on the black 4-way rocker (matching decal_left_top.jpg)
    ctx.fillStyle = 'rgba(230, 238, 246, 0.88)';
    ctx.font = '600 5px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('+/-', dpadX, dpadY - 5.5);
    ctx.fillText('∞', dpadX, dpadY + 8.5);
    ctx.fillText('◄', dpadX - 7.5, dpadY + 1.8);
    ctx.fillText('►', dpadX + 7.5, dpadY + 1.8);
    // Center macro reticle dot
    ctx.strokeStyle = 'rgba(230, 238, 246, 0.75)';
    ctx.lineWidth = 0.75;
    ctx.strokeRect(dpadX - 2.5, dpadY - 2.5, 5, 5);

    registerHitbox('dpad_rocker', 'BLACK CONCAVE 4-WAY ROCKER [STEERS HOLOGRAM FOCUS RETICLE X/Y]', dpadX - 13, dpadY - 13, 26, 26,
      (mx, my) => {
        const dx = (mx - dpadX) * 0.012;
        const dy = (my - dpadY) * 0.012;
        pressDpad('orb', dx, dy);
      },
      () => releaseDpad()
    );

    // 4. Deep-Chamfered Rectangular Distance Scale Window (decal_left_top.jpg + Adam Savage LED Mod)
    const winX = x0 + 44, winY = y0 + 35, winW = 20, winH = 34;
    // Outer chamfer bevel
    ctx.fillStyle = '#222830';
    ctx.fillRect(winX - 2, winY - 2, winW + 4, winH + 4);
    // Inner dark recessed well
    ctx.fillStyle = state.savageWindowLight ? '#102e26' : '#0b0e12';
    ctx.strokeStyle = state.savageWindowLight ? '#38d9c0' : '#404954';
    ctx.lineWidth = 1.1;
    ctx.fillRect(winX, winY, winW, winH);
    ctx.strokeRect(winX, winY, winW, winH);

    if (state.savageWindowLight) {
      ctx.save();
      ctx.shadowColor = '#38d9c0';
      ctx.shadowBlur = 12;
      ctx.fillStyle = 'rgba(56, 217, 192, 0.35)';
      ctx.fillRect(winX + 1, winY + 1, winW - 2, winH - 2);
      ctx.restore();
    }

    // Authentic lens distance scale inside window: green 'm', white L-scale, '20', '∞' & moving index
    ctx.fillStyle = '#58d678';
    ctx.font = 'bold 5px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('m', winX + 12, winY + 6);
    ctx.fillStyle = '#dce6f0';
    ctx.fillText('∞', winX + 11, winY + 13);
    ctx.fillText('20', winX + 4, winY + 25);

    ctx.strokeStyle = 'rgba(230, 240, 250, 0.85)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(winX + 13, winY + 15);
    ctx.lineTo(winX + 13, winY + 28);
    ctx.lineTo(winX + 9, winY + 28);
    ctx.stroke();

    // Left & right white center reference ticks on bezel
    ctx.beginPath();
    ctx.moveTo(winX, winY + 17);
    ctx.lineTo(winX + 4, winY + 17);
    ctx.moveTo(winX + winW - 4, winY + 17);
    ctx.lineTo(winX + winW, winY + 17);
    ctx.stroke();

    // Dynamic aperture/focus index bar inside window
    const retY = winY + 7 + (state.rings[0].angle / 360) * (winH - 14);
    ctx.strokeStyle = state.savageWindowLight ? '#38d9c0' : '#d84040';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(winX + 4, retY);
    ctx.lineTo(winX + winW - 4, retY);
    ctx.stroke();

    registerHitbox('savage_window', 'RECESSED DISTANCE SCALE WINDOW [CLICK TO TOGGLE ADAM SAVAGE / MIKE HILL LICENSED LED]', winX - 2, winY - 2, winW + 4, winH + 4,
      () => toggleSavageWindowLight()
    );

    // 5. Lower Left 4-Button Animatronic Motor Actuator Cluster (Drives M1–M4!)
    const lowerBtns = [
      { id: 'm1_btn', ring: 0, dir: 1,  x: x0 + 18, y: y0 + 150, r: 6.5, red: false, label: 'LOWER LEFT MOTOR BUTTON 01 [HOLD TO SPIN RING 01: MICRO-CT / APERTURE]' },
      { id: 'm2_btn', ring: 1, dir: -1, x: x0 + 34, y: y0 + 158, r: 6.5, red: false, label: 'LOWER LEFT MOTOR BUTTON 02 [HOLD TO SPIN RING 02: FOCAL / 5-CAM PARALLAX]' },
      { id: 'm3_btn', ring: 2, dir: 1,  x: x0 + 24, y: y0 + 174, r: 7.5, red: true,  label: 'LOWER LEFT RED-DOT MOTOR BUTTON 03 [HOLD TO SPIN RING 03: TIME-SLICE SCRUB]' },
      { id: 'm4_btn', ring: 3, dir: -1, x: x0 + 40, y: y0 + 186, r: 6.0, red: false, label: 'LOWER LEFT MOTOR BUTTON 04 [HOLD TO SPIN RING 04: AFFECTIVE MESS / ELYTRA]' }
    ];
    lowerBtns.forEach(b => {
      const active = state.rings[b.ring].motorDir !== 0 || state.pressedOnPropBtn === b.id;
      drawSpunMetalButton(ctx, b.x, b.y, b.r, b.red, active);
      registerHitbox(b.id, b.label, b.x - 9, b.y - 9, 18, 18,
        () => { state.pressedOnPropBtn = b.id; startMotorSpin(b.ring, b.dir); },
        () => { state.pressedOnPropBtn = null; stopMotorSpin(b.ring); }
      );
    });
  } else {
    // ========================================================================
    // RIGHT HAND POD SILK-SCREENED DECALS & CONTROLS (decal_right_top.jpg)
    // ========================================================================
    // 1. Upper Spun-Metal Speed Dome with Knurled Skirt & Engraved C-Groove
    const domeX = x0 + 20, domeY = y0 + 22;
    ctx.save();
    ctx.translate(domeX, domeY);
    // Outer knurled collar skirt
    ctx.fillStyle = '#5c6570';
    ctx.beginPath();
    ctx.arc(0, 0, 12.8, 0, Math.PI * 2);
    ctx.fill();
    for (let k = 0; k < 24; k++) {
      const a = (k / 24) * Math.PI * 2 + state.speedDome;

      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 10.5, Math.sin(a) * 10.5);

      ctx.stroke();
    }
    ctx.rotate(state.speedDome * 2.4);
    const domeGrad = ctx.createLinearGradient(-10, -10, 10, 10);

    ctx.strokeStyle = '#2b323a';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.arc(0, 0, 10.5, 0, Math.PI * 2);

    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(0, 0, 6.8, -0.9, 1.5);
    ctx.stroke();
    ctx.fillStyle = '#252b33';
    ctx.beginPath();

    ctx.fill();
    ctx.restore();

    registerHitbox('speed_dome', 'RIGHT POD SPUN-METAL SPEED DOME [DRAG VERTICALLY TO VARY 5-MOTOR RPM 0.2x–2.8x]', domeX - 13, domeY - 13, 26, 26,

    // 2. Recessed Knurled Jog Thumbwheel (decal_right_top.jpg)
    const jogX = x0 + 12, jogY = y0 + 42, jogW = 13, jogH = 26;

    ctx.strokeStyle = '#434c56';
    ctx.lineWidth = 1.1;
    ctx.fillRect(jogX, jogY, jogW, jogH);
    ctx.strokeRect(jogX, jogY, jogW, jogH);

    // Cylindrical 3D shading on exposed thumbwheel drum
    const drumGrad = ctx.createLinearGradient(0, jogY, 0, jogY + jogH);
    drumGrad.addColorStop(0, '#384048');
    drumGrad.addColorStop(0.5, '#c4cdd6');
    drumGrad.addColorStop(1, '#30373e');
    ctx.fillStyle = drumGrad;
    ctx.fillRect(jogX + 2, jogY + 2, jogW - 4, jogH - 4);

    for (let jy = jogY + 3; jy < jogY + jogH - 3; jy += 3.2) {
      const shift = (jy + state.jogWheelPhase) % 3.2;
      ctx.strokeStyle = '#252c34';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(jogX + 2, jy + shift * 0.3);
      ctx.lineTo(jogX + jogW - 2, jy + shift * 0.3);
      ctx.stroke();
    }
    drawPillArrowIcon(ctx, jogX + jogW + 7, jogY + jogH / 2);

    registerHitbox('jog_wheel', 'RECESSED KNURLED JOG THUMBWHEEL [DRAG VERTICALLY TO STEP TIME-SLICE FRAMES]', jogX - 3, jogY - 3, jogW + 14, jogH + 6,
      (mx, my) => {
        state.drag.active = true;
        state.drag.mode = 'jog';
        state.drag.startY = my;
        state.drag.startVal = state.rings[2].angle;

      }

    // 3. Top Right 4-Quadrant Segmented Disc Button + Authentic [SELECT] Stencil Pill (sec_030.jpg)

    registerHitbox('quad_btn', 'RIGHT POD [SELECT] SUB-OBJECT & CAMERA NODE BUTTON [CLICK TO CYCLE 3D SAM ITEM]', quadX - 12, quadY - 12, 24, 24,

    // 4. Middle Right Black-Collar Spun Button

    registerHitbox('mid_r_btn', 'RIGHT POD ENGRAM SELECTOR BUTTON [CLICK TO CYCLE MEMORY CARTRIDGE]', midBtnX - 9, midBtnY - 9, 18, 18,

    );

    // 6. Lower Right Motor 5 & X-Ray Toggle Buttons

      () => { state.pressedOnPropBtn = 'lr1_btn'; startMotorSpin(4, 1); },

    const lr2X = x0 + 22, lr2Y = y0 + 176;

      () => {

        setViewMode(state.viewMode === 'xray' ? 'sculpt' : 'xray');

      () => { state.pressedOnPropBtn = null; }
    );
  }

  ctx.restore();
  ctx.restore();
}

function drawSpunMetalButton(ctx, x, y, r, hasRedDot, isPressed) {
  ctx.save();
  const offset = isPressed ? 1.2 : 0;
  // Dark machined recess collar
  ctx.fillStyle = '#161b20';
  ctx.beginPath();
  ctx.arc(x, y, r + 1.8, 0, Math.PI * 2);
  ctx.fill();

  // Base metallic disc
  const grad = ctx.createLinearGradient(x - r, y - r + offset, x + r, y + r + offset);
  grad.addColorStop(0, isPressed ? '#98a2ac' : '#f4f8fc');
  grad.addColorStop(0.5, isPressed ? '#7a848e' : '#b8c2cc');
  grad.addColorStop(1, '#48505a');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y + offset, r, 0, Math.PI * 2);
  ctx.fill();

  // Anisotropic radial diamond-turned lathe highlight lobes + concentric micro-rings
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y + offset, r - 0.5, 0, Math.PI * 2);
  ctx.clip();
  for (let lobe = 0; lobe < 2; lobe++) {
    const a = lobe * Math.PI + 0.45 + state.tiltX * 0.4;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.32)';
    ctx.beginPath();
    ctx.moveTo(x, y + offset);
    ctx.arc(x, y + offset, r, a - 0.28, a + 0.28);
    ctx.closePath();
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(40, 48, 56, 0.18)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.arc(x, y + offset, r * 0.65, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  ctx.strokeStyle = isPressed ? '#38d9c0' : '#2a3138';
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.arc(x, y + offset, r, 0, Math.PI * 2);
  ctx.stroke();

  if (hasRedDot) {
    ctx.fillStyle = '#d82e32';
    ctx.beginPath();
    ctx.arc(x, y + offset, r * 0.28, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawQuadrantDiscButton(ctx, x, y, r, isPressed) {
  drawSpunMetalButton(ctx, x, y, r, true, isPressed);
  ctx.save();
  const offset = isPressed ? 1.2 : 0;
  ctx.strokeStyle = '#323942';
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  ctx.moveTo(x - r + 1.5, y + offset);
  ctx.lineTo(x - r * 0.38, y + offset);
  ctx.moveTo(x + r * 0.38, y + offset);
  ctx.lineTo(x + r - 1.5, y + offset);
  ctx.moveTo(x, y + offset - r + 1.5);
  ctx.lineTo(x, y + offset - r * 0.38);
  ctx.moveTo(x, y + offset + r * 0.38);
  ctx.lineTo(x, y + offset + r - 1.5);
  ctx.stroke();
  ctx.restore();
}

function drawRedRingThumbButton(ctx, x, y, r, isPressed) {
  drawSpunMetalButton(ctx, x, y, r, false, isPressed);
  ctx.save();
  const offset = isPressed ? 1.2 : 0;
  ctx.strokeStyle = '#d42c30';
  ctx.lineWidth = 1.7;
  ctx.beginPath();
  ctx.arc(x, y + offset, r * 0.42, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawRedStencilCallout(ctx, x, y, dx, dy, tagText) {
  ctx.save();
  ctx.strokeStyle = 'rgba(212, 46, 50, 0.88)';
  ctx.fillStyle = 'rgba(212, 46, 50, 0.92)';
  ctx.lineWidth = 0.85;
  if (tagText === 'SELECT') {
    // Authentic rounded crimson-bordered [SELECT] stencil pill from sec_030.jpg
    const px = x - 1, py = y - 28, pw = 22, ph = 7.2;
    ctx.fillStyle = 'rgba(155, 28, 32, 0.85)';
    ctx.strokeStyle = 'rgba(235, 62, 66, 0.95)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, 3.2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(248, 244, 242, 0.96)';
    ctx.font = '700 4.5px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SELECT', px + pw * 0.5, py + 5.2);
    ctx.restore();
    return;
  }
  ctx.beginPath();
  ctx.arc(x, y, 1.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + dx, y);
  ctx.lineTo(x + dx, y + dy);
  ctx.stroke();
  if (tagText) {
    ctx.font = '600 4.5px sans-serif';
    ctx.textAlign = dx < 0 ? 'right' : 'left';
    ctx.fillText(tagText, x + dx + (dx < 0 ? -1.5 : 1.5), y + dy + 2);
  }
  ctx.restore();
}

function drawPillArrowIcon(ctx, x, y) {
  ctx.save();
  ctx.fillStyle = 'rgba(22, 27, 33, 0.25)';
  ctx.strokeStyle = '#363e48';
  ctx.lineWidth = 0.85;
  ctx.beginPath();
  ctx.roundRect(x - 6.5, y - 3, 13, 6, 3);
  ctx.fill();
  ctx.stroke();
  // Left & right micro triangles + center divider line
  ctx.fillStyle = '#222830';
  ctx.beginPath();
  ctx.moveTo(x - 4.5, y); ctx.lineTo(x - 2, y - 1.7); ctx.lineTo(x - 2, y + 1.7); ctx.closePath();
  ctx.moveTo(x + 4.5, y); ctx.lineTo(x + 2, y - 1.7); ctx.lineTo(x + 2, y + 1.7); ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x, y - 2);
  ctx.lineTo(x, y + 2);
  ctx.stroke();
  ctx.restore();
}
