<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VESPER INSTRUMENTS · FIELD ORB 05 // STELLINE-ORB-PRO</title>
<meta name="description" content="Vesper Instruments Field Orb 05 (Stelline-Orb-Pro): Build the birthday cake and the Blade Runner 2049 birthday memory scene from nothing by turning the rings and pressing the keys on the Orb.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020304;
    color: #e8f0f6;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #orb05App {
    width: 100vw;
    height: 100dvh;
    display: grid;
    grid-template-rows: minmax(0, 62fr) minmax(260px, 38fr);
    background: #020304;
  }
  #chamberStageWrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020304;
    border-bottom: 1px solid rgba(95, 240, 220, 0.24);
  }
  #chamberStageCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  #chamberStageCanvas:active {
    cursor: grabbing;
  }
  #reticleOverlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 4;
  }
  #orbDeckWrap {
    position: relative;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #141c24 0%, #06090d 68%, #020304 100%);
    overflow: hidden;
  }
  #orbProCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
    touch-action: none;
  }
  @media (max-width: 760px) {
    #orb05App {
      grid-template-rows: minmax(0, 54fr) minmax(270px, 46fr);
    }
  }
</style>
</head>
<body>
  <main id="orb05App">
    <section id="chamberStageWrap" aria-label="Stelline Cylindrical Glass Containment Chamber">
      <canvas id="chamberStageCanvas"></canvas>
      <svg id="reticleOverlay" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"></svg>
    </section>
    <section id="orbDeckWrap" aria-label="Stelline-Orb-Pro Machined 5-Ring & Concentric Seed Controller">
      <canvas id="orbProCanvas"></canvas>
    </section>
  </main>

  <script src="assets/three.min.js"></script>
  <script src="assets/v6/anatomy.js"></script>
  <script src="assets/field-orb-05-engine.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      if (window.FIELD_ORB_05) {
        window.FIELD_ORB_05.init();
      }
    });
  </script>
</body>
</html>
