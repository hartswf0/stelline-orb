<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vesper Instruments · Field Orb 05 — Stelline-Orb-Pro Live Virtual Production Studio</title>
<meta name="description" content="VOIDBASTARD-TAO ONLINE. SHOW ONLY WHAT IS TRUE NOW. Stelline-Orb-Pro replaces Blender and floating VR menus with 3 concentric optical rings, in-orb holographic seed preview, capacitive squeeze solidification, and multi-pass embodied performance layering.">
<style>
  :root {
    --bg: #04070a;
    --deck-bg: #080c12;
    --line: #1c2632;
    --ink: #e8f0f6;
    --muted: #8a9bb0;
    --cyan: #5ff0dc;
    --amber: #ffcc66;
    --orange: #ff9f43;
    --green: #98f5b0;
    --red: #ff5a3c;
    --mono: "JetBrains Mono", "SF Mono", "Menlo", monospace;
    --deck-h: 276px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--mono); font-size: 11px;
  }

  /* Pure 2-row architecture: Screen carries ONLY the 3D scene; all controls live on the Orb Deck */
  .app-shell {
    display: grid;
    grid-template-rows: minmax(0, 1fr) var(--deck-h);
    width: 100vw; height: 100vh; height: 100dvh;
  }

  .chamber-stage {
    position: relative; width: 100%; height: 100%;
    background: #030508; overflow: hidden;
  }
  #chamberStageCanvas {
    width: 100%; height: 100%; display: block;
    cursor: crosshair; touch-action: none;
  }

  .orb-pro-deck {
    position: relative; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, #121c28 0%, #05080c 78%);
    border-top: 1px solid var(--line);
  }
  #orbProCanvas {
    width: 100%; height: 100%; display: block;
    cursor: grab; touch-action: none;
  }
  #orbProCanvas:active { cursor: grabbing; }

  @media (max-width: 820px) {
    :root { --deck-h: clamp(290px, 42vh, 360px); }
  }
</style>
</head>
<body>
<div class="app-shell">
  <!-- 1. Live 90Hz Spatial Chamber Stage (01_PHYSICAL_LAB + 02_HOLOGRAM_MEMORY + In-World Faded Mirror Ghost) -->
  <main class="chamber-stage">
    <canvas id="chamberStageCanvas" aria-label="Stelline Memory Chamber: 01_PHYSICAL_LAB Glass Dome & 02_HOLOGRAM_MEMORY Volumetric Stage"></canvas>
  </main>

  <!-- 2. Operable Stelline-Orb-Pro Hardware Deck (3 Concentric Rings + In-Orb Seed Core + Capacitive Squeeze + Multi-Pass Sequencer) -->
  <footer class="orb-pro-deck">
    <canvas id="orbProCanvas" aria-label="Field Orb 05 Stelline-Orb-Pro Controller"></canvas>
  </footer>
</div>

<script src="assets/three.min.js"></script>
<script src="assets/v6/anatomy.js"></script>
<script src="assets/field-orb-05-engine.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    window.FIELD_ORB_05.init();
  });
</script>
</body>
</html>
