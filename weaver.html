<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Memory Weaver</title>
<meta name="description" content="A cake built from nothing in Stelline's memory room: sculpt clay, pipe icing, place candles, animate it frame by frame, then weave it into light, all from the rings of one orb.">
<style>
  html, body { margin: 0; height: 100%; background: #030403; overflow: hidden; user-select: none; -webkit-user-select: none; font-family: ui-monospace, Menlo, monospace; }
  * { -webkit-tap-highlight-color: transparent; }
  .app { height: 100dvh; display: grid; grid-template-rows: minmax(0, 1fr) clamp(250px, 40vh, 420px); }
  #room, #orb { position: relative; overflow: hidden; touch-action: none; }
  #room canvas, #orb canvas { display: block; width: 100%; height: 100%; }
  #orb { background: radial-gradient(120% 140% at 50% 0%, #1a1c1a 0%, #0a0b0a 55%, #040504 100%); border-top: 1px solid #1c1e1c; }
  @media (max-width: 700px) { .app { grid-template-rows: minmax(0, 1fr) 44%; } }
</style>
</head>
<body>
<div class="app"><div id="room"></div><div id="orb"></div></div>
<script src="assets/three.min.js"></script>
<script src="assets/GLTFExporter.js"></script>
<script src="assets/OBJExporter.js"></script>
<script>
/* MEMORY WEAVER. Two layers that never mix: the physical lab (glass, floor, ring light, the observer outside) and the memory (table, cake, icing, candles),
   which is solid while you build it and becomes light when you weave it. Every control is on the orb: five rings, five buttons, one display.
   SCULPT  ring 1 orbit · 2 tool · 3 radius · 4 strength · 5 the tool's option (base, colour, item, symmetry). Draw on the cake to sculpt, pipe or place.
   ANIMATE ring 1 frame · 2 hold · 3 onion skin · 4 turn (keyed per frame) · 5 playback (stepped or tweened). CAPTURE adds a frame, PLAY loops.
   WEAVE   ring 1 time · 2 materialize · 3 scale · 4 haze · 5 scanline. CAPTURE records the rings as a take, PLAY replays it.
   Buttons: MODE · UNDO (hold: redo) · CAPTURE · PLAY · KEEP (export: glb, obj, still, loop, document). */
const T = THREE, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, TAU = Math.PI * 2;
const sm = t => t * t * (3 - 2 * t);
let NOW = 0;

/* =============================================================== sound and touch */
let AC = null;
function tick(kind, i) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); const n = AC.createBufferSource(), L = kind === 'press' ? 900 : 380, b = AC.createBuffer(1, L, AC.sampleRate), d = b.getChannelData(0);
  for (let k = 0; k < L; k++) d[k] = (Math.random() * 2 - 1) * Math.exp(-k / (kind === 'dead' ? 25 : kind === 'press' ? 140 : 50)); n.buffer = b; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = kind === 'press' ? 1100 : kind === 'dead' ? 650 : [2700, 2300, 1900, 2500, 3100][i || 0]; f.Q.value = 2.5;
  const g = AC.createGain(); g.gain.value = kind === 'dead' ? .2 : .8; n.connect(f).connect(g).connect(AC.destination); n.start(); } catch (e) { }
  if (navigator.vibrate) navigator.vibrate(kind === 'press' ? 14 : kind === 'dead' ? 3 : 6); }

/* =============================================================== the room */
const roomEl = document.getElementById('room');
const R = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setPixelRatio(Math.min(2, devicePixelRatio)); R.outputEncoding = T.sRGBEncoding; R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.1; R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap; roomEl.append(R.domElement);
const scene = new T.Scene(); scene.background = new T.Color(0x050605); scene.fog = new T.FogExp2(0x060807, .05);
const cam = new T.PerspectiveCamera(40, 1, .01, 40);
const LAB = new T.Group(), MEM = new T.Group(); scene.add(LAB, MEM);   // 01 physical lab, 02 the memory
// light
const hemi = new T.HemisphereLight(0x9aa8a4, 0x120c06, .22); scene.add(hemi);
const over = new T.SpotLight(0xe6efff, .75, 7, .42, .8, 1); over.position.set(0, 2.75, 0); over.target.position.set(0, .7, 0); over.castShadow = true; over.shadow.mapSize.set(1024, 1024); over.shadow.bias = -.0015; scene.add(over, over.target);
const warm = new T.DirectionalLight(0xffc690, .45); warm.position.set(1.4, 1.6, 2.2); scene.add(warm);
const candleLight = new T.PointLight(0xffa04a, 0, 2.4, 1.7); candleLight.castShadow = true; candleLight.shadow.mapSize.set(512, 512); scene.add(candleLight);
const holoLight = new T.PointLight(0x7fe8dc, 0, 3, 1.5); holoLight.position.set(0, 1.1, 0); scene.add(holoLight);
// floor and the recessed pit
const concrete = new T.MeshStandardMaterial({ color: 0x101210, roughness: .95 });
const floor = new T.Mesh(new T.RingGeometry(1.15, 9, 96), concrete); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; LAB.add(floor);
const pit = new T.Mesh(new T.CircleGeometry(1.15, 96), new T.MeshStandardMaterial({ color: 0x141614, roughness: .95 })); pit.rotation.x = -Math.PI / 2; pit.position.y = -.08; pit.receiveShadow = true; LAB.add(pit);
const pitWall = new T.Mesh(new T.CylinderGeometry(1.15, 1.15, .08, 96, 1, true), new T.MeshStandardMaterial({ color: 0x232523, roughness: .9, side: T.BackSide })); pitWall.position.y = -.04; LAB.add(pitWall);
// the glass partition, its mullions, the lit horizon band and the overhead ring
const glass = new T.Mesh(new T.CylinderGeometry(2.2, 2.2, 3, 128, 1, true), new T.MeshStandardMaterial({ color: 0xbfd6d0, transparent: true, opacity: .06, roughness: .05, metalness: .3, side: T.DoubleSide, depthWrite: false })); glass.position.y = 1.5; LAB.add(glass);
for (let k = 0; k < 16; k++) { const a = k / 16 * TAU, m = new T.Mesh(new T.BoxGeometry(.018, 3, .018), new T.MeshStandardMaterial({ color: 0x2a2d2b, roughness: .5, metalness: .6 })); m.position.set(Math.cos(a) * 2.2, 1.5, Math.sin(a) * 2.2); LAB.add(m); }
const band = new T.Mesh(new T.TorusGeometry(2.17, .01, 6, 200), new T.MeshBasicMaterial({ color: 0xe8f2ee })); band.rotation.x = Math.PI / 2; band.position.y = 1.12; LAB.add(band);
const bandGlow = new T.Mesh(new T.TorusGeometry(2.17, .07, 6, 200), new T.MeshBasicMaterial({ color: 0x8aa6a0, transparent: true, opacity: .13, depthWrite: false })); bandGlow.rotation.x = Math.PI / 2; bandGlow.position.y = 1.12; LAB.add(bandGlow);
const ringLamp = new T.Mesh(new T.TorusGeometry(.95, .025, 10, 160), new T.MeshBasicMaterial({ color: 0xf4f8ff })); ringLamp.rotation.x = Math.PI / 2; ringLamp.position.y = 2.8; LAB.add(ringLamp);
const ceiling = new T.Mesh(new T.CircleGeometry(2.2, 96), new T.MeshStandardMaterial({ color: 0x0c0d0c, roughness: 1, side: T.DoubleSide })); ceiling.rotation.x = Math.PI / 2; ceiling.position.y = 2.95; LAB.add(ceiling);
// the observer outside the glass, a silhouette with a rim of light
(function observer() { const k = new T.Group(), dark = new T.MeshStandardMaterial({ color: 0x050505, roughness: .9 });
  const coat = new T.Mesh(new T.CylinderGeometry(.17, .27, 1.25, 24), dark); coat.position.y = .78; const chest = new T.Mesh(new T.CylinderGeometry(.21, .19, .42, 24), dark); chest.position.y = 1.5;
  const head = new T.Mesh(new T.SphereGeometry(.11, 24, 16), dark); head.position.y = 1.86; head.scale.set(1, 1.15, 1); const neck = new T.Mesh(new T.CylinderGeometry(.06, .07, .12, 12), dark); neck.position.y = 1.74;
  const legs = new T.Mesh(new T.CylinderGeometry(.13, .15, .2, 16), dark); legs.position.y = .1; k.add(coat, chest, head, neck, legs); k.position.set(2.75, 0, -1.55); k.lookAt(0, 0, 0); LAB.add(k);
  const rim = new T.SpotLight(0x9fb6ff, 1.2, 4, .5, .6); rim.position.set(3.8, 2.4, -2.6); rim.target = k; LAB.add(rim); })();
// haze: a cone of light under the ring, and dust
const coneMat = new T.ShaderMaterial({ uniforms: { haze: { value: .5 } }, transparent: true, depthWrite: false, blending: T.AdditiveBlending, side: T.DoubleSide,
  vertexShader: 'varying float vy; varying vec3 vn; varying vec3 vp; void main(){ vy=uv.y; vn=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.); vp=mv.xyz; gl_Position=projectionMatrix*mv; }',
  fragmentShader: 'uniform float haze; varying float vy; varying vec3 vn; varying vec3 vp; void main(){ float e=pow(abs(dot(normalize(-vp),vn)),1.6); gl_FragColor=vec4(vec3(.62,.7,.72)*haze*.13*vy*e,1.); }' });
const cone = new T.Mesh(new T.CylinderGeometry(.9, 1.45, 2.7, 64, 1, true), coneMat); cone.position.y = 1.45; LAB.add(cone);
const DUST = 900, dustGeo = new T.BufferGeometry(), dp = new Float32Array(DUST * 3); for (let i = 0; i < DUST; i++) { const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * 1.6; dp[i * 3] = Math.cos(a) * r; dp[i * 3 + 1] = Math.random() * 2.7; dp[i * 3 + 2] = Math.sin(a) * r; }
dustGeo.setAttribute('position', new T.BufferAttribute(dp, 3)); const dustMat = new T.PointsMaterial({ color: 0xdfe8e4, size: .006, transparent: true, opacity: .5, blending: T.AdditiveBlending, depthWrite: false }); const dust = new T.Points(dustGeo, dustMat); LAB.add(dust);

/* =============================================================== hologram: every memory material gets the same light treatment */
const HU = { uHolo: { value: 0 }, uMat: { value: 1 }, uScan: { value: .5 }, uTime: { value: 0 } };
function holo(mat) { mat.onBeforeCompile = sh => { Object.assign(sh.uniforms, HU);
    sh.vertexShader = 'varying vec3 vWP; varying vec3 vWN;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\n vWP = (modelMatrix * vec4(transformed, 1.0)).xyz; vWN = normalize(mat3(modelMatrix) * objectNormal);');
    sh.fragmentShader = 'uniform float uHolo, uMat, uScan, uTime; varying vec3 vWP; varying vec3 vWN;\nfloat h3(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }\nfloat vnz(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y), mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }\n' + sh.fragmentShader.replace('#include <dithering_fragment>', `#include <dithering_fragment>
      if (uHolo > 0.001) { float h = clamp((0.55 * vnz(vWP * 34.0) + 0.3 * vnz(vWP * 90.0) + 0.15 * vnz(vWP * 240.0) - 0.27) / 0.46, 0.0, 1.0);
        if (h > uMat) discard;
        vec3 V = normalize(cameraPosition - vWP); float fr = pow(1.0 - abs(dot(normalize(vWN), V)), 2.2);
        float scan = 0.5 + 0.5 * sin(vWP.y * 520.0 - uTime * 5.0); float flick = 0.94 + 0.06 * sin(uTime * 41.0) * sin(uTime * 7.3);
        vec3 lit = gl_FragColor.rgb * (1.0 - uScan * 0.45 + uScan * 0.45 * scan) * flick;
        vec3 rim = vec3(0.45, 0.95, 0.88) * fr * 1.1 + vec3(1.0, 0.72, 0.4) * fr * 0.25;
        float edge = smoothstep(uMat - 0.07, uMat, h) * step(uMat, 0.995); rim += vec3(0.6, 1.0, 0.95) * edge * 1.5;
        gl_FragColor.rgb = mix(gl_FragColor.rgb, lit * 1.15 + rim, uHolo); }`); };
  mat.customProgramCacheKey = () => 'holo'; return mat; }

/* =============================================================== the memory: table, plate, and the made things */
const TABLE_Y = .74, BASE_Y = TABLE_Y + .008;
const tableMat = holo(new T.MeshStandardMaterial({ color: 0xb98436, roughness: .55 }));
const table = new T.Mesh(new T.CylinderGeometry(.62, .62, .04, 6), tableMat); table.position.y = TABLE_Y - .02; table.castShadow = table.receiveShadow = true; table.userData.table = true; MEM.add(table);
const leg = new T.Mesh(new T.CylinderGeometry(.05, .09, TABLE_Y - .04, 16), holo(new T.MeshStandardMaterial({ color: 0x1c1915, roughness: .6 }))); leg.position.y = (TABLE_Y - .04) / 2; MEM.add(leg);
const plate = new T.Mesh(new T.CylinderGeometry(.17, .175, .008, 64), holo(new T.MeshStandardMaterial({ color: 0xece7dc, roughness: .25 }))); plate.position.y = TABLE_Y + .004; plate.receiveShadow = true; plate.userData.table = true; MEM.add(plate);
const CAKE = new T.Group(); CAKE.position.y = BASE_Y; MEM.add(CAKE);       // the cake's own space: clay, strokes, items
const ONION = new T.Group(); CAKE.add(ONION);

/* =============================================================== clay: a lathe grid that brushes can push anywhere */
const NP = 52, COLS = 112;
const BASES = {
  DRUM: { loop: false, P: [[0, 0], [.112, 0], [.12, .008], [.12, .082], [.112, .09], [0, .09]] },
  DOME: { loop: false, P: (() => { const p = [[0, 0], [.12, 0], [.12, .02]]; for (let k = 1; k <= 12; k++) { const a = k / 12 * Math.PI / 2; p.push([.12 * Math.cos(a), .02 + .1 * Math.sin(a)]); } return p; })() },
  TIERS: { loop: false, P: [[0, 0], [.13, 0], [.13, .07], [.09, .07], [.09, .135], [0, .135]] },
  BUNDT: { loop: true, P: (() => { const p = []; for (let k = 0; k < 40; k++) { const t = -Math.PI / 2 + k / 40 * TAU; p.push([.075 + .05 * Math.cos(t), .05 + .05 * Math.sin(t) * (Math.sin(t) < 0 ? .85 : 1)]); } return p; })() }
};
function resample(P, n, loop) { const pts = loop ? P.concat([P[0]]) : P, L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const tot = L[L.length - 1], out = []; const m = loop ? n : n - 1; for (let k = 0; k < (loop ? n : n); k++) { const s = k / m * tot; let i = 1; while (i < L.length - 1 && L[i] < s) i++; const u = (s - L[i - 1]) / Math.max(1e-9, L[i] - L[i - 1]); out.push([lerp(pts[i - 1][0], pts[i][0], u), lerp(pts[i - 1][1], pts[i][1], u)]); } return out; }
const TOPO = {};
function topology(kind) { if (TOPO[kind]) return TOPO[kind]; const B = BASES[kind], prof = resample(B.P, NP, B.loop), pos = [], idx = [], ang = [];
  const V = (r, y, a) => { pos.push(r * Math.cos(a), y, r * Math.sin(a)); ang.push(a); return pos.length / 3 - 1; };
  let rows = [], p0 = -1, p1 = -1;
  if (B.loop) { for (let i = 0; i < NP; i++) { const row = []; for (let j = 0; j < COLS; j++) { const a = j / COLS * TAU, out = prof[i][0] > .075 ? 1 : 0; const fl = 1 + .075 * Math.cos(11 * a) * out * Math.max(0, (prof[i][0] - .075) / .05); row.push(V(prof[i][0] * fl, prof[i][1], a)); } rows.push(row); } }
  else { p0 = V(0, prof[0][1], 0); for (let i = 1; i < NP - 1; i++) { const row = []; for (let j = 0; j < COLS; j++) row.push(V(prof[i][0], prof[i][1], j / COLS * TAU)); rows.push(row); } p1 = V(0, prof[NP - 1][1], 0); }
  const nr = rows.length, quad = (a, b, c, d) => idx.push(a, b, c, c, b, d);
  for (let i = 0; i < (B.loop ? nr : nr - 1); i++) for (let j = 0; j < COLS; j++) { const i2 = (i + 1) % nr, j2 = (j + 1) % COLS; quad(rows[i][j], rows[i2][j], rows[i][j2], rows[i2][j2]); }
  if (!B.loop) for (let j = 0; j < COLS; j++) { const j2 = (j + 1) % COLS; idx.push(p0, rows[0][j], rows[0][j2]); idx.push(rows[nr - 1][j], p1, rows[nr - 1][j2]); }
  const nv = pos.length / 3, nb = Array.from({ length: nv }, () => new Set()); for (let t = 0; t < idx.length; t += 3) { const [a, b, c] = [idx[t], idx[t + 1], idx[t + 2]]; nb[a].add(b).add(c); nb[b].add(a).add(c); nb[c].add(a).add(b); }
  return TOPO[kind] = { kind, base: new Float32Array(pos), idx, nv, nb: nb.map(s => Int32Array.from(s)), ang: Float32Array.from(ang) }; }
const CREAM = [.95, .9, .79];
const clayMat = holo(new T.MeshStandardMaterial({ vertexColors: true, roughness: .74, metalness: 0 }));
(function bump() { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'), id = x.createImageData(256, 256); for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 110; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } x.putImageData(id, 0, 0);
  const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(1, 1); clayMat.bumpMap = t; clayMat.bumpScale = .0012; })();
let clayMesh = null, clayKind = null;
function clayGeo(kind) { const tp = topology(kind), g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(new Float32Array(tp.base), 3)); const col = new Float32Array(tp.nv * 3); for (let i = 0; i < tp.nv; i++) col.set(CREAM, i * 3); g.setAttribute('color', new T.BufferAttribute(col, 3)); g.setIndex(tp.idx);
  const uv = new Float32Array(tp.nv * 2); for (let i = 0; i < tp.nv; i++) { uv[i * 2] = tp.ang[i] / TAU * 6; uv[i * 2 + 1] = tp.base[i * 3 + 1] * 12; } g.setAttribute('uv', new T.BufferAttribute(uv, 2)); g.computeVertexNormals(); return g; }
function ensureClay(kind) { if (clayKind === kind && clayMesh) return; if (clayMesh) { CAKE.remove(clayMesh); clayMesh.geometry.dispose(); clayMesh = null; } clayKind = kind; if (!kind) return; clayMesh = new T.Mesh(clayGeo(kind), clayMat); clayMesh.castShadow = clayMesh.receiveShadow = true; clayMesh.userData.clay = true; CAKE.add(clayMesh); }

/* =============================================================== the document: frames of a stop-motion; each frame is a whole state */
const COLORS = [['CREAM', '#f2e6c9'], ['ROSE', '#f0a8b4'], ['MINT', '#b9e3cf'], ['SKY', '#b8d4ef'], ['LEMON', '#f3dc84'], ['CHOCOLATE', '#4a2b1b'], ['RED', '#c9302c'], ['WHITE', '#fbf8f2'], ['GOLD', '#d9a640']];
const ITEMS = ['CANDLE', 'BERRY', 'SPRINKLES', 'ROSETTE', 'CHERRY'];
const TOOLS = ['SPAWN', 'GRAB', 'PULL', 'PUSH', 'SMOOTH', 'FLATTEN', 'PAINT', 'PIPE', 'PLACE'];
const SPINS = ['FREE', 'SPIN 6', 'SPIN 12', 'TURNED'];   // symmetry: none, 6 copies, 12 copies, the whole turn (lathe)
const PLAYS = [['STEP 12', 12, 0], ['STEP 8', 8, 0], ['STEP 6', 6, 0], ['TWEEN 24', 24, 1]];
const frameNew = () => ({ clay: null, strokes: [], items: [], rotY: 0, hold: 1 });
let DOC = { frames: [frameNew()], cur: 0 };
const curF = () => DOC.frames[DOC.cur];
const copyFrame = f => ({ clay: f.clay ? { kind: f.clay.kind, pos: f.clay.pos.slice(), col: f.clay.col.slice() } : null, strokes: f.strokes.map(s => ({ ...s, pts: s.pts.slice() })), items: f.items.map(i => ({ ...i })), rotY: f.rotY, hold: f.hold });
const UNDO = [], REDO = [];
function snapshot() { UNDO.push({ frames: DOC.frames.map(copyFrame), cur: DOC.cur }); if (UNDO.length > 40) UNDO.shift(); REDO.length = 0; dirtyDoc = true; }
function undo(redo) { const from = redo ? REDO : UNDO, to = redo ? UNDO : REDO; const s = from.pop(); if (!s) { say(redo ? 'NOTHING TO REDO' : 'NOTHING TO UNDO'); tick('dead'); return; } to.push({ frames: DOC.frames.map(copyFrame), cur: DOC.cur }); DOC = s; showFrame(); S.state = 'RECOVERY'; say(redo ? 'REDONE' : 'UNDONE · THE LAST CHANGE IS REVERSED'); }
let dirtyDoc = false;

/* =============================================================== show a frame (or a point between two frames) in the room */
const strokeMats = {}, strokeMat = c => strokeMats[c] || (strokeMats[c] = holo(new T.MeshStandardMaterial({ color: COLORS[c][1], roughness: .62 })));
const STROKES = new T.Group(), ITEMG = new T.Group(); CAKE.add(STROKES, ITEMG);
const meshOf = new WeakMap(), objOf = new WeakMap();
function strokeMesh(s) { if (meshOf.has(s)) return meshOf.get(s); const pts = []; for (let i = 0; i < s.pts.length; i += 6) pts.push(new T.Vector3(s.pts[i] + s.pts[i + 3] * s.w * .7, s.pts[i + 1] + s.pts[i + 4] * s.w * .7, s.pts[i + 2] + s.pts[i + 5] * s.w * .7));
  if (pts.length < 2) pts.push(pts[0].clone().add(new T.Vector3(.0005, 0, 0))); const curve = new T.CatmullRomCurve3(pts), L = curve.getLength(), seg = Math.max(8, Math.round(L / (s.w * .35))), rs = 10;
  const g = new T.TubeGeometry(curve, seg, s.w, rs, false); const p = g.attributes.position; // piped: the bead swells and narrows along the bag's path
  for (let i = 0; i <= seg; i++) { const c = curve.getPointAt(i / seg), k = 1 + .32 * Math.sin(i / seg * L / (s.w * 2.1) * TAU) * (s.style === 'line' ? 0 : 1), end = Math.min(1, Math.min(i, seg - i) / 3 + .25); for (let j = 0; j <= rs; j++) { const v = i * (rs + 1) + j; p.setXYZ(v, c.x + (p.getX(v) - c.x) * k * end, c.y + (p.getY(v) - c.y) * k * end, c.z + (p.getZ(v) - c.z) * k * end); } }
